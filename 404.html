<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>3D FPS</title>
<script>
(function(){
  var path = location.pathname;
  var match = path.match(/\/3Dfps\/r\/([^/]+)\/?$/i);
  if(match){
    var code = decodeURIComponent(match[1]);
    var base = path.slice(0, path.toLowerCase().indexOf("/3dfps") + 6);
    location.replace(base + "/?room=" + encodeURIComponent(code));
    return;
  }
  location.replace("/3Dfps/");
})();
</script>
</head>

</body>
</html>
