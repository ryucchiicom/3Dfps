<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Online 3D FPS</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
    color:white;
}

button,input{
    font:inherit;
}

#game{
    position:fixed;
    inset:0;
    display:none;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

#lobby{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at center,#27334a 0%,#111722 55%,#080b10 100%);
    z-index:100;
}

#lobbyBox{
    width:min(90vw,460px);
    padding:28px;
    border:1px solid rgba(255,255,255,.15);
    border-radius:22px;
    background:rgba(20,25,35,.78);
    backdrop-filter:blur(18px);
    box-shadow:0 20px 80px rgba(0,0,0,.45);
    text-align:center;
}

#lobbyBox h1{
    margin:0 0 10px;
    font-size:32px;
}

#lobbyBox p{
    opacity:.7;
    margin:0 0 22px;
}

#roomCode{
    width:100%;
    height:54px;
    padding:0 16px;
    border:1px solid rgba(255,255,255,.15);
    border-radius:13px;
    outline:none;
    background:rgba(255,255,255,.08);
    color:white;
    text-align:center;
    font-size:20px;
    letter-spacing:4px;
}

.mainButton{
    position:relative;
    overflow:hidden;
    width:100%;
    height:58px;
    margin-top:14px;
    border:0;
    border-radius:15px;
    color:white;
    background:rgba(75,130,255,.85);
    cursor:pointer;
    font-size:18px;
    font-weight:bold;
}

.mainButton:active{

}

#lobbyStatus{
    min-height:24px;
    margin-top:15px;
    font-size:14px;

}

#roomUI{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:20;
}

#topInfo{

    top:15px;
    left:50%;

    border-radius:12px;
    background:rgba(0,0,0,.4);
    backdrop-filter:blur(10px);

}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    width:18px;
    height:18px;
    transform:translate(-50%,-50%);
}

#crosshair::before,
#crosshair::after{
    content:"";

    box-shadow:0 0 3px black;
}

#crosshair::before{
    width:18px;
    height:2px;
    top:8px;

}

#crosshair::after{
    width:2px;
    height:18px;
    left:8px;
    top:0;
}

#hp{

#hpBar{

    }

    }

        bottom:30px;
    }

        right:130px;
        bottom:30px;
    }

// ============================================================

// ============================================================
// MAP
// ============================================================

/*
    低い足場を追加。
    platform:
      x,z = 中心
      w,d = 横幅/奥行き
      y = 上面の高さ
      h = 厚さ

    「見た目」と「当たり判定」を同じ配列から生成するため、
    上の足場も確実に衝突対象になる。
*/

const platforms = [

    // 地面
    {
        x:0,
        y:0,
        z:0,
        w:42,
        d:42,
        h:1
    },

    // 中央

];


// ============================================================
// SIMPLE 3D RENDERER
// ============================================================

function resize(){
    canvas.width = innerWidth * devicePixelRatio;
    canvas.height = innerHeight * devicePixelRatio;

    canvas.style.width = innerWidth + "px";
    canvas.style.height = innerHeight + "px";

    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );
}

addEventListener("resize",resize);
resize();


function rotatePoint(x,y,z){
    const cy = Math.cos(player.yaw);
    const sy = Math.sin(player.yaw);

    const rx = x * cy - z * sy;
    const rz = x * sy + z * cy;

    const cp = Math.cos(player.pitch);
    const sp = Math.sin(player.pitch);

    const ry = y * cp - rz * sp;
    const rz2 = y * sp + rz * cp;

    return {
        x:rx,
        y:ry,
        z:rz2
    };
}


function project(x,y,z){

    const r = rotatePoint(
        x - player.x,
        y - player.y - 1.5,
        z - player.z
    );

    if(r.z <= 0.1){
        return null;
    }

    const f = Math.min(innerWidth,innerHeight) * .9;

    return {
        x:innerWidth / 2 + r.x * f / r.z,
        y:innerHeight / 2 - r.y * f / r.z,
        z:r.z
    };
}


function drawPolygon(points,fill,stroke=null){

    const projected = points.map(p =>
        project(p.x,p.y,p.z)
    );

    if(projected.some(p=>!p)) return;

    ctx.beginPath();

    projected.forEach((p,i)=>{
        if(i===0){
            ctx.moveTo(p.x,p.y);
        }else{
            ctx.lineTo(p.x,p.y);
        }
    });

    ctx.closePath();

    ctx.fillStyle = fill;
    ctx.fill();

    if(stroke){
        ctx.strokeStyle = stroke;
        ctx.stroke();
    }
}


function renderPlatform(p){

    const x1 = p.x - p.w/2;
    const x2 = p.x + p.w/2;

    const z1 = p.z - p.d/2;
    const z2 = p.z + p.d/2;

    const y = p.y;
    const bottom = p.y - p.h;

    drawPolygon([
        {x:x1,y:y,z:z1},
        {x:x2,y:y,z:z1},
        {x:x2,y:y,z:z2},
        {x:x1,y:y,z:z2}
    ],"#66717c");

    drawPolygon([
        {x:x1,y:bottom,z:z1},
        {x:x2,y:bottom,z:z1},
        {x:x2,y:y,z:z1},
        {x:x1,y:y,z:z1}
    ],"#38414a");

    drawPolygon([
        {x:x2,y:bottom,z:z1},
        {x:x2,y:bottom,z:z2},
        {x:x2,y:y,z:z2},
        {x:x2,y:y,z:z1}
    ],"#303840");
}


function renderPlayer(p){

    const headY = p.y + 1.65;
    const bodyY = p.y + .75;

    const size = .45;

    const color =
        p.id === currentUser?.uid
        ? "#45a8ff"
        : "#ff5151";

    drawPolygon([
        {x:p.x-size,y:p.y,z:p.z-size},
        {x:p.x+size,y:p.y,z:p.z-size},
        {x:p.x+size,y:bodyY,z:p.z-size},
        {x:p.x-size,y:bodyY,z:p.z-size}
    ],color);

    drawPolygon([
        {x:p.x-size,y:bodyY,z:p.z-size},
        {x:p.x+size,y:bodyY,z:p.z-size},
        {x:p.x+size,y:headY,z:p.z-size},
        {x:p.x-size,y:headY,z:p.z-size}
    ],"#f1c7a5");
}


function render(){

    ctx.clearRect(0,0,innerWidth,innerHeight);

    const gradient =
        ctx.createLinearGradient(0,0,0,innerHeight);

    gradient.addColorStop(0,"#111b2c");
    gradient.addColorStop(.55,"#31445a");
    gradient.addColorStop(1,"#101317");

    ctx.fillStyle = gradient;
    ctx.fillRect(0,0,innerWidth,innerHeight);

    const objects = [];

    for(const p of platforms){

        const center = project(
            p.x,
            p.y,
            p.z
        );

        objects.push({
            type:"platform",
            data:p,
            z:center ? center.z : -1
        });
    }

    for(const id in players){

        const p = players[id];

        const center = project(
            p.x,
            p.y + .8,
            p.z
        );

        objects.push({
            type:"player",
            data:p,
            z:center ? center.z : -1
        });
    }

    objects
        .filter(o=>o.z>0)
        .sort((a,b)=>b.z-a.z)
        .forEach(o=>{

            if(o.type==="platform"){
                renderPlatform(o.data);
            }else{
                renderPlayer(o.data);
            }
        });
}


// ============================================================
// COLLISION
// ============================================================

const PLAYER_RADIUS = .45;
const PLAYER_HEIGHT = 1.7;
const GRAVITY = 18;
const MOVE_SPEED = 6.5;
const JUMP_POWER = 8.5;


function platformContainsXZ(p,x,z){

    return (
        x >= p.x - p.w/2 - PLAYER_RADIUS &&
        x <= p.x + p.w/2 + PLAYER_RADIUS &&
        z >= p.z - p.d/2 - PLAYER_RADIUS &&
        z <= p.z + p.d/2 + PLAYER_RADIUS
    );
}


function getFloorY(x,z,currentY,vy){

    let floor = 0;

    for(const p of platforms){

        if(!platformContainsXZ(p,x,z)){
            continue;
        }

        const top = p.y;

        /*
          下から上へ通過している場合だけ着地可能。
          これで「上の足場をすり抜ける」問題を防止。
        */

        const oldBottom = currentY;
        const newBottom = currentY + vy;

        if(
            vy <= 0 &&
            oldBottom >= top - .15 &&
            newBottom <= top + .15
        ){
            floor = Math.max(floor,top);
        }

        if(currentY <= top + .05){
            floor = Math.max(floor,top);
        }
    }

    return floor;
}


// ============================================================
// GRAB
// ============================================================

function canGrab(){

    if(player.grounded){
        return false;
    }

    const topOfBody = player.y + PLAYER_HEIGHT;

    for(const p of platforms){

        if(
            Math.abs(player.x - p.x) >
                p.w/2 + .15
        ) continue;

        if(
            Math.abs(player.z - p.z) >
                p.d/2 + .15
        ) continue;

        /*
          「自分とほぼ0距離」
          かつ
          足場の高さが全身の一番上より下
        */

        const horizontalDistance =
            Math.max(
                Math.abs(player.x-p.x)-p.w/2,
                Math.abs(player.z-p.z)-p.d/2,
                0
            );

        if(horizontalDistance > .35){
            continue;
        }

        if(
            p.y < topOfBody &&
            p.y > player.y + .2
        ){
            return true;
        }
    }

    return false;
}


function updateGrabUI(){

    const air = !player.grounded;
    const available = canGrab();

    if(!air){
        grabButton.style.display = "none";
        jumpButton.style.display = "flex";
        return;
    }

    jumpButton.style.display = "none";
    grabButton.style.display = "flex";

    if(available){
        grabButton.classList.remove("weak");
    }else{
        grabButton.classList.add("weak");
    }
}


function grab(){

    if(!canGrab()) return;

    let target = null;

    for(const p of platforms){

        const horizontalDistance =
            Math.max(
                Math.abs(player.x-p.x)-p.w/2,
                Math.abs(player.z-p.z)-p.d/2,
                0
            );

        if(horizontalDistance <= .35 &&
           p.y < player.y + PLAYER_HEIGHT &&
           p.y > player.y + .2){

            if(!target || p.y < target.y){
                target = p;
            }
        }
    }

    if(!target) return;

    player.grabbing = true;
    player.vx = 0;
    player.vy = 0;
    player.vz = 0;

    /*
      登る時間 = 0.5秒
    */

    const startY = player.y;
    const targetY = target.y;

    const startTime = performance.now();

    function climb(now){

        const t = Math.min(
            1,
            (now-startTime)/500
        );

        const smooth =
            t*t*(3-2*t);

        player.y =
            startY +
            (targetY-startY)*smooth;

        if(t<1){

            requestAnimationFrame(climb);

        }else{

            player.y = targetY;
            player.grounded = true;
            player.grabbing = false;
            updateFirebasePlayer();
        }
    }

    requestAnimationFrame(climb);
}

// ============================================================
// JOYSTICK
// ============================================================

let joyActive = false;
let joyX = 0;
let joyY = 0;

function updateJoystick(e){

    const rect = joystick.getBoundingClientRect();

    let x =
        e.clientX -
        (rect.left + rect.width/2);

    let y =
        e.clientY -
        (rect.top + rect.height/2);

    const max = rect.width/2 - 32;

    const length = Math.hypot(x,y);

    if(length > max){

        x = x/length*max;
        y = y/length*max;
    }

    joyX = x/max;
    joyY = y/max;

    stick.style.transform =
        `translate(${x}px,${y}px)`;
}

joystick.addEventListener("pointerdown",e=>{
    joyActive = true;
    joystick.setPointerCapture(e.pointerId);
    updateJoystick(e);
    registerActivity();
});

joystick.addEventListener("pointermove",e=>{
    if(!joyActive) return;
    updateJoystick(e);
    registerActivity();
});

joystick.addEventListener("pointerup",e=>{
    joyActive = false;
    joyX = 0;
    joyY = 0;
    stick.style.transform = "";
});

joystick.addEventListener("pointercancel",()=>{
    joyActive = false;
    joyX = 0;
    joyY = 0;
    stick.style.transform = "";
});

let lastLookX = 0;
let lastLookY = 0;

lookArea.addEventListener("pointerdown",e=>{

    lastLookY = e.clientY;
    lookArea.setPointerCapture(e.pointerId);

});

// ============================================================
// BULLETS
// ============================================================

const bullets = [];

const BULLET_SPEED = 30;
const BULLET_LIFE = 2.5;
const FIRE_INTERVAL = 250;

let lastShot = 0;
let firing = false;


function shoot(){

    const now = performance.now();

    if(
        now-lastShot < FIRE_INTERVAL ||
        !roomStarted ||
        player.dead
    ){
        return;
    }

    lastShot = now;
    registerActivity();

    const dir = {
        x:Math.sin(player.yaw)*Math.cos(player.pitch),
        y:-Math.sin(player.pitch),
        z:Math.cos(player.yaw)*Math.cos(player.pitch)
    };

    bullets.push({
        owner:currentUser.uid,
        x:player.x,
        y:player.y+1.25,
        z:player.z,
        vx:dir.x*BULLET_SPEED,
        vy:dir.y*BULLET_SPEED,
        vz:dir.z*BULLET_SPEED,
        born:now
    });

    updateFireUI(now);
}


function updateFireUI(now=performance.now()){

    const elapsed =
        now-lastShot;

    const progress =
        Math.max(
            0,
            Math.min(1,elapsed/FIRE_INTERVAL)
        );

    const degrees =
        progress*360;

    fireButton.querySelector(".cooldownCircle")
        .style.background =
        `conic-gradient(
            rgba(90,180,255,.9) 0deg,
            rgba(90,180,255,.9) ${degrees}deg,
            transparent ${degrees}deg
        )`;
}


fireButton.addEventListener("pointerdown",e=>{
    e.preventDefault();
    firing = true;
    registerActivity();
    shoot();
});

fireButton.addEventListener("pointerup",()=>{
    firing = false;
});

fireButton.addEventListener("pointercancel",()=>{
    firing = false;
});


function updateBullets(dt){

    const now = performance.now();

    for(let i=bullets.length-1;i>=0;i--){

        const b = bullets[i];

        b.x += b.vx*dt;
        b.y += b.vy*dt;
        b.z += b.vz*dt;

        if(now-b.born > BULLET_LIFE){
            bullets.splice(i,1);
            continue;
        }

        let hitWall = false;

        for(const p of platforms){

            if(
                b.x >= p.x-p.w/2 &&
                b.x <= p.x+p.w/2 &&
                b.z >= p.z-p.d/2 &&
                b.z <= p.z+p.d/2 &&
                b.y >= p.y-p.h &&
                b.y <= p.y
            ){
                hitWall = true;
                break;
            }
        }

        if(hitWall){
            bullets.splice(i,1);
            continue;
        }

        for(const id in players){

            if(id===currentUser.uid) continue;

            const target = players[id];

            const dx = b.x-target.x;
            const dy = b.y-(target.y+.8);
            const dz = b.z-target.z;

            if(
                dx*dx+
                dy*dy+
                dz*dz < .8*.8
            ){

                hitPlayer(id);

                bullets.splice(i,1);
                break;
            }
        }
    }
}


async function hitPlayer(id){

    if(!roomId) return;

    const ref = doc(
        db,
        "dfpsRooms",
        roomId,
        "players",
        id
    );

    try{

        const snap = await getDoc(ref);

        if(!snap.exists()) return;

        const target = snap.data();

        if(
            target.invulnerableUntil &&
            target.invulnerableUntil > Date.now()
        ){
            return;
        }

        const hp =
            Math.max(
                0,
                Number(target.hp ?? 100)-25
            );

        await updateDoc(ref,{
            hp,
            lastActivity:Date.now()
        });

    }catch(e){
        console.error(e);
    }
}

// ============================================================
// PLAYER MOVEMENT
// ============================================================

function getMovementInput(){

    let forward = 0;
    let right = 0;

    if(keys["KeyW"] || keys["ArrowUp"]) forward += 1;
    if(keys["KeyS"] || keys["ArrowDown"]) forward -= 1;
    if(keys["KeyD"] || keys["ArrowRight"]) right += 1;
    if(keys["KeyA"] || keys["ArrowLeft"]) right -= 1;

    if(Math.abs(joyX)>.05 || Math.abs(joyY)>.05){

        right += joyX;
        forward += -joyY;
    }

    const length =
        Math.hypot(forward,right);

    if(length>1){

        forward/=length;
        right/=length;
    }

    return {forward,right};
}


function updateMovement(dt){

    if(!roomStarted || player.dead || player.grabbing){
        return;
    }

    const input = getMovementInput();

    const sin = Math.sin(player.yaw);
    const cos = Math.cos(player.yaw);

    const dx =
        (right=input.right)*cos +
        input.forward*sin;

    const dz =
        input.forward*cos -
        input.right*sin;

    player.vx =
        dx*MOVE_SPEED;

    player.vz =
        dz*MOVE_SPEED;

    const oldY = player.y;

    if(!player.grounded){

        player.vy -= GRAVITY*dt;
    }

    let newX =
        player.x + player.vx*dt;

    let newZ =
        player.z + player.vz*dt;

    /*
      地図外への移動制限
    */

    newX = Math.max(-19,Math.min(19,newX));
    newZ = Math.max(-19,Math.min(19,newZ));

    const previousY = player.y;

    player.x = newX;
    player.z = newZ;

    if(!player.grounded){

        const nextY =
            player.y + player.vy*dt;

        let landed = false;

        for(const p of platforms){

            if(!platformContainsXZ(p,player.x,player.z)){
                continue;
            }

            const top = p.y;

            /*
              前フレームの足元が足場より上、
              今フレームの足元が足場以下なら着地。
            */

            if(
                player.vy <= 0 &&
                previousY >= top &&
                nextY <= top
            ){

                player.y = top;
                player.vy = 0;
                player.grounded = true;
                landed = true;
                break;
            }
        }

        if(!landed){
            player.y = nextY;
        }

    }else{

        /*
          現在乗っている足場がなくなった場合なども
          落下状態に戻せる。
        */

        let supported = false;

        for(const p of platforms){

            if(
                Math.abs(player.y-p.y)<.08 &&
                platformContainsXZ(p,player.x,player.z)
            ){
                supported = true;
                break;
            }
        }

        if(!supported){
            player.grounded = false;
            player.vy = 0;
        }
    }

    if(player.y < -10){

        player.y = 2;
        player.vy = 0;
        player.x = 0;
        player.z = 0;
        player.grounded = false;
    }
}

// ============================================================
// RANDOM TELEPORT
// ============================================================

function randomTeleport(){

    /*
      マップ外や足場内部を避け、
      プレイヤー同士の初期位置が重ならないよう調整。
    */

    const safeSpawns = [
        {x:-15,z:14,y:1},
        {x:14,z:13,y:1},
        {x:-14,z:5,y:1},
        {x:14,z:-13,y:1},
        {x:0,z:10,y:1},
        {x:-10,z:-2,y:2},
        {x:10,z:3,y:2}
    ];

    let candidates =
        [...safeSpawns];

    candidates.sort(
        ()=>Math.random()-.5
    );

    for(const s of candidates){

        let tooClose = false;

        for(const id in players){

            if(id===currentUser.uid) continue;

            const p = players[id];

            if(
                Math.hypot(
                    p.x-s.x,
                    p.z-s.z
                ) < 4
            ){
                tooClose = true;
                break;
            }
        }

        if(!tooClose){

            player.x = s.x;
            player.y = s.y;
            player.z = s.z;

            player.vx = 0;
            player.vy = 0;
            player.vz = 0;

            return;
        }
    }

    const s = safeSpawns[
        Math.floor(
            Math.random()*safeSpawns.length
        )
    ];

    player.x=s.x;
    player.y=s.y;
    player.z=s.z;
}

function roomRef(id){
    return doc(db,"dfpsRooms",id);
}

function playerRef(id){
    return doc(
        db,
        "dfpsRooms",
        roomId,
        "players",
        id
    );
}


async function createOrJoinRoom(){

    if(!currentUser){
        lobbyStatus.textContent =
            "Firebase接続中……";
        return;
    }

    let code =
        roomCodeInput.value
            .trim()
            .toUpperCase()
            .replace(/[^A-Z0-9]/g,"");

    if(!code){
        code =
            Math.random()
                .toString(36)
                .slice(2,8)
                .toUpperCase();

        roomCodeInput.value = code;
    }

    if(code.length<3){
        lobbyStatus.textContent =
            "試合コードは3文字以上で入力してね";
        return;
    }

    roomButton.disabled = true;
    lobbyStatus.textContent =
        "接続中……";

    roomId = code;

    const ref = roomRef(roomId);

    try{

        await runTransaction(db,async transaction=>{

            const snap =
                await transaction.get(ref);

            if(!snap.exists()){

                transaction.set(ref,{
                    hostUid:currentUser.uid,
                    started:false,
                    ended:false,
                    createdAt:Date.now(),
                    lastRoomActivity:Date.now()
                });

                isHost = true;

            }else{

                const data = snap.data();

                if(data.ended){

                    transaction.set(ref,{
                        hostUid:currentUser.uid,
                        started:false,
                        ended:false,
                        createdAt:Date.now(),
                        lastRoomActivity:Date.now()
                    });

                    isHost = true;

                }else{

                    isHost =
                        data.hostUid === currentUser.uid;
                }
            }
        });

        await setDoc(
            playerRef(currentUser.uid),
            {
                id:currentUser.uid,
                x:0,
                y:1,
                z:0,
                yaw:0,
                pitch:0,
                hp:100,
                dead:false,
                lastActivity:Date.now(),
                invulnerableUntil:0
            },
            {merge:true}
        );

        enterRoom();

    }catch(e){

        console.error(e);

        lobbyStatus.textContent =
            "部屋への接続に失敗しました";

        roomButton.disabled = false;
    }
}

}


// ============================================================
// ROOM LISTENER
// ============================================================

function listenRoom(){

    if(unsubscribeRoom){
        unsubscribeRoom();
    }

    unsubscribeRoom =
        onSnapshot(
            roomRef(roomId),
            snap=>{

                if(!snap.exists()){

                    returnToLobby(
                        "試合が削除されました"
                    );

                    return;
                }

                const data =
                    snap.data();

                roomStarted =
                    data.started === true;

                roomEnded =
                    data.ended === true;

                if(roomEnded){

                    returnToLobby(
                        "試合が終了しました"
                    );
                }

                if(
                    roomStarted &&
                    startButton
                ){
                    startButton.style.display =
                        "none";
                }
            },
            error=>{
                console.error(error);
            }
        );
}


// ============================================================
// PLAYERS LISTENER
// ============================================================

function listenPlayers(){

    if(unsubscribePlayers){
        unsubscribePlayers();
    }

    unsubscribePlayers =
        onSnapshot(
            collection(
                db,
                "dfpsRooms",
                roomId,
                "players"
            ),
            snapshot=>{

                const next = {};

                snapshot.forEach(snap=>{
                    next[snap.id] = snap.data();
                });

                players = next;

                playerCount.textContent =
                    Object.keys(players).length;

                const me =
                    players[currentUser.uid];

                if(me){

                    player.hp =
                        Number(me.hp ?? 100);

                    player.dead =
                        me.dead === true;

                    updateLocalHP();
                }
            }
        );
}

    if(
        !force &&
        now-lastFirebaseUpdate < 100
    ){
        if(!updateQueued){

            updateQueued = true;

            setTimeout(()=>{

            playerRef(currentUser.uid),
            {
                x:player.x,
                y:player.y,
                z:player.z,
                yaw:player.yaw,
                pitch:player.pitch,
                hp:player.hp,
                dead:player.dead,
                lastActivity:lastActivity
            }

    }catch(e){

        if(e.code !== "not-found"){
            console.error(e);
        }
    }

    startHolding = true;

        );

    updateStartCircle(progress);

    if(progress>=1){

        startHolding = false;
        updateStartCircle(0);

        startMatch();

    requestAnimationFrame(
        updateStartHold

// ============================================================
// START MATCH
// ============================================================

async function startMatch(){

    if(!isHost || roomStarted) return;

    try{

        const spawnData = {};

        for(const id in players){

            const spawn = {
                x:0,
                y:1,
                z:0
            };

            spawnData[id] = spawn;
        }

        /*
          ランダムTP。
          プレイヤー同士が埋まらないように
          4m以上離す。
        */

        const shuffled =
            [...[
                {x:-15,z:14,y:1},
                {x:14,z:13,y:1},
                {x:-14,z:5,y:1},
                {x:14,z:-13,y:1},
                {x:0,z:10,y:1},
                {x:-10,z:-2,y:2},
                {x:10,z:3,y:2}
            ]].sort(
                ()=>Math.random()-.5
            );

        let index=0;

        for(const id in players){

            let chosen =
                shuffled[index % shuffled.length];

            /*
              同じ位置になる可能性がある場合は
              少しずつずらす。
            */

            chosen = {
                x:chosen.x + index*.7,
                y:chosen.y,
                z:chosen.z
            };

            spawnData[id] = chosen;

            index++;
        }

        await runTransaction(
            db,
            async transaction=>{

                const snap =
                    await transaction.get(
                        roomRef(roomId)
                    );

                if(!snap.exists()) return;

                const data =
                    snap.data();

                if(
                    data.started ||
                    data.ended
                ){
                    return;
                }

                transaction.update(
                    roomRef(roomId),
                    {
                        started:true,
                        lastRoomActivity:Date.now()
                    }
                );

                for(const id in spawnData){

                    const s =
                        spawnData[id];

                    transaction.update(
                        playerRef(id),
                        {
                            x:s.x,
                            y:s.y,
                            z:s.z,
                            hp:100,
                            dead:false,

                            /*
                              3秒間無敵
                            */
                            invulnerableUntil:
                                Date.now()+3000,

                            lastActivity:Date.now()
                        }
                    );
                }
            }
        );

    }catch(e){

        console.error(e);

        showMessage(
            "開始に失敗しました"
        );
    }
}


// ============================================================
// INACTIVITY CLEANUP
// ============================================================

/*
  条件:
  「部屋にいる全プレイヤーが1分以上操作していない」

  → 部屋を終了
  → プレイヤー情報を削除
  → 各クライアントはroom snapshotが消えたことを検知して
    ロビーへ戻る
*/

const INACTIVE_LIMIT = 60 * 1000;


async function checkInactiveRoom(){

    if(
        !roomId ||
        roomEnded ||
        Date.now()-lastCleanupCheck < 5000
    ){
        return;
    }

    lastCleanupCheck = Date.now();

    try{

        const roomSnap =
            await getDoc(roomRef(roomId));

        if(!roomSnap.exists()){
            returnToLobby(
                "試合が削除されました"
            );
            return;
        }

        const roomData =
            roomSnap.data();

        if(roomData.ended){
            return;
        }

        const playerIds =
            Object.keys(players);

        if(playerIds.length===0){
            return;
        }

        const now = Date.now();

        const allInactive =
            playerIds.every(id=>{

                const p =
                    players[id];

                return (
                    Number(p.lastActivity || 0) <
                    now-INACTIVE_LIMIT
                );
            });

        if(!allInactive){
            return;
        }

        /*
          削除処理はホストだけが実行。
          ただしホスト自身が1分以上操作していないため、
          その時点では他のクライアントが
          「削除対象になった部屋」として検出できるよう、
          まず ended を設定。
        */

        if(roomData.hostUid !== currentUser.uid){
            return;
        }

        await updateDoc(
            roomRef(roomId),
            {
                ended:true,
                endedReason:"allPlayersInactive",
                lastRoomActivity:now
            }
        );

        /*
          試合情報そのものを削除。
        */

        for(const id of playerIds){

            try{
                await deleteDoc(
                    playerRef(id)
                );
            }catch(e){
                console.error(e);
            }
        }

        try{
            await deleteDoc(
                roomRef(roomId)
            );
        }catch(e){
            console.error(e);
        }

    }catch(e){

        console.error(
            "inactive cleanup error:",
            e
        );
    }
}


// ============================================================
// ACTIVITY LOOP
// ============================================================

setInterval(()=>{

    if(!roomId) return;

    /*
      自分が操作した場合、
      最終操作時刻を常に維持。
    */

    if(
        Date.now()-lastActivity < 10000
    ){
        updateFirebasePlayer();
    }

    checkInactiveRoom();

},5000);


// ============================================================
// RETURN TO LOBBY
// ============================================================

async function returnToLobby(reason=""){

    if(!roomId && !gameRunning){
        return;
    }

    gameRunning = false;

    if(unsubscribePlayers){
        unsubscribePlayers();
        unsubscribePlayers = null;
    }

    if(unsubscribeRoom){
        unsubscribeRoom();
        unsubscribeRoom = null;
    }

    const oldRoom =
        roomId;

    roomId = "";
    roomStarted = false;
    roomEnded = false;
    isHost = false;

    players = {};

    startButton.style.display =
        "none";

    deathScreen.style.display =
        "none";

    game.style.display =
        "none";

    lobby.style.display =
        "flex";

    roomButton.disabled = false;

    if(reason){
        lobbyStatus.textContent =
            reason;
    }else{
        lobbyStatus.textContent =
            "";
    }

    /*
      自分のプレイヤーデータが残っていた場合のみ削除。
    */

    if(
        oldRoom &&
        currentUser
    ){

        try{

            await deleteDoc(
                doc(
                    db,
                    "dfpsRooms",
                    oldRoom,
                    "players",
                    currentUser.uid
                )
            );

        }catch(e){
            console.error(e);
        }
    }
}


// ============================================================
// MESSAGE
// ============================================================

let messageTimer = null;

function showMessage(text){

    message.textContent = text;
    message.style.opacity = "1";

    clearTimeout(messageTimer);

    messageTimer =
        setTimeout(()=>{
            message.style.opacity = "0";
        },2500);
}


// ============================================================
// ROOM BUTTON
// ============================================================

roomButton.addEventListener(
    "click",
    createOrJoinRoom
);

roomCodeInput.addEventListener(
    "keydown",
    e=>{
        if(e.key==="Enter"){
            createOrJoinRoom();
        }
    }
);


// ============================================================
// DESKTOP MOUSE LOOK
// ============================================================

let mouseLocked = false;

canvas.addEventListener("click",()=>{

    if(innerWidth>=800 && gameRunning){

        canvas.requestPointerLock?.();
    }
});


document.addEventListener(
    "pointerlockchange",
    ()=>{
        mouseLocked =
            document.pointerLockElement === canvas;
    }
);


document.addEventListener(
    "mousemove",
    e=>{

        if(!mouseLocked) return;

        player.yaw += e.movementX*.003;
        player.pitch += e.movementY*.003;

        player.pitch =
            Math.max(
                -1.35,
                Math.min(1.35,player.pitch)
            );

        registerActivity();
    }
);


// ============================================================
// DESKTOP JUMP
// ============================================================

addEventListener(
    "keydown",
    e=>{

        if(e.code==="Space"){
            e.preventDefault();
            jump();
        }

        if(e.code==="Mouse0"){
            shoot();
        }
    }
);


// ============================================================
// MAIN LOOP
// ============================================================

let previousTime =
    performance.now();


function loop(now){

    const dt =
        Math.min(
            .05,
            (now-previousTime)/1000
        );

    previousTime = now;

    if(gameRunning){

        updateMovement(dt);
        updateBullets(dt);
        updateGrabUI();
        checkDeath();

        updateLocalHP();

        /*
          3秒無敵中は画面上では特に変更せず、
          Firebase側のinvulnerableUntilで判定。
        */

        render();

        updateFirebasePlayer();
    }

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);


// ============================================================
// PAGE CLOSE
// ============================================================

addEventListener(
    "beforeunload",
    ()=>{
        /*
          ページ終了時にも操作時刻を更新しておく。
          実際の部屋削除は他のクライアント/ホストが判定する。
        */

        if(roomId && currentUser){

            updateDoc(
                playerRef(currentUser.uid),
                {
                    lastActivity:Date.now()
                }
            ).catch(()=>{});
        }
    }
);


// ============================================================
// INITIAL UI
// ============================================================

lobbyStatus.textContent =
    currentUser
    ? "試合コードを入力してね"
    : "Firebase接続中……";

</script>
</body>
</html>
