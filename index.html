.info{

#status{

#topBar{

#healthBox,

#crosshair::after{

function randomCode(length=6){

  const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let result = "";

  for(
    let i=0;
    i<length;
    i++
  ){

    result +=
      chars[
        Math.floor(
          Math.random() *
          chars.length
        )
      ];

  }

  return result;

}


function randomSpawn(){

  const margin = 9;

  return {

    x:
      Math.random() *
      (ARENA_SIZE - margin * 2)
      -
      (ARENA_SIZE / 2 - margin),

    y:PLAYER_HEIGHT,

    z:
      Math.random() *
      (ARENA_SIZE - margin * 2)
      -
      (ARENA_SIZE / 2 - margin)

  };

}


function playerColor(uid){

  let hash = 0;

  for(
    let i=0;
    i<uid.length;
    i++
  ){

    hash =
      ((hash << 5) - hash)
      +
      uid.charCodeAt(i);

    hash |= 0;

  }

  const hue =
    Math.abs(hash) % 360;

  return new THREE.Color(
    `hsl(${hue},70%,58%)`
  );

}


function createPlayerMesh(uid){

  const group =
    new THREE.Group();

  const bodyGeometry =
    new THREE.CapsuleGeometry(
      .45,
      .8,
      6,
      12
    );

  const bodyMaterial =
    new THREE.MeshStandardMaterial({

      color:
        playerColor(uid),

      roughness:.8

    });

  const body =
    new THREE.Mesh(
      bodyGeometry,
      bodyMaterial
    );

  body.position.y =
    .8;

  body.castShadow =
    true;

  group.add(body);


  const headGeometry =
    new THREE.SphereGeometry(
      .32,
      16,
      12
    );

  const headMaterial =
    new THREE.MeshStandardMaterial({
      color:0xe7c5a5
    });

  const head =
    new THREE.Mesh(
      headGeometry,
      headMaterial
    );

  head.position.y =
    1.55;

  head.castShadow =
    true;

  group.add(head);


  const gunGeometry =
    new THREE.BoxGeometry(
      .12,
      .12,
      .75
    );

  const gunMaterial =
    new THREE.MeshStandardMaterial({

      color:0x202020,

      metalness:.8,

      roughness:.3

    });

  const gun =
    new THREE.Mesh(
      gunGeometry,
      gunMaterial
    );

  gun.position.set(
    .35,
    1.15,
    -.42
  );

  group.add(gun);


  group.userData.uid =
    uid;

  scene.add(group);

  return group;

}


function removeRemoteMesh(uid){

  const mesh =
    playerMeshes.get(uid);

  if(!mesh){
    return;
  }

  scene.remove(mesh);

  mesh.traverse(
    object => {

      if(object.geometry){
        object.geometry.dispose();
      }

      if(object.material){

        if(
          Array.isArray(
            object.material
          )
        ){

          object.material.forEach(
            material =>
              material.dispose()
          );

        }else{

          object.material.dispose();

        }

      }

    }
  );

  playerMeshes.delete(uid);

}

function createArena(){

  const floorGeometry =
    new THREE.BoxGeometry(
      ARENA_SIZE,
      1,
      ARENA_SIZE
    );

  const floorMaterial =
    new THREE.MeshStandardMaterial({

      color:0x41474d,

      roughness:.92

    });

  const floor =
    new THREE.Mesh(
      floorGeometry,
      floorMaterial
    );

  floor.position.y =
    -.5;

  floor.receiveShadow =
    true;

  scene.add(floor);

  colliders.push(floor);


  const wallMaterial =
    new THREE.MeshStandardMaterial({
      color:0x252b31
    });


  createBox(
    ARENA_SIZE,
    6,
    1,
    0,
    3,
    -ARENA_SIZE / 2,
    wallMaterial
  );

  createBox(
    ARENA_SIZE,
    6,
    1,
    0,
    3,
    ARENA_SIZE / 2,
    wallMaterial
  );

  createBox(
    1,
    6,
    ARENA_SIZE,

function createBox(
  width,
  height,
  depth,
  x,
  y,
  z,
  material
){

  const geometry =
    new THREE.BoxGeometry(
      width,
      height,
      depth
    );

  const mesh =
    new THREE.Mesh(
      geometry,
      material
    );

  mesh.position.set(
    x,
    y,
    z
  );

  mesh.castShadow =
    true;

  mesh.receiveShadow =
    true;

  scene.add(mesh);

  colliders.push(mesh);

  return mesh;

}


function onResize(){

  if(
    !camera ||
    !renderer
  ){
    return;
  }

  camera.aspect =
    window.innerWidth /
    window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

}


async function ensureAuth(){

  if(currentUser){
    return currentUser;
  }

  return new Promise(
    (resolve,reject) => {

      const unsubscribe =
        onAuthStateChanged(
          auth,
          async user => {

            if(user){

              currentUser =
                user;

              unsubscribe();

              resolve(user);

              return;

            }

            try{

              await signInAnonymously(
                auth
              );

            }catch(error){

              unsubscribe();

              reject(error);

            }

          },

          error => {

            unsubscribe();

            reject(error);

          }
        );

    }
  );

}


async function createMatch(
  requestedCode=""
){

  statusEl.textContent =
    "試合を作成中…";

  try{

    const user =
      await ensureAuth();

    let code =
      requestedCode
        .trim()
        .toUpperCase();


    if(!code){

      for(
        let attempt=0;
        attempt<20;
        attempt++
      ){

        const candidate =
          randomCode();

        const ref =
          doc(
            db,
            "matches",
            candidate
          );

        const existing =
          await getDoc(ref);

        if(
          !existing.exists()
        ){

          code =
            candidate;

          break;

        }

      }

    }


    if(!code){

      throw new Error(
        "試合コードを作成できませんでした。"
      );

    }


    const spawn =
      randomSpawn();


    const player = {

      uid:user.uid,

      name:
        "Player-" +
        user.uid.slice(-4),

      x:spawn.x,

      y:spawn.y,

      z:spawn.z,

      yaw:0,

      pitch:0,

      hp:MAX_HP,

      kills:0,

      alive:true

    };


    const ref =
      doc(
        db,
        "matches",
        code
      );


    await runTransaction(
      db,
      async transaction => {

        const snap =
          await transaction.get(
            ref
          );

        if(
          snap.exists()
        ){

          throw new Error(
            "ALREADY_EXISTS"
          );

        }


        transaction.set(
          ref,
          {

            hostUid:user.uid,

            status:"waiting",

            winnerUid:null,

            startAt:null,

            createdAt:
              serverTimestamp(),

            players:{

              [user.uid]:
                player

            }

          }
        );

      }
    );


    isHost = true;

    await startMatch(code);

  }catch(error){

    console.error(error);

    if(
      error?.message ===
      "ALREADY_EXISTS"
    ){

      await joinMatch(
        requestedCode
      );

      return;

    }

    statusEl.textContent =
      "作成失敗：" +
      getFriendlyError(error);

  }

}


async function joinMatch(
  codeOverride=""
){

  const code =
    (
      codeOverride ||
      matchCodeInput.value
    )
      .trim()
      .toUpperCase();


  if(!code){

    await createMatch("");

    return;

  }


  statusEl.textContent =
    "試合を確認中…";


  try{

    const user =
      await ensureAuth();


    const ref =
      doc(
        db,
        "matches",
        code
      );


    const existing =
      await getDoc(ref);


    /*
      ここが今回の重要変更。

      部屋が存在しない
      ↓
      そのコードで新規作成
    */

    if(
      !existing.exists()
    ){

      await createMatch(
        code
      );

      return;

    }


    await runTransaction(
      db,
      async transaction => {

        const snap =
          await transaction.get(
            ref
          );


        if(
          !snap.exists()
        ){

          throw new Error(
            "NOT_FOUND"
          );

        }


        const data =
          snap.data();


        if(
          data.status !==
          "waiting"
        ){

          throw new Error(
            "STARTED"
          );

        }


        const players =
          {
            ...(data.players || {})
          };


        const count =
          Object.keys(players).length;


        if(count >= 8){

          throw new Error(
            "FULL"
          );

        }


        if(
          players[user.uid]
        ){

          return;

        }


        const spawn =
          randomSpawn();


        players[user.uid] = {

          uid:user.uid,

          name:
            "Player-" +
            user.uid.slice(-4),

          x:spawn.x,

          y:spawn.y,

          z:spawn.z,

          yaw:0,

          pitch:0,

          hp:MAX_HP,

          kills:0,

          alive:true

        };


        transaction.update(
          ref,
          {
            players
          }
        );

      }
    );


    isHost = false;

    await startMatch(code);

  }catch(error){

    console.error(error);

    const message =
      error?.message || "";


    if(
      message ===
      "NOT_FOUND"
    ){

      await createMatch(
        code
      );

    }else if(
      message ===
      "FULL"
    ){

      statusEl.textContent =
        "その試合は満員だよ。";

    }else if(
      message ===
      "STARTED"
    ){

      statusEl.textContent =
        "その試合はもう始まってるよ。";

    }else{

      statusEl.textContent =
        "参加/作成失敗：" +
        getFriendlyError(error);

    }

  }

}

function getFriendlyError(error){

  if(!error){
    return "不明なエラー";
  }

  if(
    error.code ===
    "permission-denied"
  ){

    return "Firestoreの権限設定を確認して！";

  }

  if(
    error.code ===
    "auth/operation-not-allowed"
  ){

    return "Firebaseで匿名ログインを有効にして！";

  }

  return (
    error.message ||
    String(error)
  );

}


async function startMatch(code){

  currentMatchId =
    code;

  matchRef =
    doc(
      db,
      "matches",
      code
    );


  menu.style.display =
    "none";

  gameUI.style.display =
    "block";

  gameOver.style.display =
    "none";


  roomText.textContent =
    code;


  if(!scene){

    setupScene();

  }


  gameEnded =
    false;

  gameStarted =
    false;

  roomWaiting =
    true;


  velocityY =
    0;

  localKills =
    0;


  await loadLocalPlayer();


  if(unsubscribeMatch){

    unsubscribeMatch();

    unsubscribeMatch = null;

  }


  unsubscribeMatch =
    onSnapshot(
      matchRef,

      async snapshot => {

        if(
          !snapshot.exists()
        ){

          if(
            gameStarted ||
            roomWaiting
          ){

            finishLocalGame(
              "試合データが削除されました。"
            );

          }

          return;

        }


        const data =
          snapshot.data();


        const players =
          data.players || {};


        const count =
          Object.keys(players).length;


        playerCountText.textContent =
          String(count);


        updateRemotePlayers(
          players
        );


        updateScoreboard(
          players
        );


        const me =
          players[
            currentUser.uid
          ];


        if(me){

          localPlayer = {

            ...localPlayer,

            ...me

          };


          updateLocalHUD();

        }


        if(
          data.status ===
          "waiting"
        ){

          roomWaiting =
            true;

          gameStarted =
            false;

          startTimestamp = 0;

          updateStartButton();

        }


        if(
          data.status ===
          "active"
        ){

          roomWaiting =
            false;

          startTimestamp =
            data.startAt || 0;

          if(
            startTimestamp &&
            !gameStarted
          ){

            gameStarted =
              true;

            gameEnded =
              false;

            randomizeLocalSpawnIfNeeded(
              data
            );

          }

          updateStartButton();

        }


        if(
          data.status ===
          "ended" &&
          !gameEnded
        ){

          const winner =
            data.winnerUid;


          const winnerName =
            winner &&
            players[winner] &&
            players[winner].name
              ? players[winner].name
              : "勝者";


          finishLocalGame(

            winner ===
            currentUser.uid

              ? "YOU WIN!"

              : winnerName +
                " の勝利！"

          );

        }

      },

      error => {

        console.error(error);

        if(
          gameStarted ||
          roomWaiting
        ){

          finishLocalGame(
            "通信エラーが発生しました。"
          );

        }

      }
    );


  if(!gameLoopStarted){

    gameLoopStarted =
      true;

    requestAnimationFrame(
      gameLoop
    );

  }

}


async function loadLocalPlayer(){

  const snap =
    await getDoc(
      matchRef
    );


  if(
    !snap.exists()
  ){

    throw new Error(
      "試合が見つかりません。"
    );

  }


  const data =
    snap.data();


  const player =
    data.players?.[
      currentUser.uid
    ];


  if(!player){

    throw new Error(
      "プレイヤーデータがありません。"
    );

  }


  localPlayer = {
    ...player
  };


  localKills =
    player.kills || 0;


  cameraState.yaw =
    Number(
      player.yaw || 0
    );


  cameraState.pitch =
    Number(
      player.pitch || 0
    );


  setCameraFromPlayer();

  updateLocalHUD();

  updateStartButton();

}


function randomizeLocalSpawnIfNeeded(
  data
){

  if(
    !localPlayer
  ){
    return;
  }


  /*
    startAtが入った瞬間にだけ
    ランダムTPする。
  */

  if(
    localPlayer._teleportedAt ===
    data.startAt
  ){

    return;

  }


  const spawn =
    randomSpawn();


  localPlayer.x =
    spawn.x;

  localPlayer.y =
    spawn.y;

  localPlayer.z =
    spawn.z;

  localPlayer.hp =
    MAX_HP;

  localPlayer.alive =
    true;


  localPlayer._teleportedAt =
    data.startAt;


  velocityY =
    0;


  setCameraFromPlayer();


  updateDoc(
    matchRef,
    {
      [`players.${currentUser.uid}`]:{

        uid:currentUser.uid,

        name:localPlayer.name,

        x:localPlayer.x,

        y:localPlayer.y,

        z:localPlayer.z,

        yaw:cameraState.yaw,

        pitch:cameraState.pitch,

        hp:MAX_HP,

        kills:localKills,

        alive:true

      }

    }
  ).catch(
    error =>
      console.error(
        error
      )
  );

}


function setCameraFromPlayer(){

  if(!localPlayer){
    return;
  }


  camera.position.set(

    localPlayer.x,

    localPlayer.y + .45,

    localPlayer.z

  );


  camera.rotation.order =
    "YXZ";


  camera.rotation.y =
    cameraState.yaw;


  camera.rotation.x =
    cameraState.pitch;

}


function updateRemotePlayers(
  players
){

  const seen =
    new Set();


  for(
    const [
      uid,
      player
    ]
    of Object.entries(players)
  ){

    if(
      uid ===
      currentUser.uid
    ){

      continue;

    }


    seen.add(uid);


    let mesh =
      playerMeshes.get(uid);


    if(!mesh){

      mesh =
        createPlayerMesh(
          uid
        );

      playerMeshes.set(
        uid,
        mesh
      );

    }


    mesh.position.set(

      player.x,

      Math.max(
        0,
        player.y -
        PLAYER_HEIGHT
      ),

      player.z

    );


    mesh.rotation.y =
      Number(
        player.yaw || 0
      );


    mesh.visible =
      Boolean(
        player.alive
      );

  }


  for(
    const uid
    of playerMeshes.keys()
  ){

    if(
      !seen.has(uid)
    ){

      removeRemoteMesh(
        uid
      );

    }

  }

}


function updateScoreboard(

){

  const entries =
    Object.entries(players)
      .sort(
        (a,b) =>
          (b[1].kills || 0) -
          (a[1].kills || 0)
      );


  scoreBoard.innerHTML =
    "";


  for(
    const [
      uid,
      player
    ]
    of entries
  ){

    const row =
      document.createElement(
        "div"
      );


    row.className =
      "scoreRow";

            player.name ||

          );

      document.createElement(

      );


    state.textContent =
      player.alive

        ? `${player.kills || 0} K`

        : "DEAD";


    state.className =
      player.alive

        ? "scoreAlive"

        : "scoreDead";


    row.appendChild(name);

    row.appendChild(state);

    scoreBoard.appendChild(row);

  }

function clamp(
  value,
  min,
  max
){

  return Math.max(
    min,
    Math.min(
      max,
      value
    )
  );

}


function tryMove(
  dx,
  dz
){

  if(
    !localPlayer ||
    !localPlayer.alive
  ){

    return;

  }


  const nextX =
    localPlayer.x +
    dx;


  const nextZ =
    localPlayer.z +
    dz;


  if(
    isPositionFree(
      nextX,
      localPlayer.y,
      nextZ
    )
  ){

    localPlayer.x =
      nextX;

    localPlayer.z =
      nextZ;

  }

}


function isPositionFree(
  x,
  y,
  z
){

  const radius =
    PLAYER_RADIUS;


  if(

    x <
    -ARENA_SIZE / 2 +
    radius ||

    x >
    ARENA_SIZE / 2 -
    radius ||

    z <
    -ARENA_SIZE / 2 +
    radius ||

    z >
    ARENA_SIZE / 2 -
    radius

  ){

    return false;

  }


  const playerBox =
    new THREE.Box3(

      new THREE.Vector3(

        x-radius,

        Math.max(
          0,
          y-1.6
        ),

        z-radius

      ),

      new THREE.Vector3(

        x+radius,

        y+.4,

        z+radius

      )

    );


  for(
    const collider
    of colliders
  ){

    if(
      !collider ||
      !collider.geometry
    ){

      continue;

    }


    if(
      collider ===
      colliders[0]
    ){

      continue;

    }


    const box =
      new THREE.Box3()
        .setFromObject(
          collider
        );


    if(
      box.intersectsBox(
        playerBox
      )
    ){

      return false;

    }

  }


  return true;

}


function updateMovement(
  delta
){

  if(
    !localPlayer ||
    !localPlayer.alive
  ){

    return;

  }


  let inputX = 0;

  let inputZ = 0;


  if(keys.w)
    inputZ -= 1;

  if(keys.s)
    inputZ += 1;

  if(keys.a)
    inputX -= 1;

  if(keys.d)
    inputX += 1;


  inputX +=
    mobileInput.x;

  inputZ +=
    mobileInput.y;


  const length =
    Math.hypot(
      inputX,
      inputZ
    );


  if(length > 1){

    inputX /=
      length;

    inputZ /=
      length;

  }


  const moving =
    Math.abs(inputX) > .01 ||
    Math.abs(inputZ) > .01;


  if(moving){

    const sprinting =

      keys.shift ||

      mobileInput.sprinting;


    const speed =

      sprinting

        ? physics.sprintSpeed

        : physics.moveSpeed;


    const amount =
      speed * delta;


    const forwardX =
      -Math.sin(
        cameraState.yaw
      );


    const forwardZ =
      -Math.cos(
        cameraState.yaw
      );


    const rightX =
      Math.cos(
        cameraState.yaw
      );


    const rightZ =
      -Math.sin(
        cameraState.yaw
      );


    const moveX =

      (
        forwardX * -inputZ +
        rightX * inputX
      ) * amount;


    const moveZ =

      (
        forwardZ * -inputZ +
        rightZ * inputX
      ) * amount;


    tryMove(
      moveX,
      moveZ
    );

  }


  velocityY +=
    physics.gravity *
    delta;


  localPlayer.y +=
    velocityY *
    delta;


  const landing =
    findLandingPlatform(
      localPlayer.x,
      localPlayer.y,
      localPlayer.z
    );


  if(
    velocityY <= 0 &&
    landing !== null &&
    localPlayer.y <=
    landing + .08
  ){

    localPlayer.y =
      landing;

    velocityY =
      0;

    grounded =
      true;

  }else if(
    localPlayer.y <=
    PLAYER_HEIGHT
  ){

    localPlayer.y =
      PLAYER_HEIGHT;

    velocityY =
      0;

    grounded =
      true;

  }else{

    grounded =
      false;

  }


  camera.position.set(

    localPlayer.x,

    localPlayer.y + .45,

    localPlayer.z

  );


  camera.rotation.order =
    "YXZ";


  camera.rotation.y =
    cameraState.yaw;


  camera.rotation.x =
    cameraState.pitch;


  updateGrabButton();

}


function findLandingPlatform(
  x,
  y,
  z
){

  let best = null;

  for(
    let i=1;
    i<colliders.length;
    i++
  ){

    const object =
      colliders[i];


    const box =
      new THREE.Box3()
        .setFromObject(
          object
        );


    const insideX =
      x >= box.min.x -
      PLAYER_RADIUS &&

      x <= box.max.x +
      PLAYER_RADIUS;


    const insideZ =
      z >= box.min.z -
      PLAYER_RADIUS &&

      z <= box.max.z +
      PLAYER_RADIUS;


    if(
      insideX &&
      insideZ &&
      box.max.y <=
      y + .15
    ){

      if(
        best === null ||
        box.max.y > best
      ){

        best =
          box.max.y;

      }

    }

  }

  return best;

}


function jump(){

  if(
    !localPlayer ||
    !localPlayer.alive ||
    gameEnded
  ){

    return;

  }


  if(
    grounded
  ){

    velocityY =
      physics.jumpPower;

    grounded =
      false;

    return;

  }


  /*
    空中JUMP
    ↓
    GRAB条件を満たしていれば登る
  */

  if(
    canGrab()
  ){

    grab();

  }

}


function canGrab(){

  if(
    !localPlayer ||
    !localPlayer.alive ||
    grounded ||
    performance.now() <
    grabBusyUntil
  ){

    return false;

  }


  const feetY =
    localPlayer.y -
    PLAYER_HEIGHT;


  const headY =
    localPlayer.y;


  let nearest = null;

  let nearestDistance =
    Infinity;


  for(
    let i=1;
    i<colliders.length;
    i++
  ){

    const object =
      colliders[i];


    const box =
      new THREE.Box3()
        .setFromObject(
          object
        );


    const centerX =
      (box.min.x +
       box.max.x) / 2;


    const centerZ =
      (box.min.z +
       box.max.z) / 2;


    const dx =
      localPlayer.x -
      clamp(
        localPlayer.x,
        box.min.x,
        box.max.x
      );


    const dz =
      localPlayer.z -
      clamp(
        localPlayer.z,
        box.min.z,
        box.max.z
      );


    const horizontalDistance =
      Math.hypot(
        dx,
        dz
      );


    /*
      「ほぼ0距離」
      プレイヤーの足元から
      1.15m以内
    */

    if(
      horizontalDistance >
      GRAB_DISTANCE
    ){

      continue;

    }


    /*
      自分の全身の一番上より下
    */

    if(
      box.max.y >=
      headY
    ){

      continue;

    }


    /*
      足場が現在の足元より
      上にあること
    */

    if(
      box.max.y <=
      feetY + .15
    ){

      continue;

    }


    const distance =
      horizontalDistance;


    if(
      distance <
      nearestDistance
    ){

      nearest =
        object;

      nearestDistance =
        distance;

    }

  }


  return nearest;

}


function grab(){

  if(
    !canGrab()
  ){

    return;

  }


  let target = null;

  let nearestDistance =
    Infinity;


  const feetY =
    localPlayer.y -
    PLAYER_HEIGHT;


  const headY =
    localPlayer.y;


  for(
    let i=1;
    i<colliders.length;
    i++
  ){

    const object =
      colliders[i];


    const box =
      new THREE.Box3()
        .setFromObject(
          object
        );


    const dx =
      localPlayer.x -
      clamp(
        localPlayer.x,
        box.min.x,
        box.max.x
      );


    const dz =
      localPlayer.z -
      clamp(
        localPlayer.z,
        box.min.z,
        box.max.z
      );


    const distance =
      Math.hypot(
        dx,
        dz
      );


    if(
      distance >
      GRAB_DISTANCE
    ){
      continue;
    }


    if(
      box.max.y >=
      headY
    ){
      continue;
    }


    if(
      box.max.y <=
      feetY + .15
    ){
      continue;
    }


    if(
      distance <
      nearestDistance
    ){

      nearestDistance =
        distance;

      target =
        box;

    }

  }


  if(!target){
    return;
  }


  grabBusyUntil =
    performance.now() +
    GRAB_TIME;


  grabButton.classList.add(
    "grabbing"
  );


  const targetY =
    target.max.y +
    PLAYER_HEIGHT;


  const startX =
    localPlayer.x;


  const startY =
    localPlayer.y;


  const startZ =
    localPlayer.z;


  const startTime =
    performance.now();


  function animateGrab(){

    const progress =
      clamp(
        (
          performance.now() -
          startTime
        ) /
        GRAB_TIME,
        0,
        1
      );


    const smooth =
      progress *
      progress *
      (3 - 2 * progress);


    localPlayer.y =
      startY +
      (
        targetY -
        startY
      ) *
      smooth;


    velocityY =
      0;


    if(
      progress < 1
    ){

      requestAnimationFrame(
        animateGrab
      );

    }else{

      localPlayer.y =
        targetY;

      grounded =
        true;

      grabButton.classList.remove(
        "grabbing"
      );

    }

  }


  animateGrab();

}

async function damagePlayer(
  targetUid
){

  if(
    !matchRef ||
    gameEnded ||
    !gameStarted ||
    isInvincible()
  ){

    return;

  }


  try{

    let wasKill =
      false;


    await runTransaction(
      db,
      async transaction => {

        const snap =
          await transaction.get(
            matchRef
          );


        if(
          !snap.exists()
        ){

          return;

        }


        const data =
          snap.data();


        if(
          data.status !==
          "active"
        ){

          return;

        }


        const players =
          {
            ...(data.players || {})
          };


        const shooter =
          players[
            currentUser.uid
          ];


        const target =
          players[targetUid];


        if(
          !shooter ||
          !target
        ){

          return;

        }


        if(
          !shooter.alive ||
          !target.alive
        ){

          return;

        }


        /*
          START後3秒間は
          全員無敵
        */

        if(
          data.startAt &&
          (
            Date.now() -
            data.startAt
          ) < 3000
        ){

          return;

        }


        target.hp =
          Math.max(
            0,
            Number(
              target.hp || 0
            ) -
            DAMAGE
          );


        if(
          target.hp <= 0
        ){

          target.alive =
            false;

          target.hp =
            0;


          shooter.kills =
            Number(
              shooter.kills || 0
            ) + 1;


          wasKill =
            true;


          localKills =
            shooter.kills;


          const alivePlayers =
            Object.values(
              players
            ).filter(
              player =>
                player.alive
            );


          if(
            alivePlayers.length <= 1
          ){

            transaction.update(
              matchRef,
              {

                players,

                status:"ended",

                winnerUid:
                  alivePlayers.length === 1
                    ? alivePlayers[0].uid
                    : null

              }
            );

            return;

          }

        }


        transaction.update(
          matchRef,
          {
            players
          }
        );

      }
    );


    if(wasKill){

      showKillMessage(
        "ELIMINATED"
      );

    }

  }catch(error){

    console.error(
      "damage error",
      error
    );

  }

}


function createBullet(){

  const bulletId =
    currentUser.uid +
    "_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .slice(2);


  const origin =
    camera.position.clone();


  const direction =
    new THREE.Vector3();


  camera.getWorldDirection(
    direction
  );


  const geometry =
    new THREE.SphereGeometry(
      .055,
      8,
      8
    );


  const material =
    new THREE.MeshBasicMaterial({
      color:0xffdf62
    });


  const mesh =
    new THREE.Mesh(
      geometry,
      material
    );


  mesh.position.copy(
    origin
  );


  scene.add(mesh);


  bullets.set(
    bulletId,
    {

      id:bulletId,

      mesh,

      position:
        origin.clone(),

      direction:
        direction.clone(),

      speed:
        BULLET_SPEED,

      born:
        performance.now(),

      shooter:
        currentUser.uid

    }
  );

}


function updateBullets(
  delta
){

  const now =
    performance.now();


  for(
    const [
      id,
      bullet
    ]
    of bullets
  ){

    const distance =
      bullet.speed *
      delta;


    bullet.position.add(
      bullet.direction
        .clone()
        .multiplyScalar(
          distance
        )
    );


    bullet.mesh.position.copy(
      bullet.position
    );


    const elapsed =
      (
        now -
        bullet.born
      ) / 1000;


    let remove =
      elapsed >
      BULLET_LIFETIME;


    /*
      壁・足場への衝突
    */

    if(!remove){

      const collisionRay =
        new THREE.Raycaster(
          bullet.position,
          bullet.direction,
          0,
          distance + .08
        );


      const hits =
        collisionRay.intersectObjects(
          colliders,
          false
        );


      if(hits.length){

        remove =
          true;

      }

    }


    /*
      リモートプレイヤーへの
      弾の衝突
    */

    if(!remove){

      for(
        const [
          uid,
          mesh
        ]
        of playerMeshes
      ){

        if(
          uid ===
          currentUser.uid
        ){

          continue;

        }


        if(
          !mesh.visible
        ){

          continue;

        }


        const box =
          new THREE.Box3()
            .setFromObject(
              mesh
            );


        if(
          box.containsPoint(
            bullet.position
          )
        ){

          remove =
            true;


          const hitDistance =
            bullet.position.distanceTo(
              camera.position
            );


          setTimeout(
            () => {

              damagePlayer(
                uid
              );

            },
            Math.max(
              0,
              (
                hitDistance /
                BULLET_SPEED
              ) *
              1000
            )
          );


          break;

        }

      }

    }


    if(remove){

      scene.remove(
        bullet.mesh
      );

      bullet.mesh.geometry.dispose();

      bullet.mesh.material.dispose();

      bullets.delete(id);

    }

  }

}

function startHoldBegin(
  event
){

  if(
    event
  ){
    event.preventDefault();
  }


  if(
    !isHost ||
    !roomWaiting ||
    startHoldActive
  ){

    return;

  }


  startHoldActive =
    true;


  startHoldStart =
    performance.now();


  updateStartButton();


  function update(){

    if(
      !startHoldActive
    ){

      return;

    }


    const progress =
      clamp(
        (
          performance.now() -
          startHoldStart
        ) /
        START_HOLD_TIME,
        0,
        1
      );


    startButton.style
      .setProperty(
        "--progress",
        `${progress * 360}deg`
      );


    if(
      progress >= 1
    ){

      startHoldActive =
        false;

      startButton.style
        .setProperty(
          "--progress",
          "360deg"
        );


      actuallyStartMatch();

      return;

    }


    startHoldTimer =
      requestAnimationFrame(
        update
      );

  }


  startHoldTimer =
    requestAnimationFrame(
      update
    );

}


function startHoldEnd(){

  if(
    !startHoldActive
  ){

    return;

  }


  startHoldActive =
    false;


  if(
    startHoldTimer
  ){

    cancelAnimationFrame(
      startHoldTimer
    );

  }


  startHoldTimer =
    null;


  startButton.style
    .setProperty(
      "--progress",
      "0deg"
    );


  updateStartButton();

}


async function actuallyStartMatch(){

  if(
    !isHost ||
    !matchRef ||
    !roomWaiting
  ){

    return;

  }


  try{

    const startAt =
      Date.now();


    await runTransaction(
      db,
      async transaction => {

        const snap =
          await transaction.get(
            matchRef
          );


        if(
          !snap.exists()
        ){

          throw new Error(
            "NOT_FOUND"
          );

        }


        const data =
          snap.data();


        if(
          data.status !==
          "waiting"
        ){

          throw new Error(
            "ALREADY_STARTED"
          );

        }


        const players =
          {
            ...(data.players || {})
          };


        /*
          開始時に全員をランダムTP。
        */

        for(
          const uid
          of Object.keys(players)
        ){

          const spawn =
            randomSpawn();


          players[uid] = {

            ...players[uid],

            x:spawn.x,

            y:spawn.y,

            z:spawn.z,

            hp:MAX_HP,

            alive:true

          };

        }


        transaction.update(
          matchRef,
          {

            status:"active",

            startAt,

            players,

            winnerUid:null

          }
        );

      }
    );


  }catch(error){

    console.error(error);

    statusEl.textContent =
      "START失敗：" +
      getFriendlyError(error);

  }

}

){

      cameraState.pitch,
      -1.45,
      1.45
    );

}

function setupMobileInput(){

  let joystickPointerId =
    null;


  function updateJoystick(
    clientX,
    clientY
  ){

    const rect =
      joystickZone
        .getBoundingClientRect();


    const centerX =
      rect.left +
      rect.width / 2;


    const centerY =
      rect.top +
      rect.height / 2;


    let dx =
      clientX -
      centerX;


    let dy =
      clientY -
      centerY;


    const max =
      53;


    const distance =
      Math.hypot(
        dx,
        dy
      );


    if(
      distance > max
    ){

      dx =
        dx /
        distance *
        max;

      dy =
        dy /
        distance *
        max;

    }


    mobileInput.x =
      dx / max;


    mobileInput.y =
      dy / max;


    joystickKnob.style.transform =
      `translate(${dx}px,${dy}px)`;

  }


  joystickZone.addEventListener(
    "pointerdown",
    event => {

      joystickPointerId =
        event.pointerId;


      joystickZone.setPointerCapture(
        event.pointerId
      );


      updateJoystick(
        event.clientX,
        event.clientY
      );

    }
  );


  joystickZone.addEventListener(
    "pointermove",
    event => {

      if(
        event.pointerId ===
        joystickPointerId
      ){

        updateJoystick(
          event.clientX,
          event.clientY
        );

      }

    }
  );


  function endJoystick(
    event
  ){

    if(
      event.pointerId !==
      joystickPointerId
    ){

      return;

    }


    joystickPointerId =
      null;


    mobileInput.x =
      0;

    mobileInput.y =
      0;


    joystickKnob.style.transform =
      "translate(0,0)";

  }


  joystickZone.addEventListener(
    "pointerup",
    endJoystick
  );

  joystickZone.addEventListener(
    "pointercancel",
    endJoystick
  );


  let lookPointerId =
    null;

  let lastLookX =
    0;

  let lastLookY =
    0;


  lookZone.addEventListener(
    "pointerdown",
    event => {

      lookPointerId =
        event.pointerId;


      lastLookX =
        event.clientX;


      lastLookY =
        event.clientY;


      lookZone.setPointerCapture(
        event.pointerId
      );

    }
  );


  lookZone.addEventListener(
    "pointermove",
    event => {

      if(
        event.pointerId !==
        lookPointerId
      ){

        return;

      }


      const dx =
        event.clientX -
        lastLookX;


      const dy =
        event.clientY -
        lastLookY;


      lastLookX =
        event.clientX;


      lastLookY =
        event.clientY;


      cameraState.yaw -=
        dx * .006;


      cameraState.pitch -=
        dy * .006;


      cameraState.pitch =
        clamp(
          cameraState.pitch,
          -1.45,
          1.45
        );

    }
  );


  function endLook(
    event
  ){

    if(
      event.pointerId ===
      lookPointerId
    ){

      lookPointerId =
        null;

    }

  }


  lookZone.addEventListener(
    "pointerup",
    endLook
  );

  lookZone.addEventListener(
    "pointercancel",
    endLook
  );


  /*
    スマホRUNはトグル式。

    押している間だけではなく、
    1回タップ→ON
    もう1回タップ→OFF
  */

  sprintButton.addEventListener(
    "pointerdown",
    event => {

      event.preventDefault();

      mobileInput.sprinting =
        !mobileInput.sprinting;


      sprintButton.classList.toggle(
        "active",
        mobileInput.sprinting
      );

    }
  );


  /*
    JUMP
    空中ならGRAB判定もここから
  */

  jumpButton.addEventListener(
    "pointerdown",
    event => {

      event.preventDefault();

      jump();

    }
  );


  /*
    GRABボタン
  */

  grabButton.addEventListener(
    "pointerdown",
    event => {

      event.preventDefault();

      if(
        canGrab()
      ){

        grab();

      }

    }
  );


  /*
    FIRE
  */

  fireButton.addEventListener(
    "pointerdown",
    event => {

      event.preventDefault();

      mobileInput.firing =
        true;

      shoot();

    }
  );


  fireButton.addEventListener(
    "pointerup",
    event => {

      event.preventDefault();

      mobileInput.firing =
        false;

    }
  );


  fireButton.addEventListener(
    "pointercancel",
    () => {

      mobileInput.firing =
        false;

    }
  );

}

  }


  gameEnded =
    true;

  gameStarted =
    false;

  roomWaiting =
    false;


  gameOverText.textContent =
    text;


  gameOver.style.display =
    "flex";


  startButton.style.display =
    "none";


  for(
    const [
      id,
      bullet
    ]
    of bullets
  ){

    scene.remove(
      bullet.mesh
    );

    bullet.mesh.geometry.dispose();

    bullet.mesh.material.dispose();

  }


  bullets.clear();

}


function leaveCurrentMatch(){

  if(
    unsubscribeMatch
  ){

    unsubscribeMatch();

    unsubscribeMatch =
      null;

  }


  for(
    const uid
    of playerMeshes.keys()
  ){

    removeRemoteMesh(
      uid
    );

  }


  for(
    const [
      id,
      bullet
    ]
    of bullets
  ){

    scene.remove(
      bullet.mesh
    );

    bullet.mesh.geometry.dispose();

    bullet.mesh.material.dispose();

  }


  bullets.clear();


  currentMatchId =
    null;

  matchRef =
    null;

  localPlayer =
    null;

  gameStarted =
    false;

  gameEnded =
    false;

  roomWaiting =
    false;

  isHost =
    false;

  startTimestamp =
    0;


  gameUI.style.display =
    "none";

  gameOver.style.display =
    "none";

  menu.style.display =
    "flex";


  statusEl.textContent =
    "";


  matchCodeInput.value =
    "";


  mobileInput.sprinting =
    false;

  sprintButton.classList.remove(
    "active"
  );

}


async function handleReturn(){

  const ref =
    matchRef;


  const shouldDelete =
    isHost &&
    ref;


  leaveCurrentMatch();


  if(
    shouldDelete
  ){

    try{

      await deleteDoc(
        ref
      );

    }catch(error){

      console.error(
        error
      );

    }

  }

}


function gameLoop(
  time
){

  const delta =
    Math.min(
      (
        time -
        lastFrameTime
      ) / 1000,
      .05
    );


  lastFrameTime =
    time;


  if(
    gameStarted &&
    !gameEnded
  ){

    updateMovement(
      delta
    );


    if(
      mobileInput.firing
    ){

      shoot();

    }


    updateBullets(
      delta
    );


    syncLocalPlayer();

  }


  updateInvincibleUI();

  updateFireUI();

  updateGrabButton();


  if(
    renderer &&
    scene &&
    camera
  ){

    renderer.render(
      scene,
      camera
    );

  }


  requestAnimationFrame(
    gameLoop
  );

}


matchButton.addEventListener(
  "click",
  handleMatchButton
);


returnButton.addEventListener(
  "click",
  handleReturn
);


matchCodeInput.addEventListener(
  "input",
  () => {

    matchCodeInput.value =
      matchCodeInput.value
        .replace(
          /[^A-Za-z0-9]/g,
          ""
        )
        .toUpperCase();

  }
);


matchCodeInput.addEventListener(
  "keydown",
  event => {

    if(
      event.key ===
      "Enter"
    ){

      handleMatchButton();

    }

  }
);


/*
  START長押し
*/

startButton.addEventListener(
  "pointerdown",
  startHoldBegin
);


startButton.addEventListener(
  "pointerup",
  startHoldEnd
);


startButton.addEventListener(
  "pointercancel",
  startHoldEnd
);


startButton.addEventListener(
  "pointerleave",
  startHoldEnd
);


setupDesktopInput();

setupMobileInput();


window.addEventListener(
  "beforeunload",
  () => {

    if(
      isHost &&
      matchRef
    ){

      deleteDoc(
        matchRef
      ).catch(
        () => {}
      );

    }

  }
);


try{

  await ensureAuth();

  statusEl.textContent =
    "接続準備OK";

}catch(error){

  console.error(error);

  statusEl.textContent =
    "Firebase接続失敗：" +
    getFriendlyError(error);

}

</script>

</body>
</html>
