<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<!-- GPT VERSION TRACKER: Firebase Online Battle HTML. Current version 1.2.1. On future updates, change the version here and in the visible subtitle; keep this comment invisible to players and update it every release. Release 1.2.1 changes: room URLs with QR sharing and an enhanced START hold animation. Future GPT edits must update this tracker whenever the version changes. Choose major/minor/patch increments based on update size. -->
<title>Firebase 3D FPS</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  touch-action:none;
}

canvas{
  display:block;
}

#menu{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(circle at 50% 30%,#26384f 0%,#111822 40%,#05070a 100%);
  color:white;
  overflow-y:scroll;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  touch-action:pan-y !important;
  align-items:flex-start;
  padding:24px 0;
}

.menuBox{
  width:min(92vw,480px);
  flex:0 0 auto;
  margin:0 auto;
  padding:28px;
  border-radius:22px;
  background:rgba(15,20,28,.88);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 20px 80px rgba(0,0,0,.45);
  backdrop-filter:blur(18px);
}

.title{
  margin:0 0 8px;
  font-size:34px;
  font-weight:800;
  text-align:center;
}

.subtitle{
  text-align:center;
  opacity:.72;
  margin-bottom:24px;
}

.input{
  width:100%;
  height:48px;
  padding:0 16px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:12px;
  background:rgba(255,255,255,.07);
  color:#fff;
  font-size:18px;
  outline:none;
  text-transform:uppercase;
  margin-bottom:12px;
}

.button{
  width:100%;
  height:48px;
  border:0;
  border-radius:12px;
  color:#fff;
  background:#1976ff;
  font-size:17px;
  font-weight:700;
  margin-top:8px;
  cursor:pointer;
}

.button.secondary{
  background:#2a3039;
}

.button:active{
  transform:scale(.98);
}

.info{
  margin-top:18px;
  font-size:13px;
  line-height:1.6;
  color:#c5ccd5;
}

#status{
  min-height:22px;
  margin-top:12px;
  text-align:center;
  color:#ffce66;
  font-size:14px;
}

#gameUI{
  position:fixed;
  inset:0;
  z-index:20;
  pointer-events:none;
  display:none;
  color:#fff;
}

#topBar{
  position:absolute;
  top:12px;
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:8px;
}

#healthBox,#matchBox{
  padding:9px 12px;
  border-radius:12px;
  background:rgba(0,0,0,.45);
  backdrop-filter:blur(8px);
  font-size:14px;
}

#health{
  margin-top:5px;
  width:170px;
  height:10px;
  overflow:hidden;
  border-radius:99px;
  background:#252525;
}

#healthBar{
  width:100%;
  height:100%;
  background:#48e27d;
  transition:width .15s;
}

#crosshair{
  position:absolute;
  left:50%;
  top:50%;
  width:18px;
  height:18px;
  margin-left:-9px;
  margin-top:-9px;
}

#crosshair::before,
#crosshair::after{
  content:"";
  position:absolute;
  background:#fff;
  box-shadow:0 0 3px #000;
}

#crosshair::before{
  width:2px;
  height:18px;
  left:8px;
  top:0;
}

#crosshair::after{
  width:18px;
  height:2px;
  left:0;
  top:8px;
}

#killMessage{
  position:absolute;
  left:50%;
  top:42%;
  transform:translate(-50%,-50%);
  font-size:28px;
  font-weight:900;
  text-shadow:0 3px 15px #000;
  opacity:0;
  transition:opacity .15s;
}

#scoreBoard{
  position:absolute;
  right:12px;
  top:70px;
  min-width:150px;
  max-width:220px;
  padding:10px;
  border-radius:12px;
  background:rgba(0,0,0,.45);
  backdrop-filter:blur(8px);
  font-size:12px;
}

.scoreRow{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin:3px 0;
}

.scoreAlive{
  color:#6dff8f;
}

.scoreDead{
  color:#ff7070;
}

#preStart{
  position:absolute;
  inset:0;
  display:none;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  width:100%;
  height:100%;
  padding:24px;
  pointer-events:auto;
  text-align:center;
  background:
    radial-gradient(circle at 50% 34%,rgba(39,83,132,.78) 0%,rgba(16,27,42,.96) 38%,rgba(3,6,10,1) 100%);
  overflow:hidden;
}

#preStart::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:linear-gradient(to bottom,transparent,black 25%,black 75%,transparent);
  pointer-events:none;
}

#preStart > *{
  position:relative;
  z-index:1;
}

#gameUI.preStartMode #topBar,
#gameUI.preStartMode #scoreBoard,
#gameUI.preStartMode #crosshair,
#gameUI.preStartMode #killMessage,
#gameUI.preStartMode #protectionIndicator,
#gameUI.preStartMode #mobileControls,
#gameUI.preStartMode #desktopHint{
  display:none !important;
}

.preStartButtons{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

.preStartSmallButton{
  min-width:105px;
  height:40px;
  padding:0 13px;
  border:1px solid rgba(255,255,255,.16);
  border-radius:10px;
  background:rgba(0,0,0,.48);
  color:#fff;
  font-size:13px;
  font-weight:800;
  pointer-events:auto;
  touch-action:none;
}

.preStartSmallButton:active{
  transform:scale(.97);
}

#startButton{
  touch-action:none;
  pointer-events:auto;
  cursor:pointer;
  -webkit-appearance:none;
  appearance:none;
}

#startButton::before,
#startButton::after{
  pointer-events:none;
}

#preStartText{
  margin-bottom:12px;
  font-weight:800;
  font-size:16px;
}

.preStartRoomTitle{
  margin-bottom:8px;
  font-size:13px;
  font-weight:900;
  letter-spacing:1.5px;
  opacity:.68;
}

.preStartRoomTitle span{
  opacity:1;
  color:#fff;
}

#startButton{
  position:relative;
  display:block;
  margin:0 auto;
  width:105px;
  height:105px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.35);
  background:rgba(0,0,0,.42);
  color:#fff;
  font-size:18px;
  font-weight:900;
  overflow:hidden;
}

#startButton::before{
  content:"";
  position:absolute;
  inset:5px;
  border-radius:50%;
  background:
    conic-gradient(
      #36a3ff var(--progress,0%),
      rgba(255,255,255,.10) var(--progress,0%)
    );
  z-index:0;
}

#startButton::after{
  content:"";
  position:absolute;
  inset:13px;
  border-radius:50%;
  background:rgba(12,17,23,.94);
  z-index:1;
}

#startButton span{
  position:relative;
  z-index:2;
}

#protectionIndicator{
  position:absolute;
  left:50%;
  top:78px;
  transform:translateX(-50%);
  padding:8px 14px;
  border-radius:999px;
  background:rgba(30,130,255,.25);
  border:1px solid rgba(100,190,255,.65);
  box-shadow:0 0 22px rgba(50,150,255,.32);
  color:#dff5ff;
  font-size:14px;
  font-weight:900;
  letter-spacing:.2px;
  opacity:0;
  transition:opacity .12s;
  pointer-events:none;
  z-index:4;
}

#shareModal{
  position:absolute;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  padding:18px;
  background:rgba(0,0,0,.68);
  backdrop-filter:blur(9px);
  pointer-events:auto;
  z-index:40;
}

.shareBox{
  width:min(92vw,430px);
  padding:22px;
  border-radius:20px;
  background:rgba(15,20,28,.97);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 20px 80px rgba(0,0,0,.55);
  text-align:center;
}

.shareTitle{
  margin:0 0 12px;
  font-size:22px;
  font-weight:900;
}

#shareUrlText{
  width:100%;
  padding:10px 12px;
  border-radius:10px;
  background:rgba(255,255,255,.06);
  color:#dce6f2;
  font-size:12px;
  line-height:1.4;
  word-break:break-all;
  margin-bottom:14px;
}

#qrContainer{
  width:230px;
  height:230px;
  margin:0 auto 16px;
  padding:10px;
  border-radius:14px;
  background:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

#qrContainer img,
#qrContainer canvas{
  width:210px !important;
  height:210px !important;
  image-rendering:pixelated;
}

#closeShareButton{
  margin-top:8px;
}

#startButton.startHolding{
  transform:scale(1.055);
  border-color:rgba(100,190,255,.9);
  box-shadow:
    0 0 0 5px rgba(54,163,255,.13),
    0 0 22px rgba(54,163,255,.55),
    0 0 48px rgba(54,163,255,.25);
  animation:startPulse 1s ease-in-out infinite;
}

#startButton.startHolding::after{
  background:
    radial-gradient(circle at 50% 42%,rgba(54,163,255,.24),rgba(12,17,23,.96) 64%);
}

#startButton.startHolding span{
  text-shadow:
    0 0 7px rgba(110,205,255,.9),
    0 0 18px rgba(54,163,255,.55);
  animation:startTextPulse .65s ease-in-out infinite alternate;
}

@keyframes startPulse{
  0%,100%{
    filter:brightness(1);
  }
  50%{
    filter:brightness(1.18);
  }
}

@keyframes startTextPulse{
  from{
    transform:scale(1);
    letter-spacing:0;
  }
  to{
    transform:scale(1.08);
    letter-spacing:1.5px;
  }
}

#settingsModal{
  position:absolute;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  padding:18px;
  background:rgba(0,0,0,.62);
  backdrop-filter:blur(8px);
  pointer-events:auto;
  z-index:30;
}

.settingsBox{
  width:min(92vw,500px);
  max-height:88vh;
  overflow:auto;
  padding:20px;
  border-radius:18px;
  background:rgba(15,20,28,.96);
  border:1px solid rgba(255,255,255,.13);
  box-shadow:0 20px 80px rgba(0,0,0,.5);
}

.settingsTitle{
  margin:0 0 14px;
  text-align:center;
  font-size:22px;
  font-weight:900;
}

.settingRow{
  margin:12px 0;
}

.settingLabel{
  display:block;
  margin-bottom:7px;
  font-size:13px;
  font-weight:800;
}

.settingOptions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}

.settingOption{
  min-height:40px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:9px;
  background:rgba(255,255,255,.06);
  color:#fff;
  font-size:12px;
  font-weight:800;
  pointer-events:auto;
}

.settingOption.selected{
  background:#1976ff;
  border-color:#5ba7ff;
}

.settingRow.disabled{
  opacity:.27;
}

.settingRow.disabled .settingOption,
.settingRow.disabled input{
  pointer-events:none;
}

.settingNumber{
  width:100%;
  height:42px;
  padding:0 12px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:9px;
  background:rgba(255,255,255,.06);
  color:#fff;
  font-size:16px;
  outline:none;
}

.settingsHint{
  margin-top:4px;
  font-size:11px;
  opacity:.55;
}

.settingsButtons{
  display:flex;
  gap:8px;
  margin-top:16px;
}

.settingsButtons .button{
  margin-top:0;
}

#gameOver{
  position:fixed;
  inset:0;
  z-index:50;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.68);
  backdrop-filter:blur(10px);
  color:white;
}

.gameOverBox{
  width:min(88vw,430px);
  padding:28px;
  border-radius:22px;
  text-align:center;
  background:rgba(18,22,29,.94);
}

.gameOverTitle{
  font-size:38px;
  font-weight:900;
  margin-bottom:8px;
}

.gameOverText{
  font-size:18px;
  opacity:.85;
  margin-bottom:20px;
}

#mobileControls{
  display:none;
  position:absolute;
  inset:0;
  pointer-events:none;
}

#joystickZone{
  position:absolute;
  left:0;
  bottom:0;
  width:58%;
  height:78%;
  pointer-events:auto;
}

#joystickBase{
  position:absolute;
  left:76px;
  top:calc(100% - 76px);
  width:118px;
  height:118px;
  margin-left:-59px;
  margin-top:-59px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.23);
  background:rgba(255,255,255,.06);
  opacity:0;
  transition:opacity .08s;
  pointer-events:none;
}

#joystickKnob{
  position:absolute;
  left:50%;
  top:50%;
  width:54px;
  height:54px;
  margin-left:-27px;
  margin-top:-27px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.16);
}

#lookZone{
  position:absolute;
  right:0;
  top:0;
  width:55%;
  height:70%;
  pointer-events:auto;
}

.mobileButton{
  position:absolute;
  border:1px solid rgba(255,255,255,.25);
  background:rgba(20,20,20,.45);
  color:#fff;
  border-radius:50%;
  backdrop-filter:blur(8px);
  pointer-events:auto;
  font-weight:800;
  display:flex;
  justify-content:center;
  align-items:center;
}

#fireButton{
  width:88px;
  height:88px;
  right:24px;
  bottom:32px;
  background:rgba(220,50,50,.28);
  overflow:hidden;
}

#fireButton::before{
  content:"";
  position:absolute;
  inset:4px;
  border-radius:50%;
  background:
    conic-gradient(
      rgba(255,80,80,.9) var(--fireProgress,100%),
      rgba(255,255,255,.08) var(--fireProgress,100%)
    );
  z-index:0;
}

#fireButton::after{
  content:"";
  position:absolute;
  inset:12px;
  border-radius:50%;
  background:rgba(25,20,20,.9);
  z-index:1;
}

#fireButton span{
  position:relative;
  z-index:2;
}

#jumpButton{
  width:64px;
  height:64px;
  right:125px;
  bottom:44px;
  transition:
    opacity .12s,
    background .12s;
}

#jumpButton.grabInactive{
  opacity:.28;
  background:rgba(20,20,20,.25);
}

#jumpButton.grabActive{
  opacity:1;
  background:rgba(35,130,255,.55);
}

#grabButton{
  display:none !important;
}

#desktopHint{
  position:absolute;
  bottom:14px;
  left:50%;
  transform:translateX(-50%);
  padding:7px 11px;
  border-radius:8px;
  background:rgba(0,0,0,.38);
  font-size:12px;
  opacity:.65;
}

.hidden{
  display:none !important;
}

@media (pointer:coarse){

  #mobileControls{
    display:block;
  }

  #desktopHint{
    display:none;
  }

}
</style>
</head>

<body>

<div id="menu">

  <div class="menuBox">

    <h1 class="title">3D FPS</h1>

    <div class="subtitle">
      v1.2.1
    </div>

    <input
      id="matchCodeInput"
      class="input"
      maxlength="8"
      placeholder="試合コード"
      autocomplete="off"
      spellcheck="false"
    >

    <input
      id="playerNameInput"
      class="input"
      maxlength="16"
      placeholder="プレイヤー名"
      autocomplete="off"
      spellcheck="false"
    >

    <button
      id="matchButton"
      class="button"
    >
      試合を作成/参加
    </button>

    <div id="status"></div>

    <div class="info">
      PC：WASDで移動、マウスで視点、クリックで射撃、Spaceでジャンプ<br>
      スマホ：左スティックで移動、右側スワイプで視点、FIRE・JUMP・GRAB
    </div>

  </div>

</div>

<div id="gameUI">

  <div id="topBar">

    <div id="healthBox">

      <div id="healthText">
        HP 100
      </div>

      <div id="health">

        <div id="healthBar"></div>

      </div>

    </div>

    <div id="matchBox">

      <div>
        ROOM:
        <span id="roomText">----</span>
      </div>

      <div>
        PLAYER:
        <span id="playerCountText">0</span>
      </div>

      <div>
        KILLS:
        <span id="killsText">0</span>
      </div>

    </div>

  </div>

  <div id="scoreBoard"></div>

  <div id="crosshair"></div>

  <div id="killMessage"></div>

  <div id="preStart">

    <div class="preStartRoomTitle">ROOM <span id="preStartRoomCode">----</span></div>

    <div id="preStartText">
      部屋主がSTARTを長押しして開始
    </div>

    <button id="startButton">
      <span>START</span>
    </button>

    <div class="preStartButtons">
      <button id="shareCodeButton" class="preStartSmallButton">URL…</button>
      <button id="leaveRoomButton" class="preStartSmallButton">部屋から退出</button>
      <button id="settingsButton" class="preStartSmallButton">設定</button>
    </div>

  </div>

  <div id="protectionIndicator">🛡 無敵 3.0秒</div>

  <div id="shareModal">
    <div class="shareBox">
      <h2 class="shareTitle">部屋のURL</h2>
      <div id="shareUrlText"></div>
      <div id="qrContainer"></div>
      <button id="shareUrlButton" class="button">リンクを共有</button>
      <button id="closeShareButton" class="button secondary">閉じる</button>
    </div>
  </div>

  <div id="settingsModal">
    <div class="settingsBox">
      <h2 class="settingsTitle">設定</h2>

      <div class="settingRow" id="terrainAmountRow">
        <span class="settingLabel">地形の量</span>
        <div class="settingOptions" data-setting="terrainAmount">
          <button class="settingOption" data-value="many">多</button>
          <button class="settingOption selected" data-value="medium">中</button>
          <button class="settingOption" data-value="few">少</button>
          <button class="settingOption" data-value="none">なし</button>
        </div>
      </div>

      <div class="settingRow" id="terrainHeightRow">
        <span class="settingLabel">地形の高低差</span>
        <div class="settingOptions" data-setting="terrainHeight">
          <button class="settingOption" data-value="high">高</button>
          <button class="settingOption selected" data-value="medium">中</button>
          <button class="settingOption" data-value="low">低</button>
        </div>
      </div>

      <div class="settingRow">
        <span class="settingLabel">弾速</span>
        <div class="settingOptions" data-setting="bulletSpeed">
          <button class="settingOption" data-value="infinite">∞</button>
          <button class="settingOption" data-value="fast">速</button>
          <button class="settingOption selected" data-value="medium">中</button>
          <button class="settingOption" data-value="slow">遅</button>
        </div>
      </div>

      <div class="settingRow">
        <span class="settingLabel">最大連射速度</span>
        <div class="settingOptions" data-setting="fireRate">
          <button class="settingOption" data-value="fast">速</button>
          <button class="settingOption selected" data-value="medium">中</button>
          <button class="settingOption" data-value="slow">遅</button>
        </div>
      </div>

      <div class="settingRow">
        <label class="settingLabel" for="maxHpInput">HP最大値</label>
        <input id="maxHpInput" class="settingNumber" type="number" min="1" max="9999" step="1" value="100">
      </div>

      <div class="settingRow" id="regenRow">
        <span class="settingLabel">HP自然回復</span>
        <div class="settingOptions" data-setting="hpRegen">
          <button class="settingOption" data-value="fast">速</button>
          <button class="settingOption" data-value="medium">中</button>
          <button class="settingOption" data-value="slow">遅</button>
          <button class="settingOption selected" data-value="none">なし</button>
        </div>
      </div>

      <div class="settingRow" id="regenLockRow">
        <label class="settingLabel" for="regenLockInput">ダメージからの自然回復ロック</label>
        <input id="regenLockInput" class="settingNumber" type="number" min="0" max="9999" step="0.1" value="0">
        <div class="settingsHint">秒</div>
      </div>

      <div class="settingsButtons">

function normalizeSettings(settings){

  const source =
    settings && typeof settings === "object"
      ? settings
      : {};

  const maxHp =
    clamp(
      Number(source.maxHp) || DEFAULT_SETTINGS.maxHp,
      1,
      9999
    );

  const regenLock =
    clamp(
      Number(source.regenLock) || 0,
      0,
      9999
    );

  return {
    terrainAmount:
      ["many","medium","few","none"].includes(source.terrainAmount)
        ? source.terrainAmount
        : DEFAULT_SETTINGS.terrainAmount,
    terrainHeight:
      ["high","medium","low"].includes(source.terrainHeight)
        ? source.terrainHeight
        : DEFAULT_SETTINGS.terrainHeight,
    bulletSpeed:
      ["infinite","fast","medium","slow"].includes(source.bulletSpeed)
        ? source.bulletSpeed
        : DEFAULT_SETTINGS.bulletSpeed,
    fireRate:
      ["fast","medium","slow"].includes(source.fireRate)
        ? source.fireRate
        : DEFAULT_SETTINGS.fireRate,
    maxHp,
    hpRegen:
      ["fast","medium","slow","none"].includes(source.hpRegen)
        ? source.hpRegen
        : DEFAULT_SETTINGS.hpRegen,
    regenLock
  };
}

function getTerrainSpawnY(x, z, settings){

  const normalized = normalizeSettings(settings);

  if(normalized.terrainAmount === "none") return PLAYER_HEIGHT;

  const platforms = [
    [8,1.5,8,-15,.75,-10],
    [11,2,5,13,1,-8],
    [6,2.5,6,17,1.25,14],
    [10,1.5,5,-15,.75,15],
    [5,2,12,0,1,17],
    [6,3.5,6,-15,1.75,-1],
    [7,4,7,4,2,-14],
    [7,4.5,7,16,2.25,2],
    [5,.9,5,-4,.45,-5],
    [5,1.3,5,4,.65,-5],
    [5,1.7,5,10,.85,-5],
    [4,.7,4,-10,.35,-18],
    [4,1.1,4,-4,.55,-18],
    [4,1.5,4,2,.75,-18],
    [4,1.9,4,8,.95,-18],
    [5,2.2,5,-18,1.1,8],
    [6,2.8,5,5,1.4,8],
    [5,3.8,5,12,1.9,-17],
    [5,4.4,5,-5,2.2,18],
    [4,5,4,12,2.5,18],
    [5,2.6,5,-20,1.3,-18],
    [5,3.2,5,20,1.6,-18],
    [6,2.2,4,-21,1.1,0],
    [6,3.8,4,21,1.9,0]
  ];

  const amountCount =
    normalized.terrainAmount === "many"
      ? platforms.length
      : normalized.terrainAmount === "few"
        ? 7
        : 14;

  const heightScale =
    normalized.terrainHeight === "high"
      ? 1.45
      : normalized.terrainHeight === "low"
        ? .65
        : 1;

  let top = 0;

  for(let i=0; i<Math.min(amountCount, platforms.length); i++){
    const [width, baseHeight, depth, px, baseY, pz] = platforms[i];
    const height = Math.max(.45, baseHeight * heightScale);
    if(
      Math.abs(x - px) <= width / 2 &&
      Math.abs(z - pz) <= depth / 2
    ){
      top = Math.max(top, height);
    }
  }

  return top + PLAYER_HEIGHT;
}

function getActualTerrainSpawnY(x, z, settings){

  let top = 0;

  if(colliders && colliders.length){

    for(const collider of colliders){

      if(!collider || !collider.userData.terrainPlatform){
        continue;
      }

      const box =
        new THREE.Box3().setFromObject(collider);

      if(
        x >= box.min.x &&
        x <= box.max.x &&
        z >= box.min.z &&
        z <= box.max.z
      ){
        top = Math.max(top, box.max.y);
      }

    }

  }

  const calculated =
    getTerrainSpawnY(x, z, settings);

  return Math.max(PLAYER_HEIGHT + top, calculated);
}

function liftPlayerOutOfTerrain(player, settings = currentSettings){

  if(!player){

  const x =
    Number(player.x) || 0;

  const z =
    Number(player.z) || 0;

  const safeY =
    getActualTerrainSpawnY(
      x,
      z,
      settings
    );

  if(
    Number(player.y) < safeY
  ){
    player.y = safeY;
  }
}

function playerColor(uid){

  let hash = 0;

  for(
    let i = 0;
    i < uid.length;
    i++
  ){

    hash =
      (
        (hash << 5) -
        hash
      ) +
      uid.charCodeAt(i);

    hash |= 0;

  }

  const hue =
    Math.abs(hash) % 360;

  return new THREE.Color(
    `hsl(${hue},70%,58%)`
  );

}

    [5,2,12,0,1,17],
    [6,3.5,6,-15,1.75,-1],
    [7,4,7,4,2,-14],
    [7,4.5,7,16,2.25,2],
    [5,.9,5,-4,.45,-5],
    [5,1.3,5,4,.65,-5],
    [5,1.7,5,10,.85,-5],
    [4,.7,4,-10,.35,-18],
    [4,1.1,4,-4,.55,-18],
    [4,1.5,4,2,.75,-18],
    [4,1.9,4,8,.95,-18],
    [5,2.2,5,-18,1.1,8],
    [6,2.8,5,5,1.4,8],
    [5,3.8,5,12,1.9,-17],
    [5,4.4,5,-5,2.2,18],
    [4,5,4,12,2.5,18],
    [5,2.6,5,-20,1.3,-18],
    [5,3.2,5,20,1.6,-18],
    [6,2.2,4,-21,1.1,0],
    [6,3.8,4,21,1.9,0]
  ];

  const amountCount =
    normalized.terrainAmount === "many"
      ? platforms.length
      : normalized.terrainAmount === "few"
        ? 7
        : 14;

  const heightScale =
    normalized.terrainHeight === "high"
      ? 1.45
      : normalized.terrainHeight === "low"
        ? .65
        : 1;

  for(let i = 0; i < Math.min(amountCount, platforms.length); i++){

    const [width, baseHeight, depth, x, baseY, z] = platforms[i];

    const height =
      Math.max(.45, baseHeight * heightScale);

    const platform =
      createBox(
        width,
        height,
        depth,
        x,
        height / 2,
        z,
        obstacleMaterial
      );

    platform.userData.terrainPlatform = true;
  }

}

function createBox(
  width,
  height,
  depth,
  x,
  y,
  z,
  material
){

  const geometry =
    new THREE.BoxGeometry(
      width,
      height,
      depth
    );

  const mesh =
    new THREE.Mesh(
      geometry,
      material
    );

  mesh.position.set(
    x,
    y,
    z
  );

  mesh.castShadow =
    true;

  mesh.receiveShadow =
    true;

  mesh.userData.isArena = true;

  scene.add(mesh);

  colliders.push(mesh);

  return mesh;

}


function onResize(){

  if(
    !camera ||
    !renderer
  ){
    return;
  }

  camera.aspect =
    window.innerWidth /
    window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

}


async function ensureAuth(){

  if(currentUser){

    return currentUser;

  }

  return new Promise(
    (resolve,reject) => {

      const unsubscribe =
        onAuthStateChanged(
          auth,
          async user => {

            if(user){

              currentUser =
                user;

              unsubscribe();

              resolve(user);

              return;

            }

            try{

              await signInAnonymously(
                auth
              );

            }catch(error){

              unsubscribe();

              reject(error);

            }

          },

          error => {

            unsubscribe();

            reject(error);

          }
        );

    }
  );

}


async function createMatch(
  requestedCode = ""
){

  statusEl.textContent =
    "試合を作成中…";

  try{

    const user =
      await ensureAuth();

    let code =
      requestedCode
        .trim()
        .toUpperCase();


    if(!code){

      for(
        let attempt = 0;
        attempt < 20;
        attempt++
      ){

        const candidate =
          randomCode();

        const ref =
          doc(
            db,
            "matches",
            candidate
          );

        const existing =
          await getDoc(ref);

        if(
          !existing.exists()
        ){

          code =
            candidate;

          break;

        }

      }

    }


    if(!code){

      throw new Error(
        "試合コードを作成できませんでした。"
      );

    }


    const spawn =
      randomSpawn();


    const player = {

      uid:
        user.uid,

      name:
        getPlayerName(),

      x:
        spawn.x,

      y:
        spawn.y,

      z:
        spawn.z,

      yaw:
        0,

      pitch:
        0,

      hp:
        normalizeSettings(currentSettings).maxHp,

      kills:
        0,

      alive:
        true,

      lastActiveAt:
        Date.now(),

      lastDamageAt:
        0,

      joinOrder:
        0

    };


    const ref =
      doc(
        db,
        "matches",
        code
      );


    await runTransaction(
      db,
      async transaction => {

        const snap =
          await transaction.get(
            ref
          );

        if(
          snap.exists()
        ){

          throw new Error(
            "ALREADY_EXISTS"
          );

        }


        transaction.set(
          ref,
          {

            hostUid:
              user.uid,

            status:
              "waiting",

            winnerUid:
              null,

            createdAt:
              serverTimestamp(),

            startedAt:
              null,

            settings:
              { ...DEFAULT_SETTINGS },

            playerOrder:[
              user.uid
            ],

            players:{

              [user.uid]:
                player

            }

          }
        );

      }
    );


    isHost =
      true;


    await startMatch(
      code
    );


  }catch(error){

    console.error(error);

    if(
      error?.message ===
      "ALREADY_EXISTS"
    ){

      await joinMatch(
        requestedCode
      );

      return;

    }

    statusEl.textContent =
      "作成失敗：" +
      getFriendlyError(error);

  }

}


async function joinMatch(
  codeOverride = ""
){

  const code =
    (
      codeOverride ||
      matchCodeInput.value
    )
      .trim()
      .toUpperCase();


  if(!code){

    await createMatch("");

    return;

  }


  statusEl.textContent =
    "試合を確認中…";


  try{

    const user =
      await ensureAuth();


    const ref =
      doc(
        db,
        "matches",
        code
      );


    const existing =
      await getDoc(ref);


    /*
      ここが今回の重要部分。

      部屋が存在しなければ、
      参加失敗ではなく
      「そのコードで作成」する。
    */

    if(
      !existing.exists()
    ){

      await createMatch(
        code
      );

      return;

    }


    await runTransaction(
      db,
      async transaction => {

        const snap =
          await transaction.get(
            ref
          );


        if(!snap.exists()){

          throw new Error(
            "NOT_FOUND"
          );

        }


        const data =
          snap.data();


        if(
          data.status ===
          "ended"
        ){

          throw new Error(
            "ENDED"
          );

        }


        const players =
          {
            ...(data.players || {})
          };


        if(
          players[user.uid]
        ){

          return;

        }


        const count =
          Object.keys(
            players
          ).length;

        const playerOrder =
          Array.isArray(data.playerOrder)
            ? [...data.playerOrder]
            : Object.keys(players);


        if(count >= 8){

          throw new Error(
            "FULL"
          );

        }


        const spawn =
          randomSpawn();


        players[user.uid] = {

          uid:
            user.uid,

          name:
            "Player-" +
            user.uid.slice(-4),

          x:
            spawn.x,

          y:
            spawn.y,

          z:
            spawn.z,

          yaw:
            0,

          pitch:
            0,

          hp:
            normalizeSettings(data.settings).maxHp,

          kills:
            0,

          alive:
            true,

          lastActiveAt:
            Date.now(),

          lastDamageAt:
            0,

          joinOrder:
            (data.playerOrder || []).length

        };


        playerOrder.push(user.uid);
        players[user.uid].joinOrder =
          playerOrder.length - 1;

        transaction.update(
          ref,
          {

            players,

            playerOrder

          }
        );

      }
    );


    isHost =
      false;


    await startMatch(
      code
    );


  }catch(error){

    console.error(error);

    const message =
      error?.message || "";


    if(
      message ===
      "NOT_FOUND"
    ){

      await createMatch(
        code
      );

    }else if(
      message ===
      "FULL"
    ){

      statusEl.textContent =
        "その試合は満員だよ。";

    }else if(
      message ===
      "ENDED"
    ){

      statusEl.textContent =
        "その試合はもう終了してるよ。";

    }else{

      statusEl.textContent =
        "参加/作成失敗：" +
        getFriendlyError(error);

    }

  }

}

      .replace(/\s+/g, " ")
      .trim()
      .slice(0, 16);

  return name || "Player-" + (currentUser?.uid || "").slice(-4);

}


function getFriendlyError(error){

  if(!error){

    return "不明なエラー";

  }


  if(
    error.code ===
    "permission-denied"
  ){

    return "Firestoreの権限設定を確認して！";

  }


  if(
    error.code ===
    "auth/operation-not-allowed"
  ){

    return "Firebaseで匿名ログインを有効にして！";

  }


  return (
    error.message ||
    String(error)
  );

}


async function startMatch(
  code
){

  currentMatchId =
    code;

  restoreOriginalUrl();

  matchRef =
    doc(
      db,
      "matches",
      code
    );


  menu.style.display =
    "none";

  gameUI.style.display =
    "block";

  gameOver.style.display =
    "none";


  roomText.textContent =
    code;


  currentSettings =
    normalizeSettings(currentSettings || DEFAULT_SETTINGS);

  if(!scene){

    setupScene();

  }


  gameEnded =
    false;

  gameStarted =
    true;

  matchHasStarted =
    false;


  velocityY =
    0;


  await loadLocalPlayer();


  if(unsubscribeMatch){

    unsubscribeMatch();

    unsubscribeMatch =
      null;

  }


  unsubscribeMatch =
    onSnapshot(
      matchRef,

      async snapshot => {

        if(
          !snapshot.exists()
        ){

          if(gameStarted){

            leaveCurrentMatch();

          }

          return;

        }


        const data =
          snapshot.data();

        isHost =
          data.hostUid === currentUser.uid;

        const incomingSettings =
          normalizeSettings(data.settings);

        if(
          JSON.stringify(currentSettings) !==
          JSON.stringify(incomingSettings)
        ){
          currentSettings =
            incomingSettings;

          if(scene && matchHasStarted){
            rebuildArena(currentSettings);
          }

          updateSettingsUI(currentSettings);
        }

        checkMatchCleanup(
          data
        );


        const players =
          data.players ||
          {};


        const count =
          Object.keys(
            players
          ).length;


        playerCountText.textContent =
          String(count);


        updateRemotePlayers(
          players
        );


        updateScoreboard(
          players,
          data.playerOrder
        );


        const me =
          players[
            currentUser.uid
          ];


        if(me){

          localPlayer =
            {

              ...localPlayer,

              ...me

            };


          localKills =
            me.kills || 0;


          updateLocalHUD();

        }


        const wasStarted =
          matchHasStarted;


        if(
          data.status ===
          "active"
        ){

          matchHasStarted =
            true;

        }


        if(
          data.status ===
          "active" &&
          !wasStarted
        ){

          if(scene){
            rebuildArena(currentSettings);
          }

          if(localPlayer){
            const beforeY =
              Number(localPlayer.y) || PLAYER_HEIGHT;

            liftPlayerOutOfTerrain(
              localPlayer,
              currentSettings
            );

            if(
              Number(localPlayer.y) > beforeY
            ){
              velocityY = 0;
              grounded = true;
            }
          }

          const startedAt =
            data.startedAt;


          spawnProtectionUntil =
            Date.now() +
            START_PROTECTION_TIME;


          if(startedAt){

            const serverMillis =
              startedAt.toMillis
                ? startedAt.toMillis()
                : Date.now();


            spawnProtectionUntil =
              serverMillis +
              START_PROTECTION_TIME;

          }

        }


        updateStartUI(
          data
        );

        updateProtectionIndicator();


        if(
          data.status ===
          "ended" &&
          !gameEnded
        ){

          const winner =
            data.winnerUid;


          const winnerName =
            winner &&
            players[winner] &&
            players[winner].name
              ? players[winner].name
              : "勝者";


          finishLocalGame(

            winner ===
            currentUser.uid

              ? "YOU WIN!"

              : winnerName +
                " の勝利！"

          );

          setTimeout(
            () => {
              if(
                matchRef
              ){
                deleteMatch();
              }
            },
            1200
          );

        }

      },

      error => {

        console.error(
          error
        );

        if(gameStarted){

          finishLocalGame(
            "通信エラーが発生しました。"
          );

        }

      }
    );


  if(!gameLoopStarted){

    gameLoopStarted =
      true;

    requestAnimationFrame(
      gameLoop
    );

  }

}


async function loadLocalPlayer(){

  const snap =
    await getDoc(
      matchRef
    );


  if(
    !snap.exists()
  ){

    throw new Error(
      "試合が見つかりません。"
    );

  }


  const data =
    snap.data();

  currentSettings =
    normalizeSettings(data.settings);

  const player =
    data.players?.[
      currentUser.uid
    ];


  if(!player){

    throw new Error(
      "プレイヤーデータがありません。"
    );

  }


  const playerOrder =
    Array.isArray(data.playerOrder)
      ? data.playerOrder
      : [];

  localPlayer =
    {
      ...player,
      joinOrder:
        Number.isFinite(player.joinOrder)
          ? player.joinOrder
          : playerOrder.indexOf(currentUser.uid),
      lastActiveAt:
        Number(
          player.lastActiveAt ||
          Date.now()
        )
    };


  lastActivityAt =
    localPlayer.lastActiveAt;


  localKills =
    player.kills || 0;


  cameraState.yaw =
    Number(
      player.yaw || 0
    );


  cameraState.pitch =
    Number(
      player.pitch || 0
    );


  setCameraFromPlayer();

  updateLocalHUD();

  updateStartUI(
    data
  );

}

  );

function setCameraFromPlayer(){

  if(!localPlayer){

    return;

  }


  camera.position.set(

    localPlayer.x,

    localPlayer.y + .45,

    localPlayer.z

  );


  camera.rotation.order =
    "YXZ";


  camera.rotation.y =
    cameraState.yaw;


  camera.rotation.x =
    cameraState.pitch;

}


function updateRemotePlayers(
  players
){

  const seen =
    new Set();


  for(
    const [
      uid,
      player
    ]
    of Object.entries(players)
  ){

    if(
      uid ===
      currentUser.uid
    ){

      continue;

    }


    seen.add(uid);


    let mesh =
      playerMeshes.get(uid);


    if(!mesh){

      mesh =
        createPlayerMesh(
          uid
        );

      playerMeshes.set(
        uid,
        mesh
      );

    }


    mesh.position.set(

      player.x,

      Math.max(
        0,
        player.y -
        PLAYER_HEIGHT
      ),

      player.z

    );


    mesh.rotation.y =
      Number(
        player.yaw || 0
      );


    mesh.visible =
      Boolean(
        player.alive
      );

  }


  for(
    const uid
    of playerMeshes.keys()
  ){

    if(
      !seen.has(uid)
    ){

      removeRemoteMesh(
        uid
      );

    }

  }

}


function updateScoreboard(
  players,
  playerOrder = []
){

  const order =
    Array.isArray(playerOrder)
      ? playerOrder
      : [];

  const entries =
    Object.entries(players)
      .sort(
        (a,b) => {
          const ao =
            order.indexOf(a[0]);
          const bo =
            order.indexOf(b[0]);
          const safeA =
            ao < 0 ? 999999 : ao;
          const safeB =
            bo < 0 ? 999999 : bo;
          return safeA - safeB || a[0].localeCompare(b[0]);
        }
      );


  scoreBoard.innerHTML =
    "";


  for(
    const [
      uid,
      player
    ]
    of entries
  ){

    const row =
      document.createElement(
        "div"
      );

    row.className =
      "scoreRow";


    const name =
      document.createElement(
        "span"
      );


    name.textContent =
      uid ===
      currentUser.uid

        ? "YOU"

        : player.name ||
          uid.slice(-4);


    const state =
      document.createElement(
        "span"
      );


    state.textContent =
      player.alive

        ? `${player.kills || 0} K`

        : "DEAD";


    state.className =
      player.alive

        ? "scoreAlive"

        : "scoreDead";


    row.appendChild(name);

    row.appendChild(state);

    scoreBoard.appendChild(row);

  }

}

function clamp(
  value,
  min,
  max
){

  return Math.max(
    min,
    Math.min(
      max,
      value
    )
  );

}

function getColliderBoxes(){
  return colliders
    .filter(
      collider =>
        collider &&
        collider.geometry
    )
    .map(
      collider =>
        new THREE.Box3()
          .setFromObject(collider)
    );
}


function horizontalOverlaps(
  box,
  x,
  z,
  radius = .38
){
  return (
    x + radius > box.min.x &&
    x - radius < box.max.x &&
    z + radius > box.min.z &&
    z - radius < box.max.z
  );
}


function isPositionFree(
  x,
  y,
  z
){

  const radius =
    .38;

  if(
    x < -ARENA_SIZE / 2 + radius ||
    x > ARENA_SIZE / 2 - radius ||
    z < -ARENA_SIZE / 2 + radius ||
    z > ARENA_SIZE / 2 - radius
  ){
    return false;
  }

  const feetY =
    y - PLAYER_HEIGHT;

  const headY =
    y + .35;

  for(
    const collider
    of colliders
  ){

    if(
      !collider ||
      !collider.geometry ||
      collider === colliders[0]
    ){
      continue;
    }

    const box =
      new THREE.Box3()
        .setFromObject(
          collider
        );

    if(
      !horizontalOverlaps(
        box,
        x,
        z,
        radius
      )
    ){
      continue;
    }

    /*
      足場の上に立っている場合は、
      足場そのものを横移動の障害物にしない。
    */
    if(
      box.max.y <=
      feetY + .06
    ){
      continue;
    }

    if(
      box.min.y >=
      headY - .06
    ){
      continue;
    }

    return false;
  }

  return true;
}


function getLandingTop(
  x,
  z,
  previousFeetY,
  nextFeetY
){

  let bestTop =
    null;

  /*
    床の上面は y=0。
  */
  if(
    previousFeetY >= -.05 &&
    nextFeetY <= .05
  ){
    bestTop = 0;
  }

  for(
    const collider
    of colliders
  ){

    if(
      !collider ||
      !collider.geometry ||
      collider === colliders[0]
    ){
      continue;
    }

    const box =
      new THREE.Box3()
        .setFromObject(
          collider
        );

    if(
      !horizontalOverlaps(
        box,
        x,
        z,
        .36
      )
    ){
      continue;
    }

    const top =
      box.max.y;

    if(
      previousFeetY >= top - .08 &&
      nextFeetY <= top + .08
    ){

      if(
        bestTop === null ||
        top > bestTop
      ){
        bestTop =
          top;
      }

    }
  }

  return bestTop;
}


function getCeilingBottom(
  x,
  z,
  previousHeadY,
  nextHeadY
){

  let bestBottom =
    null;

  for(
    const collider
    of colliders
  ){

    if(
      !collider ||
      !collider.geometry ||
      collider === colliders[0]
    ){
      continue;
    }

    const box =
      new THREE.Box3()
        .setFromObject(
          collider
        );

    if(
      !horizontalOverlaps(
        box,
        x,
        z,
        .36
      )
    ){
      continue;
    }

    const bottom =
      box.min.y;

    if(
      previousHeadY <= bottom + .08 &&
      nextHeadY >= bottom - .08
    ){

      if(
        bestBottom === null ||
        bottom < bestBottom
      ){
        bestBottom =
          bottom;
      }

    }
  }

  return bestBottom;
}


function tryMove(
  dx,
  dz
){

  if(
    !localPlayer ||
    !localPlayer.alive ||
    !matchHasStarted
  ){
    return;
  }

  const nextX =
    localPlayer.x +
    dx;

  const nextZ =
    localPlayer.z +
    dz;

  /*
    X/Zを分離して判定することで、
    足場の端で壁に引っかかりにくくする。
  */
  if(
    isPositionFree(
      nextX,
      localPlayer.y,
      localPlayer.z
    )
  ){
    localPlayer.x =
      nextX;
  }

  if(
    isPositionFree(
      localPlayer.x,
      localPlayer.y,
      nextZ
    )
  ){
    localPlayer.z =
      nextZ;
  }
}


function updateMovement(
  delta
){

  if(
    !localPlayer ||
    !localPlayer.alive ||
    !matchHasStarted ||
    grabAnimation
  ){
    return;
  }

  let inputX =
    0;

  let inputZ =
    0;

  if(keys.w)
    inputZ -= 1;

  if(keys.s)
    inputZ += 1;

  if(keys.a)
    inputX -= 1;

  if(keys.d)
    inputX += 1;

  inputX +=
    mobileInput.x;

  inputZ +=
    mobileInput.y;

  const length =
    Math.hypot(
      inputX,
      inputZ
    );

  if(length > 1){
    inputX /=
      length;

    inputZ /=
      length;
  }

  const moving =
    Math.abs(inputX) > .01 ||
    Math.abs(inputZ) > .01;

  if(moving){

    markActivity();

    const speed =
      physics.moveSpeed;

    const amount =
      speed * delta;

    const forwardX =
      -Math.sin(
        cameraState.yaw
      );

    const forwardZ =
      -Math.cos(
        cameraState.yaw
      );

    const rightX =
      Math.cos(
        cameraState.yaw
      );

    const rightZ =
      -Math.sin(
        cameraState.yaw
      );

    const moveX =
      (
        forwardX * -inputZ +
        rightX * inputX
      ) *
      amount;

    const moveZ =
      (
        forwardZ * -inputZ +
        rightZ * inputX
      ) *
      amount;

    tryMove(
      moveX,
      moveZ
    );
  }

  const previousFeetY =
    localPlayer.y -
    PLAYER_HEIGHT;

  const previousHeadY =
    localPlayer.y +
    .35;

  velocityY +=
    physics.gravity *
    delta;

  let nextY =
    localPlayer.y +
    velocityY * delta;

  const nextFeetY =
    nextY -
    PLAYER_HEIGHT;

  const nextHeadY =
    nextY +
    .35;

  if(
    velocityY <= 0
  ){

    const landingTop =
      getLandingTop(
        localPlayer.x,
        localPlayer.z,
        previousFeetY,
        nextFeetY
      );

    if(
      landingTop !== null
    ){

      localPlayer.y =
        landingTop +
        PLAYER_HEIGHT;

      velocityY =
        0;

      grounded =
        true;

    }else{

      localPlayer.y =
        nextY;

      grounded =
        false;

    }

  }else{

    const ceilingBottom =
      getCeilingBottom(
        localPlayer.x,
        localPlayer.z,
        previousHeadY,
        nextHeadY
      );

    if(
      ceilingBottom !== null
    ){

      localPlayer.y =
        ceilingBottom -
        .35;

      velocityY =
        0;

    }else{

      localPlayer.y =
        nextY;

    }

    grounded =
      false;
  }

  /*
    落下しすぎた場合の安全処理。
  */
  if(
    localPlayer.y <
    -10
  ){

    localPlayer.y =
      PLAYER_HEIGHT;

    velocityY =
      0;

    grounded =
      true;
  }

  camera.position.set(
    localPlayer.x,
    localPlayer.y + .45,
    localPlayer.z
  );

  camera.rotation.order =
    "YXZ";

  camera.rotation.y =
    cameraState.yaw;

  camera.rotation.x =
    cameraState.pitch;

  updateGrabUI();
}


function jump(){

  if(
    !localPlayer ||
    !localPlayer.alive ||
    !matchHasStarted
  ){

    return;

  }


  /*
    空中ならJUMPボタンがGRABになる。
    条件を満たしていればそのまま掴む。
  */

  if(!grounded){

    if(
      canGrab()
    ){

      startGrab();

    }

    return;

  }

  markActivity();

  velocityY =
    physics.jumpPower;

  grounded =
    false;

}


function getGrabTarget(){

  if(
    !localPlayer ||
    grounded
  ){

    return null;

  }


  const playerX =
    localPlayer.x;

  const playerY =
    localPlayer.y;

  const playerZ =
    localPlayer.z;


  let best =
    null;

  let bestDistance =
    Infinity;


  /*
    足場の上面が
    自分の足元より上、
    しかし頭より下。
  */

  const feetY =
    playerY -
    PLAYER_HEIGHT;

  const headY =
    playerY;


  for(
    const collider
    of colliders
  ){

    if(
      collider ===
      colliders[0]
    ){

      continue;

    }


    const box =
      new THREE.Box3()
        .setFromObject(
          collider
        );


    const insideX =
      playerX >=
        box.min.x -
        GRAB_DISTANCE &&

      playerX <=
        box.max.x +
        GRAB_DISTANCE;


    const insideZ =
      playerZ >=
        box.min.z -
        GRAB_DISTANCE &&

      playerZ <=
        box.max.z +
        GRAB_DISTANCE;


    if(
      !insideX ||
      !insideZ
    ){

      continue;

    }


    const platformTop =
      box.max.y;


    if(
      platformTop <=
      feetY + .05
    ){

      continue;

    }


    if(
      platformTop >=
      headY
    ){

      continue;

    }


    const centerX =
      clamp(
        playerX,
        box.min.x,
        box.max.x
      );


    const centerZ =
      clamp(
        playerZ,
        box.min.z,
        box.max.z
      );


    const distance =
      Math.hypot(

        playerX -
        centerX,

        playerZ -
        centerZ

      );


    if(
      distance >
      GRAB_DISTANCE
    ){

      continue;

    }


    if(
      distance <
      bestDistance
    ){

      bestDistance =
        distance;

      best = {

        box,

        top:
          platformTop,

        x:
          centerX,

        z:
          centerZ

      };

    }

  }


  return best;

}


function canGrab(){

  return Boolean(
    getGrabTarget()

function startGrab(){

  if(
    grabAnimation ||
    grounded ||
    !localPlayer
  ){

    return;

  }


  const target =
    getGrabTarget();


  if(!target){

    return;

  }

  markActivity();

  grabAnimation = {

    start:
      performance.now(),

    target,

    startX:
      localPlayer.x,

    startY:
      localPlayer.y,

    startZ:
      localPlayer.z

  };


  velocityY =
    0;


}


function updateGrabAnimation(
  now
){

  if(!grabAnimation){

    return;

  }


  const elapsed =
    now -
    grabAnimation.start;


  const progress =
    clamp(
      elapsed /
      GRAB_TIME,
      0,
      1
    );


  const smooth =
    progress *
    progress *
    (
      3 -
      2 * progress
    );


  const target =
    grabAnimation.target;


  localPlayer.x =
    grabAnimation.startX +
    (
      target.x -
      grabAnimation.startX
    ) *
    smooth;


  localPlayer.z =
    grabAnimation.startZ +
    (
      target.z -
      grabAnimation.startZ
    ) *
    smooth;


  localPlayer.y =
    target.top +
    PLAYER_HEIGHT +
    .02;


  camera.position.set(

    localPlayer.x,

    localPlayer.y + .45,

    localPlayer.z

  );


  if(
    progress >= 1
  ){

    grabAnimation =
      null;

    grounded =
      true;

    velocityY =
      0;

    updateGrabUI();

  }

}

function createBullet(
  origin,
  direction,
  ownerUid
){

  const geometry =
    new THREE.SphereGeometry(
      .09,
      8,
      8
    );


  const material =
    new THREE.MeshBasicMaterial({

      color:
        0xffe36e

    });


  const mesh =
    new THREE.Mesh(
      geometry,
      material
    );


  mesh.position.copy(
    origin
  );


  scene.add(mesh);


  const id =
    ++bulletIdCounter;


  bullets.set(
    id,
    {

      mesh,

      direction:
        direction.clone()
          .normalize(),

      ownerUid,

      created:
        performance.now(),

      lastPosition:
        origin.clone()

    }
  );

}


function removeBullet(
  id
){

  const bullet =
    bullets.get(
      id
    );


  if(!bullet){

    return;

  }


  scene.remove(
    bullet.mesh
  );


  bullet.mesh.geometry.dispose();

  bullet.mesh.material.dispose();


  bullets.delete(
    id
  );

}


function updateBullets(
  delta,
  now
){

  for(
    const [
      id,
      bullet
    ]
    of bullets
  ){

    const previous =
      bullet.mesh.position.clone();


    const bulletSpeed =
      getBulletSpeed();

    const distance =
      bulletSpeed === Infinity
        ? 10000
        : bulletSpeed * delta;


    bullet.mesh.position.add(

      bullet.direction
        .clone()
        .multiplyScalar(
          distance
        )

    );


    bullet.lastPosition =
      previous;


    if(
      bulletSpeed !== Infinity &&
      now -
      bullet.created >
      BULLET_LIFETIME
    ){

      removeBullet(
        id
      );

      continue;

    }


    const bulletLine =
      new THREE.Line3(

        previous,

        bullet.mesh.position

      );


    let hitSomething =
      false;


    /*
      壁・足場との衝突
    */

    for(
      const collider
      of colliders
    ){

      const box =
        new THREE.Box3()
          .setFromObject(
            collider
          );


      const closest =
        new THREE.Vector3();


      box.clampPoint(
        bullet.mesh.position,
        closest
      );


      if(
        closest.distanceTo(
          bullet.mesh.position
        ) < .18
      ){

        hitSomething =
          true;

        break;

      }

    }


    if(hitSomething){

      removeBullet(
        id
      );

      continue;

    }


    /*
      プレイヤーとの衝突
    */

    for(
      const [
        uid,
        mesh
      ]
      of playerMeshes
    ){

      if(
        uid ===
        bullet.ownerUid ||
        !mesh.visible
      ){

        continue;

      }


      const box =
        new THREE.Box3()
          .setFromObject(
            mesh
          );


      if(
        box.distanceToPoint(
          bullet.mesh.position
        ) < .15
      ){

        hitSomething =
          true;


        if(
          Date.now() >=
          spawnProtectionUntil
        ){

          applyBulletDamage(
            uid,
            bullet.ownerUid
          );

        }


        break;

      }

    }


    if(hitSomething){

      removeBullet(
        id
      );

    }else if(
      bulletSpeed === Infinity
    ){

      removeBullet(
        id
      );

    }

  }

}


async function applyBulletDamage(
  targetUid,
  shooterUid
){

  if(
    !matchRef ||
    gameEnded
  ){

    return;

  }


  try{

    let wasKill =
      false;


    await runTransaction(
      db,
      async transaction => {

        const snap =
          await transaction.get(
            matchRef
          );


        if(
          !snap.exists()
        ){

          return;

        }


        const data =
          snap.data();


        if(
          data.status !==
          "active"
        ){

          return;

        }


        const players =
          {
            ...(data.players || {})
          };


        const shooter =
          players[shooterUid];


        const target =
          players[targetUid];


        if(
          !shooter ||
          !target
        ){

          return;

        }


        if(
          !shooter.alive ||
          !target.alive
        ){

          return;

        }


        if(
          Date.now() <
          Number(
            data.startedProtectionUntil ||
            0
          )
        ){

          return;

        }


        target.hp =
          Math.max(

            0,

            Number(
              target.hp ?? 0
            ) -
            BULLET_DAMAGE

          );

        target.lastDamageAt =
          Date.now();


        if(
          target.hp <= 0
        ){

          target.hp =
            0;

          target.alive =
            false;


          shooter.kills =
            Number(
              shooter.kills || 0
            ) + 1;


          wasKill =
            shooterUid ===
            currentUser.uid;


          const alivePlayers =
            Object.values(
              players
            ).filter(
              player =>
                player.alive
            );


          if(
            alivePlayers.length <= 1
          ){

            transaction.update(
              matchRef,
              {

                players,

                status:
                  "ended",

                winnerUid:
                  alivePlayers.length === 1
                    ? alivePlayers[0].uid
                    : null

              }
            );

            return;

          }

        }


        transaction.update(
          matchRef,
          {

            players

          }
        );

      }
    );


    if(wasKill){

      localKills++;

      showKillMessage(
        "ELIMINATED"
      );

    }


  }catch(error){

    console.error(
      "bullet damage error",
      error
    );

  }

}


function getFireProgress(){

  if(
    now >=
    fireCooldownEnd

    return 100;

  const remaining =
    fireCooldownEnd -
    now;


  return clamp(

    100 -
      (
        remaining /
        getFireInterval()
      ) *
      100,

    0,

    100

  );

}

async function checkMatchCleanup(
  data
){

  if(
    !matchRef ||
    !data
  ){
    return;
  }

  const now =
    Date.now();

  if(
    now -
    lastCleanupCheck <
    CLEANUP_INTERVAL
  ){
    return;
  }

  lastCleanupCheck =
    now;

  let createdMillis =
    0;

  if(
    data.createdAt &&
    typeof data.createdAt.toMillis ===
      "function"
  ){
    createdMillis =
      data.createdAt.toMillis();
  }else if(
    typeof data.createdAt ===
    "number"
  ){
    createdMillis =
      data.createdAt;
  }

  if(
    createdMillis > 0 &&
    now - createdMillis >=
      MAX_MATCH_AGE
  ){

    try{
      await deleteDoc(
        matchRef
      );
    }catch(error){
      console.error(
        "age cleanup error",
        error
      );
    }

    return;
  }

  const players =
    Object.values(
      data.players || {}
    );

  if(
    players.length === 0
  ){
    return;
  }

  const allInactive =
    players.every(
      player => {

        const last =
          typeof player.lastActiveAt ===
          "number"
            ? player.lastActiveAt
            : 0;

        return (
          last > 0 &&
          now - last >=
            INACTIVE_MATCH_TIME
        );
      }
    );

  if(
    allInactive
  ){

    try{
      await deleteDoc(
        matchRef
      );
    }catch(error){
      console.error(
        "inactive cleanup error",
        error
      );
    }

  }
}

async function leaveRoom(){

  if(!matchRef || !currentUser){
    leaveCurrentMatch();
    return;
  }

  const ref = matchRef;
  const uid = currentUser.uid;

  try{
    await runTransaction(
      db,
      async transaction => {

        const snap =
          await transaction.get(ref);

        if(!snap.exists()){
          return;
        }

        const data =
          snap.data();

        if(data.status !== "waiting"){
          return;
        }

        const players =
          { ...(data.players || {}) };

        delete players[uid];

        const oldOrder =
          Array.isArray(data.playerOrder)
            ? data.playerOrder
            : Object.keys(players);

        const playerOrder =
          oldOrder.filter(id => id !== uid);

        if(playerOrder.length === 0){
          transaction.delete(ref);
          return;
        }

        const nextHost =
          data.hostUid === uid
            ? playerOrder[0]
            : data.hostUid;

        Object.keys(players).forEach(id => {
          players[id] = {
            ...players[id],
            joinOrder: playerOrder.indexOf(id)
          };
        });

        transaction.update(
          ref,
          {
            players,
            playerOrder,
            hostUid: nextHost
          }
        );
      }
    );
  }catch(error){
    console.error("leave room error", error);
  }

  leaveCurrentMatch();
}

  if(
    wasHost &&
    ref
  ){

    try{

      await deleteDoc(
        ref
      );

    }catch(error){

      console.error(
        error
      );

    }

  }

}


function handleMouseMove(
  event
){

  if(
    !gameStarted ||
    gameEnded ||
    matchMedia(
      "(pointer:coarse)"
    ).matches
  ){

    return;

  }


  if(
    document.pointerLockElement !==
    renderer.domElement
  ){

    return;

  }


  if(
    Math.abs(event.movementX) > 0 ||
    Math.abs(event.movementY) > 0
  ){
    markActivity();
  }

  cameraState.yaw -=
    event.movementX *
    .0023;


  cameraState.pitch -=
    event.movementY *
    .0023;


  cameraState.pitch =
    clamp(
      cameraState.pitch,
      -1.45,
      1.45
    );

}


function requestPointerLock(){

  if(
    matchMedia(
      "(pointer:coarse)"
    ).matches
  ){

    return;

  }


  if(
    renderer &&
    renderer.domElement
      .requestPointerLock
  ){

    renderer.domElement
      .requestPointerLock();

  }

}

  );

}


function setupMobileInput(){

  let joystickPointerId =
    null;

  function updateJoystick(
    clientX,
    clientY
  ){

    const rect =
      joystickZone.getBoundingClientRect();

    const baseRect =
      joystickBase.getBoundingClientRect();

    const centerX =
      baseRect.left +
      baseRect.width / 2;

    const centerY =
      baseRect.top +
      baseRect.height / 2;

    let dx =
      clientX - centerX;

    let dy =
      clientY - centerY;

    const max =
      53;

    const distance =
      Math.hypot(dx, dy);

    if(distance > max){

      dx =
        dx /
        distance *
        max;

      dy =
        dy /
        distance *
        max;

    }

    mobileInput.x =
      dx / max;

    mobileInput.y =
      dy / max;

    joystickKnob.style.transform =
      `translate(${dx}px,${dy}px)`;

    markActivity();

  }

  joystickZone.addEventListener(
    "pointerdown",
    event => {

      event.preventDefault();

      joystickPointerId =
        event.pointerId;

      const rect =
        joystickZone.getBoundingClientRect();

      const radius =
        59;

      const x =
        clamp(
          event.clientX - rect.left,
          radius,
          rect.width - radius
        );

      const y =
        clamp(
          event.clientY - rect.top,
          radius,
          rect.height - radius
        );

      joystickBase.style.left =
        `${x}px`;

      joystickBase.style.top =
        `${y}px`;

      joystickBase.style.opacity =
        "1";

      joystickKnob.style.transform =
        "translate(0,0)";

      joystickZone.setPointerCapture(
        event.pointerId
      );

      updateJoystick(
        event.clientX,
        event.clientY
      );

    }
  );

  joystickZone.addEventListener(
    "pointermove",
    event => {

      if(
        event.pointerId ===
        joystickPointerId
      ){

        updateJoystick(
          event.clientX,
          event.clientY
        );

      }

    }
  );

  const endJoystick =
    event => {

      if(
        event.pointerId !==
        joystickPointerId
      ){

        return;

      }

      joystickPointerId =
        null;

      mobileInput.x =
        0;

      mobileInput.y =
        0;

      joystickKnob.style.transform =
        "translate(0,0)";

      joystickBase.style.opacity =
        "0";

    };

  joystickZone.addEventListener(
    "pointerup",
    endJoystick
  );

  joystickZone.addEventListener(
    "pointercancel",
    endJoystick
  );

  let lookPointerId =
    null;

  let lastLookX =
    0;

  let lastLookY =
    0;

  lookZone.addEventListener(
    "pointerdown",
    event => {

      if(!matchHasStarted || gameEnded){
        return;
      }

      lookPointerId =
        event.pointerId;

      lastLookX =
        event.clientX;

      lastLookY =
        event.clientY;

      lookZone.setPointerCapture(
        event.pointerId
      );

    }
  );

  lookZone.addEventListener(
    "pointermove",
    event => {

      if(
        event.pointerId !==
        lookPointerId
      ){
        return;
      }

      const dx =
        event.clientX - lastLookX;

      const dy =
        event.clientY - lastLookY;

      lastLookX =
        event.clientX;

      lastLookY =
        event.clientY;

      if(Math.abs(dx) + Math.abs(dy) > 0){
        markActivity();
      }

      cameraState.yaw -=
        dx * .004;

      cameraState.pitch -=
        dy * .004;

      cameraState.pitch =
        clamp(
          cameraState.pitch,
          -1.45,
          1.45
        );

    }
  );

  const endLook =
    event => {

      if(
        event.pointerId ===
        lookPointerId
      ){

        lookPointerId =
          null;

      }

    };

  lookZone.addEventListener(
    "pointerup",
    endLook
  );

  lookZone.addEventListener(
    "pointercancel",
    endLook
  );

  fireButton.addEventListener(
    "pointerdown",
    event => {

      event.preventDefault();

      if(!matchHasStarted || gameEnded){
        return;
      }

      fireHolding =
        true;

      mobileInput.firing =
        true;

      markActivity();
      shoot();

    }
  );

  fireButton.addEventListener(
    "pointerup",
    event => {

      event.preventDefault();

      fireHolding =
        false;

      mobileInput.firing =
        false;

    }
  );

  fireButton.addEventListener(
    "pointercancel",
    () => {

      fireHolding =
        false;

      mobileInput.firing =
        false;

    }
  );

  jumpButton.addEventListener(
    "pointerdown",
    event => {

      event.preventDefault();

      if(!matchHasStarted || gameEnded){
        return;
      }

      if(
        !grounded &&
        canGrab()
      ){

        startGrab();

      }else if(
        grounded
      ){

        jump();

      }

    }
  );

}

function setupStartButton(){

  const startDown =
    event => {

      event.preventDefault();


      if(
        !isHost ||
        matchHasStarted
      ){

        return;

      }


      markActivity();

      startHolding =
        true;

      startHoldStart =
        performance.now();

    };


  const startUp =
    event => {

      event.preventDefault();

      startHolding =
        false;

      startButton.classList.remove("startHolding");

      startButton.style.setProperty(
        "--progress",
        "0%"
      );

    };


  startButton.addEventListener(
    "pointerdown",
    startDown
  );


  startButton.addEventListener(
    "pointerup",
    startUp
  );


  startButton.addEventListener(
    "pointercancel",
    startUp
  );

}


function setupRendererInput(){

  if(!renderer){

    return;

  }


  renderer.domElement.addEventListener(
    "mousedown",
    event => {

      if(
        event.button ===
        0
      ){

        requestPointerLock();

        shoot();

      }

    }
  );

}


function gameLoop(
  time
){

  const delta =
    Math.min(

      (
        time -
        lastFrameTime
      ) / 1000,

      .05

    );


  lastFrameTime =
    time;


  updateStartProgress();


  updateFireUI();
  updateProtectionIndicator();


  if(
    gameStarted &&
    matchHasStarted &&
    !gameEnded
  ){

    updateMovement(
      delta
    );


    updateGrabAnimation(
      time
    );


    if(
      mobileInput.firing
    ){

      shoot();

    }


    updateBullets(
      delta,
      time
    );

    regenerateLocalPlayer();
    updateProtectionIndicator();


    syncLocalPlayer();

  }


  if(
    renderer &&
    scene &&
    camera
  ){

    renderer.render(
      scene,
      camera
    );

  }


  requestAnimationFrame(
    gameLoop
  );

}


async function regenerateLocalPlayer(){

  if(
    !matchRef ||
    !localPlayer ||
    !localPlayer.alive ||
    !matchHasStarted ||
    gameEnded
  ){
    return;
  }

  const settings =
    normalizeSettings(currentSettings);

  const rate =
    getRegenRate();

  if(rate <= 0){
    return;
  }

  const now =
    performance.now();

  if(
    now - lastRegenTick < 250
  ){
    return;
  }

  const elapsed =
    lastRegenTick > 0
      ? Math.min(.5, (now - lastRegenTick) / 1000)
      : .25;

  lastRegenTick = now;

  if(
    Date.now() -
    Number(localPlayer.lastDamageAt || 0) <
    settings.regenLock * 1000
  ){
    return;
  }

  try{
    await runTransaction(
      db,
      async transaction => {

        const snap =
          await transaction.get(matchRef);

        if(!snap.exists()) return;

        const data =
          snap.data();

        if(data.status !== "active") return;

        const players =
          { ...(data.players || {}) };

        const player =
          players[currentUser.uid];

        if(
          !player ||
          !player.alive
        ){
          return;
        }

        const latestSettings =
          normalizeSettings(data.settings);

        const latestRate =
          getRegenRateFromSettings(latestSettings);

        if(latestRate <= 0) return;

        if(
          Date.now() -
          Number(player.lastDamageAt || 0) <
          latestSettings.regenLock * 1000
        ){
          return;
        }

        const maxHp =
          latestSettings.maxHp;

        player.hp =
          Math.min(
            maxHp,
            Number(player.hp || 0) + latestRate * elapsed
          );

        players[currentUser.uid] = player;

        transaction.update(
          matchRef,
          { players }
        );
      }
    );
  }catch(error){
    console.error("regen error", error);
  }
}

function getRegenRateFromSettings(settings){
  if(settings.hpRegen === "fast") return 3;
  if(settings.hpRegen === "medium") return 1.5;
  if(settings.hpRegen === "slow") return .6;
  return 0;
}

async function syncLocalPlayer(){

  if(
    !matchRef ||
    !localPlayer ||
    gameEnded
  ){

    return;

  }


  const now =
    performance.now();


  if(
    now -
    lastNetworkUpdate <
    80
  ){

    return;

  }


  lastNetworkUpdate =
    now;


  try{

    await updateDoc(

      matchRef,

      {

        [`players.${currentUser.uid}.x`]:
          localPlayer.x,

        [`players.${currentUser.uid}.y`]:
          localPlayer.y,

        [`players.${currentUser.uid}.z`]:
          localPlayer.z,

        [`players.${currentUser.uid}.yaw`]:
          cameraState.yaw,

        [`players.${currentUser.uid}.pitch`]:
          cameraState.pitch,

        [`players.${currentUser.uid}.lastActiveAt`]:
          lastActivityAt

      }

    );

  }catch(error){

    console.error(
      "sync error",
      error
    );

  }

}
