<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Firebase 3D FPS</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  touch-action:none;
}

canvas{
  display:block;
}

#menu{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(circle at 50% 30%,#26384f 0%,#111822 40%,#05070a 100%);
  color:white;
}

.menuBox{
  width:min(92vw,480px);
  padding:28px;
  border-radius:22px;
  background:rgba(15,20,28,.88);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 20px 80px rgba(0,0,0,.45);
  backdrop-filter:blur(18px);
}

.title{
  margin:0 0 8px;
  font-size:34px;
  font-weight:800;
  text-align:center;
}

.subtitle{
  text-align:center;
  opacity:.72;
  margin-bottom:24px;
}

.input{
  width:100%;
  height:48px;
  padding:0 16px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:12px;
  background:rgba(255,255,255,.07);
  color:#fff;
  font-size:18px;
  outline:none;
  text-transform:uppercase;
  margin-bottom:12px;
}

.button{
  width:100%;
  height:48px;
  border:0;
  border-radius:12px;
  color:#fff;
  background:#1976ff;
  font-size:17px;
  font-weight:700;
  margin-top:8px;
  cursor:pointer;
}

.button.secondary{
  background:#2a3039;
}

.button:active{
  transform:scale(.98);
}

.info{
  margin-top:18px;
  font-size:13px;
  line-height:1.6;
  color:#c5ccd5;
}

#status{
  min-height:22px;
  margin-top:12px;
  text-align:center;
  color:#ffce66;
  font-size:14px;
}

#gameUI{
  position:fixed;
  inset:0;
  z-index:20;
  pointer-events:none;
  display:none;
  color:#fff;
}

#topBar{
  position:absolute;
  top:12px;
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:8px;
}

#healthBox,#matchBox{
  padding:9px 12px;
  border-radius:12px;
  background:rgba(0,0,0,.45);
  backdrop-filter:blur(8px);
  font-size:14px;
}

#health{
  margin-top:5px;
  width:170px;
  height:10px;
  overflow:hidden;
  border-radius:99px;
  background:#252525;
}

#healthBar{
  width:100%;
  height:100%;
  background:#48e27d;
  transition:width .15s;
}

#crosshair{
  position:absolute;
  left:50%;
  top:50%;
  width:18px;
  height:18px;
  margin-left:-9px;
  margin-top:-9px;
}

#crosshair::before,
#crosshair::after{
  content:"";
  position:absolute;
  background:#fff;
  box-shadow:0 0 3px #000;
}

#crosshair::before{
  width:2px;
  height:18px;
  left:8px;
  top:0;
}

#crosshair::after{
  width:18px;
  height:2px;
  left:0;
  top:8px;
}

#killMessage{
  position:absolute;
  left:50%;
  top:42%;
  transform:translate(-50%,-50%);
  font-size:28px;
  font-weight:900;
  text-shadow:0 3px 15px #000;
  opacity:0;
  transition:opacity .15s;
}

#scoreBoard{
  position:absolute;
  right:12px;
  top:70px;
  min-width:150px;
  max-width:220px;
  padding:10px;
  border-radius:12px;
  background:rgba(0,0,0,.45);
  backdrop-filter:blur(8px);
  font-size:12px;
}

.scoreRow{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin:3px 0;
}

.scoreAlive{
  color:#6dff8f;
}

.scoreDead{
  color:#ff7070;
}

#preStart{
  position:absolute;
  left:50%;
  top:58%;
  transform:translate(-50%,-50%);
  display:none;
  pointer-events:auto;
  text-align:center;
  width:min(92vw,520px);
}

.preStartButtons{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

.preStartSmallButton{
  min-width:105px;
  height:40px;
  padding:0 13px;
  border:1px solid rgba(255,255,255,.16);
  border-radius:10px;
  background:rgba(0,0,0,.48);
  color:#fff;
  font-size:13px;
  font-weight:800;
  pointer-events:auto;
  touch-action:none;
}

.preStartSmallButton:active{
  transform:scale(.97);
}

#startButton{
  touch-action:none;
  pointer-events:auto;
}

#startButton::before,
#startButton::after{
  pointer-events:none;
}

#preStartText{
  margin-bottom:12px;
  font-weight:800;
  font-size:16px;
}

#startButton{
  position:relative;
  display:block;
  margin:0 auto;
  width:105px;
  height:105px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.35);
  background:rgba(0,0,0,.42);
  color:#fff;
  font-size:18px;
  font-weight:900;
  overflow:hidden;
}

#startButton::before{
  content:"";
  position:absolute;
  inset:5px;
  border-radius:50%;
  background:
    conic-gradient(
      #36a3ff var(--progress,0%),
      rgba(255,255,255,.10) var(--progress,0%)
    );
  z-index:0;
}

#startButton::after{
  content:"";
  position:absolute;
  inset:13px;
  border-radius:50%;
  background:rgba(12,17,23,.94);
  z-index:1;
}

#startButton span{
  position:relative;
  z-index:2;
}

#protectionIndicator{
  position:absolute;
  left:50%;
  top:78px;
  transform:translateX(-50%);
  padding:8px 14px;
  border-radius:999px;
  background:rgba(30,130,255,.25);
  border:1px solid rgba(100,190,255,.65);
  box-shadow:0 0 22px rgba(50,150,255,.32);
  color:#dff5ff;
  font-size:14px;
  font-weight:900;
  letter-spacing:.2px;
  opacity:0;
  transition:opacity .12s;
  pointer-events:none;
  z-index:4;
}

#settingsModal{
  position:absolute;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  padding:18px;
  background:rgba(0,0,0,.62);
  backdrop-filter:blur(8px);
  pointer-events:auto;
  z-index:30;
}

.settingsBox{
  width:min(92vw,500px);
  max-height:88vh;
  overflow:auto;
  padding:20px;
  border-radius:18px;
  background:rgba(15,20,28,.96);
  border:1px solid rgba(255,255,255,.13);
  box-shadow:0 20px 80px rgba(0,0,0,.5);
}

.settingsTitle{
  margin:0 0 14px;
  text-align:center;
  font-size:22px;
  font-weight:900;
}

.settingRow{
  margin:12px 0;
}

.settingLabel{
  display:block;
  margin-bottom:7px;
  font-size:13px;
  font-weight:800;
}

.settingOptions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}

.settingOption{
  min-height:40px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:9px;
  background:rgba(255,255,255,.06);
  color:#fff;
  font-size:12px;
  font-weight:800;
  pointer-events:auto;
}

.settingOption.selected{
  background:#1976ff;
  border-color:#5ba7ff;
}

.settingRow.disabled{
  opacity:.27;
}

.settingRow.disabled .settingOption,
.settingRow.disabled input{
  pointer-events:none;
}

.settingNumber{
  width:100%;
  height:42px;
  padding:0 12px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:9px;
  background:rgba(255,255,255,.06);
  color:#fff;
  font-size:16px;
  outline:none;
}

.settingsHint{
  margin-top:4px;
  font-size:11px;
  opacity:.55;
}

.settingsButtons{
  display:flex;
  gap:8px;
  margin-top:16px;
}

.settingsButtons .button{
  margin-top:0;
}

#gameOver{
  position:fixed;
  inset:0;
  z-index:50;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.68);
  backdrop-filter:blur(10px);
  color:white;
}

.gameOverBox{
  width:min(88vw,430px);
  padding:28px;
  border-radius:22px;
  text-align:center;
  background:rgba(18,22,29,.94);
}

.gameOverTitle{
  font-size:38px;
  font-weight:900;
  margin-bottom:8px;
}

.gameOverText{
  font-size:18px;
  opacity:.85;
  margin-bottom:20px;
}

#mobileControls{
  display:none;
  position:absolute;
  inset:0;
  pointer-events:none;
}

#joystickZone{
  position:absolute;
  left:18px;
  bottom:20px;
  width:150px;
  height:150px;
  border-radius:50%;
  pointer-events:auto;
}

#joystickBase{
  position:absolute;
  left:50%;
  top:50%;
  width:118px;
  height:118px;
  margin-left:-59px;
  margin-top:-59px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.23);
  background:rgba(255,255,255,.06);
}

#joystickKnob{
  position:absolute;
  left:50%;
  top:50%;
  width:54px;
  height:54px;
  margin-left:-27px;
  margin-top:-27px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.16);
}

#lookZone{
  position:absolute;
  right:0;
  top:0;
  width:55%;
  height:70%;
  pointer-events:auto;
  z-index:1;
}

.mobileButton{
  position:absolute;
  border:1px solid rgba(255,255,255,.25);
  background:rgba(20,20,20,.45);
  color:#fff;
  border-radius:50%;
  backdrop-filter:blur(8px);
  pointer-events:auto;
  touch-action:none;
  -webkit-tap-highlight-color:transparent;
  font-weight:800;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:10;
}

#fireButton{
  width:88px;
  height:88px;
  right:24px;
  bottom:32px;
  background:rgba(220,50,50,.28);
  overflow:hidden;
}

#fireButton::before{
  content:"";
  position:absolute;
  inset:4px;
  border-radius:50%;
  background:
    conic-gradient(
      rgba(255,80,80,.9) var(--fireProgress,100%),
      rgba(255,255,255,.08) var(--fireProgress,100%)
    );
  z-index:0;
}

#fireButton::after{
  content:"";
  position:absolute;
  inset:12px;
  border-radius:50%;
  background:rgba(25,20,20,.9);
  z-index:1;
}

#fireButton::before,
#fireButton::after{
  pointer-events:none;
}

#fireButton span{
  position:relative;
  z-index:2;
  pointer-events:none;
}

#jumpButton{
  width:64px;
  height:64px;
  right:125px;
  bottom:44px;
  z-index:10;
  transition:
    opacity .12s,
    background .12s;
}

#jumpButton.grabInactive{
  opacity:.28;
  background:rgba(20,20,20,.25);
}

#jumpButton.grabActive{
  opacity:1;
  background:rgba(35,130,255,.55);
}

#grabButton{
  display:none !important;
}

#desktopHint{
  position:absolute;
  bottom:14px;
  left:50%;
  transform:translateX(-50%);
  padding:7px 11px;
  border-radius:8px;
  background:rgba(0,0,0,.38);
  font-size:12px;
  opacity:.65;
}

.hidden{
  display:none !important;
}

@media (pointer:coarse){

  #mobileControls{
    display:block;
  }

  #desktopHint{
    display:none;
  }

}
</style>
</head>

<body>

<div id="menu">

  <div class="menuBox">

    <h1 class="title">3D FPS</h1>

    <div class="subtitle">
      v1.0.0
    </div>

    <input
      id="matchCodeInput"
      class="input"
      maxlength="8"
      placeholder="試合コード"
      autocomplete="off"
      spellcheck="false"
    >

    <button
      id="matchButton"
      class="button"
    >
      試合を作成/参加
    </button>

    <div id="status"></div>

    <div class="info">
      PC：WASDで移動、マウスで視点、クリックで射撃、Spaceでジャンプ<br>
      スマホ：左スティックで移動、右側スワイプで視点、FIRE・JUMP・GRAB
    </div>

  </div>

</div>

<div id="gameUI">

  <div id="topBar">

    <div id="healthBox">

      <div id="healthText">
        HP 100
      </div>

      <div id="health">

        <div id="healthBar"></div>

      </div>

    </div>

    <div id="matchBox">

      <div>
        ROOM:
        <span id="roomText">----</span>
      </div>

      <div>
        PLAYER:
        <span id="playerCountText">0</span>
      </div>

      <div>
        KILLS:
        <span id="killsText">0</span>
      </div>

    </div>

  </div>

  <div id="scoreBoard"></div>

  <div id="crosshair"></div>

  <div id="killMessage"></div>

  <div id="preStart">

    <div id="preStartText">
      部屋主がSTARTを長押しして開始
    </div>

    <button id="startButton">
      <span>START</span>
    </button>

    <div class="preStartButtons">
      <button id="shareCodeButton" class="preStartSmallButton">コードを共有</button>
      <button id="leaveRoomButton" class="preStartSmallButton">部屋から退出</button>
      <button id="settingsButton" class="preStartSmallButton">設定</button>
    </div>

  </div>

  <div id="protectionIndicator">🛡 無敵 3.0秒</div>

  <div id="settingsModal">
    <div class="settingsBox">
      <h2 class="settingsTitle">設定</h2>

      <div class="settingRow" id="terrainAmountRow">
        <span class="settingLabel">地形の量</span>
        <div class="settingOptions" data-setting="terrainAmount">
          <button class="settingOption" data-value="many">多</button>
          <button class="settingOption selected" data-value="medium">中</button>
          <button class="settingOption" data-value="few">少</button>
          <button class="settingOption" data-value="none">なし</button>
        </div>
      </div>

      <div class="settingRow" id="terrainHeightRow">
        <span class="settingLabel">地形の高低差</span>
        <div class="settingOptions" data-setting="terrainHeight">
          <button class="settingOption" data-value="high">高</button>
          <button class="settingOption selected" data-value="medium">中</button>
          <button class="settingOption" data-value="low">低</button>
        </div>
      </div>

      <div class="settingRow">
        <span class="settingLabel">弾速</span>
        <div class="settingOptions" data-setting="bulletSpeed">
          <button class="settingOption" data-value="infinite">∞</button>
          <button class="settingOption" data-value="fast">速</button>
          <button class="settingOption selected" data-value="medium">中</button>
          <button class="settingOption" data-value="slow">遅</button>
        </div>
      </div>

      <div class="settingRow">
        <label class="settingLabel" for="maxHpInput">HP最大値</label>
        <input id="maxHpInput" class="settingNumber" type="number" min="1" max="9999" step="1" value="100">
      </div>

      <div class="settingRow" id="regenRow">
        <span class="settingLabel">HP自然回復</span>
        <div class="settingOptions" data-setting="hpRegen">
          <button class="settingOption" data-value="fast">速</button>
          <button class="settingOption" data-value="medium">中</button>
          <button class="settingOption" data-value="slow">遅</button>
          <button class="settingOption selected" data-value="none">なし</button>
        </div>
      </div>

      <div class="settingRow" id="regenLockRow">
        <label class="settingLabel" for="regenLockInput">ダメージからの自然回復ロック</label>
        <input id="regenLockInput" class="settingNumber" type="number" min="0" max="9999" step="0.1" value="0">
        <div class="settingsHint">秒</div>
      </div>

      <div class="settingsButtons">
        <button id="closeSettingsButton" class="button secondary">閉じる</button>
        <button id="saveSettingsButton" class="button">保存</button>
      </div>
    </div>
  </div>

  <div id="desktopHint">
    WASD / Mouse / Click / Space
  </div>

  <div id="mobileControls">

    <div id="joystickZone">

      <div id="joystickBase">

        <div id="joystickKnob"></div>

      </div>

    </div>

    <div id="lookZone"></div>

    <div
      id="jumpButton"
      class="mobileButton"
    >
      JUMP
    </div>

    <div
      id="fireButton"
      class="mobileButton"
    >
      <span>FIRE</span>
    </div>

  </div>

</div>

<div id="gameOver">

  <div class="gameOverBox">

    <div
      id="gameOverTitle"
      class="gameOverTitle"
    >
      試合終了
    </div>

    <div
      id="gameOverText"
      class="gameOverText"
    >
      ---
    </div>

    <button
      id="returnButton"
      class="button"
    >
      メニューへ戻る
    </button>

  </div>

</div>

function normalizeSettings(settings){

  const source =
    settings && typeof settings === "object"
      ? settings
      : {};

  const maxHp =
    clamp(
      Number(source.maxHp) || DEFAULT_SETTINGS.maxHp,
      1,
      9999
    );

  const regenLock =
    clamp(
      Number(source.regenLock) || 0,
      0,
      9999
    );

  return {
    terrainAmount:
      ["many","medium","few","none"].includes(source.terrainAmount)
        ? source.terrainAmount
        : DEFAULT_SETTINGS.terrainAmount,
    terrainHeight:
      ["high","medium","low"].includes(source.terrainHeight)
        ? source.terrainHeight
        : DEFAULT_SETTINGS.terrainHeight,
    bulletSpeed:
      ["infinite","fast","medium","slow"].includes(source.bulletSpeed)
        ? source.bulletSpeed
        : DEFAULT_SETTINGS.bulletSpeed,
    maxHp,
    hpRegen:
      ["fast","medium","slow","none"].includes(source.hpRegen)
        ? source.hpRegen
        : DEFAULT_SETTINGS.hpRegen,
    regenLock
  };
}

function getBulletSpeed(){

  const setting =
    normalizeSettings(currentSettings).bulletSpeed;

  if(setting === "infinite") return Infinity;
  if(setting === "fast") return 70;
  if(setting === "slow") return 24;
  return BULLET_SPEED;
}

function getRegenRate(){

  const setting =
    normalizeSettings(currentSettings).hpRegen;

  if(setting === "fast") return 3;
  if(setting === "medium") return 1.5;
  if(setting === "slow") return .6;
  return 0;
}

function updateSettingsUI(settings){

  const normalized =
    normalizeSettings(settings);

  document
    .querySelectorAll(".settingOptions")
    .forEach(group => {

      const key =
        group.dataset.setting;

      const value =
        normalized[key];

      group
        .querySelectorAll(".settingOption")
        .forEach(button => {
          button.classList.toggle(
            "selected",
            button.dataset.value === value
          );
        });

    });

  maxHpInput.value =
    String(normalized.maxHp);

  regenLockInput.value =
    String(normalized.regenLock);

  const terrainDisabled =
    normalized.terrainAmount === "none";

  terrainHeightRow.classList.toggle(
    "disabled",
    terrainDisabled
  );

  const regenDisabled =
    normalized.hpRegen === "none";

  regenLockRow.classList.toggle(
    "disabled",
    regenDisabled
  );
}

function readSettingsUI(){

  const result =
    normalizeSettings(currentSettings);

  document
    .querySelectorAll(".settingOptions")
    .forEach(group => {

      const key =
        group.dataset.setting;

      const selected =
        group.querySelector(".settingOption.selected");

      if(selected){
        result[key] =
          selected.dataset.value;
      }

    });

  result.maxHp =
    clamp(
      Number(maxHpInput.value) || 100,
      1,
      9999
    );

  result.regenLock =
    clamp(
      Number(regenLockInput.value) || 0,
      0,
      9999
    );

  return normalizeSettings(result);
}

async function shareMatchCode(){

  if(!currentMatchId) return;

  const text = String(currentMatchId);

  try{
    if(navigator.share){
      await navigator.share({ text });
      return;
    }
  }catch(error){
    if(error?.name === "AbortError") return;
  }

  try{
    await navigator.clipboard.writeText(text);
    statusEl.textContent = "試合コードをコピーしたよ！";
  }catch(error){
    console.error("share/copy error", error);
    statusEl.textContent = text;
  }
}

    Math.max(0, spawnProtectionUntil - Date.now());

  protectionIndicator.textContent =

function rebuildArena(settings){

  if(!scene) return;

  for(const collider of colliders){
    scene.remove(collider);
    collider.traverse?.(object => {
      if(object.geometry) object.geometry.dispose();
      if(object.material){
        if(Array.isArray(object.material)){
          object.material.forEach(material => material.dispose());
        }else{
          object.material.dispose();
        }
      }
    });
  }

  colliders.length = 0;
  createArena(settings);
}

function randomCode(length = 6){

  const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let result = "";

  for(
    let i = 0;
    i < length;
    i++
  ){

    result +=
      chars[
        Math.floor(
          Math.random() *
          chars.length
        )
      ];

  }

  return result;

}


function randomSpawn(){

  const margin = 7;

  return {

    x:
      Math.random() *
      (ARENA_SIZE - margin * 2) -
      (ARENA_SIZE / 2 - margin),

    y:
      PLAYER_HEIGHT,

    z:
      Math.random() *
      (ARENA_SIZE - margin * 2) -
      (ARENA_SIZE / 2 - margin)

  };

}


function playerColor(uid){

  let hash = 0;

  for(
    let i = 0;
    i < uid.length;
    i++
  ){

    hash =
      (
        (hash << 5) -
        hash
      ) +
      uid.charCodeAt(i);

    hash |= 0;

  }

  const hue =
    Math.abs(hash) % 360;

  return new THREE.Color(
    `hsl(${hue},70%,58%)`
  );

}

function createArena(settings = DEFAULT_SETTINGS){

  const normalized =
    normalizeSettings(settings);

  const floorGeometry =
    new THREE.BoxGeometry(
      ARENA_SIZE,
      1,
      ARENA_SIZE
    );

  const floorMaterial =
    new THREE.MeshStandardMaterial({

      color:
        0x41474d,

      roughness:
        .92

    });

  const floor =
    new THREE.Mesh(
      floorGeometry,
      floorMaterial
    );

  floor.position.y =
    -.5;

  floor.receiveShadow =
    true;

  floor.userData.isArena = true;

  scene.add(floor);

  colliders.push(floor);


  const wallMaterial =
    new THREE.MeshStandardMaterial({

      color:
        0x252b31

    });


  createBox(
    ARENA_SIZE,
    6,
    1,
    0,
    3,
    -ARENA_SIZE / 2,
    wallMaterial
  );

  createBox(
    ARENA_SIZE,
    6,
    1,
    0,
    3,
    ARENA_SIZE / 2,
    wallMaterial
  );

  createBox(
    1,
    6,
    ARENA_SIZE,
    -ARENA_SIZE / 2,
    3,
    0,
    wallMaterial
  );

  createBox(
    1,
    6,
    ARENA_SIZE,
    ARENA_SIZE / 2,
    3,
    0,
    wallMaterial
  );


  if(normalized.terrainAmount === "none"){
    return;
  }


  const obstacleMaterial =
    new THREE.MeshStandardMaterial({

      color:
        0x69727b,

      roughness:
        .7

    });


  const platforms = [
    [8,1.5,8,-15,.75,-10],
    [11,2,5,13,1,-8],
    [6,2.5,6,17,1.25,14],
    [10,1.5,5,-15,.75,15],
    [5,2,12,0,1,17],
    [6,3.5,6,-15,1.75,-1],
    [7,4,7,4,2,-14],
    [7,4.5,7,16,2.25,2],
    [5,.9,5,-4,.45,-5],
    [5,1.3,5,4,.65,-5],
    [5,1.7,5,10,.85,-5],
    [4,.7,4,-10,.35,-18],
    [4,1.1,4,-4,.55,-18],
    [4,1.5,4,2,.75,-18],
    [4,1.9,4,8,.95,-18],
    [5,2.2,5,-18,1.1,8],
    [6,2.8,5,5,1.4,8],
    [5,3.8,5,12,1.9,-17],
    [5,4.4,5,-5,2.2,18],
    [4,5,4,12,2.5,18],
    [5,2.6,5,-20,1.3,-18],
    [5,3.2,5,20,1.6,-18],
    [6,2.2,4,-21,1.1,0],
    [6,3.8,4,21,1.9,0]
  ];

  const amountCount =
    normalized.terrainAmount === "many"
      ? platforms.length
      : normalized.terrainAmount === "few"
        ? 7
        : 14;

  const heightScale =
    normalized.terrainHeight === "high"
      ? 1.45
      : normalized.terrainHeight === "low"
        ? .65
        : 1;

  for(let i = 0; i < Math.min(amountCount, platforms.length); i++){

    const [width, baseHeight, depth, x, baseY, z] = platforms[i];

    const height =
      Math.max(.45, baseHeight * heightScale);

    createBox(
      width,
      height,
      depth,
      x,
      height / 2,
      z,
      obstacleMaterial
    );
  }

}


function createBox(
  width,
  height,
  depth,
  x,
  y,
  z,
  material
){

  const geometry =
    new THREE.BoxGeometry(
      width,
      height,
      depth
    );

  const mesh =
    new THREE.Mesh(
      geometry,
      material
    );

  mesh.position.set(
    x,
    y,
    z
  );

  mesh.castShadow =
    true;

  mesh.receiveShadow =
    true;

  mesh.userData.isArena = true;

  scene.add(mesh);

  colliders.push(mesh);

  return mesh;

}

async function ensureAuth(){

  if(currentUser){

    return currentUser;

  }

  return new Promise(
    (resolve,reject) => {

      const unsubscribe =
        onAuthStateChanged(
          auth,
          async user => {

            if(user){

              currentUser =
                user;

              unsubscribe();

              resolve(user);

              return;

            }

            try{

              await signInAnonymously(
                auth
              );

            }catch(error){

              unsubscribe();

              reject(error);

            }

          },

          error => {

            unsubscribe();

            reject(error);

          }
        );

    }
  );

}


async function createMatch(
  requestedCode = ""
){

  statusEl.textContent =
    "試合を作成中…";

  try{

    const user =
      await ensureAuth();

    let code =
      requestedCode
        .trim()
        .toUpperCase();


    if(!code){

      for(
        let attempt = 0;
        attempt < 20;
        attempt++
      ){

        const candidate =
          randomCode();

        const ref =
          doc(
            db,
            "matches",
            candidate
          );

        const existing =
          await getDoc(ref);

        if(
          !existing.exists()
        ){

          code =
            candidate;

          break;

        }

      }

    }


    if(!code){

      throw new Error(
        "試合コードを作成できませんでした。"
      );

    }


    const spawn =
      randomSpawn();


    const player = {

      uid:
        user.uid,

      name:
        "Player-" +
        user.uid.slice(-4),

      x:
        spawn.x,

      y:
        spawn.y,

      z:
        spawn.z,

      yaw:
        0,

      pitch:
        0,

      hp:
        normalizeSettings(currentSettings).maxHp,

      kills:
        0,

      alive:
        true,

      lastActiveAt:
        Date.now(),

      lastDamageAt:
        0,

      joinOrder:
        0

    };


    const ref =
      doc(
        db,
        "matches",
        code
      );


    await runTransaction(
      db,
      async transaction => {

        const snap =
          await transaction.get(
            ref
          );

        if(
          snap.exists()
        ){

          throw new Error(
            "ALREADY_EXISTS"
          );

        }


        transaction.set(
          ref,
          {

            hostUid:
              user.uid,

            status:
              "waiting",

            winnerUid:
              null,

            createdAt:
              serverTimestamp(),

            startedAt:
              null,

            settings:
              { ...DEFAULT_SETTINGS },

            playerOrder:[
              user.uid
            ],

            players:{

              [user.uid]:
                player

            }

          }
        );

      }
    );


    isHost =
      true;


    await startMatch(
      code
    );


  }catch(error){

    console.error(error);

    if(
      error?.message ===
      "ALREADY_EXISTS"
    ){

      await joinMatch(
        requestedCode
      );

      return;

    }

    statusEl.textContent =
      "作成失敗：" +
      getFriendlyError(error);

  }

}


async function joinMatch(
  codeOverride = ""
){

  const code =
    (
      codeOverride ||
      matchCodeInput.value
    )
      .trim()
      .toUpperCase();


  if(!code){

    await createMatch("");

    return;

  }


  statusEl.textContent =
    "試合を確認中…";


  try{

    const user =
      await ensureAuth();


    const ref =
      doc(
        db,
        "matches",
        code
      );


    const existing =
      await getDoc(ref);


    /*
      ここが今回の重要部分。

      部屋が存在しなければ、
      参加失敗ではなく
      「そのコードで作成」する。
    */

    if(
      !existing.exists()
    ){

      await createMatch(
        code
      );

      return;

    }


    await runTransaction(
      db,
      async transaction => {

        const snap =
          await transaction.get(
            ref
          );


        if(!snap.exists()){

          throw new Error(
            "NOT_FOUND"
          );

        }


        const data =
          snap.data();


        if(
          data.status ===
          "ended"
        ){

          throw new Error(
            "ENDED"
          );

        }


        const players =
          {
            ...(data.players || {})
          };


        if(
          players[user.uid]
        ){

          return;

        }


        const count =
          Object.keys(
            players
          ).length;

        const playerOrder =
          Array.isArray(data.playerOrder)
            ? [...data.playerOrder]
            : Object.keys(players);


        if(count >= 8){

          throw new Error(
            "FULL"
          );

        }


        const spawn =
          randomSpawn();


        players[user.uid] = {

          uid:
            user.uid,

          name:
            "Player-" +
            user.uid.slice(-4),

          x:
            spawn.x,

          y:
            spawn.y,

          z:
            spawn.z,

          yaw:
            0,

          pitch:
            0,

          hp:
            normalizeSettings(data.settings).maxHp,

          kills:
            0,

          alive:
            true,

          lastActiveAt:
            Date.now(),

          lastDamageAt:
            0,

          joinOrder:
            (data.playerOrder || []).length

        };


        playerOrder.push(user.uid);
        players[user.uid].joinOrder =
          playerOrder.length - 1;

        transaction.update(
          ref,
          {

            players,

            playerOrder

          }
        );

      }
    );


    isHost =
      false;


    await startMatch(
      code
    );


  }catch(error){

    console.error(error);

    const message =
      error?.message || "";


    if(
      message ===
      "NOT_FOUND"
    ){

      await createMatch(
        code
      );

    }else if(
      message ===
      "FULL"
    ){

      statusEl.textContent =
        "その試合は満員だよ。";

    }else if(
      message ===
      "ENDED"
    ){

      statusEl.textContent =
        "その試合はもう終了してるよ。";

    }else{

      statusEl.textContent =
        "参加/作成失敗：" +
        getFriendlyError(error);

    }

  }

}

function getFriendlyError(error){

  if(!error){

    return "不明なエラー";

  }


  if(
    error.code ===
    "permission-denied"
  ){

    return "Firestoreの権限設定を確認して！";

  }


  if(
    error.code ===
    "auth/operation-not-allowed"
  ){

    return "Firebaseで匿名ログインを有効にして！";

  }


  return (
    error.message ||
    String(error)
  );

}


async function startMatch(
  code
){

  currentMatchId =
    code;

  matchRef =
    doc(
      db,
      "matches",
      code
    );


  menu.style.display =
    "none";

  gameUI.style.display =
    "block";

  gameOver.style.display =
    "none";


  roomText.textContent =
    code;


  currentSettings =
    normalizeSettings(
      currentSettings ||
      DEFAULT_SETTINGS
    );

  if(!scene){

    setupScene();

  }


  gameEnded =
    false;

  gameStarted =
    false;

  matchHasStarted =
    false;

  localKills =
    0;

  fireHolding =
    false;

  mobileInput.firing =
    false;

  velocityY =
    0;

  grounded =
    true;

  killMessage.style.opacity =
    "0";

  protectionIndicator.style.opacity =
    "0";

  updateSettingsUI(
    currentSettings
  );


  if(unsubscribeMatch){

    unsubscribeMatch();

  }


  unsubscribeMatch =
    onSnapshot(
      matchRef,
      snapshot => {

        if(!snapshot.exists()){

          statusEl.textContent =
            "部屋が削除されたよ。";

          return;

        }


        const data =
          snapshot.data();


        currentSettings =
          normalizeSettings(
            data.settings
          );

        const players =
          data.players || {};


        if(
          currentUser &&
          players[currentUser.uid]
        ){

          const p =
            players[currentUser.uid];

          if(!localPlayer){

            localPlayer =
              {
                ...p
              };

            cameraState.yaw =
              Number(p.yaw || 0);

            cameraState.pitch =
              Number(p.pitch || 0);

            localKills =
              Number(p.kills || 0);

          }else{

            localPlayer.name =
              p.name;

            localPlayer.hp =
              Number(p.hp ?? localPlayer.hp);

            localPlayer.kills =
              Number(p.kills ?? localKills);

            localPlayer.alive =
              p.alive !== false;

            localKills =
              Number(p.kills || 0);

            if(
              !gameStarted &&
              data.status === "waiting"
            ){

              localPlayer.x =
                Number(p.x || 0);

              localPlayer.y =
                Number(p.y || PLAYER_HEIGHT);

              localPlayer.z =
                Number(p.z || 0);

            }

          }

        }


        updateHUD(
          players
        );


        for(
          const uid of playerMeshes.keys()
        ){

          if(
            uid !== currentUser?.uid &&
            !players[uid]
          ){

            removeRemoteMesh(
              uid
            );

          }

        }


        for(
          const [uid,p] of Object.entries(players)
        ){

          if(
            uid === currentUser?.uid
          ){

            continue;

          }


          let mesh =
            playerMeshes.get(uid);


          if(!mesh){

            mesh =
              createPlayerMesh(
                uid
              );

            playerMeshes.set(
              uid,
              mesh
            );

          }


          mesh.position.set(
            Number(p.x || 0),
            Number(p.y || PLAYER_HEIGHT) - PLAYER_HEIGHT,
            Number(p.z || 0)
          );

          mesh.rotation.y =
            Number(p.yaw || 0);

          mesh.visible =
            p.alive !== false;

        }


        const previousStarted =
          matchHasStarted;

        matchHasStarted =
          data.status === "active";


        if(
          matchHasStarted &&
          !previousStarted
        ){

          gameStarted =
            true;

          spawnProtectionUntil =
            Date.now() +
            START_PROTECTION_TIME;

          if(
            localPlayer
          ){

            localPlayer.alive =
              true;

            localPlayer.hp =
              currentSettings.maxHp;

            velocityY =
              0;

            grounded =
              true;

          }

          preStart.style.display =
            "none";

        }


        if(
          data.status ===
          "waiting"
        ){

          preStart.style.display =
            "block";

          preStartText.textContent =
            isHost
              ? "STARTを長押しして開始"
              : "部屋主がSTARTを長押しして開始";

          startButton.style.display =
            isHost
              ? "block"
              : "none";

          settingsButton.style.display =
            isHost
              ? "block"
              : "none";

        }else{

          preStart.style.display =
            "none";

        }


        if(
          data.status ===
          "ended"
        ){

          matchHasStarted =
            false;

          gameStarted =
            false;

          if(
            !gameEnded
          ){

            gameEnded =
              true;

            showGameOver(
              data,
              players
            );

          }

        }

      },

      error => {

        console.error(
          "snapshot error",
          error
        );

        statusEl.textContent =
          "通信エラー：" +
          getFriendlyError(error);

      }

    );


  if(
    !gameLoopStarted
  ){

    gameLoopStarted =
      true;

    requestAnimationFrame(
      gameLoop
    );

  }

}


function updateHUD(players){

  if(!currentUser){

    return;

  }


  const p =
    players[currentUser.uid];

  if(!p){

    return;

  }


  const maxHp =
    normalizeSettings(
      currentSettings
    ).maxHp;

  const hp =
    Math.max(
      0,
      Number(p.hp || 0)
    );


  healthText.textContent =
    `HP ${Math.ceil(hp)} / ${maxHp}`;

  healthBar.style.width =
    `${Math.max(0,Math.min(100,hp / maxHp * 100))}%`;

  killsText.textContent =
    String(
      Number(p.kills || 0)
    );

  playerCountText.textContent =
    String(
      Object.keys(players).length
    );


  const rows =
    Object.values(players)
      .sort(
        (a,b) =>
          Number(b.kills || 0) -
          Number(a.kills || 0)
      );


  scoreBoard.innerHTML =
    rows
      .map(
        p => `
          <div class="scoreRow">
            <span>${escapeHtml(p.name || "Player")}</span>
            <span class="${p.alive !== false ? "scoreAlive" : "scoreDead"}">
              ${Number(p.kills || 0)}
            </span>
          </div>
        `
      )
      .join("");

}


function escapeHtml(value){

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}

async function leaveRoom(){

    unsubscribeMatch
  ){

    unsubscribeMatch();

    unsubscribeMatch =
      null;

  }


  if(
    matchRef &&
    currentUser
  ){

    try{

        await getDoc(

        snap.exists()
      ){

          snap.data();

          {
            ...(data.players || {})

        delete players[
          currentUser.uid
        ];

          Object.keys(players).length === 0
        ){

          await deleteDoc(
            matchRef

                : []

              uid =>

            );


          await updateDoc(

              playerOrder,

      DEFAULT_SETTINGS
    );

  }

function markActivity(){

  lastActivityAt =
    Date.now();

}


function cleanupStaleMatches(){

  if(
    !isHost ||
    !matchRef ||
    gameEnded
  ){

    return;

  }


  const now =
    Date.now();


  if(
    now -
    lastCleanupCheck <
    CLEANUP_INTERVAL
  ){

    return;

  }


  lastCleanupCheck =
    now;


  if(
    now -
    lastActivityAt >
    INACTIVE_MATCH_TIME
  ){

    deleteDoc(
      matchRef
    ).catch(
      error =>
        console.error(
          "inactive cleanup error",
          error
        )
    );

    return;

  }

}


function cleanupOldMatchesIfPossible(){

  if(
    !isHost ||
    !matchRef
  ){

    return;

  }


  const createdAt =
    currentMatchCreatedAt;


  if(
    !createdAt
  ){

    return;

  }


  if(
    Date.now() -
    createdAt >
    MAX_MATCH_AGE
  ){

    deleteDoc(
      matchRef
    ).catch(
      error =>
        console.error(
          "old cleanup error",
          error
        )
    );

  }

}


let currentMatchCreatedAt =
  0;


function updateCleanupState(data){

  if(
    data?.createdAt?.toMillis
  ){

    currentMatchCreatedAt =
      data.createdAt.toMillis();

  }else if(
    !currentMatchCreatedAt
  ){

    currentMatchCreatedAt =
      Date.now();

  }

}


function updateStartProgress(){

  if(
    !startHolding ||
    !isHost ||
    matchHasStarted
  ){

    return;

  }


  const elapsed =
    performance.now() -
    startHoldStart;


  const progress =
    Math.min(
      1,
      elapsed /
      START_HOLD_TIME
    );


  startButton.style.setProperty(
    "--progress",
    `${progress * 100}%`
  );


  if(
    progress >= 1
  ){

    startHolding =
      false;

    startButton.style.setProperty(
      "--progress",
      "0%"
    );

    actuallyStartMatch();

  }

}


async function actuallyStartMatch(){

  if(
    !matchRef ||
    !isHost ||
    matchHasStarted
  ){

    return;

  }


  try{

    const snap =
      await getDoc(
        matchRef
      );

    if(
      !snap.exists()
    ){

      return;

    }


    const data =
      snap.data();

    const players =
      {
        ...(data.players || {})
      };


    for(
      const uid of Object.keys(players)
    ){

      players[uid] = {

        ...players[uid],

        hp:
          normalizeSettings(
            data.settings
          ).maxHp,

        alive:
          true,

        kills:
          0,

        lastDamageAt:
          0,

        lastActiveAt:
          Date.now()

      };

    }


    await updateDoc(
      matchRef,
      {

        status:
          "active",

        startedAt:
          serverTimestamp(),

        players

      }
    );

  }catch(error){

    console.error(
      "start match error",
      error
    );

  }

}

function setupMobileInput(){

  let joystickPointerId =
    null;


  function updateJoystick(
    clientX,
    clientY
  ){

    const rect =
      joystickZone.getBoundingClientRect();

    const centerX =
      rect.left +
      rect.width / 2;

    const centerY =
      rect.top +
      rect.height / 2;


    let dx =
      clientX -
      centerX;

    let dy =
      clientY -
      centerY;


    const max =
      53;


    const distance =
      Math.hypot(
        dx,
        dy
      );


    if(
      distance >
      max
    ){

      dx =
        dx /
        distance *
        max;

      dy =
        dy /
        distance *
        max;

    }


    mobileInput.x =
      dx / max;


    mobileInput.y =
      dy / max;


    joystickKnob.style.transform =
      `translate(${dx}px,${dy}px)`;

  }


  joystickZone.addEventListener(
    "pointerdown",
    event => {

      joystickPointerId =
        event.pointerId;


      joystickZone.setPointerCapture(
        event.pointerId
      );


      updateJoystick(
        event.clientX,
        event.clientY
      );

    }
  );


  joystickZone.addEventListener(
    "pointermove",
    event => {

      if(
        event.pointerId ===
        joystickPointerId
      ){

        updateJoystick(
          event.clientX,
          event.clientY
        );

      }

    }
  );


  const endJoystick =
    event => {

      if(
        event.pointerId !==
        joystickPointerId
      ){

        return;

      }


      joystickPointerId =
        null;


      mobileInput.x =
        0;

      mobileInput.y =
        0;


      joystickKnob.style.transform =
        "translate(0,0)";

    };


  joystickZone.addEventListener(
    "pointerup",
    endJoystick
  );


  joystickZone.addEventListener(
    "pointercancel",
    endJoystick
  );


  let lookPointerId =
    null;

  let lastLookX =
    0;

  let lastLookY =
    0;


  lookZone.addEventListener(
    "pointerdown",
    event => {

      lookPointerId =
        event.pointerId;


      lastLookX =
        event.clientX;


      lastLookY =
        event.clientY;


      lookZone.setPointerCapture(
        event.pointerId
      );

    }
  );


  lookZone.addEventListener(
    "pointermove",
    event => {

      if(
        event.pointerId !==
        lookPointerId
      ){

        return;

      }


      const dx =
        event.clientX -
        lastLookX;


      const dy =
        event.clientY -
        lastLookY;


      lastLookX =
        event.clientX;


      lastLookY =
        event.clientY;


      if(
        dx !== 0 ||
        dy !== 0
      ){
        markActivity();
      }

      cameraState.yaw -=
        dx * .006;


      cameraState.pitch -=
        dy * .006;


      cameraState.pitch =
        clamp(
          cameraState.pitch,
          -1.45,
          1.45
        );

    }
  );


  const endLook =
    event => {

      if(
        event.pointerId ===
        lookPointerId
      ){

        lookPointerId =
          null;

      }

    };


  lookZone.addEventListener(
    "pointerup",
    endLook
  );


  lookZone.addEventListener(
    "pointercancel",
    endLook
  );


  fireButton.addEventListener(
    "pointerdown",
    event => {

      event.preventDefault();

      fireHolding =
        true;

      mobileInput.firing =
        true;

      shoot();

    }
  );


  fireButton.addEventListener(
    "pointerup",
    event => {

      event.preventDefault();

      fireHolding =
        false;

      mobileInput.firing =
        false;

    }
  );


  fireButton.addEventListener(
    "pointercancel",
    () => {

      fireHolding =
        false;

      mobileInput.firing =
        false;

    }
  );


  jumpButton.addEventListener(
    "pointerdown",
    event => {

      event.preventDefault();

      if(
        !grounded &&
        canGrab()
      ){

        startGrab();

      }else if(
        grounded
      ){

        jump();

      }

    }
  );

}

async function regenerateLocalPlayer(){

  if(
    !matchRef ||
    !localPlayer ||
    !localPlayer.alive ||
    !matchHasStarted ||
    gameEnded
  ){
    return;
  }

  const settings =
    normalizeSettings(currentSettings);

  const rate =
    getRegenRate();

  if(rate <= 0){
    return;
  }

  const now =
    performance.now();

  if(
    now - lastRegenTick < 250
  ){
    return;
  }

  const elapsed =
    lastRegenTick > 0
      ? Math.min(.5, (now - lastRegenTick) / 1000)
      : .25;

  lastRegenTick = now;

  if(
    Date.now() -
    Number(localPlayer.lastDamageAt || 0) <
    settings.regenLock * 1000
  ){
    return;
  }

  try{
    await runTransaction(
      db,
      async transaction => {

        const snap =
          await transaction.get(matchRef);

        if(!snap.exists()) return;

        const data =
          snap.data();

        if(data.status !== "active") return;

        const players =
          { ...(data.players || {}) };

        const player =
          players[currentUser.uid];

        if(
          !player ||
          !player.alive
        ){
          return;
        }

        const latestSettings =
          normalizeSettings(data.settings);

        const latestRate =
          getRegenRateFromSettings(latestSettings);

        if(latestRate <= 0) return;

        if(
          Date.now() -
          Number(player.lastDamageAt || 0) <
          latestSettings.regenLock * 1000
        ){
          return;
        }

        const maxHp =
          latestSettings.maxHp;

        player.hp =
          Math.min(
            maxHp,
            Number(player.hp || 0) + latestRate * elapsed
          );

        players[currentUser.uid] = player;

        transaction.update(
          matchRef,
          { players }
        );
      }
    );
  }catch(error){
    console.error("regen error", error);
  }
}

function getRegenRateFromSettings(settings){
  if(settings.hpRegen === "fast") return 3;
  if(settings.hpRegen === "medium") return 1.5;
  if(settings.hpRegen === "slow") return .6;
  return 0;
}

    );

}

    getFriendlyError(error);

}

</script>
