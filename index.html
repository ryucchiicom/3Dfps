<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;

  -webkit-touch-callout:none;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  touch-action:none;
}

canvas{
  display:block;
}

#menu{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(circle at 50% 30%,#26384f 0%,#111822 40%,#05070a 100%);
  color:white;
}

.menuBox{
  width:min(92vw,480px);
  padding:28px;
  border-radius:22px;
  background:rgba(15,20,28,.88);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 20px 80px rgba(0,0,0,.45);
  backdrop-filter:blur(18px);
}

.title{
  margin:0 0 8px;
  font-size:34px;
  font-weight:800;
  text-align:center;
}

.subtitle{
  text-align:center;
  opacity:.72;
  margin-bottom:24px;
}

.input{
  width:100%;
  height:48px;
  padding:0 16px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:12px;
  background:rgba(255,255,255,.07);
  color:#fff;
  font-size:18px;
  outline:none;
  text-transform:uppercase;
  margin-bottom:12px;
}

.button{
  width:100%;
  height:48px;
  border:0;
  border-radius:12px;
  color:#fff;
  background:#1976ff;
  font-size:17px;
  font-weight:700;
  margin-top:8px;
  cursor:pointer;
}

.button.secondary{
  background:#2a3039;
}

.button:active{
  transform:scale(.98);
}

.info{
  margin-top:18px;
  font-size:13px;
  line-height:1.6;
  color:#c5ccd5;
}

#status{
  min-height:22px;
  margin-top:12px;
  text-align:center;
  color:#ffce66;
  font-size:14px;
}

#gameUI{
  position:fixed;
  inset:0;
  z-index:20;
  pointer-events:none;
  display:none;
  color:#fff;
}

#topBar{
  position:absolute;
  top:12px;
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:8px;
}

#healthBox,#matchBox{
  padding:9px 12px;
  border-radius:12px;
  background:rgba(0,0,0,.45);
  backdrop-filter:blur(8px);
  font-size:14px;
}

#protectionIndicator{
  position:absolute;
  left:50%;
  top:82px;
  transform:translateX(-50%);
  padding:7px 12px;
  border-radius:999px;
  background:rgba(40,140,255,.75);
  border:1px solid rgba(255,255,255,.35);
  box-shadow:0 0 18px rgba(50,160,255,.65);
  font-size:13px;
  font-weight:900;
  opacity:0;
  transition:opacity .15s, transform .15s;
  pointer-events:none;
  z-index:5;
}

#protectionIndicator.active{
  opacity:1;
  animation:protectionPulse .8s infinite alternate;
}

@keyframes protectionPulse{
  from{
    transform:translateX(-50%) scale(1);
  }

  to{
    transform:translateX(-50%) scale(1.06);
  }
}

#health{
  margin-top:5px;
  width:170px;
  height:10px;
  overflow:hidden;
  border-radius:99px;
  background:#252525;
}

#healthBar{
  width:100%;
  height:100%;
  background:#48e27d;
  transition:width .15s;
}

#crosshair{
  position:absolute;
  left:50%;
  top:50%;
  width:18px;
  height:18px;
  margin-left:-9px;
  margin-top:-9px;
}

#crosshair::before,
#crosshair::after{
  content:"";
  position:absolute;
  background:#fff;
  box-shadow:0 0 3px #000;
}

#crosshair::before{
  width:2px;
  height:18px;
  left:8px;
  top:0;
}

#crosshair::after{
  width:18px;
  height:2px;
  left:0;
  top:8px;
}

#killMessage{
  position:absolute;
  left:50%;
  top:42%;
  transform:translate(-50%,-50%);
  font-size:28px;
  font-weight:900;
  text-shadow:0 3px 15px #000;
  opacity:0;
  transition:opacity .15s;
}

#scoreBoard{
  position:absolute;
  right:12px;
  top:70px;
  min-width:150px;
  max-width:220px;
  padding:10px;
  border-radius:12px;
  background:rgba(0,0,0,.45);
  backdrop-filter:blur(8px);
  font-size:12px;
}

.scoreRow{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin:3px 0;
}

.scoreAlive{
  color:#6dff8f;
}

.scoreDead{
  color:#ff7070;
}

#preStart{
  position:absolute;
  left:50%;
  top:58%;
  transform:translate(-50%,-50%);
  display:none;
  pointer-events:auto;
  text-align:center;
}

#preStartText{
  margin-bottom:12px;
  font-weight:800;
  font-size:16px;
}

#startButton{
  position:relative;
  z-index:2;
  box-sizing:border-box;
  pointer-events:auto;
  touch-action:none;
  width:105px;
  height:105px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.35);
  background:rgba(0,0,0,.42);
  color:#fff;
  font-size:18px;
  font-weight:900;
  overflow:hidden;
}

#startButton::before{
  content:"";
  position:absolute;
  inset:5px;
  border-radius:50%;
  background:
    conic-gradient(
      #36a3ff var(--progress,0%),
      rgba(255,255,255,.10) var(--progress,0%)
    );
  z-index:0;
  pointer-events:none;
}

#startButton::after{
  content:"";
  position:absolute;
  inset:13px;
  border-radius:50%;
  background:rgba(12,17,23,.94);
  z-index:1;
  pointer-events:none;
}

#startButton span{
  position:relative;
  z-index:2;
  pointer-events:none;
}

#roomActions{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  width:min(320px,90vw);
  margin:12px auto 0;
}

.roomActionButton{
  min-height:42px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:10px;
  background:rgba(255,255,255,.08);
  color:#fff;
  font-size:12px;
  font-weight:800;
  cursor:pointer;
  pointer-events:auto;
  touch-action:manipulation;
}

.roomActionButton.danger{
  background:rgba(180,40,40,.28);
}

.roomActionButton:active{
  transform:scale(.97);
}

#settingsModal{
  position:fixed;
  inset:0;
  z-index:200;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(0,0,0,.68);
  backdrop-filter:blur(10px);
  color:#fff;
  pointer-events:auto;
}

.settingsBox{
  width:min(92vw,430px);
  max-height:90vh;
  overflow:auto;
  padding:20px;
  border-radius:20px;
  background:rgba(18,22,29,.97);
  border:1px solid rgba(255,255,255,.12);
}

.settingsTitle{
  font-size:25px;
  font-weight:900;
  text-align:center;
  margin-bottom:4px;
}

#settingsNote{
  text-align:center;
  font-size:12px;
  opacity:.6;
  margin-bottom:15px;
}

.settingsBox label{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  min-height:48px;
  padding:7px 0;
  font-size:14px;
}

.settingsBox label > span{
  line-height:1.3;
}

.settingsBox select,
.settingsBox input{
  width:150px;
  min-width:120px;
  height:38px;
  border:1px solid rgba(255,255,255,.16);
  border-radius:9px;
  background:#202630;
  color:#fff;
  padding:0 9px;
  font-size:14px;
  outline:none;
}

.settingsBox input{
  text-align:right;
}

.settingsBox .disabledSetting{
  opacity:.3;
}

.settingsBox .disabledSetting select,
.settingsBox .disabledSetting input{
  opacity:.45;
}

.settingsButtons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}

.settingsBox button{
  pointer-events:auto;
  touch-action:manipulation;
}

.button,
.roomActionButton,
#startButton,
.mobileButton{
  box-sizing:border-box;
  pointer-events:auto;
  touch-action:manipulation;
}

#gameOver{
  position:fixed;
  inset:0;
  z-index:50;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.68);
  backdrop-filter:blur(10px);
  color:white;
}

.gameOverBox{
  width:min(88vw,430px);
  padding:28px;
  border-radius:22px;
  text-align:center;
  background:rgba(18,22,29,.94);

.gameOverTitle{
  font-size:38px;
  font-weight:900;
  margin-bottom:8px;
}

.gameOverText{
  font-size:18px;
  opacity:.85;
  margin-bottom:20px;
}

#mobileControls{
  display:none;
  position:absolute;
  inset:0;
  pointer-events:none;
}

#joystickZone{
  position:absolute;
  left:18px;
  bottom:20px;
  width:150px;
  height:150px;
  border-radius:50%;
  pointer-events:auto;
}

#joystickBase{
  position:absolute;
  left:50%;
  top:50%;
  width:118px;
  height:118px;
  margin-left:-59px;
  margin-top:-59px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.23);
  background:rgba(255,255,255,.06);
}

#joystickKnob{
  position:absolute;
  left:50%;
  top:50%;
  width:54px;
  height:54px;
  margin-left:-27px;
  margin-top:-27px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.16);
}

#lookZone{
  position:absolute;
  right:0;
  top:0;
  width:55%;
  height:70%;
  pointer-events:auto;
}

.mobileButton{
  position:absolute;
  border:1px solid rgba(255,255,255,.25);
  background:rgba(20,20,20,.45);
  color:#fff;
  border-radius:50%;
  backdrop-filter:blur(8px);
  pointer-events:auto;
  font-weight:800;
  display:flex;
  justify-content:center;
  align-items:center;
}

#fireButton{
  z-index:3;
  pointer-events:auto;
  touch-action:none;
  width:88px;
  height:88px;
  right:24px;
  bottom:32px;
  background:rgba(220,50,50,.28);
  overflow:hidden;
}

#fireButton::before{
  content:"";
  position:absolute;
  inset:4px;
  border-radius:50%;
  background:

      rgba(255,80,80,.9) var(--fireProgress,100%),
      rgba(255,255,255,.08) var(--fireProgress,100%)

  z-index:0;
  pointer-events:none;
}

#fireButton::after{
  content:"";
  position:absolute;
  inset:12px;
  border-radius:50%;
  background:rgba(25,20,20,.9);
  z-index:1;
  pointer-events:none;
}

#fireButton span{
  position:relative;
  z-index:2;
  pointer-events:none;
}

#jumpButton{
  z-index:3;
  pointer-events:auto;
  touch-action:none;
  width:64px;
  height:64px;
  right:125px;
  bottom:44px;
  transition:
    opacity .12s,
    background .12s;
}

#jumpButton.grabInactive{
  opacity:.28;
  background:rgba(20,20,20,.25);
}

#jumpButton.grabActive{
  opacity:1;
  background:rgba(35,130,255,.55);
}

#grabButton{
  display:none !important;
}

#desktopHint{
  position:absolute;
  bottom:14px;
  left:50%;
  transform:translateX(-50%);
  padding:7px 11px;
  border-radius:8px;
  background:rgba(0,0,0,.38);
  font-size:12px;
  opacity:.65;
}

.hidden{
  display:none !important;
}

@media (pointer:coarse){

  #mobileControls{
    display:block;
  }

  #desktopHint{
    display:none;
  }

}

<body>

<div id="menu">

  </div>

</div>

<div id="gameUI">

      </div>

      <div>

      </div>

    </div>

  </div>

  <div id="scoreBoard"></div>

  <div id="crosshair"></div>

  <div id="killMessage"></div>

  <div id="preStart">

    <div id="preStartText">
      部屋主がSTARTを長押しして開始
    </div>

    <button id="startButton" type="button">
      <span>START</span>
    </button>

    <div id="roomActions">
      <button id="shareCodeButton" class="roomActionButton" type="button">コードを共有</button>
      <button id="leaveRoomButton" class="roomActionButton danger" type="button">部屋から退出</button>
      <button id="settingsButton" class="roomActionButton" type="button">設定</button>
    </div>

  </div>

  <div id="desktopHint">
    WASD / Mouse / Click / Space
  </div>

  <div id="mobileControls">

    <div id="joystickZone">

      <div id="joystickBase">

        <div id="joystickKnob"></div>

      </div>

    </div>

    <div id="lookZone"></div>

    <div
      id="jumpButton"
      class="mobileButton"
    >
      JUMP
    </div>

    <div
      id="fireButton"
      class="mobileButton"
    >
      <span>FIRE</span>
    </div>

  </div>

</div>

<div id="settingsModal">
  <div class="settingsBox">
    <div class="settingsTitle">設定</div>
    <div id="settingsNote">部屋主のみ変更できます</div>

    <label id="terrainAmountSetting">
      <span>地形の量</span>
      <select id="terrainAmountSelect">
        <option value="many">多</option>
        <option value="medium" selected>中</option>
        <option value="few">少</option>
        <option value="none">なし</option>
      </select>
    </label>

    <label id="terrainHeightSetting">
      <span>地形の高低差</span>
      <select id="terrainHeightSelect">
        <option value="high">高</option>
        <option value="medium" selected>中</option>
        <option value="low">低</option>
      </select>
    </label>

    <label>
      <span>弾速</span>
      <select id="bulletSpeedSelect">
        <option value="infinite">∞</option>
        <option value="fast">速</option>
        <option value="medium" selected>中</option>
        <option value="slow">遅</option>
      </select>
    </label>

    <label>
      <span>HP最大値</span>
      <input id="maxHPInput" type="number" min="1" max="9999" step="1" value="100" inputmode="numeric">
    </label>

    <label>
      <span>HP自然回復</span>
      <select id="hpRegenSelect">
        <option value="fast">速</option>
        <option value="medium">中</option>
        <option value="slow">遅</option>
        <option value="none" selected>なし</option>
      </select>
    </label>

    <label id="regenLockSetting">
      <span>ダメージからの自然回復ロック</span>
      <input id="regenLockInput" type="number" min="0" max="600" step="0.1" value="0" inputmode="decimal">
    </label>

    <div class="settingsButtons">
      <button id="closeSettingsButton" class="button secondary" type="button">閉じる</button>
      <button id="saveSettingsButton" class="button" type="button">保存</button>
    </div>
  </div>
</div>

<div id="gameOver">

  <div class="gameOverBox">

    <div
      id="gameOverTitle"
      class="gameOverTitle"
    >
      試合終了
    </div>

    <div
      id="gameOverText"
      class="gameOverText"
    >
      ---
    </div>

    <button
      id="returnButton"
      class="button"
    >
      メニューへ戻る
    </button>

  </div>

</div>

function normalizeMatchSettings(settings){

  const source =
    settings || {};

  const result = {
    ...DEFAULT_MATCH_SETTINGS,
    ...source
  };

  if(
    ![
      "many",
      "medium",
      "few",
      "none"
    ].includes(result.terrainAmount)
  ){
    result.terrainAmount =
      DEFAULT_MATCH_SETTINGS.terrainAmount;
  }

  if(
    ![
      "high",
      "medium",
      "low"
    ].includes(result.terrainHeight)
  ){
    result.terrainHeight =
      DEFAULT_MATCH_SETTINGS.terrainHeight;
  }

  if(
    ![
      "infinite",
      "fast",
      "medium",
      "slow"
    ].includes(result.bulletSpeed)
  ){
    result.bulletSpeed =
      DEFAULT_MATCH_SETTINGS.bulletSpeed;
  }

  const maxHP =
    Number(result.maxHP);

  result.maxHP =
    Number.isFinite(maxHP)
      ? clamp(Math.round(maxHP),1,9999)
      : DEFAULT_MATCH_SETTINGS.maxHP;

  if(
    ![
      "fast",
      "medium",
      "slow",
      "none"
    ].includes(result.hpRegen)
  ){
    result.hpRegen =
      DEFAULT_MATCH_SETTINGS.hpRegen;
  }

  const regenLock =
    Number(result.regenLock);

  result.regenLock =
    Number.isFinite(regenLock)
      ? clamp(regenLock,0,600)
      : DEFAULT_MATCH_SETTINGS.regenLock;

  return result;
}


function applyMatchSettings(settings){

  matchSettings =
    normalizeMatchSettings(settings);

  MAX_HP =
    matchSettings.maxHP;

  BULLET_SPEED =
    {
      infinite: Infinity,
      fast: 70,
      medium: 42,
      slow: 20
    }[
      matchSettings.bulletSpeed
    ];

  updateSettingsDisabledState();
}


function setTerrainSeed(code){

  let hash = 2166136261;

  for(
    let i = 0;
    i < String(code).length;
    i++
  ){

    hash ^= String(code).charCodeAt(i);

    hash =
      Math.imul(
        hash,
        16777619
      );

  }

  terrainSeed =
    hash >>> 0;

}


function terrainRandom(){

  terrainSeed =
    (
      Math.imul(
        terrainSeed,
        1664525
      ) +
      1013904223
    ) >>> 0;

  return terrainSeed /
    4294967296;

}


function getMaxHP(){

  return Math.max(
    1,
    Number(
      matchSettings?.maxHP ||
      MAX_HP ||
      100
    )
  );

}


function getRegenRate(){

  return REGEN_RATES[
    matchSettings?.hpRegen ||
    "none"
  ] || 0;

}


function updateProtectionUI(){

  if(
    !matchHasStarted ||
    !localPlayer
  ){

    protectionIndicator.classList.remove(
      "active"
    );

    return;

  }

  const remaining =
    Math.max(
      0,
      spawnProtectionUntil -
      Date.now()
    );

  if(
    remaining <= 0
  ){

    protectionIndicator.classList.remove(
      "active"
    );

    return;

  }

  protectionIndicator.textContent =
    `🛡 無敵 ${Math.ceil(
      remaining / 1000
    )}秒`;

  protectionIndicator.classList.add(
    "active"
  );

}

async function saveMatchSettings(){

  if(
    !isHost ||
    !matchRef ||
    matchHasStarted
  ){

    return;

  }

  const next =
    normalizeMatchSettings({

      terrainAmount:
        terrainAmountSelect.value,

      terrainHeight:
        terrainHeightSelect.value,

      bulletSpeed:
        bulletSpeedSelect.value,

      maxHP:
        maxHPInput.value,

      hpRegen:
        hpRegenSelect.value,

      regenLock:
        regenLockInput.value

    });

  try{

    await updateDoc(
      matchRef,
      {
        settings:
          next
      }
    );

    applyMatchSettings(
      next
    );

    setTerrainSeed(
      currentMatchId
    );

    rebuildArena();

    if(
      localPlayer
    ){

      localPlayer.hp =
        Math.min(
          getMaxHP(),
          Number(
            localPlayer.hp || 0
          )
        );

      updateLocalHUD();

    }

    settingsModal.style.display =
      "none";

  }catch(error){

    console.error(
      "settings save error",
      error
    );

  }

}


function rebuildArena(){

  if(
    !scene
  ){

    return;

  }

  for(
    const collider
    of colliders
  ){

    scene.remove(
      collider
    );

    if(
      collider.geometry
    ){

      collider.geometry.dispose();

    }

    if(
      collider.material
    ){

      if(
        Array.isArray(
          collider.material
        )
      ){

        collider.material.forEach(
          material =>
            material.dispose()
        );

      }else{

        collider.material.dispose();

      }

    }

  }

  colliders.length =
    0;

  createArena();

}


async function regenLocalPlayer(){

  const rate =
    getRegenRate();

  if(
    rate <= 0 ||
    !matchRef ||
    !matchHasStarted ||
    gameEnded ||
    !localPlayer ||
    !localPlayer.alive
  ){

    return;

  }

  const now =
    Date.now();

  if(
    now -
    lastRegenAt <
    250
  ){

    return;

  }

  lastRegenAt =
    now;

  try{

    await runTransaction(
      db,
      async transaction => {

        const snap =
          await transaction.get(
            matchRef
          );

        if(
          !snap.exists()
        ){

          return;

        }

        const data =
          snap.data();

        if(
          data.status !==
          "active"
        ){

          return;

        }

        const players =
          {
            ...(data.players || {})
          };

        const player =
          players[
            currentUser.uid
          ];

        if(
          !player ||
          !player.alive
        ){

          return;

        }

        const maxHP =
          normalizeMatchSettings(
            data.settings
          ).maxHP;

        const hp =
          Number(
            player.hp || 0
          );

        if(
          hp >= maxHP
        ){

          return;

        }

        const lastDamage =
          Number(
            player.lastDamageAt || 0
          );

        const lock =
          normalizeMatchSettings(
            data.settings
          ).regenLock;

        if(
          lastDamage > 0 &&
          now -
          lastDamage <
          lock * 1000
        ){

          return;

        }

        player.hp =
          Math.min(
            maxHP,
            hp +
            rate * .25
          );

        players[
          currentUser.uid
        ] =
          player;

        transaction.update(
          matchRef,
          {
            players
          }
        );

      }
    );

  }catch(error){

    console.error(
      "regen error",
      error
    );

  }

}


function randomCode(
  length = 6
){

  const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let result = "";

  for(
    let i = 0;
    i < length;
    i++
  ){

    result +=
      chars[
        Math.floor(
          Math.random() *
          chars.length
        )
      ];

  }

  return result;

}


function randomSpawn(){

  const margin = 7;

  return {

    x:
      Math.random() *
      (ARENA_SIZE - margin * 2) -
      (
        ARENA_SIZE / 2 -
        margin
      ),

    y:
      PLAYER_HEIGHT,

    z:
      Math.random() *
      (ARENA_SIZE - margin * 2) -
      (
        ARENA_SIZE / 2 -
        margin
      )

  };

}


function playerColor(
  uid
){

  let hash = 0;

  for(
    let i = 0;
    i < uid.length;
    i++
  ){

    hash =
      (
        (hash << 5) -
        hash
      ) +
      uid.charCodeAt(i);

    hash |=
      0;

  }

  const hue =
    Math.abs(hash) %
    360;

  return new THREE.Color(
    `hsl(${hue},70%,58%)`
  );

}

function removeRemoteMesh(
  uid
){

  const mesh =
    playerMeshes.get(
      uid
    );

  if(
    !mesh
  ){

    return;

  }

  scene.remove(
    mesh
  );

  mesh.traverse(
    object => {

      if(
        object.geometry
      ){

        object.geometry.dispose();

      }

      if(
        object.material
      ){

        if(
          Array.isArray(
            object.material
          )
        ){

          object.material.forEach(
            material =>
              material.dispose()
          );

        }else{

          object.material.dispose();

        }

      }

    }
  );

  playerMeshes.delete(
    uid
  );

}

function createArena(){

  const floorGeometry =
    new THREE.BoxGeometry(
      ARENA_SIZE,
      1,
      ARENA_SIZE
    );

  const floorMaterial =
    new THREE.MeshStandardMaterial({
      color:
        0x41474d,
      roughness:
        .92
    });

  const floor =
    new THREE.Mesh(
      floorGeometry,
      floorMaterial
    );

  floor.position.y =
    -.5;

  floor.receiveShadow =
    true;

  scene.add(
    floor
  );

  colliders.push(
    floor
  );


  const wallMaterial =
    new THREE.MeshStandardMaterial({
      color:
        0x252b31
    });


  createBox(
    ARENA_SIZE,
    6,
    1,
    0,
    3,
    -ARENA_SIZE / 2,
    wallMaterial
  );

  createBox(
    ARENA_SIZE,
    6,
    1,
    0,
    3,
    ARENA_SIZE / 2,
    wallMaterial
  );

  createBox(
    1,
    6,
    ARENA_SIZE,
    -ARENA_SIZE / 2,
    3,
    0,
    wallMaterial
  );

  createBox(
    1,
    6,
    ARENA_SIZE,
    ARENA_SIZE / 2,
    3,
    0,
    wallMaterial
  );


  const settings =
    normalizeMatchSettings(
      matchSettings
    );

  if(
    settings.terrainAmount ===
    "none"
  ){

    return;

  }


  const obstacleMaterial =
    new THREE.MeshStandardMaterial({
      color:
        0x69727b,
      roughness:
        .7
    });


  const heightScale =
    {
      high:
        1.35,

      medium:
        1,

      low:
        .65

    }[
      settings.terrainHeight
    ];


  const platforms = [

    [8,1.5,8,-15,-10],

    [11,2,5,13,-8],

    [6,2.5,6,17,14],

    [10,1.5,5,-15,15],

    [5,2,12,0,17],

    [6,3.5,6,-15,-1],

    [7,4,7,4,-14],

    [7,4.5,7,16,2],

    [5,.9,5,-4,-5],

    [5,1.3,5,4,-5],

    [5,1.7,5,10,-5],

    [4,.7,4,-10,-18],

    [4,1.1,4,-4,-18],

    [4,1.5,4,2,-18],

    [4,1.9,4,8,-18]

  ];


  const amountCount =
    {
      few:
        5,

      medium:
        10,

      many:
        15

    }[
      settings.terrainAmount
    ] || 0;


  for(
    let i = 0;
    i <
      Math.min(
        amountCount,
        platforms.length
      );
    i++
  ){

    const [
      width,
      height,
      depth,
      x,
      z
    ] =
      platforms[i];

    const scaledHeight =
      height *
      heightScale;

    createBox(
      width,
      scaledHeight,
      depth,
      x,
      scaledHeight / 2,
      z,
      obstacleMaterial
    );

  }


  const randomCount =
    {
      few:
        3,

      medium:
        6,

      many:
        10

    }[
      settings.terrainAmount
    ] || 0;


  for(
    let i = 0;
    i < randomCount;
    i++
  ){

    const x =
      terrainRandom() *
      42 -
      21;

    const z =
      terrainRandom() *
      42 -
      21;

    const width =
      2.5 +
      terrainRandom() *
      2;

    const depth =
      2.5 +
      terrainRandom() *
      2;

    const baseHeight =
      1.3 +
      terrainRandom() *
      1.7;

    const scaledHeight =
      baseHeight *
      heightScale;

    createBox(
      width,
      scaledHeight,
      depth,
      x,
      scaledHeight / 2,
      z,
      obstacleMaterial
    );

  }

}


function createBox(
  width,
  height,
  depth,
  x,
  y,
  z,
  material
){

  const geometry =
    new THREE.BoxGeometry(
      width,
      height,
      depth
    );

  const mesh =
    new THREE.Mesh(
      geometry,
      material
    );

  mesh.position.set(
    x,
    y,
    z
  );

  mesh.castShadow =
    true;

  mesh.receiveShadow =
    true;

  scene.add(
    mesh
  );

  colliders.push(
    mesh
  );

  return mesh;

}


function onResize(){

  if(
    !camera ||
    !renderer
  ){

    return;

  }

  camera.aspect =
    window.innerWidth /
    window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

}


async function ensureAuth(){

  if(
    currentUser
  ){

    return currentUser;

  }

  return new Promise(
    (resolve,reject) => {

      const unsubscribe =
        onAuthStateChanged(
          auth,
          async user => {

            if(
              user
            ){

              currentUser =
                user;

              unsubscribe();

              resolve(
                user
              );

              return;

            }

            try{

              await signInAnonymously(
                auth
              );

            }catch(error){

              unsubscribe();

              reject(
                error
              );

            }

          },
          reject
        );

    }
  );

}


async function createMatch(
  requestedCode = ""
){

  statusEl.textContent =
    "試合を作成中…";

  try{

    const user =
      await ensureAuth();

    let code =
      requestedCode
        .trim()
        .toUpperCase();


    if(
      !code
    ){

      for(
        let attempt = 0;
        attempt < 20;
        attempt++
      ){

        const candidate =
          randomCode();

        const ref =
          doc(
            db,
            "matches",
            candidate
          );

        const existing =
          await getDoc(
            ref
          );

        if(
          !existing.exists()
        ){

          code =
            candidate;

          break;

        }

      }

    }


    if(
      !code
    ){

      throw new Error(
        "試合コードを作成できませんでした。"
      );

    }


    const spawn =
      randomSpawn();


    const player = {

      uid:
        user.uid,

      name:
        "Player-" +
        user.uid.slice(-4),

      x:
        spawn.x,

      y:
        spawn.y,

      z:
        spawn.z,

      yaw:
        0,

      pitch:
        0,

      hp:
        getMaxHP(),

      kills:
        0,

      alive:
        true,

      lastActiveAt:
        Date.now(),

      lastDamageAt:
        0

    };


    const ref =
      doc(
        db,
        "matches",
        code
      );


    await runTransaction(
      db,
      async transaction => {

        const snap =
          await transaction.get(
            ref
          );

        if(
          snap.exists()
        ){

          throw new Error(
            "ALREADY_EXISTS"
          );

        }


        transaction.set(
          ref,
          {

            hostUid:
              user.uid,

            status:
              "waiting",

            winnerUid:
              null,

            createdAt:
              serverTimestamp(),

            startedAt:
              null,

            settings:
              normalizeMatchSettings(
                DEFAULT_MATCH_SETTINGS
              ),

            playerOrder:[
              user.uid
            ],

            players:{

              [user.uid]:
                player

            }

          }
        );

      }
    );


    isHost =
      true;


    await startMatch(
      code
    );


  }catch(error){

    console.error(
      error
    );

    if(
      error?.message ===
      "ALREADY_EXISTS"
    ){

      await joinMatch(
        requestedCode
      );

      return;

    }

    statusEl.textContent =
      "作成失敗：" +
      getFriendlyError(
        error
      );

  }

}


async function joinMatch(
  codeOverride = ""
){

  const code =
    (
      codeOverride ||
      matchCodeInput.value
    )
      .trim()
      .toUpperCase();


  if(
    !code
  ){

    await createMatch(
      ""
    );

    return;

  }


  statusEl.textContent =
    "試合を確認中…";


  try{

    const user =
      await ensureAuth();


    const ref =
      doc(
        db,
        "matches",
        code
      );


    const existing =
      await getDoc(
        ref
      );


    if(
      !existing.exists()
    ){

      await createMatch(
        code
      );

      return;

    }


    await runTransaction(
      db,
      async transaction => {

        const snap =
          await transaction.get(
            ref
          );


        if(
          !snap.exists()
        ){

          throw new Error(
            "NOT_FOUND"
          );

        }


        const data =
          snap.data();


        if(
          data.status ===
          "ended"
        ){

          throw new Error(
            "ENDED"
          );

        }


        const players =
          {
            ...(data.players || {})
          };


        if(
          players[
            user.uid
          ]
        ){

          return;

        }


        const count =
          Object.keys(
            players
          ).length;


        if(
          count >= 8
        ){

          throw new Error(
            "FULL"
          );

        }


        const spawn =
          randomSpawn();


        players[
          user.uid
        ] = {

          uid:
            user.uid,

          name:
            "Player-" +
            user.uid.slice(-4),

          x:
            spawn.x,

          y:
            spawn.y,

          z:
            spawn.z,

          yaw:
            0,

          pitch:
            0,

          hp:
            normalizeMatchSettings(
              data.settings
            ).maxHP,

          kills:
            0,

          alive:
            true,

          lastActiveAt:
            Date.now(),

          lastDamageAt:
            0

        };


        const playerOrder =
          Array.isArray(
            data.playerOrder
          )
            ? [
                ...data.playerOrder
              ]
            : Object.keys(
                data.players || {}
              );


        if(
          !playerOrder.includes(
            user.uid
          )
        ){

          playerOrder.push(
            user.uid
          );

        }


        transaction.update(
          ref,
          {

            players,

            playerOrder

          }
        );

      }
    );


    isHost =
      false;


    await startMatch(
      code
    );


  }catch(error){

    console.error(
      error
    );

    const message =
      error?.message ||
      "";


    if(
      message ===
      "NOT_FOUND"
    ){

      await createMatch(
        code
      );

    }else if(
      message ===
      "FULL"
    ){

      statusEl.textContent =
        "その試合は満員だよ。";

    }else if(
      message ===
      "ENDED"
    ){

      statusEl.textContent =
        "その試合はもう終了してるよ。";

    }else{

      statusEl.textContent =
        "参加/作成失敗：" +
        getFriendlyError(
          error
        );

    }

  }

}


async function handleMatchButton(){

      .toUpperCase();

  if(

  ){

    );

}


function getFriendlyError(
  error
){

  const code =
    error?.code ||
    "";

  if(
    code ===
    "auth/admin-restricted-operation"
  ){

    return "匿名ログインがFirebaseで有効になっていません。";

  }

  if(
    code ===
    "auth/configuration-not-found"
  ){

    return "Firebase Authenticationの設定を確認してね。";

  }

  if(
    code ===
    "permission-denied"
  ){

    return "Firestoreの権限で拒否されました。";

  }

  return (
    error?.message ||
    "不明なエラー"
  );

}


async function startMatch(
  code
){

  currentMatchId =
    code;

  matchRef =
    doc(
      db,
      "matches",
      code
    );


  menu.style.display =
    "none";

  gameUI.style.display =
    "block";

  gameOver.style.display =
    "none";


  roomText.textContent =
    code;


  gameEnded =
    false;

  gameStarted =
    true;

  matchHasStarted =
    false;


  velocityY =
    0;


  await loadLocalPlayer();


  applyMatchSettings(
    matchSettings
  );

  setTerrainSeed(
    currentMatchId
  );

  if(
    !scene
  ){

    setupScene();

  }else{

    rebuildArena();

  }


  if(
    unsubscribeMatch
  ){

    unsubscribeMatch();

    unsubscribeMatch =
      null;

  }


  unsubscribeMatch =
    onSnapshot(
      matchRef,

      async snapshot => {

        if(
          !snapshot.exists()
        ){

          if(
            gameStarted
          ){

            leaveCurrentMatch();

          }

          return;

        }


        const data =
          snapshot.data();


        roomPlayerOrder =
          Array.isArray(
            data.playerOrder
          )
            ? [
                ...data.playerOrder
              ]
            : Object.keys(
                data.players || {}
              );


        const previousSettings =
          JSON.stringify(
            matchSettings ||
            {}
          );


        applyMatchSettings(
          data.settings
        );


        if(
          JSON.stringify(
            matchSettings
          ) !==
          previousSettings &&
          !matchHasStarted
        ){

          setTerrainSeed(
            currentMatchId
          );

          rebuildArena();

        }


        checkMatchCleanup(
          data
        );


        const players =
          data.players ||
          {};


        const count =
          Object.keys(
            players
          ).length;


        playerCountText.textContent =
          String(
            count
          );


        updateRemotePlayers(
          players
        );


        updateScoreboard(
          players
        );


        const me =
          players[
            currentUser.uid
          ];


        if(
          me
        ){

          localPlayer =
            {

              ...localPlayer,

              ...me

            };


          localKills =
            me.kills ||
            0;


          updateLocalHUD();

        }


        const wasStarted =
          matchHasStarted;


        if(
          data.status ===
          "active"
        ){

          matchHasStarted =
            true;

        }


        if(
          data.status ===
          "active" &&
          !wasStarted
        ){

          const startedAt =
            data.startedAt;


          spawnProtectionUntil =
            Date.now() +
            START_PROTECTION_TIME;


          if(
            startedAt
          ){

            const serverMillis =
              startedAt.toMillis
                ? startedAt.toMillis()
                : Date.now();


            spawnProtectionUntil =
              serverMillis +
              START_PROTECTION_TIME;

          }

        }


        updateStartUI(
          data
        );


        if(
          data.status ===
          "ended" &&
          !gameEnded
        ){

          const winner =
            data.winnerUid;


          const winnerName =
            winner &&
            players[winner] &&
            players[winner].name
              ? players[winner].name
              : "勝者";


          finishLocalGame(

            winner ===
            currentUser.uid

              ? "YOU WIN!"

              : winnerName +
                " の勝利！"

          );


          setTimeout(
            () => {

              if(
                matchRef
              ){

                deleteMatch();

              }

            },
            1200
          );

        }

      },

      error => {

        console.error(
          error
        );

        if(
          gameStarted
        ){

          finishLocalGame(
            "通信エラーが発生しました。"
          );

        }

      }
    );


  if(
    !gameLoopStarted
  ){

    gameLoopStarted =
      true;

    requestAnimationFrame(
      gameLoop
    );

  }

}


async function loadLocalPlayer(){

  const snap =
    await getDoc(
      matchRef
    );


  if(
    !snap.exists()
  ){

    throw new Error(
      "試合が見つかりません。"
    );

  }


  const data =
    snap.data();


  matchSettings =
    normalizeMatchSettings(
      data.settings
    );


  roomPlayerOrder =
    Array.isArray(
      data.playerOrder
    )
      ? [
          ...data.playerOrder
        ]
      : Object.keys(
          data.players || {}
        );


  applyMatchSettings(
    matchSettings
  );


  const player =
    data.players?.[
      currentUser.uid
    ];


  if(
    !player
  ){

    throw new Error(
      "プレイヤーデータがありません。"
    );

  }


  localPlayer =
    {

      ...player,

      lastActiveAt:
        Number(
          player.lastActiveAt ||
          Date.now()
        )

    };


  lastActivityAt =
    localPlayer.lastActiveAt;


  localKills =
    player.kills ||
    0;


  cameraState.yaw =
    Number(
      player.yaw ||
      0
    );


  cameraState.pitch =
    Number(
      player.pitch ||
      0
    );


  setCameraFromPlayer();

  updateLocalHUD();

  updateStartUI(
    data
  );

}

      : "部屋主のSTART待ち";

      : ".7";

}


function updateRemotePlayers(
  players
){

  const seen =
    new Set();


  for(
    const [
      uid,
      player
    ]
    of Object.entries(
      players
    )
  ){

    if(
      uid ===
      currentUser.uid
    ){

      continue;

    }


    seen.add(
      uid
    );


    let mesh =
      playerMeshes.get(
        uid
      );


    if(
      !mesh
    ){

      mesh =
        createPlayerMesh(
          uid
        );

      playerMeshes.set(
        uid,
        mesh
      );

    }


    mesh.position.set(

      player.x,

      Math.max(
        0,
        player.y -
        PLAYER_HEIGHT
      ),

      player.z

    );


    mesh.rotation.y =
      Number(
        player.yaw ||
        0
      );


    mesh.visible =
      Boolean(
        player.alive
      );

  }


  for(
    const uid
    of playerMeshes.keys()
  ){

    if(
      !seen.has(
        uid
      )
    ){

      removeRemoteMesh(
        uid
      );

    }

  }

}


function updateScoreboard(
  players
){

  const order =
    Array.isArray(
      roomPlayerOrder
    )
      ? roomPlayerOrder
      : [];


  const entries =
    Object.entries(
      players
    )
      .sort(
        (a,b) => {

          const ai =
            order.indexOf(
              a[0]
            );

          const bi =
            order.indexOf(
              b[0]
            );


          if(
            ai === -1 &&
            bi === -1
          ){

            return 0;

          }


          if(
            ai === -1
          ){

            return 1;

          }


          if(
            bi === -1
          ){

            return -1;

          }


          return ai - bi;

        }
      );


  scoreBoard.innerHTML =
    "";


  for(
    const [
      uid,
      player
    ]
    of entries
  ){

    const row =
      document.createElement(
        "div"
      );

    row.className =
      "scoreRow";


    const name =
      document.createElement(
        "span"
      );


    name.textContent =
      uid ===
      currentUser.uid

        ? "YOU"

        : player.name ||
          uid.slice(-4);


    const state =
      document.createElement(
        "span"
      );


    state.textContent =
      player.alive

        ? `${player.kills || 0} K`

        : "DEAD";


    state.className =
      player.alive

        ? "scoreAlive"

        : "scoreDead";


    row.appendChild(
      name
    );

    row.appendChild(
      state
    );

    scoreBoard.appendChild(
      row
    );

  }

}

function clamp(
  value,
  min,
  max
){

  return Math.min(
    max,
    Math.max(
      min,
      value
    )
  );

}


function markActivity(){

  const now =
    Date.now();

  lastActivityAt =
    now;

  if(
    localPlayer
  ){

    localPlayer.lastActiveAt =
      now;

  }

}


function getColliderBoxes(){

  return colliders.map(
    collider =>
      new THREE.Box3()
        .setFromObject(
          collider
        )
  );

}


function horizontalOverlaps(
  box,
  x,
  z
){

  const halfWidth =
    .35;

  const halfDepth =
    .35;


  return (
    x + halfWidth >
      box.min.x &&
    x - halfWidth <
      box.max.x &&
    z + halfDepth >
      box.min.z &&
    z - halfDepth <
      box.max.z
  );

}


function isPositionFree(
  x,
  y,
  z
){

  const boxes =
    getColliderBoxes();


  const feetY =
    y -
    PLAYER_HEIGHT;


  const headY =
    y +
    .35;


  for(
    const box
    of boxes
  ){

    if(
      box ===
      boxes[0]
    ){

      continue;

    }


    if(
      !horizontalOverlaps(
        box,
        x,
        z
      )
    ){

      continue;

    }


    const top =
      box.max.y;

    const bottom =
      box.min.y;


    if(
      feetY <
      top - .08 &&
      headY >
      bottom + .08
    ){

      if(
        Math.abs(
          feetY -
          top
        ) >
        .12
      ){

        return false;

      }

    }

  }


  return true;

}


function getLandingTop(
  x,
  z,
  previousFeetY,
  nextFeetY
){

  let landingTop =
    null;


  if(
    previousFeetY >= 0 &&
    nextFeetY <= 0
  ){

    landingTop =
      0;

  }


  const boxes =
    getColliderBoxes();


  for(
    let i = 1;
    i < boxes.length;
    i++
  ){

    const box =
      boxes[i];


    if(
      !horizontalOverlaps(
        box,
        x,
        z
      )
    ){

      continue;

    }


    const top =
      box.max.y;


    if(
      previousFeetY >=
        top - .03 &&
      nextFeetY <=
        top + .03
    ){

      if(
        landingTop === null ||
        top >
        landingTop
      ){

        landingTop =
          top;

      }

    }

  }


  return landingTop;

}


function getCeilingBottom(
  x,
  z,
  previousHeadY,
  nextHeadY
){

  const boxes =
    getColliderBoxes();


  let ceiling =
    null;


  for(
    let i = 1;
    i < boxes.length;
    i++
  ){

    const box =
      boxes[i];


    if(
      !horizontalOverlaps(
        box,
        x,
        z
      )
    ){

      continue;

    }


    const bottom =
      box.min.y;


    if(
      previousHeadY <=
        bottom + .03 &&
      nextHeadY >=
        bottom - .03
    ){

      if(
        ceiling === null ||
        bottom <
        ceiling
      ){

        ceiling =
          bottom;

      }

    }

  }


  return ceiling;

}


function tryMove(
  dx,
  dz
){

  if(
    !localPlayer
  ){

    return;

  }


  const nextX =
    localPlayer.x +
    dx;


  const nextZ =
    localPlayer.z +
    dz;


  if(
    isPositionFree(
      nextX,
      localPlayer.y,
      localPlayer.z
    )
  ){

    localPlayer.x =
      nextX;

  }


  if(
    isPositionFree(
      localPlayer.x,
      localPlayer.y,
      nextZ
    )
  ){

    localPlayer.z =
      nextZ;

  }

}


function updateMovement(
  delta
){

  if(
    !localPlayer ||
    !localPlayer.alive
  ){

    return;

  }


  let moveX =
    keys.d -
    keys.a;

  let moveZ =
    keys.s -
    keys.w;


  if(
    mobileInput.x !== 0 ||
    mobileInput.y !== 0
  ){

    moveX =
      mobileInput.x;

    moveZ =
      mobileInput.y;

  }


  const length =
    Math.hypot(
      moveX,
      moveZ
    );


  if(
    length >
    1
  ){

    moveX /=
      length;

    moveZ /=
      length;

  }


  if(
    length >
    .05
  ){

    const forwardX =
      Math.sin(
        cameraState.yaw
      );

    const forwardZ =
      -Math.cos(
        cameraState.yaw
      );

    const rightX =
      Math.cos(
        cameraState.yaw
      );

    const rightZ =
      Math.sin(
        cameraState.yaw
      );


    const worldX =
      (
        rightX *
        moveX +
        forwardX *
        -moveZ
      ) *
      physics.moveSpeed *
      delta;


    const worldZ =
      (
        rightZ *
        moveX +
        forwardZ *
        -moveZ
      ) *
      physics.moveSpeed *
      delta;


    tryMove(
      worldX,
      worldZ
    );

    markActivity();

  }


  const previousY =
    localPlayer.y;


  const previousFeetY =
    previousY -
    PLAYER_HEIGHT;


  velocityY +=
    physics.gravity *
    delta;


  const nextY =
    previousY +
    velocityY *
    delta;


  const nextFeetY =
    nextY -
    PLAYER_HEIGHT;


  if(
    velocityY <=
    0
  ){

    const landingTop =
      getLandingTop(
        localPlayer.x,
        localPlayer.z,
        previousFeetY,
        nextFeetY
      );


    if(
      landingTop !== null
    ){

      localPlayer.y =
        landingTop +
        PLAYER_HEIGHT;

      velocityY =
        0;

      grounded =
        true;

    }else{

      localPlayer.y =
        nextY;

      grounded =
        false;

    }

  }else{

    const previousHeadY =
      previousY +
      .35;

    const nextHeadY =
      nextY +
      .35;

    const ceilingBottom =
      getCeilingBottom(
        localPlayer.x,
        localPlayer.z,
        previousHeadY,
        nextHeadY
      );


    if(
      ceilingBottom !==
      null
    ){

      localPlayer.y =
        ceilingBottom -
        .35;

      velocityY =
        0;

    }else{

      localPlayer.y =
        nextY;

    }

    grounded =
      false;

  }


  if(
    localPlayer.y <
    -10
  ){

    localPlayer.y =
      PLAYER_HEIGHT;

    localPlayer.x =
      0;

    localPlayer.z =
      0;

    velocityY =
      0;

    grounded =
      true;

  }


  setCameraFromPlayer();

}


function jump(){

  if(
    !localPlayer ||
    !localPlayer.alive ||
    !grounded
  ){

    return;

  }


  velocityY =
    physics.jumpPower;

  grounded =
    false;

  markActivity();

}


function getGrabTarget(){

  if(
    !localPlayer
  ){

    return null;

  }


  const feetY =
    localPlayer.y -
    PLAYER_HEIGHT;


  const boxes =
    getColliderBoxes();


  let best =
    null;


  for(
    let i = 1;
    i < boxes.length;
    i++
  ){

    const box =
      boxes[i];


    const horizontal =
      horizontalOverlaps(
        box,
        localPlayer.x,
        localPlayer.z
      );


    if(
      !horizontal
    ){

      continue;

    }


    const top =
      box.max.y;


    const distance =
      Math.abs(
        top -
        feetY
      );


    if(
      distance >
      GRAB_DISTANCE
    ){

      continue;

    }


    if(
      top >=
      localPlayer.y
    ){

      continue;

    }


    if(
      !best ||
      distance <
      best.distance
    ){

      best = {

        box,

        distance,

        top

      };

    }

  }


  return best;

}


function canGrab(){

  if(
    grounded
  ){

    return false;

  }


  return Boolean(
    getGrabTarget()
  );

}


function updateGrabUI(){

  if(
    grounded
  ){

    jumpButton.textContent =
      "JUMP";

    jumpButton.classList.remove(
      "grabInactive",
      "grabActive"
    );

    return;

  }


  jumpButton.textContent =
    "GRAB";


  if(
    canGrab()
  ){

    jumpButton.classList.add(
      "grabActive"
    );

    jumpButton.classList.remove(
      "grabInactive"
    );

  }else{

    jumpButton.classList.add(
      "grabInactive"
    );

    jumpButton.classList.remove(
      "grabActive"
    );

  }

}


function startGrab(){

  const target =
    getGrabTarget();


  if(
    !target ||
    !localPlayer
  ){

    return;

  }


  grabAnimation = {

    start:
      performance.now(),

    end:
      performance.now() +
      GRAB_TIME,

    targetY:
      target.top +
      PLAYER_HEIGHT

  };


  velocityY =
    0;

  grounded =
    false;

  markActivity();

}


function updateGrabAnimation(
  time
){

  updateGrabUI();


  if(
    !grabAnimation ||
    !localPlayer
  ){

    return;

  }


  const progress =
    clamp(
      (
        time -
        grabAnimation.start
      ) /
      (
        grabAnimation.end -
        grabAnimation.start
      ),
      0,
      1
    );


  localPlayer.y =
    THREE.MathUtils.lerp(
      localPlayer.y,
      grabAnimation.targetY,
      .28
    );


  if(
    progress >=
    1
  ){

    localPlayer.y =
      grabAnimation.targetY;

    velocityY =
      0;

    grounded =
      true;

    grabAnimation =
      null;

    updateGrabUI();

  }

}

){

  killMessage.style.opacity =

  );

}


function createBullet(
  origin,
  direction,
  ownerUid
){

  const geometry =
    new THREE.SphereGeometry(
      .09,
      8,
      8
    );


  const material =
    new THREE.MeshBasicMaterial({

      color:
        0xffe36e

    });


  const mesh =
    new THREE.Mesh(
      geometry,
      material
    );


  mesh.position.copy(
    origin
  );


  scene.add(
    mesh
  );


  const id =
    ++bulletIdCounter;


  bullets.set(
    id,
    {

      mesh,

      direction:
        direction.clone()
          .normalize(),

      ownerUid,

      created:
        performance.now(),

      lastPosition:
        origin.clone()

    }
  );

}


function removeBullet(
  id
){

  const bullet =
    bullets.get(
      id
    );

  if(
    !bullet
  ){

    return;

  }


  scene.remove(
    bullet.mesh
  );


  if(
    bullet.mesh.geometry
  ){

    bullet.mesh.geometry.dispose();

  }


  if(
    bullet.mesh.material
  ){

    bullet.mesh.material.dispose();

  }


  bullets.delete(
    id
  );

}


function updateBullets(
  delta,
  now
){

  for(
    const [
      id,
      bullet
    ]
    of bullets
  ){

    const previous =
      bullet.mesh.position.clone();


    const distance =
      BULLET_SPEED ===
      Infinity
        ? 0
        : BULLET_SPEED *
          delta;


    bullet.mesh.position.add(

      bullet.direction
        .clone()
        .multiplyScalar(
          distance
        )

    );


    bullet.lastPosition =
      previous;


    if(
      BULLET_SPEED !==
        Infinity &&
      now -
      bullet.created >
        BULLET_LIFETIME
    ){

      removeBullet(
        id
      );

      continue;

    }


    const bulletLine =
      new THREE.Line3(

        previous,

        bullet.mesh.position

      );


    let hitSomething =
      false;


    for(
      const collider
      of colliders
    ){

      const box =
        new THREE.Box3()
          .setFromObject(
            collider
          );


      const closest =
        new THREE.Vector3();


      box.clampPoint(
        bullet.mesh.position,
        closest
      );


      if(
        closest.distanceTo(
          bullet.mesh.position
        ) <
        .18
      ){

        hitSomething =
          true;

        break;

      }

    }


    if(
      hitSomething
    ){

      removeBullet(
        id
      );

      continue;

    }


    for(
      const [
        uid,
        mesh
      ]
      of playerMeshes
    ){

      if(
        uid ===
        bullet.ownerUid ||
        !mesh.visible
      ){

        continue;

      }


      const box =
        new THREE.Box3()
          .setFromObject(
            mesh
          );


      if(
        box.distanceToPoint(
          bullet.mesh.position
        ) <
        .15
      ){

        hitSomething =
          true;


        if(
          Date.now() >=
          spawnProtectionUntil
        ){

          applyBulletDamage(
            uid,
            bullet.ownerUid
          );

        }


        break;

      }

    }


    if(
      hitSomething
    ){

      removeBullet(
        id
      );

    }

  }

}


async function applyBulletDamage(
  targetUid,
  shooterUid
){

  if(
    !matchRef ||
    gameEnded
  ){

    return;

  }


  try{

    let wasKill =
      false;


    await runTransaction(
      db,
      async transaction => {

        const snap =
          await transaction.get(
            matchRef
          );


        if(
          !snap.exists()
        ){

          return;

        }


        const data =
          snap.data();


        if(
          data.status !==
          "active"
        ){

          return;

        }


        const players =
          {
            ...(data.players || {})
          };


        const shooter =
          players[
            shooterUid
          ];


        const target =
          players[
            targetUid
          ];


        if(
          !shooter ||
          !target
        ){

          return;

        }


        if(
          !shooter.alive ||
          !target.alive
        ){

          return;

        }


        if(
          Date.now() <
          Number(
            data.startedProtectionUntil ||
            0
          )
        ){

          return;

        }


        const settings =
          normalizeMatchSettings(
            data.settings
          );


        target.hp =
          Math.max(

            0,

            Number(
              target.hp ||
              0
            ) -
            BULLET_DAMAGE

          );


        target.lastDamageAt =
          Date.now();


        if(
          target.hp <=
          0
        ){

          target.hp =
            0;

          target.alive =
            false;


          shooter.kills =
            Number(
              shooter.kills ||
              0
            ) +
            1;


          wasKill =
            shooterUid ===
            currentUser.uid;


          const alivePlayers =
            Object.values(
              players
            )
              .filter(
                player =>
                  player.alive
              );


          if(
            alivePlayers.length <=
            1
          ){

            transaction.update(
              matchRef,
              {

                players,

                status:
                  "ended",

                winnerUid:
                  alivePlayers.length ===
                  1
                    ? alivePlayers[0].uid
                    : null

              }
            );

            return;

          }

        }


        transaction.update(
          matchRef,
          {

            players

          }
        );

      }
    );


    if(
      wasKill
    ){

      localKills++;

      showKillMessage(
        "ELIMINATED"
      );

    }


  }catch(error){

    console.error(
      "bullet damage error",
      error
    );

  }

}


function getFireProgress(){

  const now =
    performance.now();


  if(
    now >=
    fireCooldownEnd
  ){

    return 100;

  }


  const remaining =
    fireCooldownEnd -
    now;


  return clamp(

    100 -
      (
        remaining /
        FIRE_INTERVAL
      ) *
      100,

    0,

    100

  );

}

}


function shoot(){

  if(
    !localPlayer ||
    !localPlayer.alive ||
    !matchHasStarted ||
    gameEnded
  ){

    return;

  }


  if(
    Date.now() <
    spawnProtectionUntil
  ){

    markActivity();

    return;

  }


  markActivity();


  const now =
    performance.now();


  if(
    now <
    fireCooldownEnd
  ){

    return;

  }


  fireCooldownEnd =
    now +
    FIRE_INTERVAL;


  raycaster.setFromCamera(

    new THREE.Vector2(
      0,
      0
    ),

    camera

  );


  const origin =
    camera.position.clone();


  const direction =
    raycaster.ray.direction
      .clone()
      .normalize();


  if(
    BULLET_SPEED ===
    Infinity
  ){

    const candidates =
      [];


    for(
      const [
        uid,
        mesh
      ]
      of playerMeshes
    ){

      if(
        uid !==
        currentUser.uid &&
        mesh.visible
      ){

        candidates.push(
          mesh
        );

      }

    }


    const playerHits =
      raycaster.intersectObjects(
        candidates,
        true
      );


    const terrainHits =
      raycaster.intersectObjects(
        colliders,
        true
      );


    const firstPlayer =
      playerHits.length
        ? playerHits[0]
        : null;


    const firstTerrain =
      terrainHits.length
        ? terrainHits[0]
        : null;


    if(
      firstPlayer &&
      (
        !firstTerrain ||
        firstPlayer.distance <
        firstTerrain.distance
      )
    ){

      let object =
        firstPlayer.object;

      let hitUid =
        null;


      while(
        object &&
        !hitUid
      ){

        if(
          object.userData &&
          object.userData.uid
        ){

          hitUid =
            object.userData.uid;

        }

        object =
          object.parent;

      }


      if(
        hitUid &&
        Date.now() >=
        spawnProtectionUntil
      ){

        applyBulletDamage(
          hitUid,
          currentUser.uid
        );

      }

    }

  }else{

    createBullet(
      origin,
      direction,
      currentUser.uid
    );

  }


  updateFireUI();

}

async function checkMatchCleanup(
  data
){

  if(
    !matchRef ||
    !data
  ){

    return;

  }


  const now =
    Date.now();


  if(
    now -
    lastCleanupCheck <
    CLEANUP_INTERVAL
  ){

    return;

  }


  lastCleanupCheck =
    now;


  let createdMillis =
    0;


  if(
    data.createdAt &&
    typeof data.createdAt.toMillis ===
      "function"
  ){

    createdMillis =
      data.createdAt.toMillis();

  }else if(
    typeof data.createdAt ===
    "number"
  ){

    createdMillis =
      data.createdAt;

  }


  if(
    createdMillis > 0 &&
    now -
    createdMillis >=
      MAX_MATCH_AGE
  ){

    try{

      await deleteDoc(
        matchRef
      );

    }catch(error){

      console.error(
        "age cleanup error",
        error
      );

    }

    return;

  }


  const players =
    Object.values(
      data.players || {}
    );


  if(
    players.length ===
    0
  ){

    return;

  }


  const allInactive =
    players.every(
      player => {

        const last =
          typeof player.lastActiveAt ===
          "number"
            ? player.lastActiveAt
            : 0;


        return (
          last > 0 &&
          now -
          last >=
          INACTIVE_MATCH_TIME
        );

      }
    );


  if(
    allInactive
  ){

    try{

      await deleteDoc(
        matchRef
      );

    }catch(error){

      console.error(
        "inactive cleanup error",
        error
      );

    }

  }

}

function handleMouseMove(
  event
){

  if(
    !gameStarted ||
    gameEnded ||
    matchMedia(
      "(pointer:coarse)"
    ).matches
  ){

    return;

  if(
    !document.pointerLockElement
  ){

    return;

  }


  cameraState.yaw -=
    event.movementX *
    .0025;


  cameraState.pitch -=
    event.movementY *
    .0025;


  cameraState.pitch =
    clamp(
      cameraState.pitch,
      -1.45,
      1.45
    );


  markActivity();

}

function setupMobileInput(){

  let joystickPointerId =
    null;


  function updateJoystick(
    clientX,
    clientY
  ){

    const rect =
      joystickZone.getBoundingClientRect();


    const centerX =
      rect.left +
      rect.width / 2;


    const centerY =
      rect.top +
      rect.height / 2;


    let dx =
      clientX -
      centerX;


    let dy =
      clientY -
      centerY;


    const max =
      53;


    const distance =
      Math.hypot(
        dx,
        dy
      );


    if(
      distance >
      max
    ){

      dx =
        dx /
        distance *
        max;

      dy =
        dy /
        distance *
        max;

    }


    mobileInput.x =
      dx /
      max;


    mobileInput.y =
      dy /
      max;


    joystickKnob.style.transform =
      `translate(${dx}px,${dy}px)`;

  }


  joystickZone.addEventListener(
    "pointerdown",
    event => {

      joystickPointerId =
        event.pointerId;


      joystickZone.setPointerCapture(
        event.pointerId
      );


      updateJoystick(
        event.clientX,
        event.clientY
      );

    }
  );


  joystickZone.addEventListener(
    "pointermove",
    event => {

      if(
        event.pointerId ===
        joystickPointerId
      ){

        updateJoystick(
          event.clientX,
          event.clientY
        );

      }

    }
  );


  const endJoystick =
    event => {

      if(
        event.pointerId !==
        joystickPointerId
      ){

        return;

      }


      joystickPointerId =
        null;


      mobileInput.x =
        0;

      mobileInput.y =
        0;


      joystickKnob.style.transform =
        "translate(0,0)";

    };


  joystickZone.addEventListener(
    "pointerup",
    endJoystick
  );


  joystickZone.addEventListener(
    "pointercancel",
    endJoystick
  );


  let lookPointerId =
    null;

  let lastLookX =
    0;

  let lastLookY =
    0;


  lookZone.addEventListener(
    "pointerdown",
    event => {

      lookPointerId =
        event.pointerId;


      lastLookX =
        event.clientX;


      lastLookY =
        event.clientY;


      lookZone.setPointerCapture(
        event.pointerId
      );

    }
  );


  lookZone.addEventListener(
    "pointermove",
    event => {

      if(
        event.pointerId !==
        lookPointerId
      ){

        return;

      }


      const dx =
        event.clientX -
        lastLookX;


      const dy =
        event.clientY -
        lastLookY;


      lastLookX =
        event.clientX;


      lastLookY =
        event.clientY;


      if(
        dx !== 0 ||
        dy !== 0
      ){

        markActivity();

      }


      cameraState.yaw -=
        dx *
        .006;


      cameraState.pitch -=
        dy *
        .006;


      cameraState.pitch =
        clamp(
          cameraState.pitch,
          -1.45,
          1.45
        );

    }
  );


  const endLook =
    event => {

      if(
        event.pointerId ===
        lookPointerId
      ){

        lookPointerId =
          null;

      }

    };


  lookZone.addEventListener(
    "pointerup",
    endLook
  );


  lookZone.addEventListener(
    "pointercancel",
    endLook
  );


  fireButton.addEventListener(
    "pointerdown",
    event => {

      event.preventDefault();

      fireHolding =
        true;

      mobileInput.firing =
        true;

      shoot();

    }
  );


  fireButton.addEventListener(
    "pointerup",
    event => {

      event.preventDefault();

      fireHolding =
        false;

      mobileInput.firing =
        false;

    }
  );


  fireButton.addEventListener(
    "pointercancel",
    () => {

      fireHolding =
        false;

      mobileInput.firing =
        false;

    }
  );


  jumpButton.addEventListener(
    "pointerdown",
    event => {

      event.preventDefault();

      if(
        !grounded &&
        canGrab()
      ){

        startGrab();

      }else if(
        grounded
      ){

        jump();

      }

    }
  );

}

function gameLoop(
  time
){

  const delta =
    Math.min(

      (
        time -
        lastFrameTime
      ) /
      1000,

      .05

    );


  lastFrameTime =
    time;


  updateStartProgress();

  updateProtectionUI();

  updateFireUI();


  if(
    gameStarted &&
    !gameEnded
  ){

    updateMovement(
      delta
    );


    updateGrabAnimation(
      time
    );


    if(
      mobileInput.firing
    ){

      shoot();

    }


    updateBullets(
      delta,
      time
    );


    regenLocalPlayer();

    syncLocalPlayer();

  }


  if(
    renderer &&
    scene &&
    camera
  ){

    renderer.render(
      scene,
      camera
    );

  }


  requestAnimationFrame(
    gameLoop
  );

}

            cameraState.yaw,

          pitch:
            cameraState.pitch,

          lastActiveAt:
            localPlayer.lastActiveAt ||
            Date.now()

        }

      }

    );

  }catch(error){

    console.error(
      "sync error",
      error
    );

  }

}


matchButton.addEventListener(
  "click",
  handleMatchButton
);


shareCodeButton.addEventListener(
  "click",
  shareMatchCode
);


leaveRoomButton.addEventListener(
  "click",
  handleReturn
);


settingsButton.addEventListener(
  "click",
  openSettings
);


closeSettingsButton.addEventListener(
  "click",
  closeSettings
);


saveSettingsButton.addEventListener(
  "click",
  saveMatchSettings
);


terrainAmountSelect.addEventListener(
  "change",
  updateSettingsDisabledState
);


hpRegenSelect.addEventListener(
  "change",
  updateSettingsDisabledState
);


settingsModal.addEventListener(
  "pointerdown",
  event => {

    if(
      event.target ===
      settingsModal
    ){

      closeSettings();

    }

  }
);


returnButton.addEventListener(
  "click",
  handleReturn
);


matchCodeInput.addEventListener(
  "input",
  () => {

    matchCodeInput.value =
      matchCodeInput.value
        .replace(
          /[^A-Za-z0-9]/g,
          ""
        )
        .toUpperCase();

  }
);


matchCodeInput.addEventListener(
  "keydown",
  event => {

    if(
      event.key ===
      "Enter"
    ){

      handleMatchButton();

    }

  }
);


setupDesktopInput();

setupMobileInput();

setupStartButton();


window.addEventListener(
  "beforeunload",
  () => {

    if(
      isHost &&
      matchRef
    ){

      deleteDoc(
        matchRef
      ).catch(
        () => {}
      );

    }

  }
);


try{

  await ensureAuth();

  statusEl.textContent =
    "接続準備OK";

}catch(error){

  console.error(
    error
  );

  statusEl.textContent =
    "Firebase接続失敗：" +
    getFriendlyError(
      error
    );

}

</script>

</body>
</html>
