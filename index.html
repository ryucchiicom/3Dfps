.menuBox{

.title{

}

.subtitle{

.input{

  color:#fff;
  font-size:18px;
  outline:none;
  text-transform:uppercase;
  margin-bottom:12px;
}

.button{

  height:48px;
  border:0;
  border-radius:12px;
  color:#fff;

  font-size:17px;
  font-weight:700;
  margin-top:8px;

}

.button.secondary{

}

.button:active{

}

.info{

#status{

}

#gameUI{

#topBar{

  right:12px;

  gap:8px;
}

#healthBox,#matchBox{

}

#health{

}

#healthBar{

  height:100%;

}

#crosshair{

  left:50%;
  top:50%;

  height:18px;
  margin-left:-9px;
  margin-top:-9px;
}

#crosshair::before,
#crosshair::after{

  position:absolute;

}

#crosshair::before{

  height:18px;
  left:8px;
  top:0;
}

#crosshair::after{

  height:2px;
  left:0;
  top:8px;

#killMessage{

function randomCode(length = 6){

  const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let result = "";

  for(
    let i = 0;
    i < length;
    i++
  ){

    result +=
      chars[
        Math.floor(
          Math.random() *
          chars.length
        )
      ];

  }

  return result;

}


function randomSpawn(){

  const margin = 7;

  return {

    x:
      Math.random() *
      (ARENA_SIZE - margin * 2) -
      (ARENA_SIZE / 2 - margin),

    y:
      PLAYER_HEIGHT,

    z:
      Math.random() *
      (ARENA_SIZE - margin * 2) -
      (ARENA_SIZE / 2 - margin)

  };

}


function playerColor(uid){

  let hash = 0;

  for(
    let i = 0;
    i < uid.length;
    i++
  ){

    hash =
      (
        (hash << 5) -
        hash
      ) +
      uid.charCodeAt(i);

    hash |= 0;

  }

  const hue =
    Math.abs(hash) % 360;

  return new THREE.Color(
    `hsl(${hue},70%,58%)`
  );

}


function createPlayerMesh(uid){

  const group =
    new THREE.Group();

  const bodyGeometry =
    new THREE.CapsuleGeometry(
      .45,
      .8,
      6,
      12
    );

  const bodyMaterial =
    new THREE.MeshStandardMaterial({

      color:
        playerColor(uid),

      roughness:.8

    });

  const body =
    new THREE.Mesh(
      bodyGeometry,
      bodyMaterial
    );

  body.position.y =
    .8;

  group.add(body);


  const headGeometry =
    new THREE.SphereGeometry(
      .32,
      16,
      12
    );

  const headMaterial =
    new THREE.MeshStandardMaterial({

      color:
        0xe7c5a5

    });

  const head =
    new THREE.Mesh(
      headGeometry,
      headMaterial
    );

  head.position.y =
    1.55;

  group.add(head);


  const gunGeometry =
    new THREE.BoxGeometry(
      .12,
      .12,
      .75
    );

  const gunMaterial =
    new THREE.MeshStandardMaterial({

      color:
        0x202020,

      metalness:.8,

      roughness:.3

    });

  const gun =
    new THREE.Mesh(
      gunGeometry,
      gunMaterial
    );

  gun.position.set(
    .35,
    1.15,
    -.42
  );

  group.add(gun);


  group.userData.uid =
    uid;

  scene.add(group);

  return group;

}


function removeRemoteMesh(uid){

  const mesh =
    playerMeshes.get(uid);

  if(!mesh){
    return;
  }

  scene.remove(mesh);

  mesh.traverse(
    object => {

      if(object.geometry){

        object.geometry.dispose();

      }

      if(object.material){

        if(
          Array.isArray(
            object.material
          )
        ){

          object.material.forEach(
            material =>
              material.dispose()
          );

        }else{

          object.material.dispose();

        }

      }

    }
  );

  playerMeshes.delete(uid);

}

      ARENA_SIZE,
      1,
      ARENA_SIZE
    );

  const floorMaterial =
    new THREE.MeshStandardMaterial({

      color:
        0x41474d,

      roughness:

    });

  const floor =
    new THREE.Mesh(
      floorGeometry,
      floorMaterial
    );

  floor.position.y =
    -.5;

  floor.receiveShadow =
    true;

  scene.add(floor);

  colliders.push(floor);


  const wallMaterial =

      color:

    });


  createBox(
    ARENA_SIZE,
    6,

    0,

    17,
    obstacleMaterial

  /*
    少し高い足場
  */

  createBox(
    6,
    3.5,

function createBox(
  width,
  height,
  depth,
  x,
  y,
  z,
  material
){

  const geometry =
    new THREE.BoxGeometry(
      width,
      height,
      depth
    );

  const mesh =
    new THREE.Mesh(
      geometry,
      material
    );

  mesh.position.set(
    x,
    y,
    z
  );

  mesh.castShadow =
    true;

  mesh.receiveShadow =
    true;

  scene.add(mesh);

  colliders.push(mesh);

  return mesh;

}

  if(

    !renderer

  camera.aspect =
    window.innerWidth /

  renderer.setSize(

  );

}


async function ensureAuth(){

  if(currentUser){
    return currentUser;
  }

  return new Promise(
    (resolve,reject) => {

      const unsubscribe =
        onAuthStateChanged(
          auth,
          async user => {

            if(user){

              currentUser =
                user;

              unsubscribe();

              resolve(user);

              return;

            }

            try{

              await signInAnonymously(
                auth
              );

            }catch(error){

              unsubscribe();

              reject(error);

            }

          },

          error => {

            unsubscribe();

            reject(error);

          }
        );

    }
  );

}


async function createMatch(
  requestedCode = ""
){

  statusEl.textContent =
    "試合を作成中…";

  try{

    const user =
      await ensureAuth();

    let code =
      requestedCode
        .trim()
        .toUpperCase();


    if(!code){

      for(
        let attempt = 0;
        attempt < 20;
        attempt++
      ){

        const candidate =
          randomCode();

        const ref =
          doc(
            db,
            "matches",
            candidate
          );

        const existing =
          await getDoc(ref);

        if(
          !existing.exists()
        ){

          code =
            candidate;

          break;

        }

      }

    }


    if(!code){

      throw new Error(
        "試合コードを作成できませんでした。"
      );

    }


    const spawn =
      randomSpawn();


    const player = {

      uid:
        user.uid,

      name:
        "Player-" +
        user.uid.slice(-4),

      x:
        spawn.x,

      y:
        spawn.y,

      z:
        spawn.z,

      yaw:
        0,

      pitch:
        0,

      hp:
        MAX_HP,

      kills:
        0,

      alive:
        true,

      lastActiveAt:
        Date.now()

    };


    const ref =
      doc(
        db,
        "matches",
        code
      );


    await runTransaction(
      db,
      async transaction => {

        const snap =
          await transaction.get(
            ref
          );

        if(
          snap.exists()
        ){

          throw new Error(
            "ALREADY_EXISTS"
          );

        }


        transaction.set(
          ref,
          {

            hostUid:
              user.uid,

            status:
              "waiting",

            winnerUid:
              null,

            createdAt:
              serverTimestamp(),

            startedAt:
              null,

            players:{

              [user.uid]:
                player

            }

          }
        );

      }
    );


    isHost =
      true;


    await startMatch(
      code
    );


  }catch(error){

    console.error(error);

    if(
      error?.message ===
      "ALREADY_EXISTS"
    ){

      await joinMatch(
        requestedCode
      );

      return;

    }

    statusEl.textContent =
      "作成失敗：" +
      getFriendlyError(error);

  }

}


async function joinMatch(
  codeOverride = ""
){

  const code =
    (
      codeOverride ||
      matchCodeInput.value
    )
      .trim()
      .toUpperCase();


  if(!code){

    await createMatch("");

    return;

  }


  statusEl.textContent =
    "試合を確認中…";


  try{

    const user =
      await ensureAuth();


    const ref =
      doc(
        db,
        "matches",
        code
      );


    const existing =
      await getDoc(ref);


    /*
      部屋が存在しなければ、
      参加失敗ではなく
      そのコードで作成する。
    */

    if(
      !existing.exists()
    ){

      await createMatch(
        code
      );

      return;

    }


    await runTransaction(
      db,
      async transaction => {

        const snap =
          await transaction.get(
            ref
          );


        if(!snap.exists()){

          throw new Error(
            "NOT_FOUND"
          );

        }


        const data =
          snap.data();


        if(
          data.status ===
          "ended"
        ){

          throw new Error(
            "ENDED"
          );

        }


        const players =
          {
            ...(data.players || {})
          };


        if(
          players[user.uid]
        ){

          return;

        }


        const count =
          Object.keys(
            players
          ).length;


        if(count >= 8){

          throw new Error(
            "FULL"
          );

        }


        const spawn =
          randomSpawn();


        players[user.uid] = {

          uid:
            user.uid,

          name:
            "Player-" +
            user.uid.slice(-4),

          x:
            spawn.x,

          y:
            spawn.y,

          z:
            spawn.z,

          yaw:
            0,

          pitch:
            0,

          hp:
            MAX_HP,

          kills:
            0,

          alive:
            true,

          lastActiveAt:
            Date.now()

        };


        transaction.update(
          ref,
          {

            players

          }
        );

      }
    );


    isHost =
      false;


    await startMatch(
      code
    );


  }catch(error){

    console.error(error);

    const message =
      error?.message || "";


    if(
      message ===
      "NOT_FOUND"
    ){

      await createMatch(
        code
      );

    }else if(
      message ===
      "FULL"
    ){

      statusEl.textContent =
        "その試合は満員だよ。";

    }else if(
      message ===
      "ENDED"
    ){

      statusEl.textContent =
        "その試合はもう終了してるよ。";

    }else{

      statusEl.textContent =
        "参加/作成失敗：" +
        getFriendlyError(error);

    }

  }

}

function getFriendlyError(error){

  if(!error){

    return "不明なエラー";

  }


  if(
    error.code ===
    "permission-denied"
  ){

    return "Firestoreの権限設定を確認して！";

  }


  if(
    error.code ===
    "auth/operation-not-allowed"
  ){

    return "Firebaseで匿名ログインを有効にして！";

  }


  return (
    error.message ||
    String(error)
  );

}


async function startMatch(
  code
){

  currentMatchId =
    code;

  matchRef =
    doc(
      db,
      "matches",
      code
    );


  menu.style.display =
    "none";

  gameUI.style.display =
    "block";

  gameOver.style.display =
    "none";


  roomText.textContent =
    code;


  if(!scene){

    setupScene();

  }


  gameEnded =
    false;

  gameStarted =
    true;

  matchHasStarted =
    false;


  velocityY =
    0;

  lastActivityAt =
    Date.now();

  lastCleanupCheck =
    0;


  await loadLocalPlayer();


  if(unsubscribeMatch){

    unsubscribeMatch();

    unsubscribeMatch =
      null;

  }


  unsubscribeMatch =
    onSnapshot(
      matchRef,

      async snapshot => {

        if(
          !snapshot.exists()
        ){

          if(gameStarted){

            leaveCurrentMatch();

          }

          return;

        }


        const data =
          snapshot.data();

        checkMatchCleanup(
          data
        );


        const players =
          data.players ||
          {};


        const count =
          Object.keys(
            players
          ).length;


        playerCountText.textContent =
          String(count);


        updateRemotePlayers(
          players
        );


        updateScoreboard(
          players
        );


        const me =
          players[
            currentUser.uid
          ];


        if(me){

          localPlayer =
            {

              ...localPlayer,

              ...me

            };


          localKills =
            me.kills || 0;


          updateLocalHUD();

        }


        const wasStarted =
          matchHasStarted;


        if(
          data.status ===
          "active"
        ){

          matchHasStarted =
            true;

        }


        if(
          data.status ===
          "active" &&
          !wasStarted
        ){

          const startedAt =
            data.startedAt;


          spawnProtectionUntil =
            Date.now() +
            START_PROTECTION_TIME;


          if(startedAt){

            const serverMillis =
              startedAt.toMillis
                ? startedAt.toMillis()
                : Date.now();


            spawnProtectionUntil =
              serverMillis +
              START_PROTECTION_TIME;

          }

        }


        updateStartUI(
          data
        );


        if(
          data.status ===
          "ended" &&
          !gameEnded
        ){

          const winner =
            data.winnerUid;


          const winnerName =
            winner &&
            players[winner] &&
            players[winner].name
              ? players[winner].name
              : "勝者";


          finishLocalGame(

            winner ===
            currentUser.uid

              ? "YOU WIN!"

              : winnerName +
                " の勝利！"

          );


          setTimeout(
            () => {

              if(
                matchRef
              ){

                deleteMatch();

              }

            },
            1200
          );

        }

      },

      error => {

        console.error(
          error
        );

        if(gameStarted){

          finishLocalGame(
            "通信エラーが発生しました。"
          );

        }

      }
    );


  if(!gameLoopStarted){

    gameLoopStarted =
      true;

    requestAnimationFrame(
      gameLoop
    );

  }

}


async function loadLocalPlayer(){

  const snap =
    await getDoc(
      matchRef
    );


  if(
    !snap.exists()
  ){

    throw new Error(
      "試合が見つかりません。"
    );

  }


  const data =
    snap.data();


  const player =
    data.players?.[
      currentUser.uid
    ];


  if(!player){

    throw new Error(
      "プレイヤーデータがありません。"
    );

  }


  localPlayer =
    {
      ...player,
      lastActiveAt:
        Number(
          player.lastActiveAt ||
          Date.now()
        )
    };


  lastActivityAt =
    localPlayer.lastActiveAt;


  localKills =
    player.kills || 0;


  cameraState.yaw =
    Number(
      player.yaw || 0
    );


  cameraState.pitch =
    Number(
      player.pitch || 0
    );


  setCameraFromPlayer();

  updateLocalHUD();

  updateStartUI(
    data
  );

}

function updateRemotePlayers(
  players
){

  const seen =
    new Set();


  for(
    const [
      uid,
      player
    ]
    of Object.entries(players)
  ){

    if(
      uid ===
      currentUser.uid
    ){

      continue;

    }


    seen.add(uid);


    let mesh =
      playerMeshes.get(uid);


    if(!mesh){

      mesh =
        createPlayerMesh(
          uid
        );

      playerMeshes.set(
        uid,
        mesh
      );

    }


    mesh.position.set(

      player.x,

      Math.max(
        0,
        player.y -
        PLAYER_HEIGHT
      ),

      player.z

    );


    mesh.rotation.y =
      Number(
        player.yaw || 0
      );


    mesh.visible =
      Boolean(
        player.alive
      );

  }


  for(
    const uid
    of playerMeshes.keys()
  ){

    if(
      !seen.has(uid)
    ){

      removeRemoteMesh(
        uid
      );

    }

  }

}

function clamp(
  value,
  min,
  max
){

  return Math.max(
    min,
    Math.min(
      max,
      value
    )
  );

}


function markActivity(){

  lastActivityAt =
    Date.now();

  if(
    localPlayer

  }

}


function getColliderBoxes(){

  return colliders
    .filter(
      collider =>
        collider &&
        collider.geometry
    )
    .map(
      collider =>
        new THREE.Box3()
          .setFromObject(collider)
    );

}


function horizontalOverlaps(
  box,
  x,
  z,
  radius = .38
){

  return (

    x + radius >
      box.min.x &&

    x - radius <
      box.max.x &&

    z + radius >
      box.min.z &&

    z - radius <
      box.max.z

  );

}


function isPositionFree(
  x,
  y,
  z
){

  const radius =
    .38;


  if(

    x <
      -ARENA_SIZE / 2 +
      radius ||

    x >
      ARENA_SIZE / 2 -
      radius ||

    z <
      -ARENA_SIZE / 2 +
      radius ||

    z >
      ARENA_SIZE / 2 -
      radius

  ){

    return false;

  }


  const feetY =
    y -
    PLAYER_HEIGHT;

  const headY =
    y +
    .35;


  for(
    const collider
    of colliders
  ){

    if(
      !collider ||
      !collider.geometry ||
      collider ===
        colliders[0]
    ){

      continue;

    }


    const box =
      new THREE.Box3()
        .setFromObject(
          collider
        );


    if(
      !horizontalOverlaps(
        box,
        x,
        z,
        radius
      )
    ){

      continue;

    }


    /*
      足場の上に立っている場合は、
      足場そのものを横移動の障害物にしない。
    */

    if(
      box.max.y <=
      feetY + .06
    ){

      continue;

    }


    if(
      box.min.y >=
      headY - .06
    ){

      continue;

    }


    return false;

  }


  return true;

}


function getLandingTop(
  x,
  z,
  previousFeetY,
  nextFeetY
){

  let bestTop =
    null;


  /*
    床の上面は y=0。
  */

  if(
    previousFeetY >= -.05 &&
    nextFeetY <= .05
  ){

    bestTop =
      0;

  }


  for(
    const collider
    of colliders
  ){

    if(
      !collider ||
      !collider.geometry ||
      collider ===
        colliders[0]
    ){

      continue;

    }


    const box =
      new THREE.Box3()
        .setFromObject(
          collider
        );


    if(
      !horizontalOverlaps(
        box,
        x,
        z,
        .36
      )
    ){

      continue;

    }


    const top =
      box.max.y;


    if(
      previousFeetY >=
        top - .08 &&

      nextFeetY <=
        top + .08
    ){

      if(
        bestTop === null ||
        top > bestTop
      ){

        bestTop =
          top;

      }

    }

  }


  return bestTop;

}


function getCeilingBottom(
  x,
  z,
  previousHeadY,
  nextHeadY
){

  let bestBottom =
    null;


  for(
    const collider
    of colliders
  ){

    if(
      !collider ||
      !collider.geometry ||
      collider ===
        colliders[0]
    ){

      continue;

    }


    const box =
      new THREE.Box3()
        .setFromObject(
          collider
        );


    if(
      !horizontalOverlaps(
        box,
        x,
        z,
        .36
      )
    ){

      continue;

    }


    const bottom =
      box.min.y;


    if(
      previousHeadY <=
        bottom + .08 &&

      nextHeadY >=
        bottom - .08
    ){

      if(
        bestBottom === null ||
        bottom < bestBottom
      ){

        bestBottom =
          bottom;

      }

    }

  }


  return bestBottom;

}


function tryMove(
  dx,
  dz
){

  if(
    !localPlayer ||
    !localPlayer.alive ||
    !matchHasStarted
  ){

    return;

  }


  const nextX =
    localPlayer.x +
    dx;


  const nextZ =
    localPlayer.z +
    dz;


  /*
    X/Zを分離して判定することで、
    足場の端で壁に引っかかりにくくする。
  */

  if(
    isPositionFree(
      nextX,
      localPlayer.y,
      localPlayer.z
    )
  ){

    localPlayer.x =
      nextX;

  }


  if(
    isPositionFree(
      localPlayer.x,
      localPlayer.y,
      nextZ
    )
  ){

    localPlayer.z =
      nextZ;

  }

}


function updateMovement(
  delta
){

  if(
    !localPlayer ||
    !localPlayer.alive ||
    !matchHasStarted ||
    grabAnimation
  ){

    return;

  }


  let inputX =
    0;

  let inputZ =
    0;


  if(keys.w)
    inputZ -= 1;

  if(keys.s)
    inputZ += 1;

  if(keys.a)
    inputX -= 1;

  if(keys.d)
    inputX += 1;


  inputX +=
    mobileInput.x;

  inputZ +=
    mobileInput.y;


  const length =
    Math.hypot(
      inputX,
      inputZ
    );


  if(length > 1){

    inputX /=
      length;

    inputZ /=
      length;

  }


  const moving =
    Math.abs(inputX) > .01 ||
    Math.abs(inputZ) > .01;


  if(moving){

    markActivity();


    const speed =
      physics.moveSpeed;


    const amount =
      speed * delta;


    const forwardX =
      -Math.sin(
        cameraState.yaw
      );


    const forwardZ =
      -Math.cos(
        cameraState.yaw
      );


    const rightX =
      Math.cos(
        cameraState.yaw
      );


    const rightZ =
      -Math.sin(
        cameraState.yaw
      );


    const moveX =
      (
        forwardX * -inputZ +
        rightX * inputX
      ) *
      amount;


    const moveZ =
      (
        forwardZ * -inputZ +
        rightZ * inputX
      ) *
      amount;


    tryMove(
      moveX,
      moveZ
    );

  }


  const previousFeetY =
    localPlayer.y -
    PLAYER_HEIGHT;


  const previousHeadY =
    localPlayer.y +
    .35;


  velocityY +=
    physics.gravity *
    delta;


  let nextY =
    localPlayer.y +
    velocityY *
    delta;


  const nextFeetY =
    nextY -
    PLAYER_HEIGHT;


  const nextHeadY =
    nextY +
    .35;


  if(
    velocityY <= 0
  ){

    const landingTop =
      getLandingTop(
        localPlayer.x,
        localPlayer.z,
        previousFeetY,
        nextFeetY
      );


    if(
      landingTop !== null
    ){

      localPlayer.y =
        landingTop +
        PLAYER_HEIGHT;

      velocityY =
        0;

      grounded =
        true;

    }else{

      localPlayer.y =
        nextY;

      grounded =
        false;

    }

  }else{

    const ceilingBottom =
      getCeilingBottom(
        localPlayer.x,
        localPlayer.z,
        previousHeadY,
        nextHeadY
      );


    if(
      ceilingBottom !== null
    ){

      localPlayer.y =
        ceilingBottom -
        .35;

      velocityY =
        0;

    }else{

      localPlayer.y =
        nextY;

    }

    grounded =
      false;

  }


  /*
    落下しすぎた場合の安全処理。
  */

  if(
    localPlayer.y <
    -10
  ){

    localPlayer.y =
      PLAYER_HEIGHT;

    velocityY =
      0;

    grounded =
      true;

  }


  camera.position.set(

    localPlayer.x,

    localPlayer.y + .45,

    localPlayer.z

  );


  camera.rotation.order =
    "YXZ";

  camera.rotation.y =
    cameraState.yaw;

  camera.rotation.x =
    cameraState.pitch;


  updateGrabUI();

}


function jump(){

  if(
    !localPlayer ||
    !localPlayer.alive ||
    !matchHasStarted
  ){

    return;

  }


  /*
    空中ならJUMPボタンがGRABになる。
    条件を満たしていればそのまま掴む。
  */

  if(!grounded){

    if(
      canGrab()
    ){

      startGrab();

    }

    return;

  }


  markActivity();


  velocityY =
    physics.jumpPower;

  grounded =
    false;

}


function getGrabTarget(){

  if(
    !localPlayer ||
    grounded
  ){

    return null;

  }


  const playerX =
    localPlayer.x;

  const playerY =
    localPlayer.y;

  const playerZ =
    localPlayer.z;


  let best =
    null;

  let bestDistance =
    Infinity;


  /*
    足場の上面が
    自分の足元より上、
    しかし頭より下。
  */

  const feetY =
    playerY -
    PLAYER_HEIGHT;

  const headY =
    playerY;


  for(
    const collider
    of colliders
  ){

    if(
      collider ===
      colliders[0]
    ){

      continue;

    }


    const box =
      new THREE.Box3()
        .setFromObject(
          collider
        );


    const insideX =
      playerX >=
        box.min.x -
        GRAB_DISTANCE &&

      playerX <=
        box.max.x +
        GRAB_DISTANCE;


    const insideZ =
      playerZ >=
        box.min.z -
        GRAB_DISTANCE &&

      playerZ <=
        box.max.z +
        GRAB_DISTANCE;


    if(
      !insideX ||
      !insideZ
    ){

      continue;

    }


    const platformTop =
      box.max.y;


    if(
      platformTop <=
      feetY + .05
    ){

      continue;

    }


    if(
      platformTop >=
      headY
    ){

      continue;

    }


    const centerX =
      clamp(
        playerX,
        box.min.x,
        box.max.x
      );


    const centerZ =
      clamp(
        playerZ,
        box.min.z,
        box.max.z
      );


    const distance =
      Math.hypot(

        playerX -
        centerX,

        playerZ -
        centerZ

      );


    if(
      distance >
      GRAB_DISTANCE
    ){

      continue;

    }


    if(
      distance <
      bestDistance
    ){

      bestDistance =
        distance;


      best = {

        box,

        top:
          platformTop,

        x:
          centerX,

        z:
          centerZ

      };

    }

  }


  return best;

}


function canGrab(){

  return Boolean(
    getGrabTarget()
  );

}


function updateGrabUI(){

  if(
    !localPlayer ||
    !matchHasStarted
  ){

    jumpButton.style.opacity =
      "0";

    return;

  }


  jumpButton.style.opacity =
    "";


  if(
    grounded
  ){

    jumpButton.textContent =
      "JUMP";

    jumpButton.classList.remove(
      "grabInactive",
      "grabActive"
    );

    return;

  }


  jumpButton.textContent =
    "GRAB";


  if(
    canGrab()
  ){

    jumpButton.classList.remove(
      "grabInactive"
    );

    jumpButton.classList.add(
      "grabActive"
    );

  }else{

    jumpButton.classList.remove(
      "grabActive"
    );

    jumpButton.classList.add(
      "grabInactive"
    );

  }

}


function startGrab(){

  if(
    grabAnimation ||
    grounded ||
    !localPlayer
  ){

    return;

  }


  const target =
    getGrabTarget();


  if(!target){

    return;

  }


  markActivity();


  grabAnimation = {

    start:
      performance.now(),

    target,

    startX:
      localPlayer.x,

    startY:
      localPlayer.y,

    startZ:
      localPlayer.z

  };


  velocityY =
    0;

}


function updateGrabAnimation(
  now
){

  if(!grabAnimation){

    return;

  }


  const elapsed =
    now -
    grabAnimation.start;


  const progress =
    clamp(
      elapsed /
      GRAB_TIME,
      0,
      1
    );


  const smooth =
    progress *
    progress *
    (
      3 -
      2 * progress
    );


  const target =
    grabAnimation.target;


  localPlayer.x =
    grabAnimation.startX +
    (
      target.x -
      grabAnimation.startX
    ) *
    smooth;


  localPlayer.z =
    grabAnimation.startZ +
    (
      target.z -
      grabAnimation.startZ
    ) *
    smooth;


  localPlayer.y =
    target.top +
    PLAYER_HEIGHT +
    .02;


  camera.position.set(

    localPlayer.x,

    localPlayer.y + .45,

    localPlayer.z

  );


  if(
    progress >= 1
  ){

    grabAnimation =
      null;

    grounded =
      true;

    velocityY =
      0;

    updateGrabUI();

  }

}

function createBullet(
  origin,
  direction,
  ownerUid
){

  const geometry =
    new THREE.SphereGeometry(
      .09,
      8,
      8
    );


  const material =
    new THREE.MeshBasicMaterial({

      color:
        0xffe36e

    });


  const mesh =
    new THREE.Mesh(
      geometry,
      material
    );


  mesh.position.copy(
    origin
  );


  scene.add(mesh);


  const id =
    ++bulletIdCounter;


  bullets.set(
    id,
    {

      mesh,

      direction:
        direction.clone()
          .normalize(),

      ownerUid,

      created:
        performance.now(),

      lastPosition:
        origin.clone()

    }
  );

}


function removeBullet(
  id
){

  const bullet =
    bullets.get(id);


  if(!bullet){

    return;

  }


  scene.remove(
    bullet.mesh
  );


  bullet.mesh.geometry.dispose();

  bullet.mesh.material.dispose();


  bullets.delete(
    id
  );

}


function updateBullets(
  delta,
  now
){

  for(
    const [
      id,
      bullet
    ]
    of bullets
  ){

    const previous =
      bullet.mesh.position.clone();


    const distance =
      BULLET_SPEED *
      delta;


    bullet.mesh.position.add(

      bullet.direction
        .clone()
        .multiplyScalar(
          distance
        )

    );


    bullet.lastPosition =
      previous;


    if(
      now -
      bullet.created >
      BULLET_LIFETIME
    ){

      removeBullet(
        id
      );

      continue;

    }


    const bulletLine =
      new THREE.Line3(

        previous,

        bullet.mesh.position

      );


    let hitSomething =
      false;


    /*
      壁・足場との衝突
    */

    for(
      const collider
      of colliders
    ){

      const box =
        new THREE.Box3()
          .setFromObject(
            collider
          );


      const closest =
        new THREE.Vector3();


      box.clampPoint(
        bullet.mesh.position,
        closest
      );


      if(
        closest.distanceTo(
          bullet.mesh.position
        ) < .18
      ){

        hitSomething =
          true;

        break;

      }

    }


    if(hitSomething){

      removeBullet(
        id
      );

      continue;

    }


    /*
      プレイヤーとの衝突
    */

    for(
      const [
        uid,
        mesh
      ]
      of playerMeshes
    ){

      if(
        uid ===
        bullet.ownerUid ||
        !mesh.visible
      ){

        continue;

      }


      const box =
        new THREE.Box3()
          .setFromObject(
            mesh
          );


      if(
        box.distanceToPoint(
          bullet.mesh.position
        ) < .15
      ){

        hitSomething =
          true;


        if(
          Date.now() >=
          spawnProtectionUntil
        ){

          applyBulletDamage(
            uid,
            bullet.ownerUid
          );

        }


        break;

      }

    }


    if(hitSomething){

      removeBullet(
        id
      );

    }

  }

}


async function applyBulletDamage(
  targetUid,
  shooterUid
){

  if(
    !matchRef ||
    gameEnded
  ){

    return;

  }


  try{

    let wasKill =
      false;


    await runTransaction(
      db,
      async transaction => {

        const snap =
          await transaction.get(
            matchRef
          );


        if(
          !snap.exists()
        ){

          return;

        }


        const data =
          snap.data();


        if(
          data.status !==
          "active"
        ){

          return;

        }


        const players =
          {
            ...(data.players || {})
          };


        const shooter =
          players[shooterUid];


        const target =
          players[targetUid];


        if(
          !shooter ||
          !target
        ){

          return;

        }


        if(
          !shooter.alive ||
          !target.alive
        ){

          return;

        }


        if(
          Date.now() <
          Number(
            data.startedProtectionUntil ||
            0
          )
        ){

          return;

        }


        target.hp =
          Math.max(

            0,

            Number(
              target.hp || 0
            ) -
            BULLET_DAMAGE

          );


        if(
          target.hp <= 0
        ){

          target.hp =
            0;

          target.alive =
            false;


          shooter.kills =
            Number(
              shooter.kills || 0
            ) + 1;


          wasKill =
            shooterUid ===
            currentUser.uid;


          const alivePlayers =
            Object.values(
              players
            ).filter(
              player =>
                player.alive
            );


          if(
            alivePlayers.length <= 1
          ){

            transaction.update(
              matchRef,
              {

                players,

                status:
                  "ended",

                winnerUid:
                  alivePlayers.length === 1
                    ? alivePlayers[0].uid
                    : null

              }
            );

            return;

          }

        }


        transaction.update(
          matchRef,
          {

            players

          }
        );

      }
    );


    if(wasKill){

      localKills++;

      showKillMessage(
        "ELIMINATED"
      );

    }


  }catch(error){

    console.error(
      "bullet damage error",
      error
    );

  }

}


function getFireProgress(){

  const now =
    performance.now();


  if(
    now >=
    fireCooldownEnd
  ){

    return 100;

  }


  const remaining =
    fireCooldownEnd -
    now;


  return clamp(

    100 -
      (
        remaining /
        FIRE_INTERVAL
      ) *
      100,

    0,

    100

  );

}


function updateFireUI(){

  const progress =
    getFireProgress();


  fireButton.style.setProperty(
    "--fireProgress",
    `${progress}%`
  );

}


function shoot(){

  if(
    !localPlayer ||
    !localPlayer.alive ||
    !matchHasStarted ||
    gameEnded
  ){

    return;

  }


  if(
    Date.now() <
    spawnProtectionUntil
  ){

    markActivity();

    return;

  }


  markActivity();


  const now =
    performance.now();


  if(
    now <
    fireCooldownEnd
  ){

    return;

  }


  fireCooldownEnd =
    now +
    FIRE_INTERVAL;


  raycaster.setFromCamera(

    new THREE.Vector2(
      0,
      0
    ),

    camera

  );


  const origin =
    camera.position.clone();


  const direction =
    raycaster.ray.direction
      .clone()
      .normalize();


  createBullet(
    origin,
    direction,
    currentUser.uid
  );


  updateFireUI();

}


function startMatchByHost(){

  if(
    !isHost ||
    !matchRef ||
    matchHasStarted
  ){

    return;

  }


  runTransaction(
    db,
    async transaction => {

      const snap =
        await transaction.get(
          matchRef
        );


      if(
        !snap.exists()
      ){

        return;

      }


      const data =
        snap.data();


      if(
        data.status !==
        "waiting"
      ){

        return;

      }


      const players =
        {
          ...(data.players || {})
        };


      for(
        const player
        of Object.values(players)
      ){

        const spawn =
          randomSpawn();


        player.x =
          spawn.x;

        player.y =
          spawn.y;

        player.z =
          spawn.z;

        player.hp =
          MAX_HP;

        player.alive =
          true;

        player.kills =
          0;

        player.lastActiveAt =
          Date.now();

      }


      transaction.update(
        matchRef,
        {

          players,

          status:
            "active",

          winnerUid:
            null,

          startedAt:
            serverTimestamp(),

          startedProtectionUntil:
            Date.now() +
            START_PROTECTION_TIME

        }
      );

    }
  ).catch(
    error => {

      console.error(
        "start error",
        error
      );

    }
  );

}

}


async function checkMatchCleanup(
  data
){

  if(
    !matchRef ||
    !data
  ){

    return;

  }


  const now =
    Date.now();


  if(
    now -
    lastCleanupCheck <
    CLEANUP_INTERVAL
  ){

    return;

  }


  lastCleanupCheck =
    now;


  let createdMillis =
    0;


  if(
    data.createdAt &&
    typeof data.createdAt.toMillis ===
      "function"
  ){

    createdMillis =
      data.createdAt.toMillis();

  }else if(
    typeof data.createdAt ===
    "number"
  ){

    createdMillis =
      data.createdAt;

  }


  if(
    createdMillis > 0 &&
    now -
      createdMillis >=
      MAX_MATCH_AGE
  ){

    try{

      await deleteDoc(
        matchRef
      );

    }catch(error){

      console.error(
        "age cleanup error",
        error
      );

    }

    return;

  }


  const players =
    Object.values(
      data.players || {}
    );


  if(
    players.length === 0
  ){

    return;

  }


  const allInactive =
    players.every(
      player => {

        const last =
          typeof player.lastActiveAt ===
          "number"

            ? player.lastActiveAt

            : 0;


        return (

          last > 0 &&

          now -
            last >=
            INACTIVE_MATCH_TIME

        );

      }
    );


  if(
    allInactive
  ){

    try{

      await deleteDoc(
        matchRef
      );

    }catch(error){

      console.error(
        "inactive cleanup error",
        error
      );

    }

  }

}

function handleMouseMove(
  event
){

  if(
    !gameStarted ||
    gameEnded ||
    matchMedia(
      "(pointer:coarse)"
    ).matches
  ){

    return;

  }


  if(
    document.pointerLockElement !==
    renderer.domElement
  ){

    return;

  }


  if(
    Math.abs(event.movementX) > 0 ||
    Math.abs(event.movementY) > 0
  ){

    markActivity();

  }


  cameraState.yaw -=
    event.movementX *
    .0023;


  cameraState.pitch -=
    event.movementY *
    .0023;


  cameraState.pitch =
    clamp(
      cameraState.pitch,
      -1.45,
      1.45
    );

}


function requestPointerLock(){

  if(
    matchMedia(
      "(pointer:coarse)"
    ).matches
  ){

    return;

  }


  if(
    renderer &&
    renderer.domElement
      .requestPointerLock
  ){

    renderer.domElement
      .requestPointerLock();

  }

}

function setupMobileInput(){

  let joystickPointerId =
    null;


  function updateJoystick(
    clientX,
    clientY
  ){

    const rect =
      joystickZone
        .getBoundingClientRect();


    const centerX =
      rect.left +
      rect.width / 2;


    const centerY =
      rect.top +
      rect.height / 2;


    let dx =
      clientX -
      centerX;


    let dy =
      clientY -
      centerY;


    const max =
      53;


    const distance =
      Math.hypot(
        dx,
        dy
      );


    if(
      distance >
      max
    ){

      dx =
        dx /
        distance *
        max;

      dy =
        dy /
        distance *
        max;

    }


    mobileInput.x =
      dx / max;

    mobileInput.y =
      dy / max;


    joystickKnob.style.transform =
      `translate(${dx}px,${dy}px)`;

  }


  joystickZone.addEventListener(
    "pointerdown",
    event => {

      event.preventDefault();

      markActivity();


      joystickPointerId =
        event.pointerId;


      joystickZone.setPointerCapture(
        event.pointerId
      );


      updateJoystick(
        event.clientX,
        event.clientY
      );

    }
  );


  joystickZone.addEventListener(
    "pointermove",
    event => {

      if(
        event.pointerId ===
        joystickPointerId
      ){

        updateJoystick(
          event.clientX,
          event.clientY
        );

      }

    }
  );


  const endJoystick =
    event => {

      if(
        event.pointerId !==
        joystickPointerId
      ){

        return;

      }


      joystickPointerId =
        null;


      mobileInput.x =
        0;

      mobileInput.y =
        0;


      joystickKnob.style.transform =
        "translate(0,0)";

    };


  joystickZone.addEventListener(
    "pointerup",
    endJoystick
  );


  joystickZone.addEventListener(
    "pointercancel",
    endJoystick
  );


  let lookPointerId =
    null;

  let lastLookX =
    0;

  let lastLookY =
    0;


  lookZone.addEventListener(
    "pointerdown",
    event => {

      event.preventDefault();

      markActivity();


      lookPointerId =
        event.pointerId;


      lastLookX =
        event.clientX;


      lastLookY =
        event.clientY;


      lookZone.setPointerCapture(
        event.pointerId
      );

    }
  );


  lookZone.addEventListener(
    "pointermove",
    event => {

      if(
        event.pointerId !==
        lookPointerId
      ){

        return;

      }


      const dx =
        event.clientX -
        lastLookX;


      const dy =
        event.clientY -
        lastLookY;


      lastLookX =
        event.clientX;


      lastLookY =
        event.clientY;


      if(
        dx !== 0 ||
        dy !== 0
      ){

        markActivity();

      }


      cameraState.yaw -=
        dx * .006;


      cameraState.pitch -=
        dy * .006;


      cameraState.pitch =
        clamp(
          cameraState.pitch,
          -1.45,
          1.45
        );

    }
  );


  const endLook =
    event => {

      if(
        event.pointerId ===
        lookPointerId
      ){

        lookPointerId =
          null;

      }

    };


  lookZone.addEventListener(
    "pointerup",
    endLook
  );


  lookZone.addEventListener(
    "pointercancel",
    endLook
  );


  fireButton.addEventListener(
    "pointerdown",
    event => {

      event.preventDefault();


      fireHolding =
        true;

      mobileInput.firing =
        true;

      shoot();

    }
  );


  fireButton.addEventListener(
    "pointerup",
    event => {

      event.preventDefault();


      fireHolding =
        false;

      mobileInput.firing =
        false;

    }
  );


  fireButton.addEventListener(
    "pointercancel",
    () => {

      fireHolding =
        false;

      mobileInput.firing =
        false;

    }
  );


  jumpButton.addEventListener(
    "pointerdown",
    event => {

      event.preventDefault();


      if(
        !grounded &&
        canGrab()
      ){

        startGrab();

      }else if(
        grounded
      ){

        jump();

      }

    }
  );

}


function setupStartButton(){

  const startDown =
    event => {

      event.preventDefault();


      if(
        !isHost ||
        matchHasStarted
      ){

        return;

      }


      markActivity();


      startHolding =
        true;

      startHoldStart =
        performance.now();

    };


  const startUp =
    event => {

      event.preventDefault();


      startHolding =
        false;


      startButton.style.setProperty(
        "--progress",
        "0%"
      );

    };


  startButton.addEventListener(
    "pointerdown",
    startDown
  );


  startButton.addEventListener(
    "pointerup",
    startUp
  );


  startButton.addEventListener(
    "pointercancel",
    startUp
  );

}


function setupRendererInput(){

  if(!renderer){

    return;

  }


  renderer.domElement.addEventListener(
    "mousedown",
    event => {

      if(
        event.button ===
        0
      ){

        requestPointerLock();

        shoot();

      }

    }
  );

}


function gameLoop(
  time
){

  const delta =
    Math.min(

      (
        time -
        lastFrameTime
      ) / 1000,

      .05

    );


  lastFrameTime =
    time;


  updateStartProgress();

  updateFireUI();


  if(
    gameStarted &&
    !gameEnded
  ){

    updateMovement(
      delta
    );


    updateGrabAnimation(
      time
    );


    if(
      mobileInput.firing
    ){

      shoot();

    }


    updateBullets(
      delta,
      time
    );


    syncLocalPlayer();

  }


  if(
    renderer &&
    scene &&
    camera
  ){

    renderer.render(
      scene,
      camera
    );

  }


  requestAnimationFrame(
    gameLoop
  );

}


async function syncLocalPlayer(){

  if(
    !matchRef ||
    !localPlayer ||
    gameEnded
  ){

    return;

  }


  const now =
    performance.now();


  if(
    now -
    lastNetworkUpdate <
    80
  ){

    return;

  }


  lastNetworkUpdate =
    now;


  try{

    await updateDoc(

      matchRef,

      {

        [`players.${currentUser.uid}`]:{

          uid:
            currentUser.uid,

          name:
            localPlayer.name,

          x:
            localPlayer.x,

          y:
            localPlayer.y,

          z:
            localPlayer.z,

          yaw:
            cameraState.yaw,

          pitch:
            cameraState.pitch,

          hp:
            localPlayer.hp,

          kills:
            localKills,

          alive:
            localPlayer.alive,

          lastActiveAt:
            localPlayer.lastActiveAt ||
            lastActivityAt

        }

      }

    );

  }catch(error){

    console.error(
      "sync error",
      error
    );

  }

}


matchButton.addEventListener(
  "click",
  handleMatchButton
);


returnButton.addEventListener(
  "click",
  handleReturn
);


matchCodeInput.addEventListener(
  "input",
  () => {

    matchCodeInput.value =
      matchCodeInput.value
        .replace(
          /[^A-Za-z0-9]/g,
          ""
        )
        .toUpperCase();

  }
);


matchCodeInput.addEventListener(
  "keydown",
  event => {

    if(
      event.key ===
      "Enter"
    ){

      handleMatchButton();

    }

  }
);


setupDesktopInput();

setupMobileInput();

setupStartButton();


window.addEventListener(
  "beforeunload",
  () => {

    if(
      isHost &&
      matchRef
    ){

      deleteDoc(
        matchRef
      ).catch(
        () => {}
      );

    }

  }
);


try{

  await ensureAuth();

  statusEl.textContent =
    "接続準備OK";

}catch(error){

  console.error(
    error
  );

  statusEl.textContent =
    "Firebase接続失敗：" +
    getFriendlyError(error);

}

</script>
