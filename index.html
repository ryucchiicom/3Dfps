<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>3D FPS</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  touch-action:none;
}

canvas{
  display:block;
}

#menu{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(circle at 50% 30%,#26384f 0%,#111822 40%,#05070a 100%);
  color:white;
}

.menuBox{
  width:min(92vw,480px);
  padding:28px;
  border-radius:22px;
  background:rgba(15,20,28,.88);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 20px 80px rgba(0,0,0,.45);
  backdrop-filter:blur(18px);
}

.title{
  margin:0 0 8px;
  font-size:34px;
  font-weight:800;
  text-align:center;
}

.subtitle{
  text-align:center;
  opacity:.72;
  margin-bottom:24px;
}

.input{
  width:100%;
  height:48px;
  padding:0 16px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:12px;
  background:rgba(255,255,255,.07);
  color:#fff;
  font-size:18px;
  outline:none;
  text-transform:uppercase;
  margin-bottom:12px;
}

.button{
  width:100%;
  height:48px;
  border:0;
  border-radius:12px;
  color:#fff;
  background:#1976ff;
  font-size:17px;
  font-weight:700;
  margin-top:8px;
  cursor:pointer;
}

.button.secondary{
  background:#2a3039;
}

.button:active{
  transform:scale(.98);
}

.info{
  margin-top:18px;
  font-size:13px;
  line-height:1.6;
  color:#c5ccd5;
}

#status{
  min-height:22px;
  margin-top:12px;
  text-align:center;
  color:#ffce66;
  font-size:14px;
}

#gameUI{
  position:fixed;
  inset:0;
  z-index:20;
  pointer-events:none;
  display:none;
  color:#fff;
}

#topBar{
  position:absolute;
  top:12px;
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:8px;
}

#healthBox,#matchBox{
  padding:9px 12px;
  border-radius:12px;
  background:rgba(0,0,0,.45);
  backdrop-filter:blur(8px);
  font-size:14px;
}

#health{
  margin-top:5px;
  width:170px;
  height:10px;
  overflow:hidden;
  border-radius:99px;
  background:#252525;
}

#healthBar{
  width:100%;
  height:100%;
  background:#48e27d;
  transition:width .15s;
}

#crosshair{
  position:absolute;
  left:50%;
  top:50%;
  width:18px;
  height:18px;
  margin-left:-9px;
  margin-top:-9px;
}

#crosshair::before,
#crosshair::after{
  content:"";
  position:absolute;
  background:#fff;
  box-shadow:0 0 3px #000;
}

#crosshair::before{
  width:2px;
  height:18px;
  left:8px;
  top:0;
}

#crosshair::after{
  width:18px;
  height:2px;
  left:0;
  top:8px;
}

#killMessage{
  position:absolute;
  left:50%;
  top:42%;
  transform:translate(-50%,-50%);
  font-size:28px;
  font-weight:900;
  text-shadow:0 3px 15px #000;
  opacity:0;
  transition:opacity .15s;
}

#scoreBoard{
  position:absolute;
  right:12px;
  top:70px;
  min-width:150px;
  max-width:220px;
  padding:10px;
  border-radius:12px;
  background:rgba(0,0,0,.45);
  backdrop-filter:blur(8px);
  font-size:12px;
}

.scoreRow{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin:3px 0;
}

.scoreAlive{
  color:#6dff8f;
}

.scoreDead{
  color:#ff7070;
}


#gameOver{
  position:fixed;
  inset:0;
  z-index:50;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.68);
  backdrop-filter:blur(10px);
  color:white;
}

.gameOverBox{
  width:min(88vw,430px);
  padding:28px;
  border-radius:22px;
  text-align:center;
  background:rgba(18,22,29,.94);
}

.gameOverTitle{
  font-size:38px;
  font-weight:900;
  margin-bottom:8px;
}

.gameOverText{
  font-size:18px;
  opacity:.85;
  margin-bottom:20px;
}

#mobileControls{
  display:none;
  position:absolute;
  inset:0;
  pointer-events:none;
}

#joystickZone{
  position:absolute;
  left:0;
  bottom:0;
  width:55%;
  height:70%;
  border-radius:0;
  pointer-events:auto;
  touch-action:none;
}

#joystickBase{
  position:absolute;
  left:50%;
  top:50%;
  width:118px;
  height:118px;
  margin:0;
  transform:translate(-50%,-50%);
  border-radius:50%;
  border:2px solid rgba(255,255,255,.23);
  background:rgba(255,255,255,.06);
}

#joystickKnob{
  position:absolute;
  left:50%;
  top:50%;
  width:54px;
  height:54px;
  margin-left:-27px;
  margin-top:-27px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.16);
}

#lookZone{
  position:absolute;
  right:0;
  top:0;
  width:55%;
  height:70%;
  pointer-events:auto;
}

.mobileButton{
  position:absolute;
  border:1px solid rgba(255,255,255,.25);
  background:rgba(20,20,20,.45);
  color:#fff;
  border-radius:50%;
  backdrop-filter:blur(8px);
  pointer-events:auto;
  font-weight:800;
  display:flex;
  justify-content:center;
  align-items:center;
}

#fireButton{
  width:88px;
  height:88px;
  right:24px;
  bottom:32px;
  background:rgba(220,50,50,.28);
  overflow:hidden;
}

#fireButton::before{
  content:"";
  position:absolute;
  inset:4px;
  border-radius:50%;
  background:
    conic-gradient(
      rgba(255,80,80,.9) var(--fireProgress,100%),
      rgba(255,255,255,.08) var(--fireProgress,100%)
    );
  z-index:0;
}

#fireButton::after{
  content:"";
  position:absolute;
  inset:12px;
  border-radius:50%;
  background:rgba(25,20,20,.9);
  z-index:1;
}

#fireButton span{
  position:relative;
  z-index:2;
}

#jumpButton{
  width:64px;
  height:64px;
  right:125px;
  bottom:44px;
}


#desktopHint{
  position:absolute;
  bottom:14px;
  left:50%;
  transform:translateX(-50%);
  padding:7px 11px;
  border-radius:8px;
  background:rgba(0,0,0,.38);
  font-size:12px;
  opacity:.65;
}

.hidden{
  display:none !important;
}

@media (pointer:coarse){

  #mobileControls{
    display:block;
  }

  #desktopHint{
    display:none;
  }

}

#roomScreen{
  position:fixed;
  inset:0;
  z-index:90;
  display:none;
  justify-content:center;
  align-items:center;
  padding:20px;
  color:#fff;
  background:
    radial-gradient(circle at 50% 20%,#243b5a 0%,#111827 38%,#05070a 100%);
  overflow:auto;
  pointer-events:auto;
}

.roomPanel{
  width:min(94vw,620px);
  max-height:92vh;
  overflow:auto;
  padding:24px;
  border-radius:24px;
  background:rgba(12,17,25,.88);
  border:1px solid rgba(255,255,255,.13);
  box-shadow:0 24px 90px rgba(0,0,0,.48);
  backdrop-filter:blur(18px);
}

.roomHeader{
  text-align:center;
  margin-bottom:18px;
}

.roomHeaderTitle{
  font-size:28px;
  font-weight:900;
  margin-bottom:6px;
}

.roomCode{
  font-size:24px;
  font-weight:900;
  letter-spacing:4px;
  color:#72b7ff;
}

.roomPlayerList{
  margin:14px 0;
  padding:10px;
  border-radius:14px;
  background:rgba(255,255,255,.055);
  min-height:80px;
}

.roomPlayerRow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:8px 10px;
  border-radius:9px;
  font-size:14px;
}

.roomPlayerRow:nth-child(odd){
  background:rgba(255,255,255,.035);
}

.roomPlayerIndex{
  width:28px;
  opacity:.55;
  flex:none;
}

.roomPlayerName{
  flex:1;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.roomHost{
  font-size:11px;
  opacity:.62;
}

.roomActions{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.roomActions .button{
  margin-top:0;
  height:44px;
}

#roomStartWrap{
  margin-top:14px;
  text-align:center;
}

#roomStartHint{
  min-height:22px;
  margin-bottom:8px;
  font-size:14px;
  font-weight:800;
  opacity:.8;
}

#roomStartButton{
  position:relative;
  width:110px;
  height:110px;
  margin:0 auto;
  padding:0;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.35);
  background:rgba(0,0,0,.42);
  color:#fff;
  font-size:18px;
  font-weight:900;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  pointer-events:auto;
  touch-action:none;
}

#roomStartButton::before{
  content:"";
  position:absolute;
  inset:5px;
  border-radius:50%;
  background:
    conic-gradient(
      #36a3ff var(--progress,0%),
      rgba(255,255,255,.10) var(--progress,0%)
    );
  z-index:0;
}

#roomStartButton::after{
  content:"";
  position:absolute;
  inset:13px;
  border-radius:50%;
  background:rgba(12,17,23,.94);
  z-index:1;
}

#roomStartButton span{
  position:relative;
  z-index:2;
}

.roomSettings{
  margin-top:16px;
  padding:14px;
  border-radius:16px;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.08);
}

.roomSettingsTitle{
  font-size:17px;
  font-weight:900;
  margin-bottom:10px;
}

.settingRow{
  display:grid;
  grid-template-columns:minmax(130px,1fr) minmax(150px,1.15fr);
  gap:10px;
  align-items:center;
  padding:7px 0;
}

.settingLabel{
  font-size:13px;
  font-weight:800;
}

.settingControl{
  width:100%;
  min-width:0;
  height:38px;
  padding:0 9px;
  border-radius:9px;
  border:1px solid rgba(255,255,255,.13);
  background:rgba(0,0,0,.3);
  color:#fff;
  outline:none;
  font-weight:700;
}

.settingControl:disabled,
.settingDisabled{
  opacity:.28;
  filter:saturate(.25);
}

.settingNumber{
  display:flex;
  gap:6px;
  align-items:center;
}

.settingNumber input{
  flex:1;
}

.settingUnit{
  font-size:12px;
  opacity:.6;
}

#settingsLockedText{
  margin-top:8px;
  font-size:12px;
  opacity:.55;
  text-align:center;
}

#shareStatus{
  min-height:18px;
  margin-top:7px;
  text-align:center;
  font-size:12px;
  opacity:.72;
}

#spawnProtection{
  position:absolute;
  left:50%;
  top:24%;
  transform:translate(-50%,-50%);
  display:none;
  padding:12px 18px;
  border-radius:14px;
  border:2px solid rgba(95,200,255,.72);
  background:rgba(15,100,170,.34);
  box-shadow:0 0 28px rgba(70,180,255,.5);
  color:#c9f3ff;
  font-size:17px;
  font-weight:900;
  letter-spacing:1px;
  text-align:center;
  text-shadow:0 2px 10px #000;
  pointer-events:none;
}

#spawnProtectionBar{
  width:180px;
  height:5px;
  margin-top:7px;
  overflow:hidden;
  border-radius:99px;
  background:rgba(255,255,255,.15);
}

#spawnProtectionBar::before{
  content:"";
  display:block;
  width:100%;
  height:100%;
  transform-origin:left center;
  transform:scaleX(var(--protectionProgress,1));
  background:#72d7ff;
}

#jumpButton.grabInactive{
  opacity:.28;
  background:rgba(20,20,20,.25);
}

#jumpButton.grabActive{
  opacity:1;
  background:rgba(35,130,255,.55);
}

.mobileButton,
#roomStartButton,
.button{
  touch-action:manipulation;
  -webkit-user-select:none;
  user-select:none;
}

#roomStartButton{
  pointer-events:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  margin:0 auto;
  touch-action:none;
}

@media (max-width:600px){
  .roomPanel{
    padding:18px;
  }

  .roomActions{
    grid-template-columns:1fr;
  }

  .settingRow{
    grid-template-columns:1fr;
    gap:5px;
  }
}

</style>
</head>

<body>

<div id="menu">

  <div class="menuBox">

    <h1 class="title">3D FPS</h1>

    <div class="subtitle" id="versionText">
      1.0.0
    </div>

    <input
      id="matchCodeInput"
      class="input"
      maxlength="8"
      placeholder="試合コード"
      autocomplete="off"
      spellcheck="false"
    >

    <button
      id="matchButton"
      class="button"
    >
      試合を作成/参加
    </button>

    <div id="status"></div>

    <div class="info">
      PC：WASDで移動、マウスで視点、クリックで射撃、Spaceでジャンプ<br>
      スマホ：左スティックで移動、右側スワイプで視点、FIRE・JUMP・GRAB
    </div>

  </div>

</div>


<div id="roomScreen">

  <div class="roomPanel">

    <div class="roomHeader">
      <div class="roomHeaderTitle">待機ルーム</div>
      <div class="roomCode" id="roomCodeLarge">----</div>
    </div>

    <div id="roomPlayerList" class="roomPlayerList"></div>

    <div class="roomActions">
      <button id="shareCodeButton" class="button secondary">コードを共有</button>
      <button id="settingsButton" class="button secondary">設定</button>
      <button id="leaveRoomButton" class="button secondary">部屋から退出</button>
    </div>

    <div id="shareStatus"></div>

    <div id="roomSettings" class="roomSettings" style="display:none">

      <div class="roomSettingsTitle">設定</div>

      <div class="settingRow">
        <div class="settingLabel">地形の量</div>
        <select id="terrainAmount" class="settingControl">
          <option value="many">多</option>
          <option value="medium" selected>中</option>
          <option value="few">少</option>
          <option value="none">なし</option>
        </select>
      </div>

      <div class="settingRow" id="terrainHeightRow">
        <div class="settingLabel" id="terrainHeightLabel">地形の高低差</div>
        <select id="terrainHeight" class="settingControl">
          <option value="high">高</option>
          <option value="medium" selected>中</option>
          <option value="low">低</option>
        </select>
      </div>

      <div class="settingRow">
        <div class="settingLabel">弾速</div>
        <select id="bulletSpeedSetting" class="settingControl">
          <option value="infinite">∞</option>
          <option value="fast">速</option>
          <option value="medium" selected>中</option>
          <option value="slow">遅</option>
        </select>
      </div>

      <div class="settingRow">
        <div class="settingLabel">HP最大値</div>
        <div class="settingNumber">
          <input id="maxHpSetting" class="settingControl" type="number" min="1" step="1" value="100">
        </div>
      </div>

      <div class="settingRow" id="regenRow">
        <div class="settingLabel" id="regenLabel">HP自然回復</div>
        <select id="regenSetting" class="settingControl">
          <option value="fast">速</option>
          <option value="medium">中</option>
          <option value="slow">遅</option>
          <option value="none" selected>なし</option>
        </select>
      </div>

      <div class="settingRow" id="regenLockRow">
        <div class="settingLabel" id="regenLockLabel">ダメージからの自然回復ロック</div>
        <div class="settingNumber">
          <input id="regenLockSetting" class="settingControl" type="number" min="0" step="0.1" value="0">
          <span class="settingUnit">秒</span>
        </div>
      </div>

      <div id="settingsLockedText"></div>

    </div>

    <div id="roomStartWrap">
      <div id="roomStartHint">部屋主がSTARTを長押しして開始</div>
      <button id="roomStartButton">
        <span>START</span>
      </button>
    </div>

  </div>

</div>

<div id="gameUI">

  <div id="topBar">

    <div id="healthBox">

      <div id="healthText">
        HP 100
      </div>

      <div id="health">

        <div id="healthBar"></div>

      </div>

    </div>

    <div id="matchBox">

      <div>
        ROOM:
        <span id="roomText">----</span>
      </div>

      <div>
        PLAYER:
        <span id="playerCountText">0</span>
      </div>

      <div>
        KILLS:
        <span id="killsText">0</span>
      </div>

    </div>

  </div>

  <div id="scoreBoard"></div>

  <div id="crosshair"></div>

  <div id="killMessage"></div>

  <div id="spawnProtection">
    <div>🛡 無敵中 3.0秒</div>
    <div id="spawnProtectionBar"></div>
  </div>

  <div id="desktopHint">
    WASD / Mouse / Click / Space
  </div>

  <div id="mobileControls">

    <div id="joystickZone">

      <div id="joystickBase">

        <div id="joystickKnob"></div>

      </div>

    </div>

    <div id="lookZone"></div>

    <div
      id="jumpButton"
      class="mobileButton"
    >
      JUMP
    </div>

    <div
      id="fireButton"
      class="mobileButton"
    >
      <span>FIRE</span>
    </div>

  </div>

</div>

<div id="gameOver">

  <div class="gameOverBox">

    <div
      id="gameOverTitle"
      class="gameOverTitle"
    >
      試合終了
    </div>

    <div
      id="gameOverText"
      class="gameOverText"
    >
      ---
    </div>

    <button
      id="returnButton"
      class="button"
    >
      メニューへ戻る
    </button>

  </div>

</div>

function randomCode(length = 6){

  const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let result = "";

  for(
    let i = 0;
    i < length;
    i++
  ){

    result +=
      chars[
        Math.floor(
          Math.random() *
          chars.length
        )
      ];

  }

  return result;

}


function randomSpawn(){

  const margin = 7;

  return {

    x:
      Math.random() *
      (ARENA_SIZE - margin * 2) -
      (ARENA_SIZE / 2 - margin),

    y:
      PLAYER_HEIGHT,

    z:
      Math.random() *
      (ARENA_SIZE - margin * 2) -
      (ARENA_SIZE / 2 - margin)

  };

}


function playerColor(uid){

  let hash = 0;

  for(
    let i = 0;
    i < uid.length;
    i++
  ){

    hash =
      (
        (hash << 5) -
        hash
      ) +
      uid.charCodeAt(i);

    hash |= 0;

  }

  const hue =
    Math.abs(hash) % 360;

  return new THREE.Color(
    `hsl(${hue},70%,58%)`
  );

}

function removeRemoteMesh(uid){

  const mesh =
    playerMeshes.get(uid);

  if(!mesh){
    return;
  }

  scene.remove(mesh);

  mesh.traverse(
    object => {

      if(object.geometry){

        object.geometry.dispose();

      }

      if(object.material){

        if(
          Array.isArray(
            object.material
          )
        ){

          object.material.forEach(
            material =>
              material.dispose()
          );

        }else{

          object.material.dispose();

        }

      }

    }
  );

  playerMeshes.delete(uid);

}

function createArena(){

  const floorGeometry =
    new THREE.BoxGeometry(
      ARENA_SIZE,
      1,
      ARENA_SIZE
    );

  const floorMaterial =
    new THREE.MeshStandardMaterial({
      color:
        0x41474d,
      roughness:
        .92
    });

  const floor =
    new THREE.Mesh(
      floorGeometry,
      floorMaterial
    );

  floor.position.y =
    -.5;

  floor.receiveShadow =
    true;

  scene.add(floor);
  colliders.push(floor);

  const wallMaterial =
    new THREE.MeshStandardMaterial({
      color:
        0x252b31
    });

  createBox(
    ARENA_SIZE,
    6,
    1,
    0,
    3,
    -ARENA_SIZE / 2,
    wallMaterial
  );

  createBox(
    ARENA_SIZE,
    6,
    1,
    0,
    3,
    ARENA_SIZE / 2,
    wallMaterial
  );

  createBox(
    1,
    6,
    ARENA_SIZE,
    -ARENA_SIZE / 2,
    3,
    0,
    wallMaterial
  );

  createBox(
    1,
    6,
    ARENA_SIZE,
    ARENA_SIZE / 2,
    3,
    0,
    wallMaterial
  );

  const terrainCount =
    terrainCounts();

  if(
    terrainCount <= 0
  ){
    return;
  }

  const heightScale =
    terrainHeightScale();

  const obstacleMaterial =
    new THREE.MeshStandardMaterial({
      color:
        0x69727b,
      roughness:
        .7
    });

  const fixedPlatforms = [

    [8,1.5,8,-15,.75,-10],
    [11,2,5,13,1,-8],
    [6,2.5,6,17,1.25,14],
    [10,1.5,5,-15,.75,15],
    [5,2,12,0,1,17],
    [6,3.5,6,-15,1.75,-1],
    [7,4,7,4,2,-14],
    [7,4.5,7,16,2.25,2],
    [5,.9,5,-4,.45,-5],
    [5,1.3,5,4,.65,-5],
    [5,1.7,5,10,.85,-5]
  ];

  const fixedCount =
    Math.min(
      fixedPlatforms.length,
      Math.max(
        0,
        Math.floor(
          terrainCount *
          .65
        )
      )
    );

  for(
    let i = 0;
    i < fixedCount;
    i++
  ){

    const p =
      fixedPlatforms[i];

    const scaledHeight =
      p[1] *
      heightScale;

    createBox(
      p[0],
      scaledHeight,
      p[2],
      p[3],
      scaledHeight / 2,
      p[5],
      obstacleMaterial
    );

  }

  const randomCount =
    Math.max(
      0,
      terrainCount -
      fixedCount
    );

  for(
    let i = 0;
    i < randomCount;
    i++
  ){

    const width =
      2.5 +
      Math.random() * 2;

    const depth =
      2.5 +
      Math.random() * 2;

    const height =
      (
        1.3 +
        Math.random() * 1.7
      ) *
      heightScale;

    const x =
      Math.random() *
      42 -
      21;

    const z =
      Math.random() *
      42 -
      21;

    createBox(
      width,
      height,
      depth,
      x,
      height / 2,
      z,
      obstacleMaterial
    );

  }

}


function createBox(
  width,
  height,
  depth,
  x,
  y,
  z,
  material
){

  const geometry =
    new THREE.BoxGeometry(
      width,
      height,
      depth
    );

  const mesh =
    new THREE.Mesh(
      geometry,
      material
    );

  mesh.position.set(
    x,
    y,
    z
  );

  mesh.castShadow =
    true;

  mesh.receiveShadow =
    true;

  scene.add(mesh);

  colliders.push(mesh);

  return mesh;

}


function onResize(){

  if(
    !camera ||

    return;
  }

  camera.aspect =
    window.innerWidth /
    window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

}


async function ensureAuth(){

  if(currentUser){

    return currentUser;

  }

  return new Promise(
    (resolve,reject) => {

      const unsubscribe =
        onAuthStateChanged(
          auth,
          async user => {

            if(user){

              currentUser =
                user;

              unsubscribe();

              resolve(user);

              return;

            }

            try{

              await signInAnonymously(
                auth
              );

            }catch(error){

              unsubscribe();

              reject(error);

            }

          },

          error => {

            unsubscribe();

            reject(error);

          }
        );

    }
  );

}



function normalizeSettings(settings = {}){
  const result = {
    ...DEFAULT_SETTINGS,
    ...(settings || {})
  };

  if(!["many","medium","few","none"].includes(result.terrainAmount)){
    result.terrainAmount = "medium";
  }

  if(!["high","medium","low"].includes(result.terrainHeight)){
    result.terrainHeight = "medium";
  }

  if(!["infinite","fast","medium","slow"].includes(result.bulletSpeed)){
    result.bulletSpeed = "medium";
  }

  const hp =
    Number(result.maxHp);

  result.maxHp =
    Number.isFinite(hp) && hp > 0
      ? Math.max(1, Math.floor(hp))
      : 100;

  if(!["fast","medium","slow","none"].includes(result.regen)){
    result.regen = "none";
  }

  const lock =
    Number(result.regenLock);

  result.regenLock =
    Number.isFinite(lock) && lock >= 0
      ? lock
      : 0;

  return result;
}


function applyMatchSettings(settings = {}){
  currentSettings =
    normalizeSettings(settings);

  MAX_HP =
    currentSettings.maxHp;

  if(
    localPlayer &&
    matchHasStarted &&
    localPlayer.hp > MAX_HP
  ){

    localPlayer.hp =
      MAX_HP;

  }

  updateSettingsUI();
  updateLocalHUD();
}

function updateSettingsUI(){
  const disabled =
    currentSettings.terrainAmount ===
    "none";

  terrainHeight.disabled =
    disabled;

  terrainHeightRow.classList.toggle(
    "settingDisabled",
    disabled
  );

  terrainHeightLabel.classList.toggle(
    "settingDisabled",
    disabled
  );

  const regenDisabled =
    currentSettings.regen ===
    "none";

  regenLockSetting.disabled =
    regenDisabled;

  regenLockRow.classList.toggle(
    "settingDisabled",
    regenDisabled
  );

  regenLockLabel.classList.toggle(
    "settingDisabled",
    regenDisabled
  );

  if(disabled || regenDisabled){
    settingsLockedText.textContent =
      disabled
        ? "地形の量が「なし」のため、地形の高低差は設定できません"
        : "HP自然回復が「なし」のため、自然回復ロックは設定できません";
  }else{
    settingsLockedText.textContent =
      "";
  }

  const controls = [
    terrainAmount,
    terrainHeight,
    bulletSpeedSetting,
    maxHpSetting,
    regenSetting,
    regenLockSetting
  ];

  for(const control of controls){
    control.disabled =
      !isHost ||
      (
        control === terrainHeight &&
        disabled
      ) ||
      (
        control === regenLockSetting &&
        regenDisabled
      );
  }

  settingsButton.style.opacity =
    isHost ? "1" : ".72";
}


async function saveSettings(){
  if(
    !matchRef ||
    !isHost ||
    matchHasStarted
  ){
    return;
  }

  const settings =
    readSettingsFromUI();

  applyMatchSettings(settings);

  try{

    await updateDoc(
      matchRef,
      {
        settings
      }
    );

  }catch(error){

    console.error(
      "settings save error",
      error
    );

  }
}


function updateRoomPlayerList(
  players,
  playerOrder
){
  const order =
    Array.isArray(playerOrder)
      ? playerOrder.filter(
          uid => players[uid]
        )
      : Object.keys(players);

  roomPlayerList.innerHTML =
    "";

  order.forEach(
    (uid,index) => {

      const player =
        players[uid];

      if(!player){
        return;
      }

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "roomPlayerRow";

      const number =
        document.createElement(
          "span"
        );

      number.className =
        "roomPlayerIndex";

      number.textContent =
        `${index + 1}.`;

      const name =
        document.createElement(
          "span"
        );

      name.className =
        "roomPlayerName";

      name.textContent =
        uid === currentUser.uid
          ? "YOU"
          : player.name ||
            uid.slice(-4);

      const host =
        document.createElement(
          "span"
        );

      host.className =
        "roomHost";

      host.textContent =
        uid ===
        (
          player.hostUid ||
          ""
        )
          ? "HOST"
          : (
            uid ===
            currentHostUid
              ? "HOST"
              : ""
          );

      row.appendChild(number);
      row.appendChild(name);
      row.appendChild(host);

      roomPlayerList.appendChild(row);

    }
  );
}

    !data ||

      ? "block"

async function shareRoomCode(){
  if(!currentMatchId){
    return;
  }

  const text =
    `試合コード：${currentMatchId}`;

  try{

    if(
      navigator.share
    ){

      await navigator.share({
        text
      });

      shareStatus.textContent =
        "共有しました";

      return;

    }

    if(
      navigator.clipboard &&
      navigator.clipboard.writeText
    ){

      await navigator.clipboard.writeText(
        text
      );

      shareStatus.textContent =
        "コードをコピーしました";

      return;

    }

    shareStatus.textContent =
      text;

  }catch(error){

    if(
      error &&
      error.name ===
      "AbortError"
    ){

      return;

    }

    shareStatus.textContent =
      "共有できませんでした";

  }
}


async function leaveRoom(){
  const ref =
    matchRef;

  const wasHost =
    isHost;

  const uid =
    currentUser &&
    currentUser.uid;

  leaveCurrentMatch();

  if(!ref || !uid){
    return;
  }

  try{

    if(wasHost){

      await deleteDoc(
        ref
      );

      return;

    }

    await runTransaction(
      db,
      async transaction => {

        const snap =
          await transaction.get(
            ref
          );

        if(!snap.exists()){
          return;
        }

        const data =
          snap.data();

        const players =
          {
            ...(data.players || {})
          };

        delete players[uid];

        const playerOrder =
          Array.isArray(data.playerOrder)
            ? data.playerOrder.filter(
                id => id !== uid
              )
            : Object.keys(players);

        transaction.update(
          ref,
          {
            players,
            playerOrder
          }
        );

      }
    );

  }catch(error){

    console.error(
      "leave room error",
      error
    );

  }
}


function terrainCounts(){
  switch(
    currentSettings.terrainAmount
  ){
    case "many":
      return 18;
    case "few":
      return 6;
    case "none":
      return 0;
    default:
      return 10;
  }
}


function terrainHeightScale(){
  switch(
    currentSettings.terrainHeight
  ){
    case "high":
      return 1.65;
    case "low":
      return .58;
    default:
      return 1;
  }
}


function bulletSpeedValue(){
  if(
    currentSettings.bulletSpeed ===
    "infinite"
  ){
    return Infinity;
  }

  return (
    BULLET_SPEED_VALUES[
      currentSettings.bulletSpeed
    ] ||
    BULLET_SPEED_VALUES.medium
  );
}


function getRegenRate(){
  return (
    REGEN_RATES[
      currentSettings.regen
    ] ||
    0
  );
}

function updateSpawnProtectionUI(now = Date.now()){
  if(
    !matchHasStarted ||
    now >= spawnProtectionUntil
  ){

    spawnProtection.style.display =
      "none";

    return;

  }

  const remaining =
    Math.max(
      0,
      spawnProtectionUntil -
      now
    );

  const progress =
    clamp(
      remaining /
      START_PROTECTION_TIME,
      0,
      1
    );

  spawnProtection.style.display =
    "block";

  spawnProtectionBar.style.setProperty(
    "--protectionProgress",
    String(progress)
  );

  spawnProtection.firstElementChild.textContent =
    `🛡 無敵中 ${(
      remaining / 1000
    ).toFixed(1)}秒`;
}


async function checkMatchCleanup(data){
  if(
    !matchRef ||
    !data ||
    !data.players
  ){
    return;
  }

  const now =
    Date.now();

  if(
    now -
    lastCleanupCheck <
    CLEANUP_INTERVAL
  ){
    return;
  }

  lastCleanupCheck =
    now;

  let createdMillis =
    0;

  if(
    data.createdAt
  ){

    if(
      typeof data.createdAt.toMillis ===
      "function"
    ){

      createdMillis =
        data.createdAt.toMillis();

    }else{

      createdMillis =
        Number(
          data.createdAt
        ) || 0;

    }

  }

  if(
    createdMillis &&
    now -
    createdMillis >=
    MAX_MATCH_AGE
  ){

    try{
      await deleteDoc(
        matchRef
      );
    }catch(error){
      console.error(
        "age cleanup error",
        error
      );
    }

    return;
  }

  const players =
    Object.values(
      data.players
    );

  if(
    !players.length
  ){
    return;
  }

  const allInactive =
    players.every(
      player =>
        Number.isFinite(
          Number(
            player.lastActiveAt
          )
        ) &&
        now -
        Number(
          player.lastActiveAt
        ) >=
        INACTIVE_MATCH_TIME
    );

  if(allInactive){

    try{
      await deleteDoc(
        matchRef
      );
    }catch(error){
      console.error(
        "inactive cleanup error",
        error
      );
    }

  }
}


function getPlayerOrder(
  players,
  order
){
  const result =
    Array.isArray(order)
      ? order.filter(
          uid => players[uid]
        )
      : [];

  for(
    const uid of Object.keys(players)
  ){
    if(
      !result.includes(uid)
    ){
      result.push(uid);
    }
  }

  return result;
}


function getLandingTop(
  x,
  z,
  previousFeetY,
  nextFeetY
){
  if(
    nextFeetY >
    previousFeetY
  ){
    return null;
  }

  let best =
    null;

  for(
    let i = 1;
    i < colliders.length;
    i++
  ){

    const collider =
      colliders[i];

    const box =
      new THREE.Box3()
        .setFromObject(
          collider
        );

    const inside =
      x >=
        box.min.x - .38 &&
      x <=
        box.max.x + .38 &&
      z >=
        box.min.z - .38 &&
      z <=
        box.max.z + .38;

    if(!inside){
      continue;
    }

    const top =
      box.max.y;

    if(
      previousFeetY >=
      top - .08 &&
      nextFeetY <=
      top + .08
    ){

      if(
        best === null ||
        top > best
      ){
        best =
          top;
      }

    }

  }

  return best;
}


function getCeilingBottom(
  x,
  z,
  previousHeadY,
  nextHeadY
){
  if(
    nextHeadY <
    previousHeadY
  ){
    return null;
  }

  let best =
    null;

  for(
    let i = 1;
    i < colliders.length;
    i++
  ){

    const box =
      new THREE.Box3()
        .setFromObject(
          colliders[i]
        );

    const inside =
      x >=
        box.min.x - .32 &&
      x <=
        box.max.x + .32 &&
      z >=
        box.min.z - .32 &&
      z <=
        box.max.z + .32;

    if(!inside){
      continue;
    }

    const bottom =
      box.min.y;

    if(
      previousHeadY <=
      bottom + .08 &&
      nextHeadY >=
      bottom - .08
    ){

      if(
        best === null ||
        bottom < best
      ){
        best =
          bottom;
      }

    }

  }

  return best;
}


async function createMatch(
  requestedCode = ""
){

  statusEl.textContent =
    "試合を作成中…";

  try{

    const user =
      await ensureAuth();

    let code =
      requestedCode
        .trim()
        .toUpperCase();

    if(!code){

      for(
        let attempt = 0;
        attempt < 20;
        attempt++
      ){

        const candidate =
          randomCode();

        const ref =
          doc(
            db,
            "matches",
            candidate
          );

        const existing =
          await getDoc(ref);

        if(!existing.exists()){

          code =
            candidate;

          break;

        }

      }

    }

    if(!code){
      throw new Error(
        "試合コードを作成できませんでした。"
      );
    }

    const spawn =
      randomSpawn();

    const player = {

      uid:
        user.uid,

      name:
        "Player-" +
        user.uid.slice(-4),

      x:
        spawn.x,

      y:
        spawn.y,

      z:
        spawn.z,

      yaw:
        0,

      pitch:
        0,

      hp:
        MAX_HP,

      kills:
        0,

      alive:
        true,

      lastActiveAt:
        Date.now()

    };

    const ref =
      doc(
        db,
        "matches",
        code
      );

    await runTransaction(
      db,
      async transaction => {

        const snap =
          await transaction.get(ref);

        if(snap.exists()){

          throw new Error(
            "ALREADY_EXISTS"
          );

        }

        transaction.set(
          ref,
          {

            hostUid:
              user.uid,

            status:
              "waiting",

            winnerUid:
              null,

            createdAt:
              serverTimestamp(),

            startedAt:
              null,

            settings:
              {
                ...DEFAULT_SETTINGS
              },

            playerOrder:
              [user.uid],

            players:{
              [user.uid]:
                player
            }

          }
        );

      }
    );

    isHost =
      true;

    await startMatch(
      code
    );

  }catch(error){

    console.error(error);

    if(
      error?.message ===
      "ALREADY_EXISTS"
    ){

      await joinMatch(
        requestedCode
      );

      return;

    }

    statusEl.textContent =
      "作成失敗：" +
      getFriendlyError(error);

  }
}


async function joinMatch(
  codeOverride = ""
){

  const code =
    (
      codeOverride ||
      matchCodeInput.value
    )
      .trim()
      .toUpperCase();

  if(!code){

    await createMatch("");

    return;

  }

  statusEl.textContent =
    "試合を確認中…";

  try{

    const user =
      await ensureAuth();

    const ref =
      doc(
        db,
        "matches",
        code
      );

    const existing =
      await getDoc(ref);

    if(!existing.exists()){

      await createMatch(
        code
      );

      return;

    }

    await runTransaction(
      db,
      async transaction => {

        const snap =
          await transaction.get(ref);

        if(!snap.exists()){

          throw new Error(
            "NOT_FOUND"
          );

        }

        const data =
          snap.data();

        if(
          data.status !==
          "waiting"
        ){

          if(
            data.status ===
            "ended"
          ){

            throw new Error(
              "ENDED"
            );

          }

          throw new Error(
            "ALREADY_STARTED"
          );

        }

        const players =
          {
            ...(data.players || {})
          };

        if(players[user.uid]){
          return;
        }

        const playerOrder =
          Array.isArray(
            data.playerOrder
          )
            ? data.playerOrder.slice()
            : Object.keys(players);

        if(
          playerOrder.length >= 8
        ){

          throw new Error(
            "FULL"
          );

        }

        const spawn =
          randomSpawn();

        players[user.uid] = {

          uid:
            user.uid,

          name:
            "Player-" +
            user.uid.slice(-4),

          x:
            spawn.x,

          y:
            spawn.y,

          z:
            spawn.z,

          yaw:
            0,

          pitch:
            0,

          hp:
            MAX_HP,

          kills:
            0,

          alive:
            true,

          lastActiveAt:
            Date.now()

        };

        playerOrder.push(
          user.uid
        );

        transaction.update(
          ref,
          {
            players,
            playerOrder
          }
        );

      }
    );

    isHost =
      false;

    await startMatch(
      code
    );

  }catch(error){

    console.error(error);

    const message =
      error?.message || "";

    if(
      message ===
      "NOT_FOUND"
    ){

      await createMatch(
        code
      );

    }else if(
      message ===
      "FULL"
    ){

      statusEl.textContent =
        "その試合は満員だよ。";

    }else if(
      message ===
      "ENDED"
    ){

      statusEl.textContent =
        "その試合はもう終了してるよ。";

    }else if(
      message ===
      "ALREADY_STARTED"
    ){

      statusEl.textContent =
        "その試合はもう始まってるよ。";

    }else{

      statusEl.textContent =
        "参加/作成失敗：" +
        getFriendlyError(error);

    }

  }
}

function getFriendlyError(error){

  if(!error){

    return "不明なエラー";

  }


  if(
    error.code ===
    "permission-denied"
  ){

    return "Firestoreの権限設定を確認して！";

  }


  if(
    error.code ===
    "auth/operation-not-allowed"
  ){

    return "Firebaseで匿名ログインを有効にして！";

  }


  return (
    error.message ||
    String(error)
  );

}


async function startMatch(
  code
){

  currentMatchId =
    code;

  matchRef =
    doc(
      db,
      "matches",
      code
    );

  gameOver.style.display =
    "none";

  gameEnded =
    false;

  gameStarted =
    true;

  matchHasStarted =
    false;

  gameUI.style.display =
    "none";

  hideRoomScreen();

  velocityY =
    0;

  lastActivityAt =
    Date.now();

  lastCleanupCheck =
    0;

  await loadLocalPlayer();

  if(unsubscribeMatch){

    unsubscribeMatch();

    unsubscribeMatch =
      null;

  }

  unsubscribeMatch =
    onSnapshot(
      matchRef,

      async snapshot => {

        if(
          !snapshot.exists()
        ){

          if(gameStarted){

            leaveCurrentMatch();

          }

          return;

        }

        const data =
          snapshot.data();

        const players =
          data.players ||
          {};

        roomPlayerOrder =
          getPlayerOrder(
            players,
            data.playerOrder
          );

        const count =
          roomPlayerOrder.length;

        playerCountText.textContent =
          String(count);

        const me =
          players[
            currentUser.uid
          ];

        if(me){

          const previousHp =
            localPlayer
              ? Number(
                  localPlayer.hp
                )
              : Number(
                  me.hp
                );

          const preservedHp =
            localHpNeedsSync &&
            localPlayer
              ? localPlayer.hp
              : me.hp;

          localPlayer =
            {
              ...localPlayer,
              ...me,
              hp:
                preservedHp
            };

          localKills =
            me.kills || 0;

          if(
            previousHp >
            Number(me.hp) &&
            matchHasStarted
          ){

            lastDamageAt =
              Date.now();

          }

          updateLocalHUD();

        }

        const wasStarted =
          matchHasStarted;

        if(
          data.status ===
          "waiting"
        ){

          matchHasStarted =
            false;

          applyMatchSettings(
            data.settings ||
            DEFAULT_SETTINGS
          );

          updateRoomUI(
            data
          );

          gameUI.style.display =
            "none";

        }

        if(
          data.status ===
          "active"
        ){

          matchHasStarted =
            true;

          applyMatchSettings(
            data.settings ||
            DEFAULT_SETTINGS
          );

          if(
            !wasStarted
          ){

            const startedAt =
              data.startedAt;

            spawnProtectionUntil =
              Date.now() +
              START_PROTECTION_TIME;

            if(startedAt){

              const serverMillis =
                startedAt.toMillis
                  ? startedAt.toMillis()
                  : Date.now();

              spawnProtectionUntil =
                serverMillis +
                START_PROTECTION_TIME;

            }

            lastDamageAt =
              0;

            lastRegenTime =
              performance.now();

          }

          if(!scene){

            setupScene();

          }

          setCameraFromPlayer();

          updateRemotePlayers(
            players
          );

          updateScoreboard(
            players
          );

          gameUI.style.display =
            "block";

          hideRoomScreen();

        }

        if(
          data.status ===
          "ended" &&
          !gameEnded
        ){

          const winner =
            data.winnerUid;

          const winnerName =
            winner &&
            players[winner] &&
            players[winner].name
              ? players[winner].name
              : "勝者";

          finishLocalGame(

            winner ===
            currentUser.uid
              ? "YOU WIN!"
              : winnerName +
                " の勝利！"

          );

          setTimeout(
            () => {
              deleteMatch();
            },
            1200
          );

        }

        await checkMatchCleanup(
          data
        );

      },

      error => {

        console.error(
          error
        );

        if(gameStarted){

          leaveCurrentMatch();

        }

      }
    );

  if(!gameLoopStarted){

    gameLoopStarted =
      true;

    requestAnimationFrame(
      gameLoop
    );

  }

}


async function loadLocalPlayer(){

  const snap =
    await getDoc(
      matchRef
    );

  if(
    !snap.exists()
  ){

    throw new Error(
      "試合が見つかりません。"
    );

  }

  const data =
    snap.data();

  const player =
    data.players?.[
      currentUser.uid
    ];

  if(!player){

    throw new Error(
      "プレイヤーデータがありません。"
    );

  }

  localPlayer =
    {
      ...player
    };

  localKills =
    player.kills || 0;

  lastActivityAt =
    Number(
      player.lastActiveAt
    ) ||
    Date.now();

  localPlayer.lastActiveAt =
    lastActivityAt;

  cameraState.yaw =
    Number(
      player.yaw || 0
    );

  cameraState.pitch =
    Number(
      player.pitch || 0
    );

  applyMatchSettings(
    data.settings ||
    DEFAULT_SETTINGS
  );

  if(
    data.status ===
    "active"
  ){

    matchHasStarted =
      true;

    setCameraFromPlayer();

  }

  updateLocalHUD();

  if(
    data.status ===
    "waiting"
  ){

    updateRoomUI(
      data
    );

  }

}


function setCameraFromPlayer(){

  if(!localPlayer){

    return;

  }


  camera.position.set(

    localPlayer.x,

    localPlayer.y + .45,

    localPlayer.z

  );


  camera.rotation.order =
    "YXZ";


  camera.rotation.y =
    cameraState.yaw;


  camera.rotation.x =
    cameraState.pitch;

}


function updateRemotePlayers(
  players
){

  const seen =
    new Set();


  for(
    const [
      uid,
      player
    ]
    of Object.entries(players)
  ){

    if(
      uid ===
      currentUser.uid
    ){

      continue;

    }


    seen.add(uid);


    let mesh =
      playerMeshes.get(uid);


    if(!mesh){

      mesh =
        createPlayerMesh(
          uid
        );

      playerMeshes.set(
        uid,
        mesh
      );

    }


    mesh.position.set(

      player.x,

      Math.max(
        0,
        player.y -
        PLAYER_HEIGHT
      ),

      player.z

    );


    mesh.rotation.y =
      Number(
        player.yaw || 0
      );


    mesh.visible =
      Boolean(
        player.alive
      );

  }


  for(
    const uid
    of playerMeshes.keys()
  ){

    if(
      !seen.has(uid)
    ){

      removeRemoteMesh(
        uid
      );

    }

  }

}


function updateScoreboard(
  players
){

  const order =
    getPlayerOrder(
      players,
      roomPlayerOrder
    );

  scoreBoard.innerHTML =
    "";

  for(
    const uid
    of order
  ){

    const player =
      players[uid];

    if(!player){
      continue;
    }

    const row =
      document.createElement(
        "div"
      );

    row.className =
      "scoreRow";

    const name =
      document.createElement(
        "span"
      );

    name.textContent =
      uid ===
      currentUser.uid
        ? "YOU"
        : player.name ||
          uid.slice(-4);

    const state =
      document.createElement(
        "span"
      );

    state.textContent =
      player.alive
        ? `${player.kills || 0} K`
        : "DEAD";

    state.className =
      player.alive
        ? "scoreAlive"
        : "scoreDead";

    row.appendChild(name);
    row.appendChild(state);

    scoreBoard.appendChild(row);
  }
}

}


function clamp(
  value,
  min,
  max
){

  return Math.max(
    min,
    Math.min(
      max,
      value
    )
  );

}


function horizontalOverlaps(
  x,
  z,
  box
){
  return (
    x + .38 >
      box.min.x &&
    x - .38 <
      box.max.x &&
    z + .38 >
      box.min.z &&
    z - .38 <
      box.max.z
  );
}


function isPositionFree(
  x,
  y,
  z
){

  const radius =
    .38;

  if(
    x <
      -ARENA_SIZE / 2 +
      radius ||
    x >
      ARENA_SIZE / 2 -
      radius ||
    z <
      -ARENA_SIZE / 2 +
      radius ||
    z >
      ARENA_SIZE / 2 -
      radius
  ){
    return false;
  }

  const feetY =
    y -
    PLAYER_HEIGHT;

  const headY =
    feetY +
    PLAYER_HEIGHT;

  for(
    let i = 1;
    i < colliders.length;
    i++
  ){

    const box =
      new THREE.Box3()
        .setFromObject(
          colliders[i]
        );

    if(
      !horizontalOverlaps(
        x,
        z,
        box
      )
    ){
      continue;
    }

    if(
      headY >
      box.min.y + .05 &&
      feetY <
      box.max.y - .05
    ){
      return false;
    }

  }

  return true;
}


function tryMove(
  dx,
  dz
){

  if(
    !localPlayer ||
    !localPlayer.alive ||
    !matchHasStarted ||
    grabAnimation
  ){
    return;
  }

  const nextX =
    localPlayer.x +
    dx;

  if(
    isPositionFree(
      nextX,
      localPlayer.y,
      localPlayer.z
    )
  ){

    localPlayer.x =
      nextX;

  }

  const nextZ =
    localPlayer.z +
    dz;

  if(
    isPositionFree(
      localPlayer.x,
      localPlayer.y,
      nextZ
    )
  ){

    localPlayer.z =
      nextZ;

  }

  if(
    Math.abs(dx) > .0001 ||
    Math.abs(dz) > .0001
  ){

    markActivity();

  }
}


function updateMovement(
  delta
){

  if(
    !localPlayer ||
    !localPlayer.alive ||
    !matchHasStarted ||
    grabAnimation
  ){
    return;
  }

  let inputX =
    0;

  let inputZ =
    0;

  if(keys.w)
    inputZ -= 1;

  if(keys.s)
    inputZ += 1;

  if(keys.a)
    inputX -= 1;

  if(keys.d)
    inputX += 1;

  inputX +=
    mobileInput.x;

  inputZ +=
    mobileInput.y;

  const length =
    Math.hypot(
      inputX,
      inputZ
    );

  if(
    length > 1
  ){

    inputX /=
      length;

    inputZ /=
      length;

  }

  const moving =
    Math.abs(inputX) > .01 ||
    Math.abs(inputZ) > .01;

  if(moving){

    const speed =
      physics.moveSpeed;

    const amount =
      speed * delta;

    const forwardX =
      -Math.sin(
        cameraState.yaw
      );

    const forwardZ =
      -Math.cos(
        cameraState.yaw
      );

    const rightX =
      Math.cos(
        cameraState.yaw
      );

    const rightZ =
      -Math.sin(
        cameraState.yaw
      );

    const moveX =
      (
        forwardX * -inputZ +
        rightX * inputX
      ) *
      amount;

    const moveZ =
      (
        forwardZ * -inputZ +
        rightZ * inputX
      ) *
      amount;

    tryMove(
      moveX,
      moveZ
    );

  }

  const previousFeetY =
    localPlayer.y -
    PLAYER_HEIGHT;

  velocityY +=
    physics.gravity *
    delta;

  const nextY =
    localPlayer.y +
    velocityY *
    delta;

  const nextFeetY =
    nextY -
    PLAYER_HEIGHT;

  if(
    velocityY <= 0
  ){

    const landingTop =
      getLandingTop(
        localPlayer.x,
        localPlayer.z,
        previousFeetY,
        nextFeetY
      );

    if(
      landingTop !==
      null
    ){

      localPlayer.y =
        landingTop +
        PLAYER_HEIGHT;

      velocityY =
        0;

      grounded =
        true;

    }else if(
      nextFeetY <=
      0
    ){

      localPlayer.y =
        PLAYER_HEIGHT;

      velocityY =
        0;

      grounded =
        true;

    }else{

      localPlayer.y =
        nextY;

      grounded =
        false;

    }

  }else{

    const previousHeadY =
      previousFeetY +
      PLAYER_HEIGHT;

    const nextHeadY =
      nextFeetY +
      PLAYER_HEIGHT;

    const ceilingBottom =
      getCeilingBottom(
        localPlayer.x,
        localPlayer.z,
        previousHeadY,
        nextHeadY
      );

    if(
      ceilingBottom !==
      null
    ){

      localPlayer.y =
        ceilingBottom;

      velocityY =
        0;

      grounded =
        false;

    }else{

      localPlayer.y =
        nextY;

      grounded =
        false;

    }

  }

  if(
    localPlayer.y <
    -8
  ){

    const spawn =
      randomSpawn();

    localPlayer.x =
      spawn.x;

    localPlayer.y =
      PLAYER_HEIGHT;

    localPlayer.z =
      spawn.z;

    velocityY =
      0;

    grounded =
      true;

    markActivity();

  }

  camera.position.set(
    localPlayer.x,
    localPlayer.y + .45,
    localPlayer.z
  );

  camera.rotation.order =
    "YXZ";

  camera.rotation.y =
    cameraState.yaw;

  camera.rotation.x =
    cameraState.pitch;

  updateGrabUI();
}


function jump(){

  if(
    !localPlayer ||
    !localPlayer.alive ||
    !matchHasStarted
  ){
    return;
  }

  if(!grounded){

    if(
      canGrab()
    ){
      startGrab();
    }

    return;
  }

  velocityY =
    physics.jumpPower;

  grounded =
    false;

  markActivity();
}


function getGrabTarget(){

  if(
    !localPlayer ||
    grounded
  ){

    return null;

  }


  const playerX =
    localPlayer.x;

  const playerY =
    localPlayer.y;

  const playerZ =
    localPlayer.z;


  let best =
    null;

  let bestDistance =
    Infinity;


  /*
    足場の上面が
    自分の足元より上、
    しかし頭より下。
  */

  const feetY =
    playerY -
    PLAYER_HEIGHT;

  const headY =
    playerY;


  for(
    const collider
    of colliders
  ){

    if(
      collider ===
      colliders[0]
    ){

      continue;

    }


    const box =
      new THREE.Box3()
        .setFromObject(
          collider
        );


    const insideX =
      playerX >=
        box.min.x -
        GRAB_DISTANCE &&

      playerX <=
        box.max.x +
        GRAB_DISTANCE;


    const insideZ =
      playerZ >=
        box.min.z -
        GRAB_DISTANCE &&

      playerZ <=
        box.max.z +
        GRAB_DISTANCE;


    if(
      !insideX ||
      !insideZ
    ){

      continue;

    }


    const platformTop =
      box.max.y;


    if(
      platformTop <=
      feetY + .05
    ){

      continue;

    }


    if(
      platformTop >=
      headY
    ){

      continue;

    }


    const centerX =
      clamp(
        playerX,
        box.min.x,
        box.max.x
      );


    const centerZ =
      clamp(
        playerZ,
        box.min.z,
        box.max.z
      );


    const distance =
      Math.hypot(

        playerX -
        centerX,

        playerZ -
        centerZ

      );


    if(
      distance >
      GRAB_DISTANCE
    ){

      continue;

    }


    if(
      distance <
      bestDistance
    ){

      bestDistance =
        distance;

      best = {

        box,

        top:
          platformTop,

        x:
          centerX,

        z:
          centerZ

      };

    }

  }


  return best;

}


function canGrab(){

  return Boolean(
    getGrabTarget()
  );

}


function updateGrabUI(){

  if(
    grounded ||
    !localPlayer ||
    !matchHasStarted
  ){

    jumpButton.textContent =
      "JUMP";

    jumpButton.classList.remove(
      "grabActive",
      "grabInactive"
    );

    jumpButton.style.opacity =
      "1";

    return;
  }

  jumpButton.textContent =
    "GRAB";

  if(
    canGrab()
  ){

    jumpButton.classList.remove(
      "grabInactive"
    );

    jumpButton.classList.add(
      "grabActive"
    );

  }else{

    jumpButton.classList.remove(
      "grabActive"
    );

    jumpButton.classList.add(
      "grabInactive"
    );

  }
}


function startGrab(){

  if(
    grabAnimation ||
    grounded ||
    !localPlayer
  ){

    return;

  }


  const target =
    getGrabTarget();


  if(!target){

    return;

  }


  grabAnimation = {

    start:
      performance.now(),

    target,

    startX:
      localPlayer.x,

    startY:
      localPlayer.y,

    startZ:
      localPlayer.z

  };


  velocityY =
    0;

  markActivity();

}


function updateGrabAnimation(
  now
){

  if(!grabAnimation){

    return;

  }


  const elapsed =
    now -
    grabAnimation.start;


  const progress =
    clamp(
      elapsed /
      GRAB_TIME,
      0,
      1
    );


  const smooth =
    progress *
    progress *
    (
      3 -
      2 * progress
    );


  const target =
    grabAnimation.target;


  localPlayer.x =
    grabAnimation.startX +
    (
      target.x -
      grabAnimation.startX
    ) *
    smooth;


  localPlayer.z =
    grabAnimation.startZ +
    (
      target.z -
      grabAnimation.startZ
    ) *
    smooth;


  localPlayer.y =
    target.top +
    PLAYER_HEIGHT +
    .02;


  camera.position.set(

    localPlayer.x,

    localPlayer.y + .45,

    localPlayer.z

  );


  if(
    progress >= 1
  ){

    grabAnimation =
      null;

    grounded =
      true;

    velocityY =
      0;

    updateGrabUI();

  }

}

function createBullet(
  origin,
  direction,
  ownerUid
){

  const geometry =
    new THREE.SphereGeometry(
      .09,
      8,
      8
    );


  const material =
    new THREE.MeshBasicMaterial({

      color:
        0xffe36e

    });


  const mesh =
    new THREE.Mesh(
      geometry,
      material
    );


  mesh.position.copy(
    origin
  );


  scene.add(mesh);


  const id =
    ++bulletIdCounter;


  bullets.set(
    id,
    {

      mesh,

      direction:
        direction.clone()
          .normalize(),

      ownerUid,

      speed:
        bulletSpeedValue(),

      created:
        performance.now(),

      lastPosition:
        origin.clone()

    }
  );

}


function removeBullet(
  id
){

  const bullet =
    bullets.get(id);


  if(!bullet){

    return;

  }


  scene.remove(
    bullet.mesh
  );


  bullet.mesh.geometry.dispose();

  bullet.mesh.material.dispose();


  bullets.delete(
    id
  );

}


function updateBullets(
  delta,
  now
){

  for(
    const [
      id,
      bullet
    ]
    of bullets
  ){

    if(
      !Number.isFinite(
        bullet.speed
      )
    ){

      removeBullet(
        id
      );

      continue;

    }

    const previous =
      bullet.mesh.position.clone();

    const distance =
      bullet.speed *
      delta;

    bullet.mesh.position.add(
      bullet.direction
        .clone()
        .multiplyScalar(
          distance
        )
    );

    bullet.lastPosition =
      previous;

    if(
      now -
      bullet.created >
      BULLET_LIFETIME
    ){

      removeBullet(
        id
      );

      continue;

    }

    let hitSomething =
      false;

    for(
      const collider
      of colliders
    ){

      const box =
        new THREE.Box3()
          .setFromObject(
            collider
          );

      const closest =
        new THREE.Vector3();

      box.clampPoint(
        bullet.mesh.position,
        closest
      );

      if(
        closest.distanceTo(
          bullet.mesh.position
        ) < .18
      ){

        hitSomething =
          true;

        break;

      }

    }

    if(hitSomething){

      removeBullet(
        id
      );

      continue;

    }

    for(
      const [
        uid,
        mesh
      ]
      of playerMeshes
    ){

      if(
        uid ===
        bullet.ownerUid ||
        !mesh.visible
      ){
        continue;
      }

      const box =
        new THREE.Box3()
          .setFromObject(
            mesh
          );

      if(
        box.distanceToPoint(
          bullet.mesh.position
        ) < .15
      ){

        hitSomething =
          true;

        applyBulletDamage(
          uid,
          bullet.ownerUid
        );

        break;

      }

    }

    if(hitSomething){

      removeBullet(
        id
      );

    }

  }

}


function shootHitscan(){

  raycaster.setFromCamera(
    new THREE.Vector2(
      0,
      0
    ),
    camera
  );

  const colliderHits =
    raycaster.intersectObjects(
      colliders,
      false
    );

  const remoteMeshes =
    Array.from(
      playerMeshes.values()
    );

  const playerHits =
    raycaster.intersectObjects(
      remoteMeshes,
      true
    );

  let closestCollider =
    colliderHits.length
      ? colliderHits[0]
      : null;

  let closestPlayer =
    null;

  for(
    const hit
    of playerHits
  ){

    let object =
      hit.object;

    let uid =
      null;

    while(
      object
    ){

      if(
        object.userData &&
        object.userData.uid
      ){

        uid =
          object.userData.uid;

        break;

      }

      object =
        object.parent;

    }

    if(
      !uid ||
      uid ===
      currentUser.uid
    ){
      continue;
    }

    closestPlayer = {
      hit,
      uid
    };

    break;

  }

  if(
    closestPlayer &&
    (
      !closestCollider ||
      closestPlayer.hit.distance <=
      closestCollider.distance
    )
  ){

    applyBulletDamage(
      closestPlayer.uid,
      currentUser.uid
    );

  }
}


async function applyBulletDamage(
  targetUid,
  shooterUid
){

  if(
    !matchRef ||
    gameEnded
  ){
    return;
  }

  try{

    let wasKill =
      false;

    let wasLocalDamage =
      false;

    await runTransaction(
      db,
      async transaction => {

        const snap =
          await transaction.get(
            matchRef
          );

        if(
          !snap.exists()
        ){
          return;
        }

        const data =
          snap.data();

        if(
          data.status !==
          "active"
        ){
          return;
        }

        const players =
          {
            ...(data.players || {})
          };

        const shooter =
          players[shooterUid];

        const target =
          players[targetUid];

        if(
          !shooter ||
          !target ||
          !shooter.alive ||
          !target.alive
        ){
          return;
        }

        const protectionUntil =
          Number(
            data.startedProtectionUntil ||
            0
          );

        if(
          Date.now() <
          protectionUntil
        ){
          return;
        }

        const beforeHpRaw =
          Number(
            target.hp
          );

        const beforeHp =
          Number.isFinite(
            beforeHpRaw
          )
            ? beforeHpRaw
            : MAX_HP;

        const newHp =
          Math.max(
            0,
            beforeHp -
            BULLET_DAMAGE
          );

        target.hp =
          newHp;

        if(
          targetUid ===
          currentUser.uid
        ){

          wasLocalDamage =
            true;

        }

        if(
          newHp <= 0
        ){

          target.hp =
            0;

          target.alive =
            false;

          shooter.kills =
            Number(
              shooter.kills || 0
            ) + 1;

          wasKill =
            shooterUid ===
            currentUser.uid;

          const alivePlayers =
            Object.values(
              players
            ).filter(
              player =>
                player.alive
            );

          if(
            alivePlayers.length <= 1
          ){

            transaction.update(
              matchRef,
              {

                players,

                status:
                  "ended",

                winnerUid:
                  alivePlayers.length === 1
                    ? alivePlayers[0].uid
                    : null

              }
            );

            return;

          }

        }

        transaction.update(
          matchRef,
          {
            players
          }
        );

      }
    );

    if(
      wasLocalDamage
    ){

      lastDamageAt =
        Date.now();

    }

    if(wasKill){

      localKills++;

      showKillMessage(
        "ELIMINATED"
      );

    }

  }catch(error){

    console.error(
      "bullet damage error",
      error
    );

  }
}


function getFireProgress(){

  const now =
    performance.now();


  if(
    now >=
    fireCooldownEnd
  ){

    return 100;

  }


  const remaining =
    fireCooldownEnd -
    now;


  return clamp(

    100 -
      (
        remaining /
        FIRE_INTERVAL
      ) *
      100,

    0,

    100

  );

}

  );

function shoot(){

  if(
    !localPlayer ||
    !localPlayer.alive ||
    !matchHasStarted ||
    gameEnded
  ){
    return;
  }

  if(
    Date.now() <
    spawnProtectionUntil
  ){

    markActivity();

    return;

  }

  const now =
    performance.now();

  if(
    now <
    fireCooldownEnd
  ){
    return;
  }

  fireCooldownEnd =
    now +
    FIRE_INTERVAL;

  if(
    currentSettings.bulletSpeed ===
    "infinite"
  ){

    shootHitscan();

  }else{

    raycaster.setFromCamera(
      new THREE.Vector2(
        0,
        0
      ),
      camera
    );

    const origin =
      camera.position.clone();

    const direction =
      raycaster.ray.direction
        .clone()
        .normalize();

    createBullet(
      origin,
      direction,
      currentUser.uid
    );

  }

  markActivity();

  updateFireUI();

}



function getSeparatedSpawn(
  used
){
  for(
    let attempt = 0;
    attempt < 80;
    attempt++
  ){

    const spawn =
      randomSpawn();

    let safe =
      true;

    for(
      const other
      of used
    ){

      if(
        Math.hypot(
          spawn.x -
          other.x,
          spawn.z -
          other.z
        ) < 2.4
      ){

        safe =
          false;

        break;

      }

    }

    if(safe){
      return spawn;
    }

  }

  return randomSpawn();
}


function startMatchByHost(){

  if(
    !isHost ||
    !matchRef ||
    matchHasStarted
  ){
    return;
  }

  runTransaction(
    db,
    async transaction => {

      const snap =
        await transaction.get(
          matchRef
        );

      if(!snap.exists()){
        return;
      }

      const data =
        snap.data();

      if(
        data.status !==
        "waiting"
      ){
        return;
      }

      const players =
        {
          ...(data.players || {})
        };

      const settings =
        normalizeSettings(
          data.settings ||
          currentSettings
        );

      const usedSpawns =
        [];

      const order =
        getPlayerOrder(
          players,
          data.playerOrder
        );

      for(
        const uid
        of order
      ){

        const player =
          players[uid];

        if(!player){
          continue;
        }

        const spawn =
          getSeparatedSpawn(
            usedSpawns
          );

        usedSpawns.push(
          spawn
        );

        player.x =
          spawn.x;

        player.y =
          PLAYER_HEIGHT;

        player.z =
          spawn.z;

        player.hp =
          settings.maxHp;

        player.alive =
          true;

        player.kills =
          0;

        player.lastActiveAt =
          Date.now();

      }

      transaction.update(
        matchRef,
        {

          players,

          playerOrder:
            order,

          settings,

          status:
            "active",

          winnerUid:
            null,

          startedAt:
            serverTimestamp(),

          startedProtectionUntil:
            Date.now() +
            START_PROTECTION_TIME

        }
      );

    }
  ).catch(
    error => {

      console.error(
        "start error",
        error
      );

    }
  );
}

function handleMouseMove(
  event
){

  if(
    !gameStarted ||
    gameEnded ||
    matchMedia(
      "(pointer:coarse)"
    ).matches
  ){

    return;

  }


  if(
    document.pointerLockElement !==
    renderer.domElement
  ){

    return;

  }


  cameraState.yaw -=
    event.movementX *
    .0023;


  cameraState.pitch -=
    event.movementY *
    .0023;


  cameraState.pitch =
    clamp(
      cameraState.pitch,
      -1.45,
      1.45
    );

  if(
    Math.abs(event.movementX) > .1 ||
    Math.abs(event.movementY) > .1
  ){
    markActivity();
  }

}


function requestPointerLock(){

  if(
    matchMedia(
      "(pointer:coarse)"
    ).matches
  ){

    return;

  }


  if(
    renderer &&
    renderer.domElement
      .requestPointerLock
  ){

    renderer.domElement
      .requestPointerLock();

  }

}

function setupMobileInput(){

  let joystickPointerId =
    null;

  let joystickCenterX =
    null;

  let joystickCenterY =
    null;

  function setJoystickCenter(
    clientX,
    clientY
  ){

    const rect =
      joystickZone
        .getBoundingClientRect();

    const minX =
      65;

    const maxX =
      rect.width -
      65;

    const minY =
      65;

    const maxY =
      rect.height -
      65;

    const x =
      clamp(
        clientX -
        rect.left,
        minX,
        maxX
      );

    const y =
      clamp(
        clientY -
        rect.top,
        minY,
        maxY
      );

    joystickCenterX =
      x;

    joystickCenterY =
      y;

    joystickBase.style.left =
      `${x}px`;

    joystickBase.style.top =
      `${y}px`;

  }


  function resetJoystickCenter(){

    joystickCenterX =
      null;

    joystickCenterY =
      null;

    joystickBase.style.left =
      "50%";

    joystickBase.style.top =
      "50%";

  }


  function updateJoystick(
    clientX,
    clientY
  ){

    const rect =
      joystickZone
        .getBoundingClientRect();

    const centerX =
      rect.left +
      (
        joystickCenterX ??
        rect.width / 2
      );

    const centerY =
      rect.top +
      (
        joystickCenterY ??
        rect.height / 2
      );

    let dx =
      clientX -
      centerX;

    let dy =
      clientY -
      centerY;

    const max =
      53;

    const distance =
      Math.hypot(
        dx,
        dy
      );

    if(
      distance >
      max
    ){

      dx =
        dx /
        distance *
        max;

      dy =
        dy /
        distance *
        max;

    }

    mobileInput.x =
      dx / max;

    mobileInput.y =
      dy / max;

    joystickKnob.style.transform =
      `translate(${dx}px,${dy}px)`;

    if(
      Math.abs(
        mobileInput.x
      ) > .05 ||
      Math.abs(
        mobileInput.y
      ) > .05
    ){

      markActivity();

    }

  }


  joystickZone.addEventListener(
    "pointerdown",
    event => {

      event.preventDefault();

      joystickPointerId =
        event.pointerId;

      joystickZone.setPointerCapture(
        event.pointerId
      );

      setJoystickCenter(
        event.clientX,
        event.clientY
      );

      updateJoystick(
        event.clientX,
        event.clientY
      );

    }
  );


  joystickZone.addEventListener(
    "pointermove",
    event => {

      if(
        event.pointerId ===
        joystickPointerId
      ){

        updateJoystick(
          event.clientX,
          event.clientY
        );

      }

    }
  );


  const endJoystick =
    event => {

      if(
        event.pointerId !==
        joystickPointerId
      ){
        return;
      }

      joystickPointerId =
        null;

      mobileInput.x =
        0;

      mobileInput.y =
        0;

      joystickKnob.style.transform =
        "translate(0,0)";

      resetJoystickCenter();

    };


  joystickZone.addEventListener(
    "pointerup",
    endJoystick
  );

  joystickZone.addEventListener(
    "pointercancel",
    endJoystick
  );


  let lookPointerId =
    null;

  let lastLookX =
    0;

  let lastLookY =
    0;


  lookZone.addEventListener(
    "pointerdown",
    event => {

      lookPointerId =
        event.pointerId;

      lastLookX =
        event.clientX;

      lastLookY =
        event.clientY;

      lookZone.setPointerCapture(
        event.pointerId
      );

    }
  );


  lookZone.addEventListener(
    "pointermove",
    event => {

      if(
        event.pointerId !==
        lookPointerId
      ){
        return;
      }

      const dx =
        event.clientX -
        lastLookX;

      const dy =
        event.clientY -
        lastLookY;

      lastLookX =
        event.clientX;

      lastLookY =
        event.clientY;

      cameraState.yaw -=
        dx * .006;

      cameraState.pitch -=
        dy * .006;

      cameraState.pitch =
        clamp(
          cameraState.pitch,
          -1.45,
          1.45
        );

      if(
        Math.abs(dx) > .1 ||
        Math.abs(dy) > .1
      ){
        markActivity();
      }

    }
  );


  const endLook =
    event => {

      if(
        event.pointerId ===
        lookPointerId
      ){

        lookPointerId =
          null;

      }

    };


  lookZone.addEventListener(
    "pointerup",
    endLook
  );

  lookZone.addEventListener(
    "pointercancel",
    endLook
  );


  fireButton.addEventListener(
    "pointerdown",
    event => {

      event.preventDefault();

      fireHolding =
        true;

      mobileInput.firing =
        true;

      shoot();

    }
  );


  fireButton.addEventListener(
    "pointerup",
    event => {

      event.preventDefault();

      fireHolding =
        false;

      mobileInput.firing =
        false;

    }
  );


  fireButton.addEventListener(
    "pointercancel",
    () => {

      fireHolding =
        false;

      mobileInput.firing =
        false;

    }
  );


  jumpButton.addEventListener(
    "pointerdown",
    event => {

      event.preventDefault();

      jump();

    }
  );

}


function setupStartButton(){

  const startDown =
    event => {

      event.preventDefault();

      if(
        !isHost ||
        matchHasStarted
      ){
        return;
      }

      startHolding =
        true;

      startHoldStart =
        performance.now();

      markActivity();

    };


  const startUp =
    event => {

      event.preventDefault();

      startHolding =
        false;

      roomStartButton.style.setProperty(
        "--progress",
        "0%"
      );

    };


  roomStartButton.addEventListener(
    "pointerdown",
    startDown
  );

  roomStartButton.addEventListener(
    "pointerup",
    startUp
  );

  roomStartButton.addEventListener(
    "pointercancel",
    startUp
  );

  roomStartButton.addEventListener(
    "pointerleave",
    event => {
      if(
        event.buttons === 0
      ){
        startUp(event);
      }
    }
  );

}


function setupRendererInput(){

  if(!renderer){

    return;

  }


  renderer.domElement.addEventListener(
    "mousedown",
    event => {

      if(
        event.button ===
        0
      ){

        requestPointerLock();

        shoot();

      }

    }
  );

}



function updateHealthRegen(
  delta,
  now
){

  if(
    !localPlayer ||
    !localPlayer.alive ||
    !matchHasStarted
  ){
    return;
  }

  const rate =
    getRegenRate();

  if(
    rate <= 0 ||
    localPlayer.hp >=
    MAX_HP
  ){
    return;
  }

  if(
    lastDamageAt > 0 &&
    Date.now() -
    lastDamageAt <
    currentSettings.regenLock *
    1000
  ){
    return;
  }

  const amount =
    rate *
    delta;

  const nextHp =
    Math.min(
      MAX_HP,
      Number(
        localPlayer.hp
      ) +
      amount
    );

  if(
    nextHp <=
    Number(localPlayer.hp)
  ){
    return;
  }

  localPlayer.hp =
    nextHp;

  localHpNeedsSync =
    true;

  if(
    now -
    lastRegenTime >
    100
  ){

    lastRegenTime =
      now;

    updateLocalHUD();

  }

}


function gameLoop(
  time
){

  const delta =
    Math.min(
      (
        time -
        lastFrameTime
      ) / 1000,
      .05
    );

  lastFrameTime =
    time;

  updateStartProgress();

  updateFireUI();

  updateSpawnProtectionUI();

  if(
    gameStarted &&
    !gameEnded
  ){

    updateMovement(
      delta
    );

    updateGrabAnimation(
      time
    );

    updateHealthRegen(
      delta,
      time
    );

    if(
      mobileInput.firing
    ){
      shoot();
    }

    updateBullets(
      delta,
      time
    );

    syncLocalPlayer();

  }

  if(
    renderer &&
    scene &&
    camera &&
    matchHasStarted
  ){

    renderer.render(
      scene,
      camera
    );

  }

  requestAnimationFrame(
    gameLoop
  );
}


async function syncLocalPlayer(){

  if(
    !matchRef ||
    !localPlayer ||
    gameEnded
  ){
    return;
  }

  const now =
    performance.now();

  if(
    now -
    lastNetworkUpdate <
    80
  ){
    return;
  }

  lastNetworkUpdate =
    now;

  const playerPath =
    `players.${currentUser.uid}`;

  const updates = {

    [`${playerPath}.x`]:
      localPlayer.x,

    [`${playerPath}.y`]:
      localPlayer.y,

    [`${playerPath}.z`]:
      localPlayer.z,

    [`${playerPath}.yaw`]:
      cameraState.yaw,

    [`${playerPath}.pitch`]:
      cameraState.pitch,

    [`${playerPath}.kills`]:
      localKills,

    [`${playerPath}.alive`]:
      localPlayer.alive,

    [`${playerPath}.lastActiveAt`]:
      lastActivityAt

  };

  if(
    localHpNeedsSync
  ){

    updates[
      `${playerPath}.hp`
    ] =
      localPlayer.hp;

    localHpNeedsSync =
      false;

  }

  try{

    await updateDoc(
      matchRef,
      updates
    );

  }catch(error){

    console.error(
      "sync error",
      error
    );

  }
}


shareCodeButton.addEventListener(
  "click",
  shareRoomCode
);


settingsButton.addEventListener(
  "click",
  () => {

    roomSettings.style.display =
      roomSettings.style.display ===
      "none"
        ? "block"
        : "none";

    updateSettingsUI();

  }
);


leaveRoomButton.addEventListener(
  "click",
  leaveRoom
);


for(
  const control
  of [
    terrainAmount,
    terrainHeight,
    bulletSpeedSetting,
    maxHpSetting,
    regenSetting,
    regenLockSetting
  ]
){

  control.addEventListener(
    "change",
    () => {

      if(
        control ===
        terrainAmount
      ){

        currentSettings =
          readSettingsFromUI();

      }

      if(
        control ===
        regenSetting
      ){

        currentSettings =
          readSettingsFromUI();

      }

      updateSettingsUI();

      saveSettings();

    }
  );

  control.addEventListener(
    "input",
    () => {

      if(
        control ===
        maxHpSetting ||
        control ===
        regenLockSetting
      ){

        currentSettings =
          readSettingsFromUI();

        updateSettingsUI();

      }

    }
  );

}


matchButton.addEventListener(
  "click",
  handleMatchButton
);


returnButton.addEventListener(
  "click",
  handleReturn
);


matchCodeInput.addEventListener(
  "input",
  () => {

    matchCodeInput.value =
      matchCodeInput.value
        .replace(
          /[^A-Za-z0-9]/g,
          ""
        )
        .toUpperCase();

  }
);


matchCodeInput.addEventListener(
  "keydown",
  event => {

    if(
      event.key ===
      "Enter"
    ){

      handleMatchButton();

    }

  }
);


setupDesktopInput();

setupMobileInput();

setupStartButton();


window.addEventListener(
  "beforeunload",
  () => {

    if(
      isHost &&
      matchRef
    ){

      deleteDoc(
        matchRef
      ).catch(
        () => {}
      );

    }

  }
);


try{

  await ensureAuth();

  statusEl.textContent =
    "接続準備OK";

}catch(error){

  console.error(
    error
  );

  statusEl.textContent =
    "Firebase接続失敗：" +
    getFriendlyError(error);

}

</script>
