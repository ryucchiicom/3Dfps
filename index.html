<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Firebase 3D FPS</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  touch-action:none;
}

canvas{
  display:block;
}

#menu{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(circle at 50% 30%,#26384f 0%,#111822 40%,#05070a 100%);
  color:white;
}

.menuBox{
  width:min(92vw,480px);
  padding:28px;
  border-radius:22px;
  background:rgba(15,20,28,.88);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 20px 80px rgba(0,0,0,.45);
  backdrop-filter:blur(18px);
}

.title{
  margin:0 0 8px;
  font-size:34px;
  font-weight:800;
  text-align:center;
}

.subtitle{
  text-align:center;
  opacity:.72;
  margin-bottom:24px;
}

.input{
  width:100%;
  height:48px;
  padding:0 16px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:12px;
  background:rgba(255,255,255,.07);
  color:#fff;
  font-size:18px;
  outline:none;
  text-transform:uppercase;
  margin-bottom:12px;
}

.button{
  width:100%;
  height:48px;
  border:0;
  border-radius:12px;
  color:#fff;
  background:#1976ff;
  font-size:17px;
  font-weight:700;
  margin-top:8px;
  cursor:pointer;
}

.button.secondary{
  background:#2a3039;
}

.button:active{
  transform:scale(.98);
}

.info{
  margin-top:18px;
  font-size:13px;
  line-height:1.6;
  color:#c5ccd5;
}

#status{
  min-height:22px;
  margin-top:12px;
  text-align:center;
  color:#ffce66;
  font-size:14px;
}

#gameUI{
  position:fixed;
  inset:0;
  z-index:20;
  pointer-events:none;
  display:none;
  color:#fff;
}

#topBar{
  position:absolute;
  top:12px;
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:8px;
}

#healthBox,#matchBox{
  padding:9px 12px;
  border-radius:12px;
  background:rgba(0,0,0,.45);
  backdrop-filter:blur(8px);
  font-size:14px;
}

#health{
  margin-top:5px;
  width:170px;
  height:10px;
  overflow:hidden;
  border-radius:99px;
  background:#252525;
}

#healthBar{
  width:100%;
  height:100%;
  background:#48e27d;
  transition:width .15s;
}

#crosshair{
  position:absolute;
  left:50%;
  top:50%;
  width:18px;
  height:18px;
  margin-left:-9px;
  margin-top:-9px;
}

#crosshair::before,
#crosshair::after{
  content:"";
  position:absolute;
  background:#fff;
  box-shadow:0 0 3px #000;
}

#crosshair::before{
  width:2px;
  height:18px;
  left:8px;
  top:0;
}

#crosshair::after{
  width:18px;
  height:2px;
  left:0;
  top:8px;
}

#killMessage{
  position:absolute;
  left:50%;
  top:42%;
  transform:translate(-50%,-50%);
  font-size:28px;
  font-weight:900;
  text-shadow:0 3px 15px #000;
  opacity:0;
  transition:opacity .15s;
}

#scoreBoard{
  position:absolute;
  right:12px;
  top:70px;
  min-width:150px;
  max-width:220px;
  padding:10px;
  border-radius:12px;
  background:rgba(0,0,0,.45);
  backdrop-filter:blur(8px);
  font-size:12px;
}

.scoreRow{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin:3px 0;
}

.scoreAlive{
  color:#6dff8f;
}

.scoreDead{
  color:#ff7070;
}

#preStart{
  position:absolute;
  left:50%;
  top:58%;
  transform:translate(-50%,-50%);
  display:none;
  pointer-events:auto;
  text-align:center;
  width:min(92vw,520px);
}

.preStartButtons{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

.preStartSmallButton{
  min-width:105px;
  height:40px;
  padding:0 13px;
  border:1px solid rgba(255,255,255,.16);
  border-radius:10px;
  background:rgba(0,0,0,.48);
  color:#fff;
  font-size:13px;
  font-weight:800;
  pointer-events:auto;
  touch-action:none;
}

.preStartSmallButton:active{
  transform:scale(.97);
}

#startButton{
  touch-action:none;
  pointer-events:auto;
}

#startButton::before,
#startButton::after{
  pointer-events:none;
}

#preStartText{
  margin-bottom:12px;
  font-weight:800;
  font-size:16px;
}

#startButton{
  position:relative;
  z-index:10;
  display:block;
  margin:0 auto;
  width:105px;
  height:105px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.35);
  background:rgba(0,0,0,.42);
  color:#fff;
  font-size:18px;
  font-weight:900;
  overflow:hidden;
}

#startButton::before{
  content:"";
  position:absolute;
  inset:5px;
  border-radius:50%;
  background:
    conic-gradient(
      #36a3ff var(--progress,0%),
      rgba(255,255,255,.10) var(--progress,0%)
    );
  z-index:0;
}

#startButton::after{
  content:"";
  position:absolute;
  inset:13px;
  border-radius:50%;
  background:rgba(12,17,23,.94);
  z-index:1;
}

#startButton span{
  position:relative;
  z-index:2;
}

#protectionIndicator{
  position:absolute;
  left:50%;
  top:78px;
  transform:translateX(-50%);
  padding:8px 14px;
  border-radius:999px;
  background:rgba(30,130,255,.25);
  border:1px solid rgba(100,190,255,.65);
  box-shadow:0 0 22px rgba(50,150,255,.32);
  color:#dff5ff;
  font-size:14px;
  font-weight:900;
  letter-spacing:.2px;
  opacity:0;
  transition:opacity .12s;
  pointer-events:none;
  z-index:4;
}

#settingsModal{
  position:absolute;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  padding:18px;
  background:rgba(0,0,0,.62);
  backdrop-filter:blur(8px);
  pointer-events:auto;
  z-index:30;
}

.settingsBox{
  width:min(92vw,500px);
  max-height:88vh;
  overflow:auto;
  padding:20px;
  border-radius:18px;
  background:rgba(15,20,28,.96);
  border:1px solid rgba(255,255,255,.13);
  box-shadow:0 20px 80px rgba(0,0,0,.5);
}

.settingsTitle{
  margin:0 0 14px;
  text-align:center;
  font-size:22px;
  font-weight:900;
}

.settingRow{
  margin:12px 0;
}

.settingLabel{
  display:block;
  margin-bottom:7px;
  font-size:13px;
  font-weight:800;
}

.settingOptions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}

.settingOption{
  min-height:40px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:9px;
  background:rgba(255,255,255,.06);
  color:#fff;
  font-size:12px;
  font-weight:800;
  pointer-events:auto;
}

.settingOption.selected{
  background:#1976ff;
  border-color:#5ba7ff;
}

.settingRow.disabled{
  opacity:.27;
}

.settingRow.disabled .settingOption,
.settingRow.disabled input{
  pointer-events:none;
}

.settingNumber{
  width:100%;
  height:42px;
  padding:0 12px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:9px;
  background:rgba(255,255,255,.06);
  color:#fff;
  font-size:16px;
  outline:none;
}

.settingsHint{
  margin-top:4px;
  font-size:11px;
  opacity:.55;
}

.settingsButtons{
  display:flex;
  gap:8px;
  margin-top:16px;
}

.settingsButtons .button{
  margin-top:0;
}

#gameOver{
  position:fixed;
  inset:0;
  z-index:50;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.68);
  backdrop-filter:blur(10px);
  color:white;
}

.gameOverBox{
  width:min(88vw,430px);
  padding:28px;
  border-radius:22px;
  text-align:center;
  background:rgba(18,22,29,.94);
}

.gameOverTitle{
  font-size:38px;
  font-weight:900;
  margin-bottom:8px;
}

.gameOverText{
  font-size:18px;
  opacity:.85;
  margin-bottom:20px;
}

#mobileControls{
  display:none;
  position:absolute;
  inset:0;
  pointer-events:none;
}

#joystickZone{
  position:absolute;
  left:18px;
  bottom:20px;
  width:150px;
  height:150px;
  border-radius:50%;
  pointer-events:auto;
}

#joystickBase{
  position:absolute;
  left:50%;
  top:50%;
  width:118px;
  height:118px;
  margin-left:-59px;
  margin-top:-59px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.23);
  background:rgba(255,255,255,.06);
}

#joystickKnob{
  position:absolute;
  left:50%;
  top:50%;
  width:54px;
  height:54px;
  margin-left:-27px;
  margin-top:-27px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.16);
}

#lookZone{
  position:absolute;
  right:0;
  top:0;
  width:55%;
  height:70%;
  pointer-events:auto;
}

.mobileButton{
  position:absolute;
  border:1px solid rgba(255,255,255,.25);
  background:rgba(20,20,20,.45);
  color:#fff;
  border-radius:50%;
  backdrop-filter:blur(8px);
  pointer-events:auto;
  touch-action:none;
  z-index:10;
  font-weight:800;
  display:flex;
  justify-content:center;
  align-items:center;
}

#fireButton{
  width:88px;
  height:88px;
  right:24px;
  bottom:32px;
  background:rgba(220,50,50,.28);
  overflow:hidden;
}

#fireButton::before{
  content:"";
  position:absolute;
  inset:4px;
  pointer-events:none;
  border-radius:50%;
  background:
    conic-gradient(
      rgba(255,80,80,.9) var(--fireProgress,100%),
      rgba(255,255,255,.08) var(--fireProgress,100%)
    );
  z-index:0;
}

#fireButton::after{
  content:"";
  position:absolute;
  inset:12px;
  pointer-events:none;
  border-radius:50%;
  background:rgba(25,20,20,.9);
  z-index:1;
}

#fireButton span{
  position:relative;
  z-index:2;
}

#jumpButton{
  width:64px;
  height:64px;
  right:125px;
  bottom:44px;
  transition:
    opacity .12s,
    background .12s;
}

#jumpButton.grabInactive{
  opacity:.28;
  background:rgba(20,20,20,.25);
}

#jumpButton.grabActive{
  opacity:1;
  background:rgba(35,130,255,.55);
}

#grabButton{
  display:none !important;
}

#desktopHint{
  position:absolute;
  bottom:14px;
  left:50%;
  transform:translateX(-50%);
  padding:7px 11px;
  border-radius:8px;
  background:rgba(0,0,0,.38);
  font-size:12px;
  opacity:.65;
}

.hidden{
  display:none !important;
}

@media (pointer:coarse){

  #mobileControls{
    display:block;
  }

  #desktopHint{
    display:none;
  }

}
</style>
</head>

<body>

<div id="menu">

  <div class="menuBox">

    <h1 class="title">
      3D FPS
    </h1>

    <div class="subtitle">
      v1.0.0
    </div>

    <input
      id="nameInput"
      class="input"
      maxlength="16"
      placeholder="プレイヤー名"
      autocomplete="off"
    >

    <input
      id="matchCodeInput"
      class="input"
      maxlength="8"
      placeholder="試合コード"
      autocomplete="off"
    >

    <button
      id="matchButton"
      class="button"
    >
      試合を作成 / 参加
    </button>

    <button
      id="settingsButton"
      class="button secondary"
    >
      設定
    </button>

    <div
      id="status"
    >
      接続中...
    </div>

    <div
      class="info"
    >
      試合コードを空欄にすると新しい試合を作成します。<br>
      既存のコードを入力すると、その試合に参加します。
    </div>

  </div>

</div>


<div
  id="gameUI"
>

  <div
    id="topBar"
  >

    <div
      id="healthBox"
    >
      HP
      <div id="health">
        <div id="healthBar"></div>
      </div>
    </div>

    <div
      id="matchBox"
    >
      <div>
        CODE:
        <span id="currentMatchCode">
          -
        </span>
      </div>

      <button
        id="shareCodeButton"
        class="preStartSmallButton"
      >
        コード共有
      </button>

      <button
        id="leaveRoomButton"
        class="preStartSmallButton"
      >
        退出
      </button>
    </div>

  </div>


  <div
    id="crosshair"
  ></div>


  <div
    id="killMessage"
  ></div>


  <div
    id="scoreBoard"
  ></div>


  <div
    id="protectionIndicator"
  >
    START保護
  </div>


  <div
    id="preStart"
  >

    <div
      id="preStartText"
    >
      ホストがSTARTを長押ししてください
    </div>

    <button
      id="startButton"
    >
      <span>
        START
      </span>
    </button>

    <div
      class="preStartButtons"
    >

      <button
        id="settingsButtonInGame"
        class="preStartSmallButton"
      >
        設定
      </button>

      <button
        id="returnButton"
        class="preStartSmallButton"
      >
        ロビーへ
      </button>

    </div>

  </div>


  <div
    id="desktopHint"
  >
    WASD / Space / マウス
  </div>


  <div
    id="mobileControls"
  >

    <div
      id="joystickZone"
    >

      <div
        id="joystickBase"
      ></div>

      <div
        id="joystickKnob"
      ></div>

    </div>


    <div
      id="lookZone"
    ></div>


    <button
      id="jumpButton"
      class="mobileButton grabInactive"
    >
      JUMP
    </button>


    <button
      id="fireButton"
      class="mobileButton"
    >
      <span>
        FIRE
      </span>
    </button>

  </div>

</div>


<div
  id="settingsModal"
>

  <div
    class="settingsBox"
  >

    <h2
      class="settingsTitle"
    >
      設定
    </h2>


    <div
      class="settingRow"
    >

      <label
        class="settingLabel"
      >
        マップ
      </label>

      <div
        class="settingOptions"
        data-setting="map"
      >

        <button
          class="settingOption selected"
          data-value="normal"
        >
          Normal
        </button>

        <button
          class="settingOption"
          data-value="small"
        >
          Small
        </button>

        <button
          class="settingOption"
          data-value="large"
        >
          Large
        </button>

        <button
          class="settingOption"
          data-value="random"
        >
          Random
        </button>

      </div>

    </div>


    <div
      class="settingRow"
    >

      <label
        class="settingLabel"
      >
        最大HP
      </label>

      <div
        class="settingOptions"
        data-setting="maxHp"
      >

        <button
          class="settingOption selected"
          data-value="100"
        >
          100
        </button>

        <button
          class="settingOption"
          data-value="150"
        >
          150
        </button>

        <button
          class="settingOption"
          data-value="200"
        >
          200
        </button>

        <button
          class="settingOption"
          data-value="custom"
        >
          カスタム
        </button>

      </div>

      <input
        id="maxHpInput"
        class="settingNumber"
        type="number"
        min="1"
        max="999"
        value="100"
        style="display:none"
      >

    </div>


    <div
      class="settingRow"
    >

      <label
        class="settingLabel"
      >
        HP回復
      </label>

      <div
        class="settingOptions"
        data-setting="hpRegen"
      >

        <button
          class="settingOption selected"
          data-value="none"
        >
          なし
        </button>

        <button
          class="settingOption"
          data-value="slow"
        >
          遅い
        </button>

        <button
          class="settingOption"
          data-value="medium"
        >
          中
        </button>

        <button
          class="settingOption"
          data-value="fast"
        >
          速い
        </button>

      </div>

    </div>


    <div
      id="regenLockRow"
      class="settingRow disabled"
    >

      <label
        class="settingLabel"
      >
        被ダメージ後の回復待機時間（秒）
      </label>

      <input
        id="regenLockInput"
        class="settingNumber"
        type="number"
        min="0"
        max="60"
        step="0.5"
        value="3"
      >

      <div
        class="settingsHint"
      >
        HP回復が有効な場合のみ使用されます。
      </div>

    </div>


    <div
      class="settingRow"
    >

      <label
        class="settingLabel"
      >
        地形
      </label>

      <div
        class="settingOptions"
        data-setting="terrain"
      >

        <button
          class="settingOption selected"
          data-value="none"
        >
          なし
        </button>

        <button
          class="settingOption"
          data-value="low"
        >
          少ない
        </button>

        <button
          class="settingOption"
          data-value="medium"
        >
          中
        </button>

        <button
          class="settingOption"
          data-value="high"
        >
          多い
        </button>

      </div>

    </div>


    <div
      id="terrainHeightRow"
      class="settingRow disabled"
    >

      <label
        class="settingLabel"
      >
        地形高さ
      </label>

      <div
        class="settingOptions"
        data-setting="terrainHeight"
      >

        <button
          class="settingOption selected"
          data-value="low"
        >
          低い
        </button>

        <button
          class="settingOption"
          data-value="medium"
        >
          中
        </button>

        <button
          class="settingOption"
          data-value="high"
        >
          高い
        </button>

        <button
          class="settingOption"
          data-value="random"
        >
          Random
        </button>

      </div>

    </div>


    <div
      class="settingRow"
    >

      <label
        class="settingLabel"
      >
        試合時間（秒）
      </label>

      <input
        id="matchTimeInput"
        class="settingNumber"
        type="number"
        min="10"
        max="3600"
        value="300"
      >

    </div>


    <div
      class="settingRow"
    >

      <label
        class="settingLabel"
      >
        復活
      </label>

      <div
        class="settingOptions"
        data-setting="respawn"
      >

        <button
          class="settingOption selected"
          data-value="none"
        >
          なし
        </button>

        <button
          class="settingOption"
          data-value="3"
        >
          3秒
        </button>

        <button
          class="settingOption"
          data-value="5"
        >
          5秒
        </button>

        <button
          class="settingOption"
          data-value="10"
        >
          10秒
        </button>

      </div>

    </div>


    <div
      class="settingsButtons"
    >

      <button
        id="closeSettingsButton"
        class="button secondary"
      >
        キャンセル
      </button>

      <button
        id="saveSettingsButton"
        class="button"
      >
        保存
      </button>

    </div>

  </div>

</div>


<div
  id="gameOver"
>

  <div
    class="gameOverBox"
  >

    <div
      id="gameOverTitle"
      class="gameOverTitle"
    >
      GAME OVER
    </div>

    <div
      id="gameOverText"
      class="gameOverText"
    ></div>

    <button
      id="gameOverReturnButton"
      class="button"
    >
      ロビーへ
    </button>

  </div>

</div>


<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  signInAnonymously,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  updateDoc,
  deleteDoc,
  onSnapshot,
  runTransaction,
  collection,
  getDocs,
  query,
  where
} from

function clamp(
  value,
  min,
  max
){

  return Math.max(
    min,
    Math.min(
      max,
      value
    )
  );

}


function randomRange(
  min,
  max
){

  return (
    Math.random() *
    (max - min)
  ) + min;

}


function sanitizeName(
  name
){

  return String(
    name || ""
  )
    .trim()
    .slice(
      0,
      16
    )
    .replace(
      /[<>]/g,
      ""
    );

}


function generateMatchCode(){

  const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let code =
    "";

  for(
    let i = 0;
    i < 6;
    i++
  ){

    code +=
      chars[
        Math.floor(
          Math.random() *
          chars.length
        )
      ];

  }

  return code;

}


function normalizeSettings(
  settings
){

  const source =
    settings || {};

  return {

    map:
      source.map ||
      defaultSettings.map,

    maxHp:
      Math.max(
        1,
        Number(
          source.maxHp ||
          defaultSettings.maxHp
        )
      ),

    hpRegen:
      source.hpRegen ||
      defaultSettings.hpRegen,

    regenLock:
      Math.max(
        0,
        Number(
          source.regenLock ??
          defaultSettings.regenLock
        )
      ),

    terrainAmount:
      source.terrainAmount ||
      defaultSettings.terrainAmount,

    terrainHeight:
      source.terrainHeight ||
      defaultSettings.terrainHeight,

    matchTime:
      Math.max(
        10,
        Number(
          source.matchTime ||
          defaultSettings.matchTime
        )
      ),

    respawn:
      source.respawn ||
      defaultSettings.respawn

  };

}


function getSelectedValue(
  setting
){

  const group =
    document.querySelector(
      `.settingOptions[data-setting="${setting}"]`
    );

  if(!group){

    return null;

  }

  const selected =
    group.querySelector(
      ".settingOption.selected"
    );

  return selected
    ? selected.dataset.value
    : null;

}


function readSettingsUI(){

    getSelectedValue(

  if(
    maxHp ===
    "custom"
  ){

    maxHp =
      Number(
        maxHpInput.value
      );

  }else{

    maxHp =
      Number(
        maxHp
      );

  }


  return normalizeSettings({

    map:

      ),

    maxHp,

    hpRegen:

      ),

    regenLock:

      ),

    matchTime:
      Number(
        matchTimeInput.value

      getSelectedValue(
        "respawn"

  });

}


function applySettingsUI(
  settings
){

  const normalized =
    normalizeSettings(
      settings
    );


  document
    .querySelectorAll(
      ".settingOptions"
    )
    .forEach(
      group => {

        const setting =
          group.dataset.setting;

        let value =
          normalized[
            setting
          ];

        if(
          setting ===
          "terrain"
        ){

          value =
            normalized.terrainAmount;

        }


        if(
          setting ===
          "maxHp" &&
          !["100","150","200"].includes(
            String(value)
          )
        ){

          group
            .querySelectorAll(
              ".settingOption"
            )
            .forEach(
              item =>
                item.classList.remove(
                  "selected"
                )
            );

          group
            .querySelector(
              '[data-value="custom"]'
            )
            ?.classList.add(
              "selected"
            );

          maxHpInput.value =
            String(
              value
            );

          maxHpInput.style.display =
            "block";

          return;

        }


        group
          .querySelectorAll(
            ".settingOption"
          )
          .forEach(
            item => {

              item.classList.toggle(
                "selected",
                item.dataset.value ===
                String(value)
              );

            }
          );

      }
    );


  regenLockInput.value =
    String(
      normalized.regenLock
    );

  matchTimeInput.value =
    String(
      normalized.matchTime
    );


  maxHpInput.style.display =
    getSelectedValue(
      "maxHp"
    ) === "custom"
      ? "block"
      : "none";


  terrainHeightRow.classList.toggle(
    "disabled",
    normalized.terrainAmount ===
    "none"
  );

  regenLockRow.classList.toggle(
    "disabled",
    normalized.hpRegen ===
    "none"
  );

}

function getFriendlyError(
  error
){

  const code =
    error?.code ||
    "";

  const messages = {

    "auth/configuration-not-found":
      "Firebase Authenticationの設定を確認してください",

    "auth/admin-restricted-operation":
      "匿名ログインがFirebase Consoleで許可されていません",

    "permission-denied":
      "Firestoreのルールで拒否されました",

    "not-found":
      "試合が見つかりません",

    "already-exists":
      "すでに存在しています"

  };


  return (
    messages[code] ||
    error?.message ||
    "不明なエラー"
  );

}


async function ensureAuth(){

  return new Promise(
    (
      resolve,
      reject
    ) => {

      let finished =
        false;


      const unsubscribe =
        onAuthStateChanged(
          auth,
          user => {

            if(
              user
            ){

              currentUser =
                user;

              if(
                !finished
              ){

                finished =
                  true;

                unsubscribe();

                resolve(
                  user
                );

              }

            }

          },
          error => {

            if(
              !finished
            ){

              finished =
                true;

              unsubscribe();

              reject(
                error
              );

            }

          }
        );


      signInAnonymously(
        auth
      ).catch(
        error => {

          if(
            !finished
          ){

            finished =
              true;

            unsubscribe();

            reject(
              error
            );

          }

        }
      );

    }
  );

}

function clearWorld(){

  for(
    const object of
    worldObjects
  ){

    scene?.remove(
      object
    );

    object.geometry?.dispose();
    object.material?.dispose();

  }


  worldObjects.length =
    0;


  for(
    const mesh of
    playerMeshes.values()
  ){

    scene?.remove(
      mesh
    );

  }


  playerMeshes.clear();


  for(
    const bullet of
    bullets
  ){

    scene?.remove(
      bullet.mesh
    );

  }


  bullets.length =
    0;

}


function createBox(
  x,
  y,
  z,
  sx,
  sy,
  sz,
  material
){

  const geometry =
    new THREE.BoxGeometry(
      sx,
      sy,
      sz
    );

  const mesh =
    new THREE.Mesh(
      geometry,
      material
    );

  mesh.position.set(
    x,
    y,
    z
  );

  scene.add(
    mesh
  );

  worldObjects.push(
    mesh
  );

  return mesh;

}

function resizeRenderer(){

    !renderer ||
    !camera
  ){

    return;

  }


  camera.aspect =
    innerWidth /
    innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    innerWidth,
    innerHeight
  );

}


function getPlayerColor(
  uid
){

  if(
    uid ===
    currentUser?.uid
  ){

    return 0x36a3ff;

  }


  let hash =
    0;

  for(
    const char of
    String(uid)
  ){

    hash =
      (
        hash * 31 +
        char.charCodeAt(0)
      ) |
      0;

  }


  const colors = [

    0xff5252,
    0xffb52e,
    0x9c6cff,
    0xff5cc8,
    0x48e27d,
    0x4dd0e1

  ];


  return colors[
    Math.abs(
      hash
    ) %
    colors.length
  ];

}


function createPlayerMesh(
  player
){

  const group =
    new THREE.Group();


  const material =
    new THREE.MeshStandardMaterial({
      color:
        getPlayerColor(
          player.uid
        )
    });


  const body =
    new THREE.Mesh(
      new THREE.CapsuleGeometry(
        .38,
        1.0,
        6,
        12
      ),
      material
    );


  body.position.y =
    .85;


  group.add(
    body
  );


  const head =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .38,
        12,
        12
      ),
      material
    );


  head.position.y =
    1.65;


  group.add(
    head
  );


  group.position.set(
    player.x,
    0,
    player.z
  );


  scene.add(
    group
  );


  playerMeshes.set(
    player.uid,
    group
  );


  return group;

}


function updatePlayerMeshes(){

  const currentIds =
    new Set(
      Object.keys(
        players
      )
    );


  for(
    const [uid,mesh] of
    playerMeshes
  ){

    if(
      !currentIds.has(
        uid
      )
    ){

      scene.remove(
        mesh
      );

      playerMeshes.delete(
        uid
      );

    }

  }


  for(
    const [uid,player] of
    Object.entries(
      players
    )
  ){

    if(
      uid ===
      currentUser.uid
    ){

      continue;

    }


    let mesh =
      playerMeshes.get(
        uid
      );


    if(!mesh){

      mesh =
        createPlayerMesh(
          player
        );

    }


    mesh.position.x =
      player.x;

    mesh.position.z =
      player.z;

    mesh.visible =
      !!player.alive;

  }

}


function updateCamera(){

    !localPlayer

    return;

  }


  camera.position.set(
    localPlayer.x,
    localPlayer.y + .35,
    localPlayer.z
  );


  camera.rotation.y =
    cameraState.yaw;

  camera.rotation.x =
    cameraState.pitch;

}


function isPointInsideWorld(
  x,
  z
){

  return (
    x > -39 &&
    x < 39 &&
    z > -39 &&
    z < 39
  );

}


function checkWorldCollision(
  x,
  y,
  z
){

  if(
    !isPointInsideWorld(
      x,
      z
    )
  ){

    return true;

  }


  const radius =
    .38;


  for(
    const object of
    worldObjects
  ){

    const box =
      new THREE.Box3()
        .setFromObject(
          object
        );


    box.expandByScalar(
      radius
    );


    if(
      x >= box.min.x &&
      x <= box.max.x &&
      y >= box.min.y &&
      y <= box.max.y &&
      z >= box.min.z &&
      z <= box.max.z
    ){

      return true;

    }

  }


  return false;

}

  if(
    grounded ||
    grabbed ||
    !localPlayer
  ){

    return false;

  }


  const direction =
    new THREE.Vector3(
      0,
      0,
      -1
    );


  direction.applyEuler(
    new THREE.Euler(
      0,
      cameraState.yaw,
      0
    )
  );


  const origin =
    new THREE.Vector3(
      localPlayer.x,
      localPlayer.y,
      localPlayer.z
    );


  const raycaster =
    new THREE.Raycaster(
      origin,
      direction.normalize(),
      0,
      .8
    );


  const hits =
    raycaster.intersectObjects(
      worldObjects,
      false
    );


  if(
    hits.length ===
    0
  ){

    return false;

  }


  const hit =
    hits[0];


  return (
    hit.point.y >
    localPlayer.y -
    .2
  );

}

function updateMovement(
  delta
){

  if(
    !localPlayer ||
    gameEnded
  ){

    return;

  }


  let forward =
    0;

  let right =
    0;


  if(
    keys.has(
      "KeyW"
    )
  ){

    forward +=
      1;

  }

  if(
    keys.has(
      "KeyS"
    )
  ){

    forward -=
      1;

  }

  if(
    keys.has(
      "KeyD"
    )
  ){

    right +=
      1;

  }

  if(
    keys.has(
      "KeyA"
    )
  ){

    right -=
      1;

  }


  if(
    mobileInput.x ||
    mobileInput.y
  ){

    right +=
      mobileInput.x;

    forward +=
      -mobileInput.y;

  }


  const length =
    Math.hypot(
      forward,
      right
    );


  if(
    length >
    1
  ){

    forward /=
      length;

    right /=
      length;

  }


  const speed =
    7;


  const sin =
    Math.sin(
      cameraState.yaw
    );

  const cos =
    Math.cos(
      cameraState.yaw
    );


  const moveX =
    (
      right * cos +
      forward * sin
    ) *
    speed *
    delta;


  const moveZ =
    (
      -right * sin +
      forward * cos
    ) *
    speed *
    delta;


  let nextX =
    localPlayer.x +
    moveX;


  let nextZ =
    localPlayer.z +
    moveZ;


  if(
    !checkWorldCollision(
      nextX,
      localPlayer.y,
      localPlayer.z
    )
  ){

    localPlayer.x =
      nextX;

  }


  if(
    !checkWorldCollision(
      localPlayer.x,
      localPlayer.y,
      nextZ
    )
  ){

    localPlayer.z =
      nextZ;

  }


  if(
    keys.has(
      "Space"
    ) &&
    grounded
  ){

    jump();

  }


  if(
    !grabbed
  ){

    velocityY -=
      15 *
      delta;

    const nextY =
      localPlayer.y +
      velocityY *
      delta;


    if(
      nextY <=
      1.6
    ){

      localPlayer.y =
        1.6;

      velocityY =
        0;

      grounded =
        true;

    }else{

      if(
        !checkWorldCollision(
          localPlayer.x,
          nextY,
          localPlayer.z
        )
      ){

        localPlayer.y =
          nextY;

        grounded =
          false;

      }else{

        velocityY =
          0;

      }

    }

  }


  updateCamera();

}


function createBullet(){

  if(
    !localPlayer ||
    !localPlayer.alive
  ){

    return;

  }


  const direction =
    new THREE.Vector3(
      0,
      0,
      -1
    );


  direction.applyEuler(
    new THREE.Euler(
      cameraState.pitch,
      cameraState.yaw,
      0,
      "YXZ"
    )
  );


  const geometry =
    new THREE.SphereGeometry(
      .07,
      8,
      8
    );


  const material =
    new THREE.MeshBasicMaterial({
      color:
        0xffe45c
    });


  const mesh =
    new THREE.Mesh(
      geometry,
      material
    );


  mesh.position.set(
    localPlayer.x,
    localPlayer.y + .35,
    localPlayer.z
  );


  scene.add(
    mesh
  );


  bullets.push({

    mesh,

    velocity:
      direction
        .normalize()
        .multiplyScalar(
          35
        ),

    owner:
      currentUser.uid,

    life:
      0

  });

}


function shoot(){

  if(
    !gameStarted ||
    gameEnded ||
    !localPlayer ||
    !localPlayer.alive
  ){

    return;

  }


  const now =
    performance.now();


  if(
    now -
    lastShotTime <
    150
  ){

    return;

  }


  lastShotTime =
    now;


  createBullet();

}


function updateBullets(
  delta,
  time
){

  for(
    let i =
      bullets.length -
      1;
    i >= 0;
    i--
  ){

    const bullet =
      bullets[i];


    bullet.life +=
      delta;


    if(
      bullet.life >
      2
    ){

      scene.remove(
        bullet.mesh
      );

      bullet.mesh.geometry.dispose();
      bullet.mesh.material.dispose();

      bullets.splice(
        i,
        1
      );

      continue;

    }


    const oldPosition =
      bullet.mesh.position.clone();


    bullet.mesh.position.addScaledVector(
      bullet.velocity,
      delta
    );


    const direction =
      bullet.mesh.position
        .clone()
        .sub(
          oldPosition
        );


    const distance =
      direction.length();


    if(
      distance >
      0
    ){

      const raycaster =
        new THREE.Raycaster(
          oldPosition,
          direction.normalize(),
          0,
          distance
        );


      const hits =
        raycaster.intersectObjects(
          worldObjects,
          false
        );


      if(
        hits.length
      ){

        scene.remove(
          bullet.mesh
        );

        bullet.mesh.geometry.dispose();
        bullet.mesh.material.dispose();

        bullets.splice(
          i,
          1
        );

        continue;

      }

    }


    for(
      const [uid,player] of
      Object.entries(
        players
      )
    ){

      if(
        uid ===
        bullet.owner ||
        !player.alive
      ){

        continue;

      }


      const dx =
        bullet.mesh.position.x -
        player.x;

      const dy =
        bullet.mesh.position.y -
        (
          player.y +
          .9
        );

      const dz =
        bullet.mesh.position.z -
        player.z;


      if(
        dx * dx +
        dy * dy +
        dz * dz <
        .75
      ){

        handleBulletHit(
          uid,
          bullet.owner
        );


        scene.remove(
          bullet.mesh
        );

        bullet.mesh.geometry.dispose();
        bullet.mesh.material.dispose();

        bullets.splice(
          i,
          1
        );

        break;

      }

    }

  }

}


async function handleBulletHit(
  targetUid,
  shooterUid
){

  if(
    !matchRef ||
    !matchHasStarted
  ){

    return;

  }


  try{

    await runTransaction(
      db,
      async transaction => {

        const snap =
          await transaction.get(
            matchRef
          );


        if(
          !snap.exists()
        ){

          return;

        }


        const data =
          snap.data();


        if(
          data.status !==
          "active"
        ){

          return;

        }


        const allPlayers =
          {
            ...(data.players || {})
          };


        const target =
          allPlayers[
            targetUid
          ];


        if(
          !target ||
          !target.alive
        ){

          return;

        }


        const settings =
          normalizeSettings(
            data.settings
          );


        target.hp =
          Math.max(
            0,
            Number(
              target.hp ||
              0
            ) -
            25
          );


        target.lastDamageAt =
          Date.now();


        if(
          target.hp <=
          0
        ){

          target.hp =
            0;

          target.alive =
            false;

          target.deaths =
            Number(
              target.deaths ||
              0
            ) + 1;


          const shooter =
            allPlayers[
              shooterUid
            ];


          if(
            shooter
          ){

            shooter.kills =
              Number(
                shooter.kills ||
                0
              ) + 1;

            allPlayers[
              shooterUid
            ] =
              shooter;

          }


          const respawnSeconds =
            Number(
              settings.respawn
            );


          if(
            respawnSeconds >
            0
          ){

            target.respawnAt =
              Date.now() +
              respawnSeconds *
              1000;

          }

        }


        allPlayers[
          targetUid
        ] =
          target;


        transaction.update(
          matchRef,
          {
            players:
              allPlayers
          }
        );

      }
    );

  }catch(error){

    console.error(
      "hit error",
      error
    );

  }

}

function updateScoreBoard(){

  const entries =
    Object.values(
      players
    )
      .sort(
        (
          a,
          b
        ) =>
          Number(
            b.kills ||
            0
          ) -
          Number(
            a.kills ||
            0
          )
      );


  scoreBoard.innerHTML =
    entries
      .map(
        player => {

          const aliveClass =
            player.alive
              ? "scoreAlive"
              : "scoreDead";


          return `
            <div class="scoreRow ${aliveClass}">
              <span>${escapeHtml(player.name || "Player")}</span>
              <span>${Number(player.kills || 0)} / ${Number(player.deaths || 0)}</span>
            </div>
          `;

        }
      )
      .join(
        ""
      );

}


function escapeHtml(
  text
){

  return String(
    text
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}

async function checkMatchEnd(){

  if(
    !matchRef ||
    !matchHasStarted ||
    gameEnded
  ){

    return;

  }


  try{

    const snap =
      await getDoc(
        matchRef
      );


    if(
      !snap.exists()
    ){

      return;

    }


    const data =
      snap.data();


    if(
      data.status !==
      "active"
    ){

      return;

    }


    const startedAt =
      Number(
        data.startedAt ||
        0
      );


    const settings =
      normalizeSettings(
        data.settings
      );


    if(
      startedAt &&
      Date.now() -
      startedAt >=
      settings.matchTime *
      1000
    ){

      await endMatch();

    }

  }catch(error){

    console.error(
      "match end check",
      error
    );

  }

}


async function endMatch(){

  if(
    gameEnded
  ){

    return;

  }


  gameEnded =
    true;


  if(
    matchRef
  ){

    try{

      await updateDoc(
        matchRef,
        {
          status:
            "ended",

          endedAt:
            Date.now()
        }
      );

    }catch(error){

      console.error(
        error
      );

    }

  }


  const sorted =
    Object.values(
      players
    )
      .sort(
        (
          a,
          b
        ) =>
          Number(
            b.kills ||
            0
          ) -
          Number(
            a.kills ||
            0
          )
      );


  const winner =
    sorted[0];


  gameOverTitle.textContent =
    "TIME UP";


  gameOverText.textContent =
    winner
      ? `${winner.name} : ${winner.kills || 0} Kills`
      : "試合終了";


  gameOver.style.display =
    "flex";

}


function handleMatchSnapshot(
  snapshot
){

  if(
    !snapshot.exists()
  ){

    statusEl.textContent =
      "試合が削除されました";

    leaveRoom(
      false
    );

    return;

  }


  const data =
    snapshot.data();


  currentSettings =
    normalizeSettings(
      data.settings
    );


  players =
    data.players ||
    {};


  matchHasStarted =
    data.status ===
    "active";


  updateLocalFromPlayers();
  updatePlayerMeshes();
  updateScoreBoard();


  if(
    data.status ===
    "waiting"
  ){

    preStart.style.display =
      "block";


    preStartText.textContent =
      isHost
        ? "STARTを長押しして試合開始"
        : "ホストがSTARTを長押ししてください";

  }else if(
    data.status ===
    "active"
  ){

    preStart.style.display =
      "none";


    if(
      !gameStarted
    ){

      gameStarted =
        true;

      buildWorld();

    }

  }else if(
    data.status ===
    "ended"
  ){

    if(
      !gameEnded
    ){

      gameEnded =
        true;

    }

    preStart.style.display =
      "none";

  }

}


function subscribeMatch(){

  if(
    matchUnsubscribe
  ){

    matchUnsubscribe();

  }


  matchUnsubscribe =
    onSnapshot(
      matchRef,
      handleMatchSnapshot,
      error => {

        console.error(
          "snapshot error",
          error
        );

        statusEl.textContent =
          "通信エラー：" +
          getFriendlyError(
            error
          );

      }
    );

}

async function joinMatch(

  name
){

    doc(
      db,
      "matches",
      code

    await getDoc(
      ref
    );


  if(
    !snap.exists()
  ){

      "not-found"
    );

    snap.data();


  if(
    data.status ===
    "ended"
  ){

    throw new Error(
      "この試合は終了しています"
    );

  }


  const settings =
    normalizeSettings(
      data.settings
    );


  const spawn =
    getSpawnPosition();


  const player = {

    uid:
      currentUser.uid,

    name,

    x:
      spawn.x,

    y:
      spawn.y,

    z:
      spawn.z,

      0,

    pitch:
      0,

    hp:
      settings.maxHp,

    alive:
      true,

    kills:
      0,

    deaths:
      0,

    lastDamageAt:
      0,

    lastActiveAt:
      Date.now()

  };

      ...(data.players || {}),

  await updateDoc(
    ref,
    {
      players:
        updatedPlayers
    }
  );


  matchRef =
    ref;

  currentMatchCode =

  isHost =

  matchHasStarted =
    data.status ===
    "active";

    matchHasStarted;

    player;


  currentSettings =
    settings;


  currentMatchCodeEl.textContent =
    code;

    "none";

  gameUI.style.display =
    "block";

    gameStarted
  ){

    buildWorld();

  }

}

        );

      ){

        const updatedPlayers =
          {
            ...(data.players || {})
          };


        delete updatedPlayers[
          currentUser.uid
        ];


        if(
          Object.keys(
            updatedPlayers
          ).length ===
          0
        ){

          await deleteDoc(
            matchRef
          );

        }else if(
          data.hostUid ===
          currentUser.uid
        ){

          const nextHost =
            Object.keys(
              updatedPlayers
            )[0];


          await updateDoc(
            matchRef,
            {

              players:
                updatedPlayers,

              hostUid:
                nextHost

            }
          );

        }else{

          await updateDoc(
            matchRef,
            {
              players:
                updatedPlayers
            }
          );

        }

      }

    }catch(error){

      console.error(
        "leave error",
        error
      );

    }

  }


  matchRef =
    null;

  currentMatchCode =
    "";

  currentMatchCodeEl.textContent =
    "-";

  isHost =
    false;

  matchHasStarted =
    false;

  gameStarted =
    false;

  gameEnded =
    false;

  players =
    {};

  localPlayer =
    null;


  if(
    renderer
  ){

    renderer.domElement.remove();

    renderer =
      null;

  }


  scene =
    null;

  camera =
    null;


  if(
    showMenu
  ){

    gameUI.style.display =
      "none";

    gameOver.style.display =
      "none";

    preStart.style.display =
      "none";

    menu.style.display =
      "flex";

  }

}


function handleReturn(){

  leaveRoom(
    true
  );

}


gameOverReturnButton.addEventListener(
  "click",
  handleReturn
);


function setupDesktopInput(){

  window.addEventListener(
    "keydown",
    event => {

      keys.add(
        event.code
      );


      if(
        event.code ===
        "Space"
      ){

        event.preventDefault();

      }


      markActivity();

    }
  );


  window.addEventListener(
    "keyup",
    event => {

      keys.delete(
        event.code
      );

    }
  );


  document.addEventListener(
    "mousemove",
    event => {

      if(
        document.pointerLockElement ===
        renderer?.domElement
      ){

        cameraState.yaw -=
          event.movementX *
          .0025;

        cameraState.pitch -=
          event.movementY *
          .0025;


        cameraState.pitch =
          clamp(
            cameraState.pitch,
            -1.45,
            1.45
          );


        markActivity();

      }

    }
  );


  document.addEventListener(
    "pointerlockchange",
    () => {

      if(
        document.pointerLockElement !==
        renderer?.domElement
      ){

        return;

      }

    }
  );

}


function requestPointerLock(){

  if(
    renderer?.domElement?.requestPointerLock
  ){

    renderer.domElement
      .requestPointerLock();

  }

}


function setupMobileInput(){

  if(
    !joystickZone ||
    !lookZone ||
    !fireButton ||
    !jumpButton
  ){

    return;

  }


  function updateJoystick(
    clientX,
    clientY
  ){

    const rect =
      joystickZone.getBoundingClientRect();


    const centerX =
      rect.left +
      rect.width / 2;

    const centerY =
      rect.top +
      rect.height / 2;


    let dx =
      clientX -
      centerX;

    let dy =
      clientY -
      centerY;


    const maxDistance =
      55;


    const distance =
      Math.hypot(
        dx,
        dy
      );


    if(
      distance >
      maxDistance
    ){

      const ratio =
        maxDistance /
        distance;

      dx *=
        ratio;

      dy *=
        ratio;

    }


    mobileInput.x =
      dx /
      maxDistance;

    mobileInput.y =
      dy /
      maxDistance;


    joystickKnob.style.transform =
      `translate(${dx}px,${dy}px)`;

  }


  joystickZone.addEventListener(
    "pointerdown",
    event => {

      joystickPointerId =
        event.pointerId;


      joystickZone.setPointerCapture(
        event.pointerId
      );


      updateJoystick(
        event.clientX,
        event.clientY
      );

    }
  );


  joystickZone.addEventListener(
    "pointermove",
    event => {

      if(
        event.pointerId ===
        joystickPointerId
      ){

        updateJoystick(
          event.clientX,
          event.clientY
        );

      }

    }
  );


  const endJoystick =
    event => {

      if(
        event.pointerId !==
        joystickPointerId
      ){

        return;

      }


      joystickPointerId =
        null;


      mobileInput.x =
        0;

      mobileInput.y =
        0;


      joystickKnob.style.transform =
        "translate(0,0)";

    };


  joystickZone.addEventListener(
    "pointerup",
    endJoystick
  );


  joystickZone.addEventListener(
    "pointercancel",
    endJoystick
  );


  let lookPointerId =
    null;

  let lastLookX =
    0;

  let lastLookY =
    0;


  lookZone.addEventListener(
    "pointerdown",
    event => {

      lookPointerId =
        event.pointerId;


      lastLookX =
        event.clientX;


      lastLookY =
        event.clientY;


      lookZone.setPointerCapture(
        event.pointerId
      );

    }
  );


  lookZone.addEventListener(
    "pointermove",
    event => {

      if(
        event.pointerId !==
        lookPointerId
      ){

        return;

      }


      const dx =
        event.clientX -
        lastLookX;


      const dy =
        event.clientY -
        lastLookY;


      lastLookX =
        event.clientX;


      lastLookY =
        event.clientY;


      if(
        dx !== 0 ||
        dy !== 0
      ){

        markActivity();

      }


      cameraState.yaw -=
        dx *
        .006;


      cameraState.pitch -=
        dy *
        .006;


      cameraState.pitch =
        clamp(
          cameraState.pitch,
          -1.45,
          1.45
        );

    }
  );


  const endLook =
    event => {

      if(
        event.pointerId ===
        lookPointerId
      ){

        lookPointerId =
          null;

      }

    };


  lookZone.addEventListener(
    "pointerup",
    endLook
  );


  lookZone.addEventListener(
    "pointercancel",
    endLook
  );


  fireButton.addEventListener(
    "pointerdown",
    event => {

      event.preventDefault();

      fireHolding =
        true;

      mobileInput.firing =
        true;

      shoot();

    }
  );


  fireButton.addEventListener(
    "pointerup",
    event => {

      event.preventDefault();

      fireHolding =
        false;

      mobileInput.firing =
        false;

    }
  );


  fireButton.addEventListener(
    "pointercancel",
    () => {

      fireHolding =
        false;

      mobileInput.firing =
        false;

    }
  );


  jumpButton.addEventListener(
    "pointerdown",
    event => {

      event.preventDefault();


      if(
        !grounded &&
        canGrab()
      ){

        startGrab();

      }else if(
        grounded
      ){

        jump();

      }

    }
  );

}


function setupStartButton(){

  const startDown =
    event => {

      event.preventDefault();


      if(
        !isHost ||
        matchHasStarted
      ){

        return;

      }


      markActivity();

      startHolding =
        true;

      startHoldStart =
        performance.now();

    };


  const startUp =
    event => {

      event.preventDefault();

      startHolding =
        false;

      startButton.style.setProperty(
        "--progress",
        "0%"
      );

    };


  startButton.addEventListener(
    "pointerdown",
    startDown
  );


  startButton.addEventListener(
    "pointerup",
    startUp
  );


  startButton.addEventListener(
    "pointercancel",
    startUp
  );

}


function setupRendererInput(){

  if(
    !renderer
  ){

    return;

  }


  renderer.domElement.addEventListener(
    "mousedown",
    event => {

      if(
        event.button ===
        0
      ){

        requestPointerLock();

        shoot();

      }

    }
  );

}


function updateStartProgress(){

  if(
    !startHolding ||
    !isHost ||
    matchHasStarted
  ){

    return;

  }


  const elapsed =
    performance.now() -
    startHoldStart;


  const required =
    1500;


  const progress =
    clamp(
      elapsed /
      required,
      0,
      1
    );


  startButton.style.setProperty(
    "--progress",
    `${progress * 100}%`
  );


  if(
    progress >=
    1 &&
    !startTriggered
  ){

    startTriggered =
      true;

    startHolding =
      false;

    startMatch();

  }

}


async function startMatch(){

  if(
    !matchRef ||
    !isHost ||
    matchHasStarted
  ){

    return;

  }


  try{

    await updateDoc(
      matchRef,
      {

        status:
          "active",

        startedAt:
          Date.now()

      }
    );

  }catch(error){

    console.error(
      "start error",
      error
    );

    startTriggered =
      false;

  }

}


function gameLoop(
  time
){

  const delta =
    Math.min(

      (
        time -
        lastFrameTime
      ) /
      1000,

      .05

    );


  lastFrameTime =
    time;


  updateStartProgress();

  updateFireUI();
  updateProtectionIndicator();


  if(
    gameStarted &&
    !gameEnded
  ){

    updateMovement(
      delta
    );


    updateGrabAnimation(
      time
    );


    if(
      mobileInput.firing
    ){

      shoot();

    }


    updateBullets(
      delta,
      time
    );


    regenerateLocalPlayer();
    updateProtectionIndicator();


    syncLocalPlayer();

  }


  if(
    renderer &&
    scene &&
    camera
  ){

    renderer.render(
      scene,
      camera
    );

  }


  requestAnimationFrame(
    gameLoop
  );

}


let lastFrameTime =
  performance.now();


function updateFireUI(){

  if(
    !fireButton
  ){

    return;

  }


  const now =
    performance.now();


  const cooldown =
    150;


  const elapsed =
    now -
    lastShotTime;


  const progress =
    clamp(
      elapsed /
      cooldown *
      100,
      0,
      100
    );


  fireButton.style.setProperty(
    "--fireProgress",
    `${progress}%`
  );

}


async function regenerateLocalPlayer(){

  if(
    !matchRef ||
    !localPlayer ||
    !localPlayer.alive ||
    !matchHasStarted ||
    gameEnded
  ){

    return;

  }


  const settings =
    normalizeSettings(
      currentSettings
    );


  const rate =
    getRegenRate();


  if(
    rate <=
    0
  ){

    return;

  }


  const now =
    performance.now();


  if(
    now -
    lastRegenTick <
    250
  ){

    return;

  }


  const elapsed =
    lastRegenTick >
    0
      ? Math.min(
          .5,
          (
            now -
            lastRegenTick
          ) /
          1000
        )
      : .25;


  lastRegenTick =
    now;


  if(
    Date.now() -
    Number(
      localPlayer.lastDamageAt ||
      0
    ) <
    settings.regenLock *
    1000
  ){

    return;

  }


  try{

    await runTransaction(
      db,
      async transaction => {

        const snap =
          await transaction.get(
            matchRef
          );


        if(
          !snap.exists()
        ){

          return;

        }


        const data =
          snap.data();


        if(
          data.status !==
          "active"
        ){

          return;

        }


        const players =
          {
            ...(data.players || {})
          };


        const player =
          players[
            currentUser.uid
          ];


        if(
          !player ||
          !player.alive
        ){

          return;

        }


        const latestSettings =
          normalizeSettings(
            data.settings
          );


        const latestRate =
          getRegenRateFromSettings(
            latestSettings
          );


        if(
          latestRate <=
          0
        ){

          return;

        }


        if(
          Date.now() -
          Number(
            player.lastDamageAt ||
            0
          ) <
          latestSettings.regenLock *
          1000
        ){

          return;

        }


        const maxHp =
          latestSettings.maxHp;


        player.hp =
          Math.min(
            maxHp,
            Number(
              player.hp ||
              0
            ) +
            latestRate *
            elapsed
          );


        players[
          currentUser.uid
        ] =
          player;


        transaction.update(
          matchRef,
          {
            players
          }
        );

      }
    );

  }catch(error){

    console.error(
      "regen error",
      error
    );

  }

}


function getRegenRateFromSettings(
  settings
){

  if(
    settings.hpRegen ===
    "fast"
  ){

    return 3;

  }


  if(
    settings.hpRegen ===
    "medium"
  ){

    return 1.5;

  }


  if(
    settings.hpRegen ===
    "slow"
  ){

    return .6;

  }


  return 0;

}


async function syncLocalPlayer(){

  if(
    !matchRef ||
    !localPlayer ||
    gameEnded
  ){

    return;

  }


  const now =
    performance.now();


  if(
    now -
    lastNetworkUpdate <
    80
  ){

    return;

  }


  lastNetworkUpdate =
    now;


  try{

    await updateDoc(
      matchRef,
      {

        [`players.${currentUser.uid}`]:{

          uid:
            currentUser.uid,

          name:
            localPlayer.name,

          x:
            localPlayer.x,

          y:
            localPlayer.y,

          z:
            localPlayer.z,

          yaw:
            cameraState.yaw,

          pitch:
            cameraState.pitch,

          lastActiveAt:
            lastActivityAt

        }

      }
    );

  }catch(error){

    console.error(
      "sync error",
      error
    );

  }

}


matchButton.addEventListener(
  "click",
  handleMatchButton
);


shareCodeButton.addEventListener(
  "click",
  shareMatchCode
);


leaveRoomButton.addEventListener(
  "click",
  leaveRoom
);


settingsButton.addEventListener(
  "click",
  openSettings
);


settingsButtonInGame.addEventListener(
  "click",
  openSettings
);


closeSettingsButton.addEventListener(
  "click",
  closeSettings
);


saveSettingsButton.addEventListener(
  "click",

settingsModal.addEventListener(
  "pointerdown",
  event => {

    if(
      event.target ===
      settingsModal
    ){

      closeSettings();

    }

  }
);


document
  .querySelectorAll(
    ".settingOptions"
  )
  .forEach(
    group => {

      group
        .querySelectorAll(
          ".settingOption"
        )
        .forEach(
          button => {

            button.addEventListener(
              "click",
              () => {

                if(
                  group.parentElement.classList.contains(
                    "disabled"
                  )
                ){

                  return;

                }


                group
                  .querySelectorAll(
                    ".settingOption"
                  )
                  .forEach(
                    item =>
                      item.classList.remove(
                        "selected"
                      )
                  );


                button.classList.add(
                  "selected"
                );


                const draft =
                  readSettingsUI();


                maxHpInput.style.display =
                  getSelectedValue(
                    "maxHp"
                  ) ===
                  "custom"
                    ? "block"
                    : "none";


                terrainHeightRow.classList.toggle(
                  "disabled",
                  draft.terrainAmount ===
                  "none"
                );


                regenLockRow.classList.toggle(
                  "disabled",
                  draft.hpRegen ===
                  "none"
                );

              }
            );

          }
        );

    }
  );


returnButton.addEventListener(
  "click",
  handleReturn
);


matchCodeInput.addEventListener(
  "input",
  () => {

    matchCodeInput.value =
      matchCodeInput.value
        .replace(
          /[^A-Za-z0-9]/g,
          ""
        )
        .toUpperCase();

  }
);


matchCodeInput.addEventListener(
  "keydown",
  event => {

    if(
      event.key ===
      "Enter"
    ){

      handleMatchButton();

    }

  }
);


setupDesktopInput();

setupMobileInput();

setupStartButton();


window.addEventListener(
  "beforeunload",
  () => {

    if(
      isHost &&
      matchRef
    ){

      deleteDoc(
        matchRef
      ).catch(
        () => {}
      );

    }

  }
);


try{

  await ensureAuth();

  statusEl.textContent =
    "接続準備OK";

}catch(error){

  console.error(
    error
  );

  statusEl.textContent =
    "Firebase接続失敗：" +
    getFriendlyError(
      error
    );

}


requestAnimationFrame(
  gameLoop
);

</script>
