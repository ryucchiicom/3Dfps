<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Firebase 3D FPS</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
    color:white;
}

body{
    touch-action:none;
}

#game{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        linear-gradient(#6ea8dc 0%,#b7d9f2 58%,#88b96d 58%,#65964d 100%);
}

#world{
    position:absolute;
    inset:0;
    perspective:900px;
    overflow:hidden;
}

#camera{
    position:absolute;
    left:50%;
    top:50%;
    width:0;
    height:0;
    transform-style:preserve-3d;
}

.platform{
    position:absolute;
    transform-style:preserve-3d;
    background:linear-gradient(90deg,#777,#aaa);
    border:2px solid rgba(255,255,255,.3);
    box-shadow:
        0 8px 20px rgba(0,0,0,.3),
        inset 0 0 0 2px rgba(0,0,0,.15);
}

.platform::after{
    content:"";
    position:absolute;
    left:0;
    top:100%;
    width:100%;
    height:80px;
    background:#555;
    transform-origin:top;
    transform:rotateX(-90deg);
    opacity:.7;
}

.player{
    position:absolute;
    width:28px;
    height:60px;
    margin-left:-14px;
    margin-top:-60px;
    transform-style:preserve-3d;
    border-radius:7px;
    background:#28a9ff;
    border:2px solid rgba(255,255,255,.7);
    box-shadow:0 0 12px rgba(0,0,0,.3);
}

.player.me{
    background:#36e36b;
}

.player.dead{
    opacity:.25;
}

.bullet{
    position:absolute;
    width:8px;
    height:8px;
    margin:-4px;
    border-radius:50%;
    background:#ffe600;
    box-shadow:0 0 10px #fff000;
}

#hud{
    position:absolute;
    inset:0;
    pointer-events:none;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    width:20px;
    height:20px;
    margin:-10px;
}

#crosshair::before,
#crosshair::after{
    content:"";
    position:absolute;
    background:white;
    box-shadow:0 0 3px #000;
}

#crosshair::before{
    left:9px;
    top:0;
    width:2px;
    height:20px;
}

#crosshair::after{
    left:0;
    top:9px;
    width:20px;
    height:2px;
}

#roomScreen{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.55);
    z-index:50;
}

.panel{
    width:min(420px,90vw);
    padding:28px;
    border-radius:22px;
    background:rgba(20,20,25,.9);
    border:1px solid rgba(255,255,255,.15);
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    text-align:center;
}

.panel h1{
    margin:0 0 20px;
}

#roomCode{
    width:100%;
    padding:14px;
    border:0;
    border-radius:12px;
    background:#292933;
    color:white;
    font-size:20px;
    text-align:center;
    outline:none;
    margin-bottom:12px;
}

.bigButton{
    width:100%;
    padding:15px;
    border:0;
    border-radius:14px;
    background:#238cff;
    color:white;
    font-size:18px;
    font-weight:bold;
}

.bigButton:active{
    transform:scale(.97);
}

#status{
    min-height:24px;
    margin-top:15px;
    color:#ccc;
}

#roomInfo{
    position:absolute;
    top:15px;
    left:15px;
    padding:8px 12px;
    border-radius:12px;
    background:rgba(0,0,0,.45);
    pointer-events:none;
    z-index:20;
}

#playersInfo{
    margin-top:4px;
    font-size:12px;
    opacity:.8;
}

#startButton{
    position:absolute;
    right:20px;
    top:20px;
    width:100px;
    height:100px;
    border-radius:50%;
    border:3px solid rgba(255,255,255,.5);
    background:rgba(20,20,20,.65);
    color:white;
    font-size:16px;
    font-weight:bold;
    display:none;
    z-index:30;
    overflow:hidden;
}

#startButton .progress{
    position:absolute;
    inset:5px;
    border-radius:50%;
    background:conic-gradient(#35d86b 0deg,#35d86b 0deg,transparent 0deg);
    z-index:-1;
}

#startButton .inner{
    position:absolute;
    inset:8px;
    border-radius:50%;
    background:#181818;
    display:flex;
    align-items:center;
    justify-content:center;
}

#controls{
    position:absolute;
    inset:0;
    z-index:25;
    pointer-events:none;
}

.control{
    position:absolute;
    pointer-events:auto;
    border:2px solid rgba(255,255,255,.4);
    background:rgba(0,0,0,.35);
    color:white;
    font-weight:bold;
    display:flex;
    justify-content:center;
    align-items:center;
    touch-action:none;
}

#joystick{
    left:25px;
    bottom:30px;
    width:125px;
    height:125px;
    border-radius:50%;
}

#stick{
    width:55px;
    height:55px;
    border-radius:50%;
    background:rgba(255,255,255,.35);
    position:absolute;
    left:35px;
    top:35px;
}

.actionButton{
    width:78px;
    height:78px;
    border-radius:50%;
}

#jumpButton{
    right:25px;
    bottom:125px;
}

#fireButton{
    right:25px;
    bottom:30px;
}

#grabButton{
    right:25px;
    bottom:125px;
    display:none;
}

#fireButton .progress{
    position:absolute;
    inset:3px;
    border-radius:50%;
    background:conic-gradient(#ff4141 0deg,transparent 0deg);
    pointer-events:none;
}

#fireButton .inner{
    position:absolute;
    inset:8px;
    border-radius:50%;
    background:rgba(0,0,0,.45);
    display:flex;
    justify-content:center;
    align-items:center;
}

#fireButton.ready{
    background:rgba(255,50,50,.45);
}

#grabButton.disabled{
    opacity:.3;
    color:rgba(255,255,255,.45);
}

#message{
    position:absolute;
    left:50%;
    top:18%;
    transform:translateX(-50%);
    padding:12px 20px;
    border-radius:14px;
    background:rgba(0,0,0,.6);
    font-weight:bold;
    opacity:0;
    transition:.2s;
    z-index:40;
}

#message.show{
    opacity:1;
}

#damage{
    position:absolute;
    inset:0;
    background:rgba(255,0,0,.3);
    opacity:0;
    pointer-events:none;
    z-index:35;
}

@media(min-width:800px){
    #controls{
        opacity:.75;
    }
}

@media(max-width:799px){
    #roomInfo{
        font-size:13px;
    }
}
</style>
</head>

<body>

<div id="game">

    <div id="world">
        <div id="camera"></div>
    </div>

    <div id="hud">
        <div id="crosshair"></div>
        <div id="damage"></div>

        <div id="roomInfo">
            <div>ROOM: <span id="roomText">----</span></div>
            <div id="playersInfo">PLAYERS: 0</div>
        </div>

        <div id="message"></div>

        <button id="startButton">
            <div class="progress"></div>
            <div class="inner">START</div>
        </button>

        <div id="controls">

            <div id="joystick" class="control">
                <div id="stick"></div>
            </div>

            <button id="jumpButton" class="control actionButton">
                JUMP
            </button>

            <button id="grabButton" class="control actionButton">
                GRAB
            </button>

            <button id="fireButton" class="control actionButton">
                <div class="progress"></div>
                <div class="inner">FIRE</div>
            </button>

        </div>
    </div>

    <div id="roomScreen">
        <div class="panel">
            <h1>3D FPS</h1>
            <input
                id="roomCode"
                maxlength="12"
                placeholder="試合コード"
                autocomplete="off"
            >
            <button id="roomButton" class="bigButton">
                試合を作成/参加
            </button>
            <div id="status"></div>
        </div>
    </div>

</div>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getAnalytics
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-analytics.js";

import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    updateDoc,
    deleteDoc,
    onSnapshot,
    collection,
    serverTimestamp,
    runTransaction,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey:"AIzaSyD5cTt3b1IeiGIOgJcC0sSFgO-Ce78JyIw",
    authDomain:"dfps-4aa92.firebaseapp.com",
    projectId:"dfps-4aa92",
    storageBucket:"dfps-4aa92.firebasestorage.app",
    messagingSenderId:"379021412536",
    appId:"1:379021412536:web:003efdb33f6d6bb77d8c4d",
    measurementId:"G-BG2KFTL9ZC"
};

const app=initializeApp(firebaseConfig);

let analytics=null;
try{
    analytics=getAnalytics(app);
}catch(e){}

const db=getFirestore(app);

const roomScreen=document.getElementById("roomScreen");
const roomCodeInput=document.getElementById("roomCode");
const roomButton=document.getElementById("roomButton");
const statusEl=document.getElementById("status");

const roomText=document.getElementById("roomText");
const playersInfo=document.getElementById("playersInfo");

const world=document.getElementById("world");
const camera=document.getElementById("camera");

const startButton=document.getElementById("startButton");
const startProgress=startButton.querySelector(".progress");

const jumpButton=document.getElementById("jumpButton");
const grabButton=document.getElementById("grabButton");

const fireButton=document.getElementById("fireButton");
const fireProgress=fireButton.querySelector(".progress");

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

const message=document.getElementById("message");
const damage=document.getElementById("damage");

const clientId=
    crypto.randomUUID ?
    crypto.randomUUID() :
    Math.random().toString(36).slice(2)+Date.now();

let roomId="";
let isHost=false;
let roomRef=null;
let unsubscribeRoom=null;

let gameStarted=false;
let startHeld=false;
let startHoldStart=0;

let lastLocalAction=Date.now();
let lastRoomUpdate=0;

let yaw=0;
let pitch=0;

const player={
    x:0,
    y:2,
    z:0,
    vx:0,
    vy:0,
    vz:0,
    grounded:false,
    hp:100,
    alive:true,
    invincibleUntil:0,
    grabbing:false,
    grabStart:0,
    grabTarget:null,
    lastShot:0
};

const remotePlayers=new Map();

const bullets=new Map();

const keys={};

const platforms=[
    {
        id:"ground",
        x:0,
        y:0,
        z:0,
        w:42,
        h:1,
        d:42
    },

    {
        id:"p1",
        x:0,
        y:3,
        z:-8,
        w:8,
        h:1,
        d:8
    },

    {
        id:"p2",
        x:7,
        y:5.5,
        z:-15,
        w:7,
        h:1,
        d:7
    },

    {
        id:"p3",
        x:-7,
        y:7.5,
        z:-21,
        w:8,
        h:1,
        d:7
    },

    {
        id:"p4",
        x:2,
        y:9.5,
        z:-27,
        w:7,
        h:1,
        d:7
    },

    {
        id:"p5",
        x:11,
        y:11.5,
        z:-32,
        w:8,
        h:1,
        d:7
    },

    {
        id:"p6",
        x:-4,
        y:13.5,
        z:-36,
        w:8,
        h:1,
        d:8
    },

    {
        id:"p7",
        x:-13,
        y:15.5,
        z:-42,
        w:8,
        h:1,
        d:8
    }
];

function createPlatform(p){

    const el=document.createElement("div");

    el.className="platform";

    el.style.width=p.w*40+"px";
    el.style.height=p.d*40+"px";

    el.dataset.id=p.id;

    world.appendChild(el);

    p.el=el;

}

platforms.forEach(createPlatform);

function showMessage(text,time=1500){

    message.textContent=text;
    message.classList.add("show");

    clearTimeout(showMessage.timer);

    showMessage.timer=setTimeout(()=>{
        message.classList.remove("show");
    },time);
}

function setStatus(text){
    statusEl.textContent=text;
}

function normalizeRoomCode(value){

    return value
        .trim()
        .toUpperCase()
        .replace(/[^A-Z0-9_-]/g,"")
        .slice(0,12);

}

function randomSpawn(){

    const spawns=[
        {x:0,y:2,z:12},
        {x:8,y:2,z:8},
        {x:-8,y:2,z:8},
        {x:0,y:2,z:0},
        {x:12,y:2,z:-4},
        {x:-12,y:2,z:-4}
    ];

    return spawns[Math.floor(Math.random()*spawns.length)];

}

function resetPlayer(){

    const s=randomSpawn();

    player.x=s.x;
    player.y=s.y;
    player.z=s.z;

    player.vx=0;
    player.vy=0;
    player.vz=0;

    player.hp=100;
    player.alive=true;
    player.grounded=false;
    player.grabbing=false;
    player.grabTarget=null;

}

function markAction(){

    lastLocalAction=Date.now();

}

async function createOrJoinRoom(){

    const code=normalizeRoomCode(roomCodeInput.value);

    if(!code){

        setStatus("試合コードを入力してね");
        return;

    }

    roomCodeInput.value=code;

    roomButton.disabled=true;

    try{

        const ref=doc(db,"matches",code);
        const snap=await getDoc(ref);

        if(!snap.exists()){

            const data={
                code,
                host:clientId,
                started:false,
                createdAt:serverTimestamp(),
                updatedAt:serverTimestamp(),
                players:{
                    [clientId]:{
                        id:clientId,
                        x:0,
                        y:2,
                        z:0,
                        yaw:0,
                        pitch:0,
                        hp:100,
                        alive:true,
                        lastActive:Date.now(),
                        joinedAt:Date.now()
                    }
                }
            };

            await setDoc(ref,data);

            isHost=true;
            roomId=code;
            roomRef=ref;

            showMessage("試合を作成しました");

        }else{

            const data=snap.data();

            roomId=code;
            roomRef=ref;

            if(data.started){

                setStatus("その試合はすでに開始されています");
                roomButton.disabled=false;
                return;

            }

            await runTransaction(db,async transaction=>{

                const current=await transaction.get(ref);

                if(!current.exists()){
                    throw new Error("ROOM_NOT_FOUND");
                }

                const d=current.data();

                const players=d.players||{};

                players[clientId]={
                    id:clientId,
                    x:0,
                    y:2,
                    z:0,
                    yaw:0,
                    pitch:0,
                    hp:100,
                    alive:true,
                    lastActive:Date.now(),
                    joinedAt:Date.now()
                };

                transaction.update(ref,{
                    players,
                    updatedAt:serverTimestamp()
                });

            });

            isHost=data.host===clientId;

            showMessage("試合に参加しました");

        }

        roomScreen.style.display="none";
        roomText.textContent=roomId;

        resetPlayer();

        subscribeRoom();

    }catch(e){

        console.error(e);

        setStatus("部屋の作成/参加に失敗しました");

    }finally{

        roomButton.disabled=false;

    }

}

roomButton.addEventListener("click",createOrJoinRoom);

roomCodeInput.addEventListener("keydown",e=>{

    if(e.key==="Enter"){
        createOrJoinRoom();
    }

});

function subscribeRoom(){

    if(unsubscribeRoom){
        unsubscribeRoom();
    }

    unsubscribeRoom=onSnapshot(roomRef,snap=>{

        if(!snap.exists()){

            leaveToLobby("試合が終了しました");
            return;

        }

        const data=snap.data();

        gameStarted=!!data.started;

        if(data.host===clientId){
            isHost=true;
        }

        const players=data.players||{};

        playersInfo.textContent=
            "PLAYERS: "+Object.keys(players).length;

        updateRemotePlayers(players);

        if(gameStarted){

            startButton.style.display="none";

        }else if(isHost){

            startButton.style.display="block";

        }else{

            startButton.style.display="none";

        }

    },err=>{

        console.error(err);

    });

}

function updateRemotePlayers(players){

    for(const [id,p] of Object.entries(players)){

        if(id===clientId) continue;

        let el=remotePlayers.get(id);

        if(!el){

            el=document.createElement("div");
            el.className="player";
            world.appendChild(el);
            remotePlayers.set(id,el);

        }

        el.classList.toggle("dead",p.alive===false);

        el.style.transform=
            `translate3d(${p.x*40}px,${-p.y*40}px,${p.z*40}px)`;

    }

    for(const [id,el] of remotePlayers){

        if(!players[id]){

            el.remove();
            remotePlayers.delete(id);

        }

    }

}

async function syncPlayer(){

    if(!roomRef || !roomId || !gameStarted){
        return;
    }

    const now=Date.now();

    if(now-lastRoomUpdate<80){
        return;
    }

    lastRoomUpdate=now;

    try{

        await updateDoc(roomRef,{
            [`players.${clientId}`]:{
                id:clientId,
                x:player.x,
                y:player.y,
                z:player.z,
                yaw,
                pitch,
                hp:player.hp,
                alive:player.alive,
                lastActive:lastLocalAction
            },
            updatedAt:serverTimestamp()
        });

    }catch(e){

        console.error(e);

    }

}

async function cleanupInactivePlayers(){

    if(!roomRef || !roomId){
        return;
    }

    try{

        const snap=await getDoc(roomRef);

        if(!snap.exists()){
            return;
        }

        const data=snap.data();

        const players=data.players||{};
        const now=Date.now();

        const ids=Object.keys(players);

        if(ids.length===0){

            await deleteDoc(roomRef);
            leaveToLobby("試合が終了しました");
            return;

        }

        let allInactive=true;

        for(const id of ids){

            const active=Number(players[id].lastActive||0);

            if(now-active<60000){

                allInactive=false;
                break;

            }

        }

        if(allInactive){

            await deleteDoc(roomRef);

            leaveToLobby(
                "全員が1分以上操作していないため試合を終了しました"
            );

        }

    }catch(e){

        console.error(e);

    }

}

setInterval(cleanupInactivePlayers,10000);

function leaveToLobby(text){

    if(unsubscribeRoom){

        unsubscribeRoom();
        unsubscribeRoom=null;

    }

    roomId="";
    roomRef=null;
    gameStarted=false;
    isHost=false;

    roomScreen.style.display="flex";

    startButton.style.display="none";

    setStatus(text||"");

    for(const [id,el] of remotePlayers){

        el.remove();

    }

    remotePlayers.clear();

}

async function startMatch(){

    if(!roomRef || !isHost || gameStarted){
        return;
    }

    try{

        const snap=await getDoc(roomRef);

        if(!snap.exists()){
            return;
        }

        const data=snap.data();
        const players=data.players||{};

        const now=Date.now();

        const updated={};

        for(const id of Object.keys(players)){

            const s=randomSpawn();

            updated[id]={
                ...players[id],
                x:s.x,
                y:s.y,
                z:s.z,
                hp:100,
                alive:true,
                lastActive:now
            };

        }

        await updateDoc(roomRef,{
            started:true,
            players:updated,
            startedAt:serverTimestamp(),
            updatedAt:serverTimestamp()
        });

        resetPlayer();

        player.invincibleUntil=Date.now()+3000;

        showMessage("START!");

    }catch(e){

        console.error(e);

    }

}

function updateStartButton(){

    if(!isHost || gameStarted){
        startButton.style.display="none";
        return;
    }

    startButton.style.display="block";

    if(startHeld){

        const elapsed=performance.now()-startHoldStart;
        const progress=Math.min(1,elapsed/1000);

        startProgress.style.background=
            `conic-gradient(#35d86b ${progress*360}deg,transparent ${progress*360}deg)`;

        if(progress>=1){

            startHeld=false;
            startProgress.style.background=
                "conic-gradient(#35d86b 0deg,transparent 0deg)";

            startMatch();

        }

    }else{

        startProgress.style.background=
            "conic-gradient(#35d86b 0deg,transparent 0deg)";

    }

    requestAnimationFrame(updateStartButton);

}

startButton.addEventListener("pointerdown",e=>{

    e.preventDefault();

    if(!isHost || gameStarted){
        return;
    }

    markAction();

    startHeld=true;
    startHoldStart=performance.now();

});

for(const ev of ["pointerup","pointercancel","pointerleave"]){

    startButton.addEventListener(ev,()=>{

        if(startHeld){

            startHeld=false;

            startProgress.style.background=
                "conic-gradient(#35d86b 0deg,transparent 0deg)";

        }

    });

}

requestAnimationFrame(updateStartButton);

function checkGroundCollision(oldY,newY){

    const bottom=newY;
    const oldBottom=oldY;

    let landed=false;

    for(const p of platforms){

        const minX=p.x-p.w/2;
        const maxX=p.x+p.w/2;

        const minZ=p.z-p.d/2;
        const maxZ=p.z+p.d/2;

        const insideXZ=
            player.x>=minX &&
            player.x<=maxX &&
            player.z>=minZ &&
            player.z<=maxZ;

        if(!insideXZ){
            continue;
        }

        const top=p.y+p.h;

        if(
            player.vy<=0 &&
            oldBottom>=top &&
            bottom<=top
        ){

            player.y=top;
            player.vy=0;
            player.grounded=true;
            landed=true;

            break;

        }

    }

    if(!landed){

        player.grounded=false;

    }

    return landed;

}

function findGrabTarget(){

    if(player.grounded){
        return null;
    }

    const playerTop=player.y;

    let best=null;
    let bestDistance=Infinity;

    for(const p of platforms){

        const minX=p.x-p.w/2;
        const maxX=p.x+p.w/2;

        const minZ=p.z-p.d/2;
        const maxZ=p.z+p.d/2;

        const insideXZ=
            player.x>=minX &&
            player.x<=maxX &&
            player.z>=minZ &&
            player.z<=maxZ;

        if(!insideXZ){
            continue;
        }

        const top=p.y+p.h;

        const verticalDistance=playerTop-top;

        if(
            verticalDistance>=0 &&
            verticalDistance<=0.15
        ){

            const dx=player.x-p.x;
            const dz=player.z-p.z;

            const distance=Math.sqrt(dx*dx+dz*dz);

            if(distance<bestDistance){

                bestDistance=distance;
                best=p;

            }

        }

    }

    return best;

}

function canGrab(){

    if(player.grounded){
        return false;
    }

    return !!findGrabTarget();

}

function updateGrabButton(){

    if(!gameStarted || player.grounded){

        grabButton.style.display="none";
        return;

    }

    grabButton.style.display="flex";

    const target=findGrabTarget();

    if(target){

        grabButton.classList.remove("disabled");

    }else{

        grabButton.classList.add("disabled");

    }

}

function performGrab(){

    markAction();

    if(player.grounded || player.grabbing){
        return;
    }

    const target=findGrabTarget();

    if(!target){
        return;
    }

    player.grabbing=true;
    player.grabStart=performance.now();
    player.grabTarget=target;

}

function updateGrab(){

    if(!player.grabbing){
        return;
    }

    const target=player.grabTarget;

    if(!target){

        player.grabbing=false;
        return;

    }

    const progress=Math.min(
        1,
        (performance.now()-player.grabStart)/500
    );

    const targetY=target.y+target.h+1.2;

    player.x+=(target.x-player.x)*0.15;
    player.z+=(target.z-player.z)*0.15;

    player.y+=
        (targetY-player.y)*
        Math.min(.25,progress*.25);

    player.vx=0;
    player.vy=0;
    player.vz=0;

    if(progress>=1){

        player.x=target.x;
        player.y=targetY;
        player.z=target.z;

        player.grounded=true;
        player.grabbing=false;
        player.grabTarget=null;

    }

}

function jump(){

    markAction();

    if(!gameStarted || !player.alive){
        return;
    }

    if(player.grounded){

        player.vy=8.5;
        player.grounded=false;

    }

}

jumpButton.addEventListener("pointerdown",e=>{

    e.preventDefault();

    jump();

});

grabButton.addEventListener("pointerdown",e=>{

    e.preventDefault();

    if(canGrab()){
        performGrab();
    }

});

function fireCooldown(){

    return 250;

}

function canFire(){

    return Date.now()-player.lastShot>=fireCooldown();

}

async function fire(){

    markAction();

    if(!gameStarted || !player.alive){
        return;
    }

    if(!canFire()){
        return;
    }

    player.lastShot=Date.now();

    const direction=getLookDirection();

    const bulletId=
        clientId+"_"+Date.now()+"_"+Math.random();

    const bullet={
        id:bulletId,
        owner:clientId,
        x:player.x,
        y:player.y+1.1,
        z:player.z,
        vx:direction.x*32,
        vy:direction.y*32,
        vz:direction.z*32,
        createdAt:Date.now()
    };

    bullets.set(bulletId,bullet);

    drawBullet(bullet);

}

fireButton.addEventListener("pointerdown",e=>{

    e.preventDefault();

    fire();

});

function updateFireButton(){

    if(!gameStarted){

        fireProgress.style.background=
            "conic-gradient(#ff4141 0deg,transparent 0deg)";

        return;

    }

    const elapsed=Date.now()-player.lastShot;

    const progress=Math.min(
        1,
        elapsed/fireCooldown()
    );

    const degrees=progress*360;

    fireProgress.style.background=
        `conic-gradient(#ff4141 ${degrees}deg,transparent ${degrees}deg)`;

    fireButton.classList.toggle(
        "ready",
        progress>=1
    );

}

function getLookDirection(){

    const yawRad=yaw*Math.PI/180;
    const pitchRad=pitch*Math.PI/180;

    return {
        x:Math.sin(yawRad)*Math.cos(pitchRad),
        y:Math.sin(pitchRad),
        z:Math.cos(yawRad)*Math.cos(pitchRad)
    };

}

function drawBullet(b){

    let el=b.el;

    if(!el){

        el=document.createElement("div");
        el.className="bullet";

        world.appendChild(el);

        b.el=el;

    }

    el.style.transform=
        `translate3d(${b.x*40}px,${-b.y*40}px,${b.z*40}px)`;

}

function updateBullets(dt){

    for(const [id,b] of bullets){

        b.x+=b.vx*dt;
        b.y+=b.vy*dt;
        b.z+=b.vz*dt;

        drawBullet(b);

        let remove=false;

        if(
            Math.abs(b.x)>40 ||
            Math.abs(b.z)>40 ||
            b.y<-5 ||
            b.y>30
        ){
            remove=true;
        }

        for(const p of platforms){

            const minX=p.x-p.w/2;
            const maxX=p.x+p.w/2;

            const minZ=p.z-p.d/2;
            const maxZ=p.z+p.d/2;

            const top=p.y+p.h;

            if(
                b.x>=minX &&
                b.x<=maxX &&
                b.z>=minZ &&
                b.z<=maxZ &&
                b.y>=p.y &&
                b.y<=top+1
            ){

                remove=true;
                break;

            }

        }

        for(const [otherId,el] of remotePlayers){

            const rect=el.getBoundingClientRect();

            const screenX=window.innerWidth/2+b.x*3;
            const screenY=window.innerHeight/2-b.y*3;

            if(
                screenX>rect.left-10 &&
                screenX<rect.right+10 &&
                screenY>rect.top-10 &&
                screenY<rect.bottom+10
            ){

                remove=true;
                break;

            }

        }

        if(remove){

            if(b.el){
                b.el.remove();
            }

            bullets.delete(id);

        }

    }

}

function updatePhysics(dt){

    if(!gameStarted || !player.alive){
        return;
    }

    updateGrab();

    if(player.grabbing){
        return;
    }

    let mx=0;
    let mz=0;

    if(keys.KeyW || keys.ArrowUp) mz-=1;
    if(keys.KeyS || keys.ArrowDown) mz+=1;
    if(keys.KeyA || keys.ArrowLeft) mx-=1;
    if(keys.KeyD || keys.ArrowRight) mx+=1;

    mx+=joystickX;
    mz+=joystickY;

    const length=Math.sqrt(mx*mx+mz*mz);

    if(length>1){

        mx/=length;
        mz/=length;

    }

    const speed=6;

    const yawRad=yaw*Math.PI/180;

    const worldX=
        mx*Math.cos(yawRad)-
        mz*Math.sin(yawRad);

    const worldZ=
        mx*Math.sin(yawRad)+
        mz*Math.cos(yawRad);

    player.vx=worldX*speed;
    player.vz=worldZ*speed;

    if(length===0){

        player.vx*=.8;
        player.vz*=.8;

    }

    const oldY=player.y;

    player.x+=player.vx*dt;
    player.z+=player.vz*dt;

    player.vy-=22*dt;
    player.y+=player.vy*dt;

    checkGroundCollision(oldY,player.y);

    if(player.y<-10){

        resetPlayer();

    }

}

function updateCamera(){

    camera.style.transform=
        `translate3d(${-player.x*40}px,${player.y*40}px,${-player.z*40}px)
         rotateX(${-pitch}deg)
         rotateY(${-yaw}deg)`;

    for(const p of platforms){

        p.el.style.transform=
            `translate3d(${p.x*40}px,${-p.y*40}px,${p.z*40}px)
             rotateX(0deg)`;

    }

    const me=document.querySelector(".localPlayer");

    if(!me){

        const el=document.createElement("div");

        el.className="player me localPlayer";

        world.appendChild(el);

    }

    const local=document.querySelector(".localPlayer");

    local.style.transform=
        `translate3d(${player.x*40}px,${-player.y*40}px,${player.z*40}px)`;

}

window.addEventListener("keydown",e=>{

    keys[e.code]=true;

    markAction();

    if(e.code==="Space"){
        jump();
    }

    if(e.code==="KeyE"){
        if(canGrab()){
            performGrab();
        }
    }

    if(e.code==="KeyF"){
        fire();
    }

});

window.addEventListener("keyup",e=>{

    keys[e.code]=false;

});

let joystickActive=false;
let joystickX=0;
let joystickY=0;

function updateJoystick(e){

    const rect=joystick.getBoundingClientRect();

    const cx=rect.left+rect.width/2;
    const cy=rect.top+rect.height/2;

    let dx=e.clientX-cx;
    let dy=e.clientY-cy;

    const max=45;

    const len=Math.sqrt(dx*dx+dy*dy);

    if(len>max){

        dx=dx/len*max;
        dy=dy/len*max;

    }

    stick.style.transform=
        `translate(${dx}px,${dy}px)`;

    joystickX=dx/max;
    joystickY=dy/max;

}

joystick.addEventListener("pointerdown",e=>{

    e.preventDefault();

    joystickActive=true;
    joystick.setPointerCapture(e.pointerId);

    markAction();

    updateJoystick(e);

});

joystick.addEventListener("pointermove",e=>{

    if(!joystickActive){
        return;
    }

    updateJoystick(e);

    markAction();

});

joystick.addEventListener("pointerup",e=>{

    joystickActive=false;

    joystickX=0;
    joystickY=0;

    stick.style.transform="translate(0,0)";

});

joystick.addEventListener("pointercancel",()=>{

    joystickActive=false;

    joystickX=0;
    joystickY=0;

    stick.style.transform="translate(0,0)";

});

let lookPointer=null;
let lastLookX=0;
let lastLookY=0;

world.addEventListener("pointerdown",e=>{

    if(e.target.closest(".control")){
        return;
    }

    lookPointer=e.pointerId;
    lastLookX=e.clientX;
    lastLookY=e.clientY;

    try{
        world.setPointerCapture(e.pointerId);
    }catch(err){}

});

world.addEventListener("pointermove",e=>{

    if(e.pointerId!==lookPointer){
        return;
    }

    const dx=e.clientX-lastLookX;
    const dy=e.clientY-lastLookY;

    lastLookX=e.clientX;
    lastLookY=e.clientY;

    yaw+=dx*.18;
    pitch-=dy*.18;

    pitch=Math.max(-75,Math.min(75,pitch));

    markAction();

});

world.addEventListener("pointerup",e=>{

    if(e.pointerId===lookPointer){
        lookPointer=null;
    }

});

world.addEventListener("pointercancel",e=>{

    if(e.pointerId===lookPointer){
        lookPointer=null;
    }

});

document.addEventListener("visibilitychange",()=>{

    if(document.visibilityState==="visible"){
        markAction();
    }

});

window.addEventListener("beforeunload",()=>{

    if(!roomRef){
        return;
    }

    try{

        updateDoc(roomRef,{
            [`players.${clientId}.lastActive`]:0
        });

    }catch(e){}

});

let previous=performance.now();

function gameLoop(now){

    const dt=Math.min(
        .05,
        (now-previous)/1000
    );

    previous=now;

    updatePhysics(dt);
    updateBullets(dt);
    updateCamera();
    updateGrabButton();
    updateFireButton();

    syncPlayer();

    requestAnimationFrame(gameLoop);

}

resetPlayer();

requestAnimationFrame(gameLoop);

</script>

</body>
</html>
