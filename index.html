<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Firebase 3D FPS v1.1.0</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  touch-action:none;
}

canvas{
  display:block;
}

#menu{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(circle at 50% 30%,#26384f 0%,#111822 40%,#05070a 100%);
  color:white;
}

.menuBox{
  width:min(92vw,480px);
  padding:28px;
  border-radius:22px;
  background:rgba(15,20,28,.88);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 20px 80px rgba(0,0,0,.45);
  backdrop-filter:blur(18px);
}

.title{
  margin:0 0 8px;
  font-size:34px;
  font-weight:800;
  text-align:center;
}

.subtitle{
  text-align:center;
  opacity:.72;
  margin-bottom:24px;
}

.input{
  width:100%;
  height:48px;
  padding:0 16px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:12px;
  background:rgba(255,255,255,.07);
  color:#fff;
  font-size:18px;
  outline:none;
  text-transform:uppercase;
  margin-bottom:12px;
}

.button{
  width:100%;
  height:48px;
  border:0;
  border-radius:12px;
  color:#fff;
  background:#1976ff;
  font-size:17px;
  font-weight:700;
  margin-top:8px;
  cursor:pointer;
}

.button.secondary{
  background:#2a3039;
}

.button:active{
  transform:scale(.98);
}

.info{
  margin-top:18px;
  font-size:13px;
  line-height:1.6;
  color:#c5ccd5;
}

#status{
  min-height:22px;
  margin-top:12px;
  text-align:center;
  color:#ffce66;
  font-size:14px;
}

#gameUI{
  position:fixed;
  inset:0;
  z-index:20;
  pointer-events:none;
  display:none;
  color:#fff;
}

#topBar{
  position:absolute;
  top:12px;
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:8px;
}

#healthBox,#matchBox{
  padding:9px 12px;
  border-radius:12px;
  background:rgba(0,0,0,.45);
  backdrop-filter:blur(8px);
  font-size:14px;
}

#health{
  margin-top:5px;
  width:170px;
  height:10px;
  overflow:hidden;
  border-radius:99px;
  background:#252525;
}

#healthBar{
  width:100%;
  height:100%;
  background:#48e27d;
  transition:width .15s;
}

#crosshair{
  position:absolute;
  left:50%;
  top:50%;
  width:18px;
  height:18px;
  margin-left:-9px;
  margin-top:-9px;
}

#crosshair::before,
#crosshair::after{
  content:"";
  position:absolute;
  background:#fff;
  box-shadow:0 0 3px #000;
}

#crosshair::before{
  width:2px;
  height:18px;
  left:8px;
  top:0;
}

#crosshair::after{
  width:18px;
  height:2px;
  left:0;
  top:8px;
}

#killMessage{
  position:absolute;
  left:50%;
  top:42%;
  transform:translate(-50%,-50%);
  font-size:28px;
  font-weight:900;
  text-shadow:0 3px 15px #000;
  opacity:0;
  transition:opacity .15s;
}

#scoreBoard{
  position:absolute;
  right:12px;
  top:70px;
  min-width:150px;
  max-width:220px;
  padding:10px;
  border-radius:12px;
  background:rgba(0,0,0,.45);
  backdrop-filter:blur(8px);
  font-size:12px;
}

.scoreRow{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin:3px 0;
}

.scoreAlive{
  color:#6dff8f;
}

.scoreDead{
  color:#ff7070;
}

#preStart{
  position:absolute;
  left:50%;
  top:58%;
  transform:translate(-50%,-50%);
  display:none;
  pointer-events:auto;
  text-align:center;
}

#preStartText{
  margin-bottom:12px;
  pointer-events:none;
  font-weight:800;
  font-size:16px;
}

#startButton{
  position:relative;
  z-index:3;
  width:105px;
  height:105px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.35);
  background:rgba(0,0,0,.42);
  color:#fff;
  font-size:18px;
  font-weight:900;
  overflow:hidden;
}

#startButton::before{
  content:"";
  position:absolute;
  inset:5px;
  border-radius:50%;
  background:
    conic-gradient(
      #36a3ff var(--progress,0%),
      rgba(255,255,255,.10) var(--progress,0%)
    );
  z-index:0;
}

#startButton::after{
  content:"";
  position:absolute;
  inset:13px;
  border-radius:50%;
  background:rgba(12,17,23,.94);
  z-index:1;
}

#startButton span{
  position:relative;
  z-index:2;
}

#roomActions{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  margin-top:14px;
}

.roomActionButton{
  border:1px solid rgba(255,255,255,.18);
  border-radius:11px;
  min-width:92px;
  height:42px;
  padding:0 14px;
  color:#fff;
  background:rgba(255,255,255,.08);
  font-size:14px;
  font-weight:800;
  cursor:pointer;
  pointer-events:auto;
  touch-action:manipulation;
  appearance:none;
  -webkit-appearance:none;
}

.roomActionButton:active{
  transform:scale(.97);
}

#startButton,
#startButton::before,
#startButton::after,
.mobileButton,
.mobileButton::before,
.mobileButton::after{
  pointer-events:auto;
}

#startButton{
  box-sizing:border-box;
  padding:0;
  margin:0;
  display:flex;
  align-items:center;
  justify-content:center;
  appearance:none;
  -webkit-appearance:none;
  touch-action:none;
}

#startButton::before,
#startButton::after{
  pointer-events:none;
}

#spawnProtection{
  position:absolute;
  left:50%;
  top:27%;
  transform:translate(-50%,-50%);
  padding:8px 13px;
  border-radius:999px;
  background:rgba(40,140,255,.22);
  border:1px solid rgba(110,190,255,.55);
  color:#dff3ff;
  font-size:14px;
  font-weight:900;
  letter-spacing:.4px;
  text-shadow:0 2px 8px #000;
  opacity:0;
  transition:opacity .12s;
  pointer-events:none;
}

#settingsModal{
  position:fixed;
  inset:0;
  z-index:70;
  display:none;
  justify-content:center;
  align-items:center;
  padding:18px;
  background:rgba(0,0,0,.64);
  backdrop-filter:blur(10px);
  pointer-events:auto;
}

.settingsBox{
  width:min(92vw,470px);
  max-height:90vh;
  overflow:auto;
  padding:22px;
  border-radius:20px;
  background:rgba(18,22,29,.97);
  border:1px solid rgba(255,255,255,.13);
  box-shadow:0 24px 80px rgba(0,0,0,.55);
  color:#fff;
}

.settingsTitle{
  margin:0 0 4px;
  font-size:26px;
  font-weight:900;
}

.settingsHint{
  margin:0 0 16px;
  font-size:12px;
  opacity:.62;
}

.settingRow{
  display:grid;
  grid-template-columns:1fr 160px;
  align-items:center;
  gap:12px;
  padding:10px 0;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.settingLabel{
  font-size:14px;
  font-weight:800;
}

.settingControl{
  width:100%;
  height:40px;
  border:1px solid rgba(255,255,255,.16);
  border-radius:10px;
  background:#222933;
  color:#fff;
  padding:0 10px;
  font-size:14px;
  outline:none;
  appearance:none;
  -webkit-appearance:none;
}

.settingControl:disabled,
.settingDisabled{
  opacity:.28;
}

.settingsButtons{
  display:flex;
  gap:8px;
  margin-top:18px;
}

.settingsButtons .button{
  margin-top:0;
}

#settingsMessage{
  min-height:18px;
  margin-top:8px;
  text-align:center;
  color:#ffce66;
  font-size:12px;
}

#gameOver{
  position:fixed;
  inset:0;
  z-index:50;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.68);
  backdrop-filter:blur(10px);
  color:white;
}

.gameOverBox{
  width:min(88vw,430px);
  padding:28px;
  border-radius:22px;
  text-align:center;
  background:rgba(18,22,29,.94);
}

.gameOverTitle{
  font-size:38px;
  font-weight:900;
  margin-bottom:8px;
}

.gameOverText{
  font-size:18px;
  opacity:.85;
  margin-bottom:20px;
}

#mobileControls{
  display:none;
  position:absolute;
  inset:0;
  pointer-events:none;
}

#joystickZone{
  position:absolute;
  left:18px;
  bottom:20px;
  width:150px;
  height:150px;
  border-radius:50%;
  pointer-events:auto;
}

#joystickBase{
  position:absolute;
  left:50%;
  top:50%;
  width:118px;
  height:118px;
  margin-left:-59px;
  margin-top:-59px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.23);
  background:rgba(255,255,255,.06);
}

#joystickKnob{
  position:absolute;
  left:50%;
  top:50%;
  width:54px;
  height:54px;
  margin-left:-27px;
  margin-top:-27px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.16);
}

#lookZone{
  position:absolute;
  right:0;
  top:0;
  width:55%;
  height:70%;
  pointer-events:auto;
}

.mobileButton{
  position:absolute;
  border:1px solid rgba(255,255,255,.25);
  background:rgba(20,20,20,.45);
  color:#fff;
  border-radius:50%;
  backdrop-filter:blur(8px);
  pointer-events:auto;
  font-weight:800;
  display:flex;
  justify-content:center;
  align-items:center;
  touch-action:none;
  appearance:none;
  -webkit-appearance:none;
}

#fireButton{
  z-index:3;
  box-sizing:border-box;
  padding:0;
  margin:0;
  width:88px;
  height:88px;
  right:24px;
  bottom:32px;
  background:rgba(220,50,50,.28);
  overflow:hidden;
}

#fireButton::before{
  content:"";
  position:absolute;
  inset:4px;
  border-radius:50%;
  background:
    conic-gradient(
      rgba(255,80,80,.9) var(--fireProgress,100%),
      rgba(255,255,255,.08) var(--fireProgress,100%)
    );
  z-index:0;
}

#fireButton::after{
  content:"";
  position:absolute;
  inset:12px;
  border-radius:50%;
  background:rgba(25,20,20,.9);
  z-index:1;
}

#fireButton span{
  position:relative;
  z-index:2;
}

#jumpButton{
  z-index:3;
  box-sizing:border-box;
  padding:0;
  margin:0;
  width:64px;
  height:64px;
  right:125px;
  bottom:44px;
  transition:
    opacity .12s,
    background .12s;
}

#jumpButton.grabInactive{
  opacity:.28;
  background:rgba(20,20,20,.25);
}

#jumpButton.grabActive{
  opacity:1;
  background:rgba(35,130,255,.55);
}

#grabButton{
  display:none !important;
}

#desktopHint{
  position:absolute;
  bottom:14px;
  left:50%;
  transform:translateX(-50%);
  padding:7px 11px;
  border-radius:8px;
  background:rgba(0,0,0,.38);
  font-size:12px;
  opacity:.65;
}

.hidden{
  display:none !important;
}

@media (pointer:coarse){

  #mobileControls{
    display:block;
  }

  #desktopHint{
    display:none;
  }

}
</style>
</head>

<body>

<div id="menu">

  <div class="menuBox">

    <h1 class="title">3D FPS</h1>

    <div class="subtitle">
      v1.1.0
    </div>

    <input
      id="matchCodeInput"
      class="input"
      maxlength="8"
      placeholder="試合コード"
      autocomplete="off"
      spellcheck="false"
    >

    <button
      id="matchButton"
      class="button"
    >
      試合を作成/参加
    </button>

    <div id="status"></div>

    <div class="info">
      PC：WASDで移動、マウスで視点、クリックで射撃、Spaceでジャンプ<br>
      スマホ：左スティックで移動、右側スワイプで視点、FIRE・JUMP・GRAB
    </div>

  </div>

</div>

<div id="gameUI">

  <div id="topBar">

    <div id="healthBox">

      <div id="healthText">
        HP 100
      </div>

      <div id="health">

        <div id="healthBar"></div>

      </div>

    </div>

    <div id="matchBox">

      <div>
        ROOM:
        <span id="roomText">----</span>
      </div>

      <div>
        PLAYER:
        <span id="playerCountText">0</span>
      </div>

      <div>
        KILLS:
        <span id="killsText">0</span>
      </div>

    </div>

  </div>

  <div id="scoreBoard"></div>

  <div id="crosshair"></div>

  <div id="killMessage"></div>

  <div id="preStart">

    <div id="preStartText">
      部屋主がSTARTを長押しして開始
    </div>

    <button id="startButton" type="button">
      <span>START</span>
    </button>

    <div id="roomActions">
      <button id="shareRoomButton" class="roomActionButton" type="button">コードを共有</button>
      <button id="settingsButton" class="roomActionButton" type="button">設定</button>
      <button id="leaveRoomButton" class="roomActionButton" type="button">部屋から退出</button>
    </div>

  </div>

  <div id="spawnProtection">🛡️ 無敵中 <span id="spawnProtectionTime">3.0</span>s</div>

  <div id="desktopHint">
    WASD / Mouse / Click / Space
  </div>

  <div id="mobileControls">

    <div id="joystickZone">

      <div id="joystickBase">

        <div id="joystickKnob"></div>

      </div>

    </div>

    <div id="lookZone"></div>

    <div
      id="jumpButton"
      class="mobileButton"
    >
      JUMP
    </div>

    <div
      id="fireButton"
      class="mobileButton"
    >
      <span>FIRE</span>
    </div>

  </div>

</div>

<div id="settingsModal">

  <div class="settingsBox">

    <h2 class="settingsTitle">設定</h2>
    <p class="settingsHint">試合開始前のみ変更できます</p>

    <div class="settingRow">
      <div class="settingLabel" id="terrainAmountLabel">地形の量</div>
      <select id="terrainAmountSetting" class="settingControl">
        <option value="high">多</option>
        <option value="medium" selected>中</option>
        <option value="low">少</option>
        <option value="none">なし</option>
      </select>
    </div>

    <div class="settingRow">
      <div class="settingLabel" id="terrainHeightLabel">地形の高低差</div>
      <select id="terrainHeightSetting" class="settingControl">
        <option value="high">高</option>
        <option value="medium" selected>中</option>
        <option value="low">低</option>
      </select>
    </div>

    <div class="settingRow">
      <div class="settingLabel">弾速</div>
      <select id="bulletSpeedSetting" class="settingControl">
        <option value="infinite">∞</option>
        <option value="fast">速</option>
        <option value="medium" selected>中</option>
        <option value="slow">遅</option>
      </select>
    </div>

    <div class="settingRow">
      <div class="settingLabel">HP最大値</div>
      <input id="maxHpSetting" class="settingControl" type="number" min="1" max="99999" step="1" value="100" inputmode="numeric">
    </div>

    <div class="settingRow">
      <div class="settingLabel" id="hpRegenLabel">HP自然回復</div>
      <select id="hpRegenSetting" class="settingControl">
        <option value="fast">速</option>
        <option value="medium">中</option>
        <option value="slow">遅</option>
        <option value="none" selected>なし</option>
      </select>
    </div>

    <div class="settingRow">
      <div class="settingLabel" id="regenLockLabel">ダメージからの自然回復ロック</div>
      <input id="regenLockSetting" class="settingControl" type="number" min="0" max="999" step="0.1" value="0" inputmode="decimal">
    </div>

    <div id="settingsMessage"></div>

    <div class="settingsButtons">
      <button id="settingsCancelButton" class="button secondary" type="button">閉じる</button>
      <button id="settingsSaveButton" class="button" type="button">保存</button>
    </div>

  </div>

</div>

<div id="gameOver">

  <div class="gameOverBox">

    <div
      id="gameOverTitle"
      class="gameOverTitle"
    >
      試合終了
    </div>

    <div
      id="gameOverText"
      class="gameOverText"
    >
      ---
    </div>

    <button
      id="returnButton"
      class="button"
    >
      メニューへ戻る
    </button>

  </div>

</div>

function randomCode(length = 6){

  const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let result = "";

  for(
    let i = 0;
    i < length;
    i++
  ){

    result +=
      chars[
        Math.floor(
          Math.random() *
          chars.length
        )
      ];

  }

  return result;

}


function randomSpawn(){

  const margin = 7;

  return {

    x:
      Math.random() *
      (ARENA_SIZE - margin * 2) -
      (ARENA_SIZE / 2 - margin),

    y:
      PLAYER_HEIGHT,

    z:
      Math.random() *
      (ARENA_SIZE - margin * 2) -
      (ARENA_SIZE / 2 - margin)

  };

}


function playerColor(uid){

  let hash = 0;

  for(
    let i = 0;
    i < uid.length;
    i++
  ){

    hash =
      (
        (hash << 5) -
        hash
      ) +
      uid.charCodeAt(i);

    hash |= 0;

  }

  const hue =
    Math.abs(hash) % 360;

  return new THREE.Color(
    `hsl(${hue},70%,58%)`
  );

}

    object => {

      if(object.geometry){

        object.geometry.dispose();

      }

      if(object.material){

        if(
          Array.isArray(
            object.material
          )
        ){

          object.material.forEach(
            material =>
              material.dispose()
          );

        }else{

          object.material.dispose();

        }

      }

    }
  );

  playerMeshes.delete(uid);

function createArena(){

  colliders.length = 0;

  const floorGeometry =
    new THREE.BoxGeometry(
      ARENA_SIZE,
      1,
      ARENA_SIZE
    );

  const floorMaterial =
    new THREE.MeshStandardMaterial({

      color:
        0x41474d,

      roughness:
        .92

    });

  const floor =
    new THREE.Mesh(
      floorGeometry,
      floorMaterial
    );

  floor.position.y =
    -.5;

  floor.receiveShadow =
    true;

  floor.userData.isArenaObject = true;

  scene.add(floor);

  colliders.push(floor);


  const wallMaterial =
    new THREE.MeshStandardMaterial({

      color:
        0x252b31

    });


  createBox(
    ARENA_SIZE,
    6,
    1,
    0,
    3,
    -ARENA_SIZE / 2,
    wallMaterial
  );

  createBox(
    ARENA_SIZE,
    6,
    1,
    0,
    3,
    ARENA_SIZE / 2,
    wallMaterial
  );

  createBox(
    1,
    6,
    ARENA_SIZE,
    -ARENA_SIZE / 2,
    3,
    0,
    wallMaterial
  );

  createBox(
    1,
    6,
    ARENA_SIZE,
    ARENA_SIZE / 2,
    3,
    0,
    wallMaterial
  );


  const obstacleMaterial =
    new THREE.MeshStandardMaterial({

      color:
        0x69727b,

      roughness:
        .7

    });


  const terrainSets = {

    high:[
      [8,1.5,8,-15,.75,-10],
      [11,2,5,13,1,-8],
      [6,2.5,6,17,1.25,14],
      [10,1.5,5,-15,.75,15],
      [5,2,12,0,1,17],
      [6,3.5,6,-15,1.75,-1],
      [7,4,7,4,2,-14],
      [7,4.5,7,16,2.25,2],
      [5,.9,5,-4,.45,-5],
      [5,1.3,5,4,.65,-5],
      [5,1.7,5,10,.85,-5],
      [4,.7,4,-10,.35,-18],
      [4,1.1,4,-4,.55,-18],
      [4,1.5,4,2,.75,-18],
      [4,1.9,4,8,.95,-18]
    ],

    medium:[
      [8,1.5,8,-15,.75,-10],
      [11,2,5,13,1,-8],
      [6,2.5,6,17,1.25,14],
      [10,1.5,5,-15,.75,15],
      [5,2,12,0,1,17],
      [6,3.5,6,-15,1.75,-1],
      [7,4,7,4,2,-14],
      [7,4.5,7,16,2.25,2],
      [5,.9,5,-4,.45,-5],
      [5,1.3,5,4,.65,-5],
      [5,1.7,5,10,.85,-5]
    ],

    low:[
      [8,1.5,8,-15,.75,-10],
      [11,2,5,13,1,-8],
      [10,1.5,5,-15,.75,15],
      [5,2,12,0,1,17],
      [5,.9,5,-4,.45,-5],
      [5,1.3,5,4,.65,-5]
    ]

  };


  const terrainAmount =
    matchSettings.terrainAmount;

  if(terrainAmount !== "none"){

    const base =
      terrainSets[terrainAmount] ||
      terrainSets.medium;

    let heightScale = 1;

    if(matchSettings.terrainHeight === "high"){
      heightScale = 1.35;
    }else if(matchSettings.terrainHeight === "low"){
      heightScale = .68;
    }

    base.forEach(
      values => {

        const [width,height,depth,x,y,z] = values;

        const scaledHeight =
          height * heightScale;

        createBox(
          width,
          scaledHeight,
          depth,
          x,
          scaledHeight / 2,
          z,
          obstacleMaterial
        );

      }
    );

    const randomCount =
      terrainAmount === "high"
        ? 8
        : terrainAmount === "medium"
          ? 5
          : 2;

    for(
      let i = 0;
      i < randomCount;
      i++
    ){

      const x =
        Math.random() * 42 - 21;

      const z =
        Math.random() * 42 - 21;

      const height =
        (1.3 + Math.random() * 1.7) *
        heightScale;

      createBox(
        2.5 + Math.random() * 2,
        height,
        2.5 + Math.random() * 2,
        x,
        height / 2,
        z,
        obstacleMaterial
      );

    }

  }

}


function rebuildArena(){

  if(!scene){
    return;
  }

  for(
    const child of [...scene.children]
  ){
    if(child.userData?.isArenaObject){
      scene.remove(child);
      if(child.geometry){
        child.geometry.dispose();
      }
      if(child.material){
        if(Array.isArray(child.material)){
          child.material.forEach(
            material => material.dispose()
          );
        }else{
          child.material.dispose();
        }
      }
    }
  }

  colliders.length = 0;
  createArena();
}


function createBox(
  width,
  height,
  depth,
  x,
  y,
  z,
  material
){

  const geometry =
    new THREE.BoxGeometry(
      width,
      height,
      depth
    );

  const mesh =
    new THREE.Mesh(
      geometry,
      material
    );

  mesh.position.set(
    x,
    y,
    z
  );

  mesh.castShadow =
    true;

  mesh.receiveShadow =
    true;

  mesh.userData.isArenaObject = true;

  scene.add(mesh);

  colliders.push(mesh);

  return mesh;

}

async function ensureAuth(){

  if(currentUser){

    return currentUser;

  }

  return new Promise(
    (resolve,reject) => {

      const unsubscribe =
        onAuthStateChanged(
          auth,
          async user => {

            if(user){

              currentUser =
                user;

              unsubscribe();

              resolve(user);

              return;

            }

            try{

              await signInAnonymously(
                auth
              );

            }catch(error){

              unsubscribe();

              reject(error);

            }

          },

          error => {

            unsubscribe();

            reject(error);

          }
        );

    }
  );

}


async function createMatch(
  requestedCode = ""
){

  statusEl.textContent =
    "試合を作成中…";

  try{

    const user =
      await ensureAuth();

    let code =
      requestedCode
        .trim()
        .toUpperCase();


    if(!code){

      for(
        let attempt = 0;
        attempt < 20;
        attempt++
      ){

        const candidate =
          randomCode();

        const ref =
          doc(
            db,
            "matches",
            candidate
          );

        const existing =
          await getDoc(ref);

        if(
          !existing.exists()
        ){

          code =
            candidate;

          break;

        }

      }

    }


    if(!code){

      throw new Error(
        "試合コードを作成できませんでした。"
      );

    }


    const spawn =
      randomSpawn();


    const player = {

      uid:
        user.uid,

      name:
        "Player-" +
        user.uid.slice(-4),

      x:
        spawn.x,

      y:
        spawn.y,

      z:
        spawn.z,

      yaw:
        0,

      pitch:
        0,

      hp:
        matchSettings.maxHp,

      kills:
        0,

      alive:
        true,

      lastActiveAt:
        Date.now(),

      lastDamagedAt:
        0

    };


    const ref =
      doc(
        db,
        "matches",
        code
      );


    await runTransaction(
      db,
      async transaction => {

        const snap =
          await transaction.get(
            ref
          );

        if(
          snap.exists()
        ){

          throw new Error(
            "ALREADY_EXISTS"
          );

        }


        transaction.set(
          ref,
          {

            hostUid:
              user.uid,

            status:
              "waiting",

            winnerUid:
              null,

            createdAt:
              serverTimestamp(),

            startedAt:
              null,

            players:{

              [user.uid]:
                player

            },

            playerOrder:[
              user.uid
            ],

            settings:{
              ...matchSettings
            }

          }
        );

      }
    );


    isHost =
      true;


    await startMatch(
      code
    );


  }catch(error){

    console.error(error);

    if(
      error?.message ===
      "ALREADY_EXISTS"
    ){

      await joinMatch(
        requestedCode
      );

      return;

    }

    statusEl.textContent =
      "作成失敗：" +
      getFriendlyError(error);

  }

}


async function joinMatch(
  codeOverride = ""
){

  const code =
    (
      codeOverride ||
      matchCodeInput.value
    )
      .trim()
      .toUpperCase();


  if(!code){

    await createMatch("");

    return;

  }


  statusEl.textContent =
    "試合を確認中…";


  try{

    const user =
      await ensureAuth();


    const ref =
      doc(
        db,
        "matches",
        code
      );


    const existing =
      await getDoc(ref);


    /*
      ここが今回の重要部分。

      部屋が存在しなければ、
      参加失敗ではなく
      「そのコードで作成」する。
    */

    if(
      !existing.exists()
    ){

      await createMatch(
        code
      );

      return;

    }


    await runTransaction(
      db,
      async transaction => {

        const snap =
          await transaction.get(
            ref
          );


        if(!snap.exists()){

          throw new Error(
            "NOT_FOUND"
          );

        }


        const data =
          snap.data();


        if(
          data.status ===
          "ended"
        ){

          throw new Error(
            "ENDED"
          );

        }


        const players =
          {
            ...(data.players || {})
          };


        if(
          players[user.uid]
        ){

          return;

        }


        const count =
          Object.keys(
            players
          ).length;

        const playerOrder =
          Array.isArray(data.playerOrder)
            ? [...data.playerOrder]
            : Object.keys(players);


        if(count >= 8){

          throw new Error(
            "FULL"
          );

        }


        const roomSettings =
          normalizeMatchSettings(
            data.settings || matchSettings
          );

        const spawn =
          randomSpawn();


        players[user.uid] = {

          uid:
            user.uid,

          name:
            "Player-" +
            user.uid.slice(-4),

          x:
            spawn.x,

          y:
            spawn.y,

          z:
            spawn.z,

          yaw:
            0,

          pitch:
            0,

          hp:
            roomSettings.maxHp,

          kills:
            0,

          alive:
            true,

          lastActiveAt:
            Date.now(),

          lastDamagedAt:
            0

        };


        playerOrder.push(
          user.uid
        );

        transaction.update(
          ref,
          {

            players,

            playerOrder

          }
        );

      }
    );


    isHost =
      false;


    await startMatch(
      code
    );


  }catch(error){

    console.error(error);

    const message =
      error?.message || "";


    if(
      message ===
      "NOT_FOUND"
    ){

      await createMatch(
        code
      );

    }else if(
      message ===
      "FULL"
    ){

      statusEl.textContent =
        "その試合は満員だよ。";

    }else if(
      message ===
      "ENDED"
    ){

      statusEl.textContent =
        "その試合はもう終了してるよ。";

    }else{

      statusEl.textContent =
        "参加/作成失敗：" +
        getFriendlyError(error);

    }

  }

}

function getFriendlyError(error){

  if(!error){

    return "不明なエラー";

  }


  if(
    error.code ===
    "permission-denied"
  ){

    return "Firestoreの権限設定を確認して！";

  }


  if(
    error.code ===
    "auth/operation-not-allowed"
  ){

    return "Firebaseで匿名ログインを有効にして！";

  }


  return (
    error.message ||
    String(error)
  );

}


async function startMatch(
  code
){

  currentMatchId =
    code;

  matchRef =
    doc(
      db,
      "matches",
      code
    );

  const initialRoom =
    await getDoc(matchRef);

  if(initialRoom.exists()){
    applyMatchSettings(
      initialRoom.data().settings || matchSettings,
      true
    );
  }


  menu.style.display =
    "none";

  gameUI.style.display =
    "block";

  gameOver.style.display =
    "none";


  roomText.textContent =
    code;


  if(!scene){

    setupScene();

  }


  gameEnded =
    false;

  gameStarted =
    true;

  matchHasStarted =
    false;


  velocityY =
    0;


  await loadLocalPlayer();


  if(unsubscribeMatch){

    unsubscribeMatch();

    unsubscribeMatch =
      null;

  }


  unsubscribeMatch =
    onSnapshot(
      matchRef,

      async snapshot => {

        if(
          !snapshot.exists()
        ){

          if(gameStarted){

            leaveCurrentMatch();

          }

          return;

        }


        const data =
          snapshot.data();

        checkMatchCleanup(
          data
        );


        const players =
          data.players ||
          {};


        const count =
          Object.keys(
            players
          ).length;

        window.__dfpsPlayerOrder =
          Array.isArray(data.playerOrder)
            ? [...data.playerOrder]
            : Object.keys(players);


        playerCountText.textContent =
          String(count);


        updateRemotePlayers(
          players
        );


        updateScoreboard(
          players
        );


        const me =
          players[
            currentUser.uid
          ];


        if(me){

          localPlayer =
            {

              ...localPlayer,

              ...me

            };


          localKills =
            me.kills || 0;


          updateLocalHUD();

        }


        const wasStarted =
          matchHasStarted;


        if(
          data.status ===
          "active"
        ){

          matchHasStarted =
            true;

        }


        if(
          data.status ===
          "active" &&
          !wasStarted
        ){

          const startedAt =
            data.startedAt;


          spawnProtectionUntil =
            Date.now() +
            START_PROTECTION_TIME;


          if(startedAt){

            const serverMillis =
              startedAt.toMillis
                ? startedAt.toMillis()
                : Date.now();


            spawnProtectionUntil =
              serverMillis +
              START_PROTECTION_TIME;

          }

        }


        updateStartUI(
          data
        );


        if(
          data.status ===
          "ended" &&
          !gameEnded
        ){

          const winner =
            data.winnerUid;


          const winnerName =
            winner &&
            players[winner] &&
            players[winner].name
              ? players[winner].name
              : "勝者";


          finishLocalGame(

            winner ===
            currentUser.uid

              ? "YOU WIN!"

              : winnerName +
                " の勝利！"

          );

          setTimeout(
            () => {
              if(
                matchRef
              ){
                deleteMatch();
              }
            },
            1200
          );

        }

      },

      error => {

        console.error(
          error
        );

        if(gameStarted){

          finishLocalGame(
            "通信エラーが発生しました。"
          );

        }

      }
    );


  if(!gameLoopStarted){

    gameLoopStarted =
      true;

    requestAnimationFrame(
      gameLoop
    );

  }

}


async function loadLocalPlayer(){

  const snap =
    await getDoc(
      matchRef
    );


  if(
    !snap.exists()
  ){

    throw new Error(
      "試合が見つかりません。"
    );

  }


  const data =
    snap.data();


  const player =
    data.players?.[
      currentUser.uid
    ];


  if(!player){

    throw new Error(
      "プレイヤーデータがありません。"
    );

  }


  localPlayer =
    {
      ...player,
      lastActiveAt:
        Number(
          player.lastActiveAt ||
          Date.now()
        )
    };


  lastActivityAt =
    localPlayer.lastActiveAt;


  localKills =
    player.kills || 0;


  cameraState.yaw =
    Number(
      player.yaw || 0
    );


  cameraState.pitch =
    Number(
      player.pitch || 0
    );


  setCameraFromPlayer();

  updateLocalHUD();

  updateStartUI(
    data
  );

}


function normalizeMatchSettings(settings){

  const source =
    settings || {};

  const maxHp =
    Math.round(
      Number(
        source.maxHp ||
        100
      )
    );

  const regenLock =
    Number(
      source.regenLock ||
      0
    );

  return {
    terrainAmount:
      ["high","medium","low","none"].includes(source.terrainAmount)
        ? source.terrainAmount
        : "medium",
    terrainHeight:
      ["high","medium","low"].includes(source.terrainHeight)
        ? source.terrainHeight
        : "medium",
    bulletSpeed:
      ["infinite","fast","medium","slow"].includes(source.bulletSpeed)
        ? source.bulletSpeed
        : "medium",
    maxHp:
      clamp(
        Number.isFinite(maxHp) ? maxHp : 100,
        1,
        99999
      ),
    hpRegen:
      ["fast","medium","slow","none"].includes(source.hpRegen)
        ? source.hpRegen
        : "none",
    regenLock:
      clamp(
        Number.isFinite(regenLock) ? regenLock : 0,
        0,
        999
      )
  };
}


function getBulletSpeed(){

  if(matchSettings.bulletSpeed === "infinite"){

  }

  if(matchSettings.bulletSpeed === "fast"){

}

    normalized.hpRegen;

function readSettingsFromUI(){

    Math.round(
      Number(maxHpSetting.value)

    Number(regenLockSetting.value);

  return normalizeMatchSettings({
    terrainAmount: terrainAmountSetting.value,
    terrainHeight: terrainHeightSetting.value,
    bulletSpeed: bulletSpeedSetting.value,
    maxHp,
    hpRegen: hpRegenSetting.value,
    regenLock
  });
}


function applyMatchSettings(settings, force=false){

  const normalized =
    normalizeMatchSettings(settings);

  const signature =
    JSON.stringify(normalized);

  const terrainChanged =
    normalized.terrainAmount !== matchSettings.terrainAmount ||
    normalized.terrainHeight !== matchSettings.terrainHeight;

  matchSettings =
    normalized;

  if(
    (force || terrainChanged) &&
    scene &&
    !matchHasStarted
  ){
    rebuildArena();
  }

  appliedTerrainSignature =
    signature;
}

async function saveSettings(){

  if(!isHost || !matchRef || matchHasStarted){
    return;
  }

  const settings =
    readSettingsFromUI();

  settingsMessage.textContent =
    "保存中…";

  try{

    const snap =
      await getDoc(matchRef);

    if(!snap.exists()){
      return;
    }

    const data =
      snap.data();

    if(data.status !== "waiting"){
      settingsMessage.textContent =
        "もう試合が始まっています";
      return;
    }

    const players =
      { ...(data.players || {}) };

    Object.values(players).forEach(
      player => {
        player.hp = settings.maxHp;
        player.lastDamagedAt = 0;
      }
    );

    await updateDoc(
      matchRef,
      {
        settings,
        players
      }
    );

    matchSettings = settings;
    settingsMessage.textContent =
      "保存しました";

    setTimeout(
      closeSettings,
      220
    );

  }catch(error){

    console.error(
      "settings save error",
      error
    );

    settingsMessage.textContent =
      "保存失敗：" +
      getFriendlyError(error);

  }
}

function updateRemotePlayers(
  players
){

  const seen =
    new Set();


  for(
    const [
      uid,
      player
    ]
    of Object.entries(players)
  ){

    if(
      uid ===
      currentUser.uid
    ){

      continue;

    }


    seen.add(uid);


    let mesh =
      playerMeshes.get(uid);


    if(!mesh){

      mesh =
        createPlayerMesh(
          uid
        );

      playerMeshes.set(
        uid,
        mesh
      );

    }


    mesh.position.set(

      player.x,

      Math.max(
        0,
        player.y -
        PLAYER_HEIGHT
      ),

      player.z

    );


    mesh.rotation.y =
      Number(
        player.yaw || 0
      );


    mesh.visible =
      Boolean(
        player.alive
      );

  }


  for(
    const uid
    of playerMeshes.keys()
  ){

    if(
      !seen.has(uid)
    ){

      removeRemoteMesh(
        uid
      );

    }

  }

}

function clamp(
  value,
  min,
  max
){

  return Math.max(
    min,
    Math.min(
      max,
      value
    )
  );

}


function markActivity(){

  lastActivityAt =
    Date.now();

  if(
    localPlayer
  ){
    localPlayer.lastActiveAt =
      lastActivityAt;
  }
}


function getColliderBoxes(){
  return colliders
    .filter(
      collider =>
        collider &&
        collider.geometry
    )
    .map(
      collider =>
        new THREE.Box3()
          .setFromObject(collider)
    );
}


function horizontalOverlaps(
  box,
  x,
  z,
  radius = .38
){
  return (
    x + radius > box.min.x &&
    x - radius < box.max.x &&
    z + radius > box.min.z &&
    z - radius < box.max.z
  );
}


function isPositionFree(
  x,
  y,
  z
){

  const radius =
    .38;

  if(
    x < -ARENA_SIZE / 2 + radius ||
    x > ARENA_SIZE / 2 - radius ||
    z < -ARENA_SIZE / 2 + radius ||
    z > ARENA_SIZE / 2 - radius
  ){
    return false;
  }

  const feetY =
    y - PLAYER_HEIGHT;

  const headY =
    y + .35;

  for(
    const collider
    of colliders
  ){

    if(
      !collider ||
      !collider.geometry ||
      collider === colliders[0]
    ){
      continue;
    }

    const box =
      new THREE.Box3()
        .setFromObject(
          collider
        );

    if(
      !horizontalOverlaps(
        box,
        x,
        z,
        radius
      )
    ){
      continue;
    }

    /*
      足場の上に立っている場合は、
      足場そのものを横移動の障害物にしない。
    */
    if(
      box.max.y <=
      feetY + .06
    ){
      continue;
    }

    if(
      box.min.y >=
      headY - .06
    ){
      continue;
    }

    return false;
  }

  return true;
}


function getLandingTop(
  x,
  z,
  previousFeetY,
  nextFeetY
){

  let bestTop =
    null;

  /*
    床の上面は y=0。
  */
  if(
    previousFeetY >= -.05 &&
    nextFeetY <= .05
  ){
    bestTop = 0;
  }

  for(
    const collider
    of colliders
  ){

    if(
      !collider ||
      !collider.geometry ||
      collider === colliders[0]
    ){
      continue;
    }

    const box =
      new THREE.Box3()
        .setFromObject(
          collider
        );

    if(
      !horizontalOverlaps(
        box,
        x,
        z,
        .36
      )
    ){
      continue;
    }

    const top =
      box.max.y;

    if(
      previousFeetY >= top - .08 &&
      nextFeetY <= top + .08
    ){

      if(
        bestTop === null ||
        top > bestTop
      ){
        bestTop =
          top;
      }

    }
  }

  return bestTop;
}


function getCeilingBottom(
  x,
  z,
  previousHeadY,
  nextHeadY
){

  let bestBottom =
    null;

  for(
    const collider
    of colliders
  ){

    if(
      !collider ||
      !collider.geometry ||
      collider === colliders[0]
    ){
      continue;
    }

    const box =
      new THREE.Box3()
        .setFromObject(
          collider
        );

    if(
      !horizontalOverlaps(
        box,
        x,
        z,
        .36
      )
    ){
      continue;
    }

    const bottom =
      box.min.y;

    if(
      previousHeadY <= bottom + .08 &&
      nextHeadY >= bottom - .08
    ){

      if(
        bestBottom === null ||
        bottom < bestBottom
      ){
        bestBottom =
          bottom;
      }

    }
  }

  return bestBottom;
}


function tryMove(
  dx,
  dz
){

  if(
    !localPlayer ||
    !localPlayer.alive ||
    !matchHasStarted
  ){
    return;
  }

  const nextX =
    localPlayer.x +
    dx;

  const nextZ =
    localPlayer.z +
    dz;

  /*
    X/Zを分離して判定することで、
    足場の端で壁に引っかかりにくくする。
  */
  if(
    isPositionFree(
      nextX,
      localPlayer.y,
      localPlayer.z
    )
  ){
    localPlayer.x =
      nextX;
  }

  if(
    isPositionFree(
      localPlayer.x,
      localPlayer.y,
      nextZ
    )
  ){
    localPlayer.z =
      nextZ;
  }
}


function updateMovement(
  delta
){

  if(
    !localPlayer ||
    !localPlayer.alive ||
    !matchHasStarted ||
    grabAnimation
  ){
    return;
  }

  let inputX =
    0;

  let inputZ =
    0;

  if(keys.w)
    inputZ -= 1;

  if(keys.s)
    inputZ += 1;

  if(keys.a)
    inputX -= 1;

  if(keys.d)
    inputX += 1;

  inputX +=
    mobileInput.x;

  inputZ +=
    mobileInput.y;

  const length =
    Math.hypot(
      inputX,
      inputZ
    );

  if(length > 1){
    inputX /=
      length;

    inputZ /=
      length;
  }

  const moving =
    Math.abs(inputX) > .01 ||
    Math.abs(inputZ) > .01;

  if(moving){

    markActivity();

    const speed =
      physics.moveSpeed;

    const amount =
      speed * delta;

    const forwardX =
      -Math.sin(
        cameraState.yaw
      );

    const forwardZ =
      -Math.cos(
        cameraState.yaw
      );

    const rightX =
      Math.cos(
        cameraState.yaw
      );

    const rightZ =
      -Math.sin(
        cameraState.yaw
      );

    const moveX =
      (
        forwardX * -inputZ +
        rightX * inputX
      ) *
      amount;

    const moveZ =
      (
        forwardZ * -inputZ +
        rightZ * inputX
      ) *
      amount;

    tryMove(
      moveX,
      moveZ
    );
  }

  const previousFeetY =
    localPlayer.y -
    PLAYER_HEIGHT;

  const previousHeadY =
    localPlayer.y +
    .35;

  velocityY +=
    physics.gravity *
    delta;

  let nextY =
    localPlayer.y +
    velocityY * delta;

  const nextFeetY =
    nextY -
    PLAYER_HEIGHT;

  const nextHeadY =
    nextY +
    .35;

  if(
    velocityY <= 0
  ){

    const landingTop =
      getLandingTop(
        localPlayer.x,
        localPlayer.z,
        previousFeetY,
        nextFeetY
      );

    if(
      landingTop !== null
    ){

      localPlayer.y =
        landingTop +
        PLAYER_HEIGHT;

      velocityY =
        0;

      grounded =
        true;

    }else{

      localPlayer.y =
        nextY;

      grounded =
        false;

    }

  }else{

    const ceilingBottom =
      getCeilingBottom(
        localPlayer.x,
        localPlayer.z,
        previousHeadY,
        nextHeadY
      );

    if(
      ceilingBottom !== null
    ){

      localPlayer.y =
        ceilingBottom -
        .35;

      velocityY =
        0;

    }else{

      localPlayer.y =
        nextY;

    }

    grounded =
      false;
  }

  /*
    落下しすぎた場合の安全処理。
  */
  if(
    localPlayer.y <
    -10
  ){

    localPlayer.y =
      PLAYER_HEIGHT;

    velocityY =
      0;

    grounded =
      true;
  }

  camera.position.set(
    localPlayer.x,
    localPlayer.y + .45,
    localPlayer.z
  );

  camera.rotation.order =
    "YXZ";

  camera.rotation.y =
    cameraState.yaw;

  camera.rotation.x =
    cameraState.pitch;

  updateGrabUI();
}


function jump(){

  if(
    !localPlayer ||
    !localPlayer.alive ||
    !matchHasStarted
  ){

    return;

  }


  /*
    空中ならJUMPボタンがGRABになる。
    条件を満たしていればそのまま掴む。
  */

  if(!grounded){

    if(
      canGrab()
    ){

      startGrab();

    }

    return;

  }

  markActivity();

  velocityY =
    physics.jumpPower;

  grounded =
    false;

}


function getGrabTarget(){

  if(
    !localPlayer ||
    grounded
  ){

    return null;

  }


  const playerX =
    localPlayer.x;

  const playerY =
    localPlayer.y;

  const playerZ =
    localPlayer.z;


  let best =
    null;

  let bestDistance =
    Infinity;


  /*
    足場の上面が
    自分の足元より上、
    しかし頭より下。
  */

  const feetY =
    playerY -
    PLAYER_HEIGHT;

  const headY =
    playerY;


  for(
    const collider
    of colliders
  ){

    if(
      collider ===
      colliders[0]
    ){

      continue;

    }


    const box =
      new THREE.Box3()
        .setFromObject(
          collider
        );


    const insideX =
      playerX >=
        box.min.x -
        GRAB_DISTANCE &&

      playerX <=
        box.max.x +
        GRAB_DISTANCE;


    const insideZ =
      playerZ >=
        box.min.z -
        GRAB_DISTANCE &&

      playerZ <=
        box.max.z +
        GRAB_DISTANCE;


    if(
      !insideX ||
      !insideZ
    ){

      continue;

    }


    const platformTop =
      box.max.y;


    if(
      platformTop <=
      feetY + .05
    ){

      continue;

    }


    if(
      platformTop >=
      headY
    ){

      continue;

    }


    const centerX =
      clamp(
        playerX,
        box.min.x,
        box.max.x
      );


    const centerZ =
      clamp(
        playerZ,
        box.min.z,
        box.max.z
      );


    const distance =
      Math.hypot(

        playerX -
        centerX,

        playerZ -
        centerZ

      );


    if(
      distance >
      GRAB_DISTANCE
    ){

      continue;

    }


    if(
      distance <
      bestDistance
    ){

      bestDistance =
        distance;

      best = {

        box,

        top:
          platformTop,

        x:
          centerX,

        z:
          centerZ

      };

    }

  }


  return best;

}


function canGrab(){

  return Boolean(
    getGrabTarget()
  );

}


function updateGrabUI(){

  if(
    !localPlayer ||
    !matchHasStarted
  ){

    jumpButton.style.opacity =
      "0";

    return;
  }

  jumpButton.style.opacity =
    "";

  if(
    grounded
  ){

    jumpButton.textContent =
      "JUMP";

    jumpButton.classList.remove(
      "grabInactive",
      "grabActive"
    );

    return;

  }

  jumpButton.textContent =
    "GRAB";

  if(
    canGrab()
  ){

    jumpButton.classList.remove(
      "grabInactive"
    );

    jumpButton.classList.add(
      "grabActive"
    );

  }else{

    jumpButton.classList.remove(
      "grabActive"
    );

    jumpButton.classList.add(
      "grabInactive"
    );

  }
}


function startGrab(){

  if(
    grabAnimation ||
    grounded ||
    !localPlayer
  ){

    return;

  }


  const target =
    getGrabTarget();


  if(!target){

    return;

  }

  markActivity();

  grabAnimation = {

    start:
      performance.now(),

    target,

    startX:
      localPlayer.x,

    startY:
      localPlayer.y,

    startZ:
      localPlayer.z

  };


  velocityY =
    0;

}


function updateGrabAnimation(
  now
){

  if(!grabAnimation){

    return;

  }


  const elapsed =
    now -
    grabAnimation.start;


  const progress =
    clamp(
      elapsed /
      GRAB_TIME,
      0,
      1
    );


  const smooth =
    progress *
    progress *
    (
      3 -
      2 * progress
    );


  const target =
    grabAnimation.target;


  localPlayer.x =
    grabAnimation.startX +
    (
      target.x -
      grabAnimation.startX
    ) *
    smooth;

  localPlayer.z =
    grabAnimation.startZ +
    (
      target.z -
      grabAnimation.startZ
    ) *
    smooth;


  localPlayer.y =
    target.top +
    PLAYER_HEIGHT +
    .02;


  camera.position.set(

    localPlayer.x,

    localPlayer.y + .45,

    localPlayer.z

  );


  if(
    progress >= 1
  ){

    grabAnimation =
      null;

    grounded =
      true;

    velocityY =
      0;

    updateGrabUI();

  }

}

function createBullet(
  origin,
  direction,
  ownerUid
){

  const geometry =
    new THREE.SphereGeometry(
      .09,
      8,
      8
    );


  const material =
    new THREE.MeshBasicMaterial({

      color:
        0xffe36e

    });


  const mesh =
    new THREE.Mesh(
      geometry,
      material
    );


  mesh.position.copy(
    origin
  );


  scene.add(mesh);


  const id =
    ++bulletIdCounter;


  bullets.set(
    id,
    {

      mesh,

      direction:
        direction.clone()
          .normalize(),

      ownerUid,

      created:
        performance.now(),

      lastPosition:
        origin.clone()

    }
  );

}


function removeBullet(
  id
){

  const bullet =
    bullets.get(id);


  if(!bullet){

    return;

  }


  scene.remove(
    bullet.mesh
  );


  bullet.mesh.geometry.dispose();

  bullet.mesh.material.dispose();


  bullets.delete(
    id
  );

}


function updateBullets(
  delta,
  now
){

  for(
    const [
      id,
      bullet
    ]
    of bullets
  ){

    const previous =
      bullet.mesh.position.clone();


    const distance =
      getBulletSpeed() *
      delta;


    bullet.mesh.position.add(

      bullet.direction
        .clone()
        .multiplyScalar(
          distance
        )

    );


    bullet.lastPosition =
      previous;


    if(
      now -
      bullet.created >
      BULLET_LIFETIME
    ){

      removeBullet(
        id
      );

      continue;

    }


    const bulletLine =
      new THREE.Line3(

        previous,

        bullet.mesh.position

      );


    let hitSomething =
      false;


    /*
      壁・足場との衝突
    */

    for(
      const collider
      of colliders
    ){

      const box =
        new THREE.Box3()
          .setFromObject(
            collider
          );


      const closest =
        new THREE.Vector3();


      box.clampPoint(
        bullet.mesh.position,
        closest
      );


      if(
        closest.distanceTo(
          bullet.mesh.position
        ) < .18
      ){

        hitSomething =
          true;

        break;

      }

    }


    if(hitSomething){

      removeBullet(
        id
      );

      continue;

    }


    /*
      プレイヤーとの衝突
    */

    for(
      const [
        uid,
        mesh
      ]
      of playerMeshes
    ){

      if(
        uid ===
        bullet.ownerUid ||
        !mesh.visible
      ){

        continue;

      }


      const box =
        new THREE.Box3()
          .setFromObject(
            mesh
          );


      if(
        box.distanceToPoint(
          bullet.mesh.position
        ) < .15
      ){

        hitSomething =
          true;


        if(
          Date.now() >=
          spawnProtectionUntil
        ){

          applyBulletDamage(
            uid,
            bullet.ownerUid
          );

        }


        break;

      }

    }


    if(hitSomething){

      removeBullet(
        id
      );

    }

  }

}


async function applyBulletDamage(
  targetUid,
  shooterUid
){

  if(
    !matchRef ||
    gameEnded
  ){

    return;

  }


  try{

    let wasKill =
      false;


    await runTransaction(
      db,
      async transaction => {

        const snap =
          await transaction.get(
            matchRef
          );


        if(
          !snap.exists()
        ){

          return;

        }


        const data =
          snap.data();


        if(
          data.status !==
          "active"
        ){

          return;

        }


        const players =
          {
            ...(data.players || {})
          };


        const shooter =
          players[shooterUid];


        const target =
          players[targetUid];


        if(
          !shooter ||
          !target
        ){

          return;

        }


        if(
          !shooter.alive ||
          !target.alive
        ){

          return;

        }


        if(
          Date.now() <
          Number(
            data.startedProtectionUntil ||
            0
          )
        ){

          return;

        }


        target.hp =
          Math.max(

            0,

            Number(
              target.hp || 0
            ) -
            BULLET_DAMAGE

          );

        target.lastDamagedAt =
          Date.now();


        if(
          target.hp <= 0
        ){

          target.hp =
            0;

          target.alive =
            false;


          shooter.kills =
            Number(
              shooter.kills || 0
            ) + 1;


          wasKill =
            shooterUid ===
            currentUser.uid;


          const alivePlayers =
            Object.values(
              players
            ).filter(
              player =>
                player.alive
            );


          if(
            alivePlayers.length <= 1
          ){

            transaction.update(
              matchRef,
              {

                players,

                status:
                  "ended",

                winnerUid:
                  alivePlayers.length === 1
                    ? alivePlayers[0].uid
                    : null

              }
            );

            return;

          }

        }


        transaction.update(
          matchRef,
          {

            players

          }
        );

      }
    );


    if(wasKill){

      localKills++;

      showKillMessage(
        "ELIMINATED"
      );

    }


  }catch(error){

    console.error(
      "bullet damage error",
      error
    );

  }

}

async function checkMatchCleanup(
  data
){

  if(
    !matchRef ||
    !data
  ){
    return;
  }

  const now =
    Date.now();

  if(
    now -
    lastCleanupCheck <
    CLEANUP_INTERVAL
  ){
    return;
  }

  lastCleanupCheck =
    now;

  let createdMillis =
    0;

  if(
    data.createdAt &&
    typeof data.createdAt.toMillis ===
      "function"
  ){
    createdMillis =
      data.createdAt.toMillis();
  }else if(
    typeof data.createdAt ===
    "number"
  ){
    createdMillis =
      data.createdAt;
  }

  if(
    createdMillis > 0 &&
    now - createdMillis >=
      MAX_MATCH_AGE
  ){

    try{
      await deleteDoc(
        matchRef
      );
    }catch(error){
      console.error(
        "age cleanup error",
        error
      );
    }

    return;
  }

  const players =
    Object.values(
      data.players || {}
    );

  if(
    players.length === 0
  ){
    return;
  }

  const allInactive =
    players.every(
      player => {

        const last =
          typeof player.lastActiveAt ===
          "number"
            ? player.lastActiveAt
            : 0;

        return (
          last > 0 &&
          now - last >=
            INACTIVE_MATCH_TIME
        );
      }
    );

  if(
    allInactive
  ){

    try{
      await deleteDoc(
        matchRef
      );
    }catch(error){
      console.error(
        "inactive cleanup error",
        error
      );
    }

  }
}

function handleMouseMove(
  event
){

  if(
    !gameStarted ||
    gameEnded ||
    matchMedia(
      "(pointer:coarse)"
    ).matches
  ){

    return;

  }


  if(
    document.pointerLockElement !==
    renderer.domElement
  ){

    return;

  }


  if(
    Math.abs(event.movementX) > 0 ||
    Math.abs(event.movementY) > 0
  ){
    markActivity();
  }

  cameraState.yaw -=
    event.movementX *
    .0023;


  cameraState.pitch -=
    event.movementY *
    .0023;


  cameraState.pitch =
    clamp(
      cameraState.pitch,
      -1.45,
      1.45
    );

}

  if(

function setupMobileInput(){

  let joystickPointerId =
    null;


  function updateJoystick(
    clientX,
    clientY
  ){

    const rect =
      joystickZone
        .getBoundingClientRect();


    const centerX =
      rect.left +
      rect.width / 2;


    const centerY =
      rect.top +
      rect.height / 2;


    let dx =
      clientX -
      centerX;


    let dy =
      clientY -
      centerY;


    const max =
      53;


    const distance =
      Math.hypot(
        dx,
        dy
      );


    if(
      distance >
      max
    ){

      dx =
        dx /
        distance *
        max;

      dy =
        dy /
        distance *
        max;

    }


    mobileInput.x =
      dx / max;


    mobileInput.y =
      dy / max;


    joystickKnob.style.transform =
      `translate(${dx}px,${dy}px)`;

  }


  joystickZone.addEventListener(
    "pointerdown",
    event => {

      joystickPointerId =
        event.pointerId;


      joystickZone.setPointerCapture(
        event.pointerId
      );


      updateJoystick(
        event.clientX,
        event.clientY
      );

    }
  );


  joystickZone.addEventListener(
    "pointermove",
    event => {

      if(
        event.pointerId ===
        joystickPointerId
      ){

        updateJoystick(
          event.clientX,
          event.clientY
        );

      }

    }
  );


  const endJoystick =
    event => {

      if(
        event.pointerId !==
        joystickPointerId
      ){

        return;

      }


      joystickPointerId =
        null;


      mobileInput.x =
        0;

      mobileInput.y =
        0;


      joystickKnob.style.transform =
        "translate(0,0)";

    };


  joystickZone.addEventListener(
    "pointerup",
    endJoystick
  );


  joystickZone.addEventListener(
    "pointercancel",
    endJoystick
  );


  let lookPointerId =
    null;

  let lastLookX =
    0;

  let lastLookY =
    0;


  lookZone.addEventListener(
    "pointerdown",
    event => {

      lookPointerId =
        event.pointerId;


      lastLookX =
        event.clientX;


      lastLookY =
        event.clientY;


      lookZone.setPointerCapture(
        event.pointerId
      );

    }
  );


  lookZone.addEventListener(
    "pointermove",
    event => {

      if(
        event.pointerId !==
        lookPointerId
      ){

        return;

      }


      const dx =
        event.clientX -
        lastLookX;


      const dy =
        event.clientY -
        lastLookY;


      lastLookX =
        event.clientX;


      lastLookY =
        event.clientY;


      if(
        dx !== 0 ||
        dy !== 0
      ){
        markActivity();
      }

      cameraState.yaw -=
        dx * .006;


      cameraState.pitch -=
        dy * .006;


      cameraState.pitch =
        clamp(
          cameraState.pitch,
          -1.45,
          1.45
        );

    }
  );


  const endLook =
    event => {

      if(
        event.pointerId ===
        lookPointerId
      ){

        lookPointerId =
          null;

      }

    };


  lookZone.addEventListener(
    "pointerup",
    endLook
  );


  lookZone.addEventListener(
    "pointercancel",
    endLook
  );


  fireButton.addEventListener(
    "pointerdown",
    event => {

      event.preventDefault();

      fireHolding =
        true;

      mobileInput.firing =
        true;

      shoot();

    }
  );


  fireButton.addEventListener(
    "pointerup",
    event => {

      event.preventDefault();

      fireHolding =
        false;

      mobileInput.firing =
        false;

    }
  );


  fireButton.addEventListener(
    "pointercancel",
    () => {

      fireHolding =
        false;

      mobileInput.firing =
        false;

    }
  );


  jumpButton.addEventListener(
    "pointerdown",
    event => {

      event.preventDefault();

      if(
        !grounded &&
        canGrab()
      ){

        startGrab();

      }else if(
        grounded
      ){

        jump();

      }

    }
  );

}

async function updateHealthRegen(){

  if(
    !matchRef ||
    !localPlayer ||
    !matchHasStarted ||
    gameEnded ||
    !localPlayer.alive
  ){
    return;
  }

  const config =
    getRegenConfig();

  if(!config){
    return;
  }

  const now =
    performance.now();

  if(
    now - lastRegenAt <
    config.interval
  ){
    return;
  }

  lastRegenAt =
    now;

  try{

    await runTransaction(
      db,
      async transaction => {

        const snap =
          await transaction.get(
            matchRef
          );

        if(!snap.exists()){
          return;
        }

        const data =
          snap.data();

        if(data.status !== "active"){
          return;
        }

        const players =
          { ...(data.players || {}) };

        const player =
          players[currentUser.uid];

        if(
          !player ||
          !player.alive
        ){
          return;
        }

        const hp =
          Number(player.hp || 0);

        const maxHp =
          Number(
            data.settings?.maxHp ||
            matchSettings.maxHp ||
            100
          );

        if(hp >= maxHp){
          return;
        }

        const lastDamagedAt =
          Number(
            player.lastDamagedAt ||
            0
          );

        const lockMs =
          Number(
            data.settings?.regenLock ||
            matchSettings.regenLock ||
            0
          ) * 1000;

        if(
          lockMs > 0 &&
          Date.now() - lastDamagedAt < lockMs
        ){
          return;
        }

        player.hp =
          Math.min(
            maxHp,
            hp + config.amount
          );

        transaction.update(
          matchRef,
          { players }
        );

      }
    );

  }catch(error){
    console.error(
      "regen error",
      error
    );
  }
}


function gameLoop(
  time
){

  const delta =
    Math.min(

      (
        time -
        lastFrameTime
      ) / 1000,

      .05

    );


  lastFrameTime =
    time;


  updateStartProgress();


  updateFireUI();
  updateSpawnProtectionUI();


  if(
    gameStarted &&
    !gameEnded
  ){

    updateMovement(
      delta
    );


    updateGrabAnimation(
      time
    );


    if(
      mobileInput.firing
    ){

      shoot();

    }


    updateBullets(
      delta,
      time
    );


    updateHealthRegen();


    syncLocalPlayer();

  }


  if(
    renderer &&
    scene &&
    camera
  ){

    renderer.render(
      scene,
      camera
    );

  }


  requestAnimationFrame(
    gameLoop
  );

}

  }catch(error){

    console.error(
      "sync error",
      error
    );

  }

}


matchButton.addEventListener(
  "click",
  handleMatchButton
);


returnButton.addEventListener(
  "click",
  handleReturn
);


matchCodeInput.addEventListener(
  "input",
  () => {

    matchCodeInput.value =
      matchCodeInput.value
        .replace(
          /[^A-Za-z0-9]/g,
          ""
        )
        .toUpperCase();

  }
);


matchCodeInput.addEventListener(
  "keydown",
  event => {

    if(
      event.key ===
      "Enter"
    ){

      handleMatchButton();

    }

  }
);


shareRoomButton.addEventListener(
  "click",
  shareRoomCode
);


settingsButton.addEventListener(
  "click",
  openSettings
);


leaveRoomButton.addEventListener(
  "click",
  handleReturn
);


settingsCancelButton.addEventListener(
  "click",
  closeSettings
);


settingsSaveButton.addEventListener(
  "click",
  saveSettings
);


terrainAmountSetting.addEventListener(
  "change",
  updateSettingsDisabledUI
);


hpRegenSetting.addEventListener(
  "change",
  updateSettingsDisabledUI
);


settingsModal.addEventListener(
  "pointerdown",
  event => {
    if(event.target === settingsModal){
      closeSettings();
    }
  }
);


setupDesktopInput();

setupMobileInput();

setupStartButton();


window.addEventListener(
  "beforeunload",
  () => {

    if(
      isHost &&
      matchRef
    ){

      deleteDoc(
        matchRef
      ).catch(
        () => {}
      );

    }

  }
);


try{

  await ensureAuth();

  statusEl.textContent =
    "接続準備OK";

}catch(error){

  console.error(
    error
  );

  statusEl.textContent =
    "Firebase接続失敗：" +
    getFriendlyError(error);

}

</script>

</body>
</html>
